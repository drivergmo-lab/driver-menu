<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#ffffff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      var(--bg),
      var(--bg2)
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}


/* ============================================================
   ヘッダー
   ============================================================ */

.hero{
  position:relative;
  overflow:hidden;

  padding:
    21px
    10px
    23px;

  border-radius:26px;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );

  box-shadow:var(--shadow);
}

.hero h1{
  margin:0;

  color:var(--blue);

  font-size:30px;
  line-height:1.15;

  font-weight:900;

  white-space:nowrap;
}


/* ============================================================
   メインカード
   ============================================================ */

.card{
  margin-top:12px;

  padding:13px;

  border-radius:24px;

  background:rgba(
    255,
    255,
    255,
    .97
  );

  box-shadow:var(--shadow);
}


/* ============================================================
   人物選択
   左側の判別枠は削除。
   ここ1枠に「判別中 / 選択可 / 人物名」を統合。
   ============================================================ */

.top-row{
  display:block;
}

.select-box{
  width:100%;

  padding:
    10px
    11px;

  border:
    1px
    solid
    var(--line);

  border-radius:18px;

  background:#f9fdff;
}

.select-box label{
  display:block;

  margin-bottom:5px;

  color:#637c90;

  font-size:13px;

  font-weight:900;
}

select{
  width:100%;

  height:44px;

  padding:
    0
    10px;

  border:
    1px
    solid
    #cfe4f3;

  border-radius:12px;

  background:#fff;

  color:var(--text);

  font-size:16px;

  font-weight:800;

  outline:none;
}

select:focus{
  border-color:#63b4ea;

  box-shadow:
    0
    0
    0
    3px
    rgba(
      99,
      180,
      234,
      .12
    );
}


/* ============================================================
   今月担当
   ============================================================ */

.assignment{
  display:flex;

  align-items:center;
  justify-content:center;

  min-height:38px;

  margin-top:8px;

  padding:
    7px
    10px;

  border:
    1px
    solid
    var(--line);

  border-radius:12px;

  background:#f6fcff;

  color:#496a82;

  font-size:14px;

  font-weight:900;

  text-align:center;
}

.assignment.ready{
  color:var(--blue);

  background:#eef9ff;
}


/* ============================================================
   出勤・退勤
   ============================================================ */

.mode-box{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

  margin-top:10px;
}

.mode-btn{
  min-height:90px;

  border:0;

  border-radius:20px;

  font-size:28px;

  font-weight:900;

  transition:.12s;
}

.mode-btn:active{
  transform:scale(.99);
}

.mode-btn.in{
  background:
    linear-gradient(
      #73cdf8,
      #7dd77a
    );

  color:#084e78;
}

.mode-btn.out{
  background:
    linear-gradient(
      #1b357c,
      #0e1e4d
    );

  color:#fff;
}

.mode-btn.off{
  opacity:.38;

  filter:grayscale(.18);
}

.guide{
  margin:
    9px
    4px;

  color:var(--blue);

  font-size:13px;

  font-weight:900;

  text-align:center;
}


/* ============================================================
   写真
   ============================================================ */

.upload-btn{
  width:100%;

  min-height:54px;

  border:
    1px
    solid
    #cfe8f7;

  border-radius:17px;

  background:#eaf7ff;

  color:var(--blue);

  font-size:17px;

  font-weight:900;
}

.upload-btn:disabled{
  opacity:.45;

  cursor:not-allowed;
}

.notice{
  display:none;

  margin-top:9px;

  padding:
    9px
    11px;

  border-radius:12px;

  background:#f7fcff;

  color:#5c7588;

  font-size:12px;

  line-height:1.45;

  text-align:center;
}

.notice.show{
  display:block;
}

.hidden{
  display:none !important;
}


/* ============================================================
   写真＋修正
   ============================================================ */

.preview{
  display:none;

  margin-top:11px;
}

.preview.show{
  display:block;
}

.preview-box{
  padding:12px;

  border:
    1px
    solid
    var(--line);

  border-radius:18px;

  background:#fff;
}

.photo-preview{
  display:block;

  width:100%;

  max-height:360px;

  object-fit:contain;

  border-radius:14px;

  background:#eef4f8;
}


/* ============================================================
   勤怠項目
   順番：
   日付
   出勤時間
   退勤時間
   次回出勤日
   次回出勤時間
   ============================================================ */

.fields{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;

  margin-top:9px;
}

.field{
  min-width:0;

  padding:9px;

  border:
    1px
    solid
    var(--line);

  border-radius:14px;

  background:var(--soft);
}

.field-title{
  display:block;

  margin-bottom:4px;

  color:#637c90;

  font-size:13px;

  font-weight:900;
}

input[type="date"],
input[type="time"]{
  width:100%;

  height:44px;

  padding:
    0
    10px;

  border:
    1px
    solid
    #cfe4f3;

  border-radius:12px;

  background:#fff;

  color:var(--text);

  font-size:16px;

  font-weight:800;

  outline:none;
}

input[type="date"]:focus,
input[type="time"]:focus{
  border-color:#63b4ea;

  box-shadow:
    0
    0
    0
    3px
    rgba(
      99,
      180,
      234,
      .12
    );
}

#nextDate{
  font-size:15px;

  letter-spacing:-.4px;
}


/* ============================================================
   残業
   ============================================================ */

.summary{
  grid-column:1/-1;

  padding:
    9px
    10px;

  border:
    1px
    solid
    var(--line);

  border-radius:12px;

  background:#fff;

  color:#446276;

  text-align:center;

  font-size:13px;

  font-weight:800;
}

.summary strong{
  color:var(--blue);
}


/* ============================================================
   報告文章
   ============================================================ */

.message-section{
  margin-top:12px;
}

.message-title{
  margin:
    0
    0
    7px;

  color:var(--blue);

  font-size:20px;

  font-weight:900;

  text-align:left;
}

.message-box{
  padding:11px;

  border:
    1px
    solid
    var(--line);

  border-radius:16px;

  background:#f7fcff;
}

.message-preview{
  white-space:pre-line;

  font-size:14px;

  line-height:1.55;

  color:#15446e;

  font-weight:700;
}

.memo-input{
  display:block;

  width:100%;

  min-height:92px;

  margin-top:10px;

  padding:
    10px
    11px;

  border:
    1px
    solid
    #cfe4f3;

  border-radius:12px;

  background:#fff;

  color:var(--text);

  font-size:14px;

  line-height:1.55;

  resize:vertical;

  outline:none;
}

.memo-input::placeholder{
  color:#93a8b7;
}

.memo-input:focus{
  border-color:#63b4ea;

  box-shadow:
    0
    0
    0
    3px
    rgba(
      99,
      180,
      234,
      .12
    );
}


/* ============================================================
   送信
   ============================================================ */

.send-btn{
  width:100%;

  min-height:54px;

  margin-top:9px;

  border:0;

  border-radius:17px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:#fff;

  font-size:18px;

  font-weight:900;
}

.send-btn:disabled{
  opacity:.45;

  cursor:not-allowed;
}


/* ============================================================
   履歴
   ============================================================ */

.history{
  margin-top:16px;

  padding-top:13px;

  border-top:
    1px
    solid
    #e2eef6;
}

.history-title{
  margin:
    0
    0
    8px;

  color:var(--blue);

  font-size:20px;

  font-weight:900;

  text-align:center;
}

.history-list{
  list-style:none;

  padding:0;

  margin:0;
}

.history-list li{
  display:grid;

  grid-template-columns:
    84px
    42px
    minmax(78px,1fr)
    26px;

  gap:4px;

  align-items:center;

  padding:
    9px
    1px;

  border-bottom:
    1px
    solid
    #edf4fa;

  color:#496173;

  font-size:12px;

  white-space:nowrap;
}

.history-date{
  font-weight:800;
}

.history-type{
  color:var(--blue);

  font-weight:900;
}

.history-time{
  color:var(--text);

  font-weight:900;

  overflow:hidden;

  text-overflow:ellipsis;
}

.history-ok{
  color:var(--green);

  font-size:16px;

  font-weight:900;

  text-align:right;
}

.empty{
  display:block !important;

  text-align:center;

  color:#7a90a3;
}


/* ============================================================
   フッター
   ============================================================ */

.footer{
  padding:
    14px
    10px
    4px;

  color:#8aa0b2;

  font-size:13px;

  text-align:center;
}


/* ============================================================
   スマホ
   ============================================================ */

@media(max-width:480px){

  .page{
    padding:
      10px
      9px
      20px;
  }

  .hero{
    padding:
      20px
      10px
      21px;
  }

  .hero h1{
    font-size:30px;
  }

  .card{
    padding:11px;
  }

  .mode-btn{
    min-height:82px;

    font-size:25px;
  }

  .history-list li{
    grid-template-columns:
      auto
      auto
      minmax(70px,1fr)
      24px;
  }

}
</style>
</head>


<body>

<div class="page">


<header class="hero">

  <h1>
    🚙 運転手MENU
  </h1>

</header>


<main class="card">


  <!-- ========================================================
       人物選択
       ======================================================== -->

  <div class="top-row">

    <div class="select-box">

      <label for="driverSelect">
        選択
      </label>

      <select
        id="driverSelect"
      >

        <option value="">
          ⏳ 判別中
        </option>

      </select>

    </div>

  </div>


  <!-- ========================================================
       今月担当
       ======================================================== -->

  <div
    id="assignment"
    class="assignment"
  >
    👔 今月の担当：確認中...
  </div>


  <!-- ========================================================
       出勤・退勤
       ======================================================== -->

  <div class="mode-box">

    <button
      id="inMode"
      class="mode-btn in"
      type="button"
      disabled
    >
      ☀️ 出勤
    </button>


    <button
      id="outMode"
      class="mode-btn out off"
      type="button"
      disabled
    >
      🌙 退勤
    </button>

  </div>


  <div class="guide">
    必要な場合は修正お願いします。
  </div>


  <!-- ========================================================
       写真選択
       ======================================================== -->

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    class="hidden"
  >


  <button
    id="uploadBtn"
    class="upload-btn"
    type="button"
    disabled
  >
    📷 写真を撮影・選択して読み取る
  </button>


  <div
    id="notice"
    class="notice"
  ></div>


  <!-- ========================================================
       写真＋修正
       ======================================================== -->

  <section
    id="preview"
    class="preview"
  >

    <div class="preview-box">


      <!-- ====================================================
           写真
           ==================================================== -->

      <img
        id="photoPreview"
        class="photo-preview"
        alt="勤怠写真"
      >


      <!-- ====================================================
           勤怠項目
           ==================================================== -->

      <div class="fields">


        <!-- 日付 -->

        <div class="field">

          <label
            class="field-title"
            for="reportDate"
          >
            日付
          </label>

          <input
            id="reportDate"
            type="date"
          >

        </div>


        <!-- 出勤時間 -->

        <div class="field">

          <label
            class="field-title"
            for="startTime"
          >
            出勤時間
          </label>

          <input
            id="startTime"
            type="time"
          >

        </div>


        <!-- 退勤時間 -->

        <div
          id="endField"
          class="field hidden"
        >

          <label
            class="field-title"
            for="endTime"
          >
            退勤時間
          </label>

          <input
            id="endTime"
            type="time"
          >

        </div>


        <!-- 次回出勤日 -->

        <div
          id="nextDateField"
          class="field hidden"
        >

          <label
            class="field-title"
            for="nextDate"
          >
            次回出勤日
          </label>

          <input
            id="nextDate"
            type="date"
          >

        </div>


        <!-- 次回出勤時間 -->

        <div
          id="nextTimeField"
          class="field hidden"
        >

          <label
            class="field-title"
            for="nextTime"
          >
            次回出勤時間
          </label>

          <select
            id="nextTime"
          ></select>

        </div>


        <!-- 残業 -->

        <div
          id="summary"
          class="summary"
        >

          前回残業
          <strong>0:00</strong>

          　

          月間合計
          <strong>0:00</strong>

        </div>


      </div>


      <!-- ====================================================
           報告文章
           ==================================================== -->

      <div
        class="message-section"
      >

        <div
          class="message-title"
        >
          報告文章
        </div>


        <div
          class="message-box"
        >

          <div
            id="messagePreview"
            class="message-preview"
          ></div>


          <textarea
            id="memo"
            class="memo-input"
            placeholder="文章を入力できます"
          ></textarea>

        </div>

      </div>


      <!-- ====================================================
           送信
           ==================================================== -->

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        disabled
      >
        写真＋報告文章を送信
      </button>


    </div>

  </section>


  <!-- ========================================================
       履歴
       ======================================================== -->

  <section
    class="history"
  >

    <h2
      class="history-title"
    >
      履歴
    </h2>


    <ul
      id="historyList"
      class="history-list"
    >

      <li
        class="empty"
      >
        人物を選択すると履歴を表示します
      </li>

    </ul>

  </section>


</main>


<footer class="footer">
  勤怠管理Bot
</footer>


</div>


<script>

/* ============================================================
   設定
   ============================================================ */

const API_URL =
  'https://script.google.com/macros/s/AKfycbySmhEE3JyfWGxEylyWscOtqL3FTIH9Ww6nybcAGb0f_kw2QXVP-LaoVtT1eFRtv-4Lyw/exec';

const LIFF_ID =
  '2011011273-HIdBF1sM';

const AUTO_DETECT_TIMEOUT =
  5000;


/* ============================================================
   DOM
   ============================================================ */

const el = {

  driverSelect:
    document.getElementById(
      'driverSelect'
    ),

  assignment:
    document.getElementById(
      'assignment'
    ),

  inMode:
    document.getElementById(
      'inMode'
    ),

  outMode:
    document.getElementById(
      'outMode'
    ),

  uploadBtn:
    document.getElementById(
      'uploadBtn'
    ),

  photoInput:
    document.getElementById(
      'photoInput'
    ),

  notice:
    document.getElementById(
      'notice'
    ),

  preview:
    document.getElementById(
      'preview'
    ),

  photoPreview:
    document.getElementById(
      'photoPreview'
    ),

  reportDate:
    document.getElementById(
      'reportDate'
    ),

  startTime:
    document.getElementById(
      'startTime'
    ),

  endField:
    document.getElementById(
      'endField'
    ),

  endTime:
    document.getElementById(
      'endTime'
    ),

  nextDateField:
    document.getElementById(
      'nextDateField'
    ),

  nextDate:
    document.getElementById(
      'nextDate'
    ),

  nextTimeField:
    document.getElementById(
      'nextTimeField'
    ),

  nextTime:
    document.getElementById(
      'nextTime'
    ),

  summary:
    document.getElementById(
      'summary'
    ),

  messagePreview:
    document.getElementById(
      'messagePreview'
    ),

  memo:
    document.getElementById(
      'memo'
    ),

  sendBtn:
    document.getElementById(
      'sendBtn'
    ),

  historyList:
    document.getElementById(
      'historyList'
    )

};


/* ============================================================
   STATE
   ============================================================ */

const state = {

  idToken:'',

  drivers:[],

  driver:null,

  mode:'in',

  draft:null,

  userSelectedManually:false,

  workState:{
    hasWork:false,
    startTime:''
  },

  summary:{
    previousOvertime:'0:00',
    monthlyOvertime:'0:00'
  },

  history:[]

};


/* ============================================================
   次回出勤時間
   00:00～23:59 + ??:??
   ============================================================ */

function buildNextTimeOptions(){

  el.nextTime.innerHTML = '';

  for(
    let hour=0;
    hour<24;
    hour++
  ){

    for(
      let minute=0;
      minute<60;
      minute++
    ){

      const value =
        String(hour).padStart(2,'0')+
        ':'+
        String(minute).padStart(2,'0');

      const option =
        document.createElement(
          'option'
        );

      option.value =
        value;

      option.textContent =
        value;

      el.nextTime.appendChild(
        option
      );

    }

  }


  const unknown =
    document.createElement(
      'option'
    );

  unknown.value =
    '??:??';

  unknown.textContent =
    '??:??';

  el.nextTime.appendChild(
    unknown
  );


  el.nextTime.value =
    '08:00';

}


/* ============================================================
   選択状態表示
   ============================================================ */

function setSelectStatus(
  text
){

  /*
   * 自動判別中・選択可などを
   * 人物選択欄1つだけで表示。
   */

  el.driverSelect.innerHTML =
    '';

  const option =
    document.createElement(
      'option'
    );

  option.value =
    '';

  option.textContent =
    text;

  option.selected =
    true;

  el.driverSelect.appendChild(
    option;

  );

}


function setDetecting(){

  setSelectStatus(
    '⏳ 判別中'
  );

}


function setSelectable(){

  /*
   * 人物一覧が既に存在する場合は
   * 一覧を描画し直す。
   */

  if(
    state.drivers.length
  ){

    renderDrivers();

    return;

  }

  setSelectStatus(
    '選択可'
  );

}


/* ============================================================
   共通
   ============================================================ */

function pad2(
  value
){

  return String(
    value
  ).padStart(
    2,
    '0'
  );

}


function today(){

  const d =
    new Date();

  return (
    d.getFullYear()+
    '-' +
    pad2(
      d.getMonth()+1
    )+
    '-' +
    pad2(
      d.getDate()
    )
  );

}


function nowTime(){

  const d =
    new Date();

  return (
    pad2(
      d.getHours()
    )+
    ':'+
    pad2(
      d.getMinutes()
    )
  );

}


function tomorrow(){

  const d =
    new Date();

  d.setDate(
    d.getDate()+1
  );

  return (
    d.getFullYear()+
    '-' +
    pad2(
      d.getMonth()+1
    )+
    '-' +
    pad2(
      d.getDate()
    )
  );

}


function dateText(
  value
){

  if(
    !value
  ){

    return '';

  }

  const d =
    new Date(
      value+
      'T00:00:00'
    );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }

  const week=[
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return (
    d.getFullYear()+
    '/' +
    (d.getMonth()+1)+
    '/' +
    d.getDate()+
    '('+
    week[d.getDay()]+
    ')'
  );

}


function shortDate(
  value
){

  if(
    !value
  ){

    return '';

  }

  const d =
    new Date(
      value+
      'T00:00:00'
    );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }

  const week=[
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return (
    (d.getMonth()+1)+
    '/' +
    d.getDate()+
    '('+
    week[d.getDay()]+
    ')'
  );

}


/*
 * 「来週」だけを付ける。
 * 「明日」は使用しない。
 */
function nextAttendancePrefix(
  value
){

  if(
    !value
  ){

    return '';

  }

  const base =
    new Date(
      today()+
      'T00:00:00'
    );

  const target =
    new Date(
      value+
      'T00:00:00'
    );

  const baseDay =
    base.getDay() || 7;

  const targetDay =
    target.getDay() || 7;

  const monday =
    new Date(
      base
    );

  monday.setDate(
    base.getDate()-
    baseDay+
    1
  );

  const nextMonday =
    new Date(
      monday
    );

  nextMonday.setDate(
    monday.getDate()+7
  );

  const targetMonday =
    new Date(
      target
    );

  targetMonday.setDate(
    target.getDate()-
    targetDay+
    1
  );

  if(
    nextMonday.getTime()===
    targetMonday.getTime()
  ){

    return '来週';

  }

  return '';

}


function escapeHtml(
  value
){

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#39;'
  );

}


function showNotice(

){

  el.notice.textContent =

  el.notice.classList.toggle(

function withTimeout(
  promise,
  milliseconds
){

  return Promise.race([

    promise,

    new Promise(
      (
        resolve,
        reject
      )=>{

        setTimeout(
          ()=>{
            reject(
              new Error(
                'timeout'
              )
            );
          },
          milliseconds
        );

      }
    )

  ]);

}


/* ============================================================
   API
   ============================================================ */

async function callServer(
  operation,
  data={}
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);

      const params =
        new URLSearchParams();

      params.append(
        'action',
        'api'
      );

      params.append(
        'operation',
        operation
      );

      params.append(
        'requestId',
        requestId
      );

      params.append(
        'idToken',
        state.idToken || ''
      );

      Object.keys(
        data
      ).forEach(
        key=>{

          params.append(
            key,
            data[key] ?? ''
          );

        }
      );


      fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'
          },

          body:
            params.toString(),

          mode:'no-cors'
        }
      )
      .catch(
        error=>{

          console.warn(
            'API POST失敗',
            error
          );

        }
      );


      pollApi(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


function pollApi(
  requestId,
  resolve,
  reject,
  attempt
){

  if(
    attempt>=50
  ){

    reject(
      new Error(
        'サーバー応答がタイムアウトしました'
      )
    );

    return;
  }


  const callback =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt;


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup(){

    if(
      script.parentNode
    ){

      script.parentNode.removeChild(
        script
      );

    }

    try{

      delete window[
        callback
      ];

    }catch(_){

      window[
        callback
      ] =
        undefined;

    }

  }


  window[
    callback
  ] =
    function(response){

      if(
        finished
      ){

        return;

      }


      finished =
        true;


      cleanup();


      if(
        response &&
        (
          response.status ===
            'pending' ||
          response.status ===
            'processing'
        )
      ){

        setTimeout(
          ()=>{

            pollApi(
              requestId,
              resolve,
              reject,
              attempt+1
            );

          },
          500
        );

        return;

      }


      if(
        !response ||
        response.ok !== true
      ){

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );

        return;

      }


      resolve(
        response.data
      );

    };


  script.onerror =
    function(){

      if(
        finished
      ){

        return;

      }


      finished =
        true;


      cleanup();


      setTimeout(
        ()=>{

          pollApi(
            requestId,
            resolve,
            reject,
            attempt+1
          );

        },
        500
      );

    };


  script.src =
    API_URL+
    '?action=pollApi'+
    '&requestId='+
    encodeURIComponent(
      requestId
    )+
    '&callback='+
    encodeURIComponent(
      callback
    )+
    '&_='+
    Date.now();


  document.body.appendChild(
    script
  );

}

/* ============================================================
   履歴
   ============================================================ */

function normalizeHistoryType(
  item
){

  const raw =
    String(
      item.type ||
      item.mode ||
      ''
    )
    .trim()
    .toLowerCase();


  if(
    raw === 'in' ||
    raw === '出勤' ||
    raw === '出勤時'
  ){

    return '出勤';

  }


  if(
    raw === 'out' ||
    raw === '退勤' ||
    raw === '退勤時'
  ){

    return '退勤';

  }


  return '';

}


function normalizeHistoryDate(
  item
){

  const value =
    item.date ||
    item.reportDate ||
    '';


  if(
    !value
  ){

    return '';

  }


  const text =
    String(
      value
    );


  let match =
    text.match(
      /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/
    );


  if(
    match
  ){

    return (
      match[1]+
      '/' +
      Number(match[2])+
      '/' +
      Number(match[3])
    );

  }


  match =
    text.match(
      /^(\d{1,2})[\/-](\d{1,2})/
    );


  if(
    match
  ){

    const now =
      new Date();


    return (
      now.getFullYear()+
      '/' +
      Number(match[1])+
      '/' +
      Number(match[2])
    );

  }


  return text;

}


function renderHistory(
  list
){

  if(
    !Array.isArray(list) ||
    !list.length
  ){

    el.historyList.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';


    return;

  }


  const sorted =
    [...list].sort(
      (a,b)=>
        Number(
          b.savedAt || 0
        ) -
        Number(
          a.savedAt || 0
        )
    );


  el.historyList.innerHTML =
    sorted
      .map(
        item=>{

          const type =
            normalizeHistoryType(
              item
            );


          const date =
            normalizeHistoryDate(
              item
            );


          let time =
            '';


          if(
            type === '退勤'
          ){

            time =
              (
                item.startTime ||
                '0:00'
              )+
              '→'+
              (
                item.endTime ||
                '0:00'
              );

          }else if(
            type === '出勤'
          ){

            time =
              item.reportTime ||
              item.startTime ||
              '0:00';

          }


          return (
            '<li>'+
              '<span class="history-date">'+
                escapeHtml(
                  date
                )+
              '</span>'+
              '<span class="history-type">'+
                escapeHtml(
                  type
                )+
              '</span>'+
              '<span class="history-time">'+
                escapeHtml(
                  time
                )+
              '</span>'+
              '<span class="history-ok">✅</span>'+
            '</li>'
          );

        }
      )
      .join('');

}

      nowTime();

      )+

      '合計)'+
      (
        state.summary.monthlyOvertime ||
        '0:00'
      )+
      '\n'+
      '【MEMO】'
    );

  }


  const reportDate =
    el.reportDate.value ||
    today();


  const start =
    el.startTime.value ||
    state.workState.startTime ||
    '00:00';


  const end =
    el.endTime.value ||
    nowTime();


  const nextDate =
    el.nextDate.value ||
    tomorrow();


  const nextTime =
    el.nextTime.value ||
    '??:??';


  const prefix =
    nextAttendancePrefix(
      nextDate
    );

    shortDate(

    );


  let nextAttendance =
    '';


  if(
    prefix
  ){

    nextAttendance =
      prefix+
      ' '+
      datePart;

  }else{

    nextAttendance =
      datePart;

  }


  nextAttendance +=
    ' '+
    nextTime;


  return (
    'お疲れ様でございます。\n'+
    '業務完了いたしました。\n'+
    dateText(
      reportDate
    )+
    '\n'+
    '稼働)'+
    start+
    '→'+
    end+
    '\n'+
    '本日は失礼させていただきます。\n'+
    '出勤) '+
    nextAttendance+
    '\n'+
    '明日もよろしくお願いいたします。\n'+
    '【MEMO】'
  );

}

/* ============================================================
   写真
   ============================================================ */

function imageToDataUrl(
  file
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const image =
            new Image();


          image.onload =
            function(){

              const max =
                1800;


              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                Math.round(
                  image.width*
                  scale
                );


              canvas.height =
                Math.round(
                  image.height*
                  scale
                );


              const context =
                canvas.getContext(
                  '2d',
                  {
                    alpha:false
                  }
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .86
                )
              );

            };


          image.onerror =
            reject;


          image.src =
            reader.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

   OCR

async function runBrowserOcr(
  dataUrl
){

  if(
    !window.Tesseract
  ){

    throw new Error(
      'OCRライブラリの読み込みに失敗しました'
    );

  }


  const result =
    await Tesseract.recognize(
      dataUrl,
      'eng',
      {

        logger:
          message=>{

            if(
              message &&
              message.status ===
                'recognizing text' &&
              message.progress
            ){

              showNotice(
                '写真を読み取り中... '+
                Math.round(
                  message.progress*
                  100
                )+
                '%'
              );

            }

          },

        tessedit_pageseg_mode:
          6

      }
    );


  return (
    result &&
    result.data
      ? String(
          result.data.text || ''
        )
      : ''
  );

}

async function sendDraft(){

  ){

  el.sendBtn.disabled =

  showNotice(

        }
      );


    if(
      !result ||
      result.ok !== true
    ){

      throw new Error(
        '送信に失敗しました'
      );

    }


    showNotice(
      '送信完了しました。'
    );


    state.draft =
      null;


    el.preview.classList.remove(
      'show'
    );


    el.photoInput.value =
      '';


    el.memo.value =
      '';


    await refreshSelectedDriverData();


  }catch(error){

    console.error(
      error
    );


    showNotice(
      error.message ||
      '送信に失敗しました'
    );


  }finally{

    el.sendBtn.disabled =
      !state.draft;

  }

}

/* ============================================================
   自動判別
   ============================================================ */

async function autoDetect(){

  /*
   * 判別中を人物選択欄だけに表示。
   */
  setDetecting();


  try{

    if(
      typeof liff ===
      'undefined'
    ){

      throw new Error(
        'LIFF SDKが読み込まれていません'
      );

    }


    await withTimeout(
      liff.init({
        liffId:
          LIFF_ID
      }),
      AUTO_DETECT_TIMEOUT
    );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      !liff.isLoggedIn()
    ){

      await loadDrivers();

      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      await loadDrivers();

      return;

    }


    const info =
      await withTimeout(
        callServer(
          'getDriverInfo'
        ),
        AUTO_DETECT_TIMEOUT
      );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      info &&
      info.found &&
      info.driverKey
    ){

      const driver =
        findDriver(
          info.driverKey
        );


      if(
        driver
      ){

        await selectDriver(
          driver,
          false
        );


        return;

      }

    }


    await loadDrivers();


  }catch(error){

    console.warn(
      '自動判別失敗',
      error
    );


    await loadDrivers();


  }

}

    );

    el.outMode.disabled =

    el.uploadBtn.disabled =
      true;


    el.assignment.textContent =
      '👔 今月の担当：確認中...';


    setDetecting();


    refreshMessage();


    loadDrivers()
      .catch(
        error=>{

          console.error(
            error

          setSelectable();

        }
      );


    setTimeout(
      ()=>{

  }
);
