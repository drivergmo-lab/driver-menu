<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>運転手MENU</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    :root {
      --bg1: #e7f7ff;
      --bg2: #f8fcff;
      --card: #ffffff;
      --line: #d5eaf7;
      --text: #17324d;
      --muted: #71889a;
      --blue: #1676c7;
      --green: #18824e;
      --green-bg: #eefbf3;
      --soft: #f7fcff;
      --danger: #c93b3b;
      --shadow: 0 12px 34px rgba(40, 92, 128, .10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          var(--bg1),
          var(--bg2)
        );

      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      box-sizing: border-box;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;

      padding:
        12px 10px
        calc(24px + env(safe-area-inset-bottom));
    }

    /* ========================================================
       HERO
       ======================================================== */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 22px 14px 18px;

      border-radius: 26px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          #bfeaff 0%,
          #e8f9ff 78%,
          #8bd07c 78%,
          #73c768 100%
        );

      box-shadow: var(--shadow);
    }

    .hero-car {
      font-size: 48px;
      line-height: 1;
    }

    .hero h1 {
      margin: 7px 0 0;

      color: var(--blue);

      font-size: 32px;
      line-height: 1.1;
      font-weight: 900;
    }

    /* ========================================================
       MAIN
       ======================================================== */

    .card {
      width: 100%;

      margin-top: 12px;
      padding: 13px;

      border-radius: 24px;

      background: rgba(255,255,255,.97);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    /* ========================================================
       STATUS
       ======================================================== */

    .status {
      display: flex;

      align-items: center;
      justify-content: center;

      width: fit-content;
      max-width: 100%;

      min-height: 44px;

      margin: 0 auto 11px;

      padding: 9px 17px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: #f3fbff;

      color: var(--blue);

      font-size: 15px;
      font-weight: 900;

      text-align: center;
    }

    .status.done {
      color: var(--green);

      background: var(--green-bg);

      border-color: #ccefd8;
    }

    .status.error {
      color: var(--danger);

      background: #fff3f3;

      border-color: #f0cccc;
    }

    /* ========================================================
       DRIVER
       ======================================================== */

    .box {
      width: 100%;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: var(--soft);

      overflow: hidden;
    }

    .driver-box {
      padding: 10px 12px;
    }

    .label {
      display: block;

      margin-bottom: 6px;

      color: #637c90;

      font-size: 13px;
      font-weight: 900;
    }

    select,
    input[type="time"],
    input[type="date"] {
      display: block;

      width: 100%;
      min-width: 0;
      max-width: 100%;

      height: 46px;

      border: 1px solid #cfe4f3;
      border-radius: 13px;

      padding: 0 9px;

      outline: none;

      background: #ffffff;

      color: var(--text);

      font-size: 16px;
      font-weight: 800;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #67b6ea;

      box-shadow:
        0 0 0 3px
        rgba(103, 182, 234, .14);
    }

    /* ========================================================
       MODE
       ======================================================== */

    .mode-box {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 8px;

      width: 100%;

      margin-top: 10px;
      padding: 8px;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: var(--soft);

      overflow: hidden;
    }

    .mode-btn {
      min-width: 0;
      min-height: 74px;

      border: 0;
      border-radius: 15px;

      background: #e7f4fb;

      color: #738a9a;

      font-size: 23px;
      font-weight: 900;

      cursor: pointer;

      transition: .15s ease;
    }

    .mode-btn.active.in {
      color: #084e78;

      background:
        linear-gradient(
          180deg,
          #70cdfb,
          #aee9ff 60%,
          #79d272
        );

      box-shadow:
        0 5px 12px
        rgba(67, 170, 225, .18);
    }

    .mode-btn.active.out {
      color: #ffffff;

      background:
        linear-gradient(
          180deg,
          #5b73c9,
          #1b357c
        );

      box-shadow:
        0 5px 12px
        rgba(39, 68, 145, .24);
    }

    /* ========================================================
       PHOTO
       ======================================================== */

    .upload-btn {
      display: block;

      width: 100%;
      min-height: 54px;

      margin-top: 11px;

      padding: 12px 14px;

      border: 1px solid #cfe8f7;
      border-radius: 17px;

      background: #eaf7ff;

      color: var(--blue);

      font-size: 17px;
      font-weight: 900;

      cursor: pointer;
    }

    .upload-btn:active {
      transform: translateY(1px);
    }

    .notice {
      display: none;

      width: 100%;

      margin-top: 10px;

      padding: 10px 12px;

      border: 1px solid var(--line);
      border-radius: 13px;

      background: #f7fcff;

      color: #5c7588;

      font-size: 13px;
      line-height: 1.5;

      text-align: center;
    }

    .notice.show {
      display: block;
    }

    /* ========================================================
       PREVIEW
       ======================================================== */

    .preview-wrap {
      display: none;

      width: 100%;

      margin-top: 12px;

      padding: 12px;

      border: 1px solid var(--line);
      border-radius: 19px;

      background: #ffffff;

      overflow: hidden;
    }

    .preview-wrap.show {
      display: block;
    }

    .photo-preview {
      display: block;

      width: 100%;
      max-width: 100%;
      max-height: 390px;

      object-fit: contain;

      border-radius: 15px;

      background: #eef4f8;
    }

    .section-title {
      margin: 14px 0 8px;

      color: var(--blue);

      font-size: 18px;
      font-weight: 900;

      text-align: center;
    }

    /* OCRの生データは表示しない */

    .ocr-text {
      display: none !important;
    }

    /* ========================================================
       INPUT FIELDS
       ======================================================== */

    .fields {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 8px;

      width: 100%;

      margin-top: 11px;
    }

    .field {
      width: 100%;
      min-width: 0;

      padding: 8px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #f9fdff;

      overflow: hidden;
    }

    .field input {
      display: block;

      width: 100%;
      min-width: 0;
      max-width: 100%;

      height: 42px;

      padding: 0 6px;

      border-radius: 12px;

      font-size: 16px;
      font-weight: 900;

      text-align: center;
    }

    input[type="date"] {
      font-size: 14px;
    }

    input[type="time"] {
      font-size: 17px;
    }

    .summary {
      grid-column: 1 / -1;

      width: 100%;
      min-width: 0;

      padding: 11px 8px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #f7fcff;

      color: #446276;

      font-size: 14px;
      font-weight: 800;

      text-align: center;

      overflow: hidden;
    }

    .summary strong {
      color: var(--blue);

      font-size: 16px;
    }

    /* ========================================================
       MESSAGE
       ======================================================== */

    .message-box {
      width: 100%;
      min-width: 0;

      margin-top: 11px;

      padding: 13px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: #f4fbff;

      overflow: hidden;
    }

    .extra-message-label {
      margin-top: 8px;
      margin-bottom: 6px;

      color: #637c90;

      font-size: 13px;
      font-weight: 900;
    }

    .extra-message {
      display: block;

      width: 100%;
      min-width: 0;
      max-width: 100%;

      min-height: 84px;

      resize: vertical;

      padding: 10px;

      border: 1px solid #cfe4f3;
      border-radius: 13px;

      background: #ffffff;

      color: var(--text);

      font-size: 14px;
      line-height: 1.6;

      outline: none;
    }

    .message-preview {
      width: 100%;
      min-width: 0;

      min-height: 130px;

      margin-top: 13px;

      padding: 12px;

      border: 1px solid #dcecf6;
      border-radius: 13px;

      background: #ffffff;

      color: #15446e;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;

      white-space: pre-line;

      word-break: break-word;
      overflow-wrap: anywhere;

      overflow: hidden;
    }

    /* ========================================================
       SEND
       ======================================================== */

    .send-btn {
      display: block;

      width: 100%;
      min-height: 55px;

      margin-top: 11px;

      padding: 13px 14px;

      border: 0;
      border-radius: 17px;

      background:
        linear-gradient(
          180deg,
          #56baf0,
          #2d88d8
        );

      color: #ffffff;

      font-size: 19px;
      font-weight: 900;

      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: .45;

      cursor: not-allowed;
    }

    /* ========================================================
       HISTORY
       ======================================================== */

    .history {
      width: 100%;

      margin-top: 17px;

      padding-top: 14px;

      border-top: 1px solid #e1edf5;

      overflow: hidden;
    }

    .history-title {
      margin: 0 0 10px;

      color: var(--blue);

      font-size: 21px;
      font-weight: 900;

      text-align: center;
    }

    .history-list {
      width: 100%;

      list-style: none;

      margin: 0;
      padding: 0;
    }

    .history-item {
      display: flex;

      align-items: center;

      gap: 8px;

      width: 100%;
      min-width: 0;

      min-height: 46px;

      padding: 10px 2px;

      border-bottom: 1px solid #edf4fa;

      color: #536b7c;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;
    }

    .history-date {
      flex: 0 0 42px;

      color: #687f90;
    }

    .history-type {
      flex: 0 0 42px;

      color: var(--blue);

      font-weight: 900;
    }

    .history-time {
      flex: 1 1 auto;

      min-width: 0;

      color: var(--text);

      font-weight: 900;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .history-ok {
      flex: 0 0 auto;

      color: var(--green);

      font-weight: 900;
    }

    .empty {
      padding: 10px;

      color: #8095a5;

      text-align: center;
    }

    .footer {
      padding: 15px 0 4px;

      color: #8aa0b2;

      font-size: 13px;

      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* ========================================================
       MOBILE
       ======================================================== */

    @media (max-width: 420px) {

      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      .card {
        padding: 10px;
      }

      .mode-btn {
        min-height: 68px;

        font-size: 20px;
      }

      .field {
        padding: 6px;
      }

      .field input {
        padding-left: 3px;
        padding-right: 3px;
      }

      input[type="date"] {
        font-size: 12px;
      }

      input[type="time"] {
        font-size: 16px;
      }

      .history-item {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <!-- ========================================================
       HEADER
       ======================================================== -->

  <header class="hero">

    <div class="hero-car">
      🚙
    </div>

    <h1>
      運転手MENU
    </h1>

  </header>


  <!-- ========================================================
       MAIN
       ======================================================== -->

  <main class="card">

    <div
      id="status"
      class="status"
    >
      👤 人物を選択できます
    </div>


    <!-- 人物選択 -->

    <section class="box driver-box">

      <label
        class="label"
        for="driverSelect"
      >
        人物選択
      </label>

      <select id="driverSelect">

        <option value="">
          人物を選択してください
        </option>

      </select>

    </section>


    <!-- 出勤 / 退勤 -->

    <section class="mode-box">

      <button
        id="inMode"
        class="mode-btn active in"
        type="button"
      >
        ☀️ 出勤
      </button>

      <button
        id="outMode"
        class="mode-btn"
        type="button"
      >
        🌙 退勤
      </button>

    </section>


    <!--
      captureを付けていないので、

      ・その場で撮影
      ・過去写真を選択

      の両方が利用可能
    -->

    <input
      id="photoInput"
      class="hidden"
      type="file"
      accept="image/*"
    >


    <button
      id="uploadBtn"
      class="upload-btn"
      type="button"
    >
      📷 写真を撮影・選択して読み取る
    </button>


    <div
      id="notice"
      class="notice"
    ></div>


    <!-- ======================================================
         写真確認
         ====================================================== -->

    <section
      id="previewWrap"
      class="preview-wrap"
    >

      <img
        id="photoPreview"
        class="photo-preview"
        alt="勤怠写真"
      >


      <div class="section-title">
        🔎 写真の読み取り結果
      </div>


      <div class="fields">

        <!-- 報告日 -->

        <div class="field">

          <label
            class="label"
            for="reportDate"
          >
            報告日
          </label>

          <input
            id="reportDate"
            type="date"
          >

        </div>


        <!-- 出勤時間 -->

        <div
          class="field"
          id="reportTimeField"
        >

          <label
            id="reportTimeLabel"
            class="label"
            for="reportTime"
          >
            出勤時間
          </label>

          <input
            id="reportTime"
            type="time"
          >

        </div>


        <!-- 退勤時の出勤時間 -->

        <div
          id="startField"
          class="field hidden"
        >

          <label
            class="label"
            for="startTime"
          >
            出勤時間
          </label>

          <input
            id="startTime"
            type="time"
          >

        </div>


        <!-- 退勤時間 -->

        <div
          id="endField"
          class="field hidden"
        >

          <label
            class="label"
            for="endTime"
          >
            退勤時間
          </label>

          <input
            id="endTime"
            type="time"
          >

        </div>


        <!-- 次回出勤日 -->

        <div
          id="nextDateField"
          class="field hidden"
        >

          <label
            class="label"
            for="nextDate"
          >
            次回出勤日
          </label>

          <input
            id="nextDate"
            type="date"
          >

        </div>


        <!-- 次回出勤時間 -->

        <div
          id="nextTimeField"
          class="field hidden"
        >

          <label
            class="label"
            for="nextTime"
          >
            次回出勤時間
          </label>

          <input
            id="nextTime"
            type="time"
            value="08:00"
          >

        </div>


        <!-- 残業 -->

        <div
          id="summary"
          class="summary"
        >

          前回残業
          <strong>0:00</strong>

          　

          月間合計
          <strong>0:00</strong>

        </div>

      </div>


      <!-- ====================================================
           送信内容
           ==================================================== -->

      <section class="message-box">

        <div
          class="section-title"
          style="margin-top:0;"
        >
          📝 送信内容
        </div>


        <div class="extra-message-label">
          追加文章（任意）
        </div>


        <textarea
          id="extraMessage"
          class="extra-message"
          rows="3"
          placeholder="【MEMO】追加文章"
        ></textarea>


        <div
          id="messagePreview"
          class="message-preview"
        ></div>

      </section>


      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        disabled
      >
        📤 写真＋報告文章を送信
      </button>

    </section>


    <!-- ======================================================
         今日の履歴
         ====================================================== -->

    <section class="history">

      <h2 class="history-title">
        🕘 今日の履歴
      </h2>


      <ul
        id="historyList"
        class="history-list"
      >

        <li class="empty">
          人物を選択すると履歴を表示します
        </li>

      </ul>

    </section>

  </main>


  <footer class="footer">
    運転手Bot
  </footer>

</div>


<script>

// ============================================================
// ★ 最新 Apps Script URL
// ============================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbxUMjEbzsDobOSlGoXpAtXBujfHSlVmTFSmd1ep4EMO_WHV5x3AZrATH2A9po6XqDsY/exec';


// ============================================================
// LIFF
// ============================================================

const LIFF_ID =
  '2011011273-HIdBF1sM';


// ============================================================
// LOCAL STORAGE
// ============================================================

const RECENT_STORAGE_KEY =
  'driver_menu_recent_v5';

const DRIVER_CACHE_KEY =
  'driver_menu_driver_list_v2';

const LAST_DRIVER_KEY =
  'driver_menu_last_driver_v2';


// ============================================================
// 自動判別は最大2.5秒
// ============================================================

const AUTO_DETECT_TIMEOUT_MS =
  2500;


// ============================================================
// STATE
// ============================================================

const state = {

  idToken: '',

  drivers: [],

  driver: null,

  mode: 'in',

  draft: null,

  manualSelected: false,

  workState: {

    hasWork: false,

    startTime: ''

  },

  summary: {

    previousOvertime: '0:00',

    monthlyOvertime: '0:00'

  }

};


// ============================================================
// ELEMENT
// ============================================================

const el = {

  status:
    document.getElementById(
      'status'
    ),

  driverSelect:
    document.getElementById(
      'driverSelect'
    ),

  inMode:
    document.getElementById(
      'inMode'
    ),

  outMode:
    document.getElementById(
      'outMode'
    ),

  photoInput:
    document.getElementById(
      'photoInput'
    ),

  uploadBtn:
    document.getElementById(
      'uploadBtn'
    ),

  notice:
    document.getElementById(
      'notice'
    ),

  previewWrap:
    document.getElementById(
      'previewWrap'
    ),

  photoPreview:
    document.getElementById(
      'photoPreview'
    ),

  reportDate:
    document.getElementById(
      'reportDate'
    ),

  reportTimeField:
    document.getElementById(
      'reportTimeField'
    ),

  reportTimeLabel:
    document.getElementById(
      'reportTimeLabel'
    ),

  reportTime:
    document.getElementById(
      'reportTime'
    ),

  startField:
    document.getElementById(
      'startField'
    ),

  startTime:
    document.getElementById(
      'startTime'
    ),

  endField:
    document.getElementById(
      'endField'
    ),

  endTime:
    document.getElementById(
      'endTime'
    ),

  nextDateField:
    document.getElementById(
      'nextDateField'
    ),

  nextDate:
    document.getElementById(
      'nextDate'
    ),

  nextTimeField:
    document.getElementById(
      'nextTimeField'
    ),

  nextTime:
    document.getElementById(
      'nextTime'
    ),

  summary:
    document.getElementById(
      'summary'
    ),

  extraMessage:
    document.getElementById(
      'extraMessage'
    ),

  messagePreview:
    document.getElementById(
      'messagePreview'
    ),

  sendBtn:
    document.getElementById(
      'sendBtn'
    ),

  historyList:
    document.getElementById(
      'historyList'
    )

};


// ============================================================
// STATUS
// ============================================================

function setStatus(
  text,
  type
) {

  el.status.textContent =
    text;


  el.status.classList.remove(
    'done',
    'error'
  );


  if (
    type === 'done'
  ) {

    el.status.classList.add(
      'done'
    );

  }


  if (
    type === 'error'
  ) {

    el.status.classList.add(
      'error'
    );

  }

}


// ============================================================
// NOTICE
// ============================================================

function showNotice(
  text
) {

  el.notice.textContent =
    text;

  el.notice.classList.add(
    'show'
  );

}


function hideNotice() {

  el.notice.textContent =
    '';

  el.notice.classList.remove(
    'show'
  );

}


// ============================================================
// API
// ============================================================

function callServer(
  operation,
  data
) {

  data =
    data || {};


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      params.append(
        'action',
        'api'
      );


      params.append(
        'operation',
        operation
      );


      params.append(
        'requestId',
        requestId
      );


      params.append(
        'idToken',
        state.idToken || ''
      );


      Object.keys(
        data
      ).forEach(
        function(key) {

          params.append(
            key,
            data[key] == null
              ? ''
              : String(
                  data[key]
                )
          );

        }
      );


      fetch(
        API_URL,
        {

          method: 'POST',

          mode: 'no-cors',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params.toString()

        }
      ).catch(
        function(error) {

          console.warn(
            'POST:',
            error
          );

        }
      );


      pollResult(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


// ============================================================
// POLL
// ============================================================

function pollResult(
  requestId,
  resolve,
  reject,
  attempt
) {

  if (
    attempt >= 50
  ) {

    reject(
      new Error(
        'Apps Scriptから応答がありませんでした'
      )
    );

    return;

  }


  const callback =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


    try {

      delete window[
        callback
      ];

    } catch (_) {

      window[
        callback
      ] = undefined;

    }

  }


  window[
    callback
  ] =
    function(
      response
    ) {

      if (
        finished
      ) {

        return;

      }


      if (
        response &&
        (
          response.status === 'pending' ||
          response.status === 'processing'
        )
      ) {

        cleanup();


        setTimeout(
          function() {

            pollResult(
              requestId,
              resolve,
              reject,
              attempt + 1
            );

          },
          400
        );


        return;

      }


      finished =
        true;


      cleanup();


      if (
        !response ||
        response.ok !== true
      ) {

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );


        return;

      }


      resolve(
        response.data
      );

    };


  script.onerror =
    function() {

      if (
        finished
      ) {

        return;

      }


      cleanup();


      setTimeout(
        function() {

          pollResult(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        400
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callback
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}


// ============================================================
// CACHE
// ============================================================

function getCachedDrivers() {

  try {

    const raw =
      localStorage.getItem(
        DRIVER_CACHE_KEY
      );


    if (!raw) {

      return [];

    }


    const parsed =
      JSON.parse(
        raw
      );


    return Array.isArray(
      parsed
    )
      ? parsed
      : [];

  } catch (_) {

    return [];

  }

}


function saveCachedDrivers(
  drivers
) {

  try {

    localStorage.setItem(
      DRIVER_CACHE_KEY,
      JSON.stringify(
        drivers
      )
    );

  } catch (_) {

  }

}


// ============================================================
// RECENT DRIVER
// ============================================================

function getRecentDrivers() {

  try {

    const raw =
      localStorage.getItem(
        RECENT_STORAGE_KEY
      );


    const parsed =
      JSON.parse(
        raw || '[]'
      );


    return Array.isArray(
      parsed
    )
      ? parsed
      : [];

  } catch (_) {

    return [];

  }

}


function saveRecentDriver(
  driver
) {

  if (!driver) {

    return;

  }


  let list =
    getRecentDrivers();


  list =
    list.filter(
      function(item) {

        return (
          item.driverKey !==
          driver.driverKey
        );

      }
    );


  list.unshift({

    driverKey:
      driver.driverKey,

    displayName:
      driver.displayName

  });


  try {

    localStorage.setItem(
      RECENT_STORAGE_KEY,

      JSON.stringify(
        list.slice(
          0,
          10
        )
      )
    );

  } catch (_) {

  }

}

// LAST DRIVER
// ============================================================

function saveLastDriver(
  driver
) {

  if (!driver) {

    return;

  }


  try {

    localStorage.setItem(

      JSON.stringify({

        driverKey:
          driver.driverKey,

        displayName:
          driver.displayName

      })
    );

  } catch (_) {

  }

}


function getLastDriver() {

// ============================================================
// DRIVER
// ============================================================

function findDriver(
  driverKey
) {

  if (!driverKey) {

    return null;

  }


  return (
    state.drivers.find(
      function(driver) {

        return (
          driver.driverKey ===
          driverKey
        );

      }
    ) || null
  );

}


// ============================================================
// DRIVER SELECT
// ============================================================

function renderDrivers() {

  const selectedKey =
    state.driver
      ? state.driver.driverKey
      : el.driverSelect.value;


  el.driverSelect.innerHTML =
    '<option value="">人物を選択してください</option>';


  const recent =
    getRecentDrivers();


  const recentDrivers =
    recent
      .map(
        function(item) {

          return findDriver(
            item.driverKey
          );

        }
      )
      .filter(Boolean);


  const used =
    new Set(
      recentDrivers.map(
        function(driver) {

          return driver.driverKey;

        }
      )
    );


  if (
    recentDrivers.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '最近使った人物';


    recentDrivers.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          '★ ' +
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  const others =
    state.drivers.filter(
      function(driver) {

        return (
          !used.has(
            driver.driverKey
          )
        );

      }
    );


  if (
    others.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '人物一覧';


    others.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  if (
    selectedKey &&
    findDriver(
      selectedKey
    )
  ) {

    el.driverSelect.value =
      selectedKey;

  }

}

// SELECT DRIVER
// ============================================================

async function selectDriver(
  driver,
  source
) {

  if (!driver) {

    return;

  }


  if (
    source === 'manual'
  ) {

    state.manualSelected =
      true;

  }


  state.driver =
    driver;


  state.draft =
    null;


  saveRecentDriver(
    driver
  );


  saveLastDriver(
    driver
  );


  renderDrivers();


  el.driverSelect.value =
    driver.driverKey;


  setStatus(
    '✓ ' +
    driver.displayName,
    'done'
  );


  el.historyList.innerHTML =
    '<li class="empty">履歴を読み込んでいます...</li>';


  await loadDriverState();

}


// ============================================================
// LOAD DRIVER LIST
// ============================================================

async function loadDrivers() {

  /*
   * まず前回保存した人物一覧を即表示
   */

  const cached =
    getCachedDrivers();


  if (
    cached.length
  ) {

    state.drivers =
      cached;


    renderDrivers();


    const last =
      getLastDriver();


    if (
      last
    ) {

      const driver =
        findDriver(
          last.driverKey
        );


      if (
        driver
      ) {

        el.driverSelect.value =
          driver.driverKey;

      }

    }

  }


  /*
   * 最新人物一覧は裏で取得
   */

  try {

    const result =
      await callServer(
        'getDriverList'
      );


    if (
      Array.isArray(
        result
      ) &&
      result.length
    ) {

      state.drivers =
        result;


      saveCachedDrivers(
        result
      );


      renderDrivers();


      /*
       * まだ人物未選択なら
       * 前回人物を選択欄に表示
       */

      if (
        !state.driver
      ) {

        const last =
          getLastDriver();


        if (
          last
        ) {

          const driver =
            findDriver(
              last.driverKey
            );


          if (
            driver
          ) {

            el.driverSelect.value =
              driver.driverKey;

          }

        }

      }

    }

  } catch (error) {

    console.warn(
      '人物一覧取得失敗:',
      error
    );

  }

}


// ============================================================
// TIMEOUT
// ============================================================

function withTimeout(
  promise,
  milliseconds
) {

  return Promise.race([

    promise,

    new Promise(
      function(resolve) {

        setTimeout(
          function() {

            resolve(
              null
            );

          },
          milliseconds
        );

      }
    )

  ]);

}


// ============================================================
// LIFF AUTO DETECT
// ============================================================

async function initLiff() {

  try {

    const initResult =
      await withTimeout(
        liff.init({

          liffId:
            LIFF_ID,

          withLoginOnExternalBrowser:
            true

        }),
        AUTO_DETECT_TIMEOUT_MS
      );


    /*
     * 2.5秒以上かかる場合
     * 手動選択を優先
     */

    if (
      initResult === null
    ) {

      if (
        !state.driver
      ) {

        setStatus(
          '👤 人物を選択してください'
        );

      }


      return;

    }


    if (
      !liff.isLoggedIn()
    ) {

      if (
        !state.driver
      ) {

        setStatus(
          '👤 人物を選択してください'
        );

      }


      return;

    }


    state.idToken =
      liff.getIDToken() || '';


    if (
      !state.idToken
    ) {

      return;

    }


    const info =
      await withTimeout(
        callServer(
          'getDriverInfo'
        ),
        AUTO_DETECT_TIMEOUT_MS
      );


    /*
     * 手動選択済みなら
     * 後から自動判別で上書きしない
     */

    if (
      state.manualSelected
    ) {

      return;

    }


    if (
      info &&
      info.found
    ) {

      const driver =
        findDriver(
          info.driverKey
        );


      if (
        driver
      ) {

        await selectDriver(
          driver,
          'auto'
        );


        setStatus(
          '✓ ' +
          driver.displayName,
          'done'
        );


        return;

      }

    }


    if (
      !state.driver
    ) {

      setStatus(
        '👤 人物を選択してください'
      );

    }


  } catch (error) {

    console.warn(
      '自動判別:',
      error
    );


    if (
      !state.driver
    ) {

      setStatus(
        '👤 人物を選択してください'
      );

    }

  }

}

// ============================================================
// HISTORY
// ============================================================

function normalizeDisplayTime(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  const text =
    String(
      value
    ).trim();


  if (!text) {

    return '';

  }


  const simple =
    text.match(
      /^(\d{1,2}):(\d{2})$/
    );


  if (
    simple
  ) {

    return (

      String(
        Number(
          simple[1]
        )
      ).padStart(
        2,
        '0'
      ) +

      ':' +

      String(
        Number(
          simple[2]
        )
      ).padStart(
        2,
        '0'
      )

    );

  }


  const match =
    text.match(
      /(\d{1,2}):(\d{2})(?::\d{2})?/
    );


  if (
    match
  ) {

    return (

      String(
        Number(
          match[1]
        )
      ).padStart(
        2,
        '0'
      ) +

      ':' +

      String(
        Number(
          match[2]
        )
      ).padStart(
        2,
        '0'
      )

    );

  }


  return text;

}


function renderHistory(
  history
) {

  const list =
    Array.isArray(
      history
    )
      ? history.slice()
      : [];


  /*
   * savedAtが大きいもの
   * ＝後から送信されたもの
   * を上にする
   */

  list.sort(
    function(a, b) {

      return (

        Number(
          b.savedAt || 0
        ) -

        Number(
          a.savedAt || 0
        )

      );

    }
  );


  if (
    !list.length
  ) {

    el.historyList.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';


    return;

  }


  el.historyList.innerHTML =
    list.map(
      function(item) {

        const date =
          String(
            item.date || ''
          );


        const type =
          item.type === '退勤'
            ? '退勤'
            : '出勤';


        const reportTime =
          normalizeDisplayTime(
            item.reportTime
          );


        const startTime =
          normalizeDisplayTime(
            item.startTime
          );


        const endTime =
          normalizeDisplayTime(
            item.endTime
          );


        let timeText =
          '';


        if (
          type === '退勤'
        ) {

          timeText =
            startTime +
            '→' +
            endTime;

        } else {

          timeText =
            reportTime;

        }


        return (

          '<li class="history-item">' +

            '<span class="history-date">' +
              escapeHtml(
                date
              ) +
            '</span>' +

            '<span class="history-type">' +
              escapeHtml(
                type
              ) +
            '</span>' +

            '<span class="history-time">' +
              escapeHtml(
                timeText
              ) +
            '</span>' +

            '<span class="history-ok">' +
              '✓完了' +
            '</span>' +

          '</li>'

        );

      }
    ).join('');

}

// ============================================================
// IMAGE
// ============================================================

function prepareImage(
  file
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onerror =
        function() {

          reject(
            new Error(
              '写真を読み込めませんでした'
            )
          );

        };


      reader.onload =
        function() {

          const image =
            new Image();


          image.onerror =
            function() {

              reject(
                new Error(
                  '画像を開けませんでした'
                )
              );

            };


          image.onload =
            function() {

              const maxSide =
                1800;


              const scale =
                Math.min(
                  1,

                  maxSide /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const width =
                Math.max(
                  1,
                  Math.round(
                    image.width *
                    scale
                  )
                );


              const height =
                Math.max(
                  1,
                  Math.round(
                    image.height *
                    scale
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d',
                  {
                    alpha: false
                  }
                );


              ctx.fillStyle =
                '#ffffff';


              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              const dataUrl =
                canvas.toDataURL(
                  'image/jpeg',
                  .86
                );


              resolve({

                dataUrl:
                  dataUrl,

                width:
                  width,

                height:
                  height

              });

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


// ============================================================
// OCR
// ============================================================

async function runOcr(
  dataUrl
) {

  if (
    !window.Tesseract
  ) {

    throw new Error(
      '無料OCRを読み込めませんでした'
    );

  }


  const result =
    await Tesseract.recognize(
      dataUrl,
      'eng',
      {

        logger:
          function(message) {

            if (
              !message
            ) {

              return;

            }


            if (
              message.status ===
              'recognizing text'
            ) {

              const percent =
                Math.round(
                  Number(
                    message.progress || 0
                  ) *
                  100
                );


              showNotice(
                '写真を読み取り中... ' +
                percent +
                '%'
              );

            }

          }

      }
    );


  if (
    !result ||
    !result.data
  ) {

    return '';

  }


  return String(
    result.data.text || ''
  );

}

    if (
      !draft ||
      !draft.draftId
    ) {

      throw new Error(
        '写真の下書きを作成できませんでした'
      );

    }


    state.draft =
      draft;


    el.previewWrap.classList.add(
      'show'
    );


    el.reportDate.value =
      draft.reportDate ||
      todayDate();


    if (
      state.mode === 'in'
    ) {

      el.reportTime.value =
        draft.ocrTime ||
        currentTime();

    } else {

      el.startTime.value =
        draft.startTime ||
        state.workState.startTime ||
        '';


      el.endTime.value =
        draft.endTime ||
        draft.ocrTime ||
        currentTime();


      if (
        !el.nextDate.value
      ) {

        el.nextDate.value =
          tomorrowDate();

      }


      if (
        !el.nextTime.value
      ) {

        el.nextTime.value =
          '08:00';

      }

    }


    if (
      draft.previousOvertime != null
    ) {

      state.summary.previousOvertime =
        draft.previousOvertime;

    }


    if (
      draft.monthlyOvertime != null
    ) {

      state.summary.monthlyOvertime =
        draft.monthlyOvertime;

    }


    renderSummary();


    refreshMessage();


    el.sendBtn.disabled =
      false;


    showNotice(
      '読み取り完了。日付・時間・文章を確認してください。'
    );


    setTimeout(
      function() {

        el.previewWrap.scrollIntoView({

          behavior: 'smooth',

          block: 'start'

        });

      },
      100
    );


  } catch (error) {

    console.error(
      error
    );


    showNotice(
      error.message ||
      '写真の読み取りに失敗しました'
    );


    el.sendBtn.disabled =
      true;

  }

}


// ============================================================
// MESSAGE
// ============================================================

function refreshMessage() {

  if (
    !state.driver
  ) {

    return;

  }


  const extra =
    (
      el.extraMessage.value || ''
    ).trim();


  // ----------------------------------------------------------
  // 出勤
  // ----------------------------------------------------------

  if (
    state.mode === 'in'
  ) {

    const reportDate =
      el.reportDate.value ||
      todayDate();


    const reportTime =
      el.reportTime.value || '';


    const dateLabel =
      formatJapaneseDate(
        reportDate
      );


    let message =

      'お疲れ様でございます。\n' +

      dateLabel +

      reportTime +

      '出勤いたしました。\n' +

      '本日もよろしくお願いいたします。\n' +

      '残業)' +

      (
        state.summary.previousOvertime ||
        '0:00'
      ) +

      '\n' +

      '合計)' +

      (
        state.summary.monthlyOvertime ||
        '0:00'
      );


    if (
      extra
    ) {

      message +=
        '\n【MEMO】\n' +
        extra;

    }


    el.messagePreview.textContent =
      message;


    return;

  }


  // ----------------------------------------------------------
  // 退勤
  // ----------------------------------------------------------

  const reportDate =
    el.reportDate.value ||
    todayDate();


  const startTime =
    el.startTime.value || '';


  const endTime =
    el.endTime.value || '';


  const nextDate =
    el.nextDate.value || '';


  const nextTime =
    el.nextTime.value || '';


  let message =

    'お疲れ様でございます。\n' +

    '業務完了いたしました。\n\n' +

    formatJapaneseDate(
      reportDate
    ) +

    '\n' +

    '稼働）' +

    startTime +

    '-' +

    endTime +

    '\n' +

    '本日は失礼させていただきます。';


  if (
    extra
  ) {

    message +=
      '\n\n【MEMO】\n' +
      extra;

  }


  if (
    nextDate
  ) {

    message +=

      '\n\n' +

      '出勤）' +

      formatShortDate(
        nextDate
      ) +

      (
        nextTime
          ? ' ' +
            nextTime
          : ''
      ) +

      '\n' +

      getNextLabel(
        nextDate
      ) +

      'もよろしくお願いいたします。';

  }


  el.messagePreview.textContent =
    message;

}


// ============================================================
// SEND
// ============================================================

async function sendAttendance() {

  if (
    !state.driver
  ) {

    alert(
      '人物を選択してください。'
    );

    return;

  }


  if (
    !state.draft ||
    !state.draft.draftId
  ) {

    alert(
      '先に写真を選択してください。'
    );

    return;

  }


  if (
    !el.reportDate.value
  ) {

    alert(
      '報告日を確認してください。'
    );

    return;

  }


  if (
    state.mode === 'in' &&
    !el.reportTime.value
  ) {

    alert(
      '出勤時間を確認してください。'
    );

    return;

  }


  if (
    state.mode === 'out' &&
    (
      !el.startTime.value ||
      !el.endTime.value
    )
  ) {

    alert(
      '出勤時間と退勤時間を確認してください。'
    );

    return;

  }


  refreshMessage();


  el.sendBtn.disabled =
    true;


  showNotice(
    '写真＋報告文章を送信しています...'
  );


  try {

    const result =
      await callServer(
        'sendAttendanceDraft',
        {

          draftId:
            state.draft.draftId,

          mode:
            state.mode,

          reportDate:
            el.reportDate.value,

          reportTime:
            state.mode === 'in'
              ? el.reportTime.value
              : el.endTime.value,

          startTime:
            state.mode === 'out'
              ? el.startTime.value
              : el.reportTime.value,

          endTime:
            state.mode === 'out'
              ? el.endTime.value
              : '',

          nextDate:
            state.mode === 'out'
              ? el.nextDate.value
              : '',

          nextTime:
            state.mode === 'out'
              ? el.nextTime.value
              : '',

          message:
            el.messagePreview.textContent

        }
      );


    if (
      !result ||
      result.ok !== true
    ) {

      throw new Error(
        '送信処理が完了しませんでした'
      );

    }


    showNotice(
      '✓ 写真＋報告文章を送信しました。'
    );


    state.draft =
      null;


    el.photoInput.value =
      '';


    el.previewWrap.classList.remove(
      'show'
    );


    await reloadHistoryWithRetry();


    try {

      const workState =
        await callServer(
          'getWorkState',
          {

            selectedDriverKey:
              state.driver.driverKey

          }
        );


      state.workState =
        workState || {

          hasWork: false,

          startTime: ''

        };


    } catch (_) {

    }


  } catch (error) {

    console.error(
      error
    );


    showNotice(
      error.message ||
      '送信に失敗しました'
    );


    el.sendBtn.disabled =
      false;

  }

}


// ============================================================
// DATE
// ============================================================

function todayDate() {

  const d =
    new Date();


  return (

    d.getFullYear() +
    '-' +

    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +
    '-' +

    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )

  );

}


function tomorrowDate() {

  const d =
    new Date();


  d.setDate(
    d.getDate() + 1
  );


  return (

    d.getFullYear() +
    '-' +

    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +
    '-' +

    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )

  );

}


function currentTime() {

  const d =
    new Date();


  return (

    String(
      d.getHours()
    ).padStart(
      2,
      '0'
    ) +

    ':' +

    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    )

  );

}


function formatJapaneseDate(
  value
) {

  const match =
    String(
      value || ''
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if (
    !match
  ) {

    return String(
      value || ''
    ).replace(
      /-/g,
      '/'
    );

  }


  const year =
    Number(
      match[1]
    );


  const month =
    Number(
      match[2]
    );


  const day =
    Number(
      match[3]
    );


  const date =
    new Date(
      year,
      month - 1,
      day
    );


  const weekdays = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  return (

    month +
    '/' +
    day +
    '(' +
    weekdays[
      date.getDay()
    ] +
    ')'

  );

}


function formatShortDate(
  value
) {

  const match =
    String(
      value || ''
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if (
    !match
  ) {

    return value || '';

  }


  return (

    Number(
      match[2]
    ) +
    '/' +
    Number(
      match[3]
    )

  );

}


function getNextLabel(
  value
) {

  if (
    !value
  ) {

    return '次回';

  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const target =
    new Date(
      value +
      'T00:00:00'
    );


  const diff =
    Math.round(
      (
        target -
        today
      ) /
      86400000
    );


  if (
    diff === 1
  ) {

    return '明日';

  }


  if (
    diff === 2
  ) {

    return '明後日';

  }


  return '次回';

}


// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#39;'
    );

}


// ============================================================
// SLEEP
// ============================================================

function sleep(
  milliseconds
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


// ============================================================
// EVENTS
// ============================================================

el.driverSelect.addEventListener(
  'change',
  async function() {

    const driver =
      findDriver(
        el.driverSelect.value
      );


    if (
      !driver
    ) {

      return;

    }


    await selectDriver(
      driver,
      'manual'
    );

  }
);


el.inMode.addEventListener(
  'click',
  function() {

    setMode(
      'in'
    );

  }
);


el.outMode.addEventListener(
  'click',
  function() {

    setMode(
      'out'
    );

  }
);


el.uploadBtn.addEventListener(
  'click',
  function() {

    if (
      !state.driver
    ) {

      alert(
        '先に人物を選択してください。'
      );


      return;

    }


    el.photoInput.click();

  }
);


el.photoInput.addEventListener(
  'change',
  function() {

    const file =
      el.photoInput.files &&
      el.photoInput.files[0];


    if (
      file
    ) {

      processPhoto(
        file
      );

    }

  }
);


[
  el.reportDate,
  el.reportTime,
  el.startTime,
  el.endTime,
  el.nextDate,
  el.nextTime,
  el.extraMessage
].forEach(
  function(input) {

    input.addEventListener(
      'input',
      refreshMessage
    );


    input.addEventListener(
      'change',
      refreshMessage
    );

  }
);


el.sendBtn.addEventListener(
  'click',
  sendAttendance
);

// START

window.addEventListener(
  'load',
  function() {

    /*
     * 日付を即セット
     */

    el.reportDate.value =
      todayDate();


    el.nextDate.value =
      tomorrowDate();


    el.nextTime.value =
      '08:00';


    setMode(
      'in'
    );


    /*
     * ★ 自動判別完了を待たない
     */

    setStatus(
      '👤 人物を選択できます'
    );


    /*
     * 前回取得した人物一覧を
     * その場で表示
     */

    const cachedDrivers =
      getCachedDrivers();


    if (
      cachedDrivers.length
    ) {

      state.drivers =
        cachedDrivers;


      renderDrivers();


      /*
       * 前回使った人物を
       * 選択欄に表示
       *
       * ただし、この時点では
       * 勝手に報告人物として確定しない。
       */

      const last =
        getLastDriver();


      if (
        last
      ) {

        const driver =
          findDriver(
            last.driverKey
          );


        if (
          driver
        ) {

          el.driverSelect.value =
            driver.driverKey;

        }

      }

    }


    /*
     * ★ ここから2つを同時実行
     *
     * 1. 最新人物一覧
     * 2. LINE本人自動判別
     *
     * お互いを待たない。
     */

    loadDrivers();


    initLiff();

  }
);
