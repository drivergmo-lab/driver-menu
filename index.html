<script>

  // ==========================================================
  // ★★★★★ 設定 ★★★★★
  // ==========================================================

  const API_URL =
    'https://script.google.com/macros/s/AKfycbzcqyJl-AD5dt8iZ6wb17UxnbfgXuk0Y_RFDVi6-wxZdF9flYGFid0m1mXBSUJxzQdk/exec';

  const LIFF_ID =
    '2011011273-HIdBF1sM';


  // ==========================================================
  // 最近使用した人物
  // ==========================================================

  const RECENT_KEYS = [
    'driver_menu_recent_drivers_v1',
    'driver_menu_recent_drivers_v2'
  ];

  const MAX_RECENT_DRIVERS = 10;


  // ==========================================================
  // DOM
  // ==========================================================

  const els = {

    statusPill:
      document.getElementById('statusPill'),

    statusIcon:
      document.getElementById('statusIcon'),

    statusText:
      document.getElementById('statusText'),

    driverSelect:
      document.getElementById('driverSelect'),

    btnIn:
      document.getElementById('btnIn'),

    btnOut:
      document.getElementById('btnOut'),

    editPanel:
      document.getElementById('editPanel'),

    inFields:
      document.getElementById('inFields'),

    outFields:
      document.getElementById('outFields'),

    clockInTime:
      document.getElementById('clockInTime'),

    editClockInTime:
      document.getElementById('editClockInTime'),

    clockOutTime:
      document.getElementById('clockOutTime'),

    nextDate:
      document.getElementById('nextDate'),

    nextTime:
      document.getElementById('nextTime'),

    preview:
      document.getElementById('preview'),

    sendBtn:
      document.getElementById('sendBtn'),

    historyList:
      document.getElementById('historyList')
  };


  // ==========================================================
  // 状態
  // ==========================================================

  const state = {

    driver: null,

    idToken: '',

    mode: null,

    lastStartTime: '',

    history: [],

    drivers: [],

    userSelectedManually: false,

    autoDetectFinished: false,

    driverListLoaded: false

  };


  // ==========================================================
  // 状態表示
  //
  // detecting
  // waiting
  // done
  // ==========================================================

  function setStatus(status) {

    els.statusPill.classList.remove('done');

    if (status === 'done') {

      els.statusIcon.textContent = '✓';
      els.statusText.textContent = '完了';

      els.statusPill.classList.add('done');

      return;
    }


    if (status === 'waiting') {

      els.statusIcon.textContent = '👤';
      els.statusText.textContent = '人物選択待ち';

      return;
    }


    els.statusIcon.textContent = '⏳';
    els.statusText.textContent = '自動判別中...';
  }


  // ==========================================================
  // 人物選択を有効化
  // ==========================================================

  function enableAttendance(driver) {

    if (!driver) {
      return;
    }

    state.driver = driver;

    els.btnIn.disabled = false;
    els.btnOut.disabled = false;
    els.sendBtn.disabled = false;

    els.driverSelect.value = driver.driverKey;
  }


  // ==========================================================
  // 人物を選択
  // ==========================================================

  function selectDriver(driver, manual) {

    if (!driver) {
      return false;
    }

    state.driver = driver;
    state.userSelectedManually = !!manual;

    saveRecentDriver(driver);

    enableAttendance(driver);

    setStatus('done');

    return true;
  }


  // ==========================================================
  // driverKeyから人物を探す
  // ==========================================================

  function findDriverByKey(driverKey) {

    if (!driverKey) {
      return null;
    }

    const serverDriver =
      state.drivers.find(function(driver) {

        return driver.driverKey === driverKey;

      });

    if (serverDriver) {
      return serverDriver;
    }


    const recent =
      getRecentDrivers();

    const recentDriver =
      recent.find(function(driver) {

        return driver.driverKey === driverKey;

      });

    if (recentDriver) {
      return recentDriver;
    }

    return null;
  }


  // ==========================================================
  // 最近使用した人物を取得
  // ==========================================================

  function getRecentDrivers() {

    const result = [];

    for (const key of RECENT_KEYS) {

      try {

        const raw =
          localStorage.getItem(key);

        if (!raw) {
          continue;
        }

        const list =
          JSON.parse(raw);

        if (!Array.isArray(list)) {
          continue;
        }

        for (const item of list) {

          if (
            !item ||
            !item.driverKey ||
            !item.displayName
          ) {
            continue;
          }

          const exists =
            result.some(function(existing) {

              return (
                existing.driverKey ===
                item.driverKey
              );

            });

          if (!exists) {

            result.push({

              driverKey:
                item.driverKey,

              displayName:
                item.displayName

            });

          }
        }

      } catch (error) {

        console.warn(
          '人物履歴の読み込み失敗',
          error
        );

      }
    }

    return result.slice(
      0,
      MAX_RECENT_DRIVERS
    );
  }


  // ==========================================================
  // 最近使用した人物を保存
  // ==========================================================

  function saveRecentDriver(driver) {

    if (
      !driver ||
      !driver.driverKey ||
      !driver.displayName
    ) {
      return;
    }

    try {

      let list =
        getRecentDrivers();

      list =
        list.filter(function(item) {

          return (
            item.driverKey !==
            driver.driverKey
          );

        });

      list.unshift({

        driverKey:
          driver.driverKey,

        displayName:
          driver.displayName

      });

      list =
        list.slice(
          0,
          MAX_RECENT_DRIVERS
        );

      localStorage.setItem(

        'driver_menu_recent_drivers_v1',

        JSON.stringify(list)

      );

    } catch (error) {

      console.warn(
        '人物履歴の保存失敗',
        error
      );

    }
  }


  // ==========================================================
  // 起動直後の人物選択肢
  //
  // ネットワーク不要
  // ==========================================================

  function renderRecentDriversImmediately() {

    const recent =
      getRecentDrivers();

    els.driverSelect.innerHTML = '';

    const placeholder =
      document.createElement('option');

    placeholder.value = '';

    placeholder.textContent =
      '人物を選択してください';

    els.driverSelect.appendChild(
      placeholder
    );


    if (!recent.length) {

      return;
    }


    const group =
      document.createElement(
        'optgroup'
      );

    group.label =
      '最近使った人物';


    recent.forEach(function(driver) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        driver.driverKey;

      option.textContent =
        driver.displayName;

      group.appendChild(
        option
      );

    });


    els.driverSelect.appendChild(
      group
    );
  }


  // ==========================================================
  // driver_master一覧を画面に表示
  // ==========================================================

  function renderDriverList() {

    const currentKey =
      state.driver
        ? state.driver.driverKey
        : '';


    els.driverSelect.innerHTML =
      '';


    const placeholder =
      document.createElement(
        'option'
      );

    placeholder.value = '';

    placeholder.textContent =
      '人物を選択してください';

    els.driverSelect.appendChild(
      placeholder
    );


    if (!state.drivers.length) {

      /*
       * driver_master取得失敗でも
       * 最近使用した人物を使えるようにする
       */

      const recent =
        getRecentDrivers();

      if (recent.length) {

        const recentGroup =
          document.createElement(
            'optgroup'
          );

        recentGroup.label =
          '最近使った人物';


        recent.forEach(function(driver) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            driver.driverKey;

          option.textContent =
            driver.displayName;

          recentGroup.appendChild(
            option
          );

        });


        els.driverSelect.appendChild(
          recentGroup
        );
      }

      return;
    }


    const recent =
      getRecentDrivers();

    const recentKeySet =
      new Set(

        recent.map(function(item) {

          return item.driverKey;

        })

      );


    const recentDrivers =
      state.drivers.filter(function(driver) {

        return recentKeySet.has(
          driver.driverKey
        );

      });


    if (recentDrivers.length) {

      const recentGroup =
        document.createElement(
          'optgroup'
        );

      recentGroup.label =
        '最近使った人物';


      recentDrivers.forEach(function(driver) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;

        recentGroup.appendChild(
          option
        );

      });


      els.driverSelect.appendChild(
        recentGroup
      );
    }


    const others =
      state.drivers.filter(function(driver) {

        return !recentKeySet.has(
          driver.driverKey
        );

      });


    if (others.length) {

      const otherGroup =
        document.createElement(
          'optgroup'
        );

      otherGroup.label =
        'その他の人物';


      others.forEach(function(driver) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;

        otherGroup.appendChild(
          option
        );

      });


      els.driverSelect.appendChild(
        otherGroup
      );
    }


    if (currentKey) {

      els.driverSelect.value =
        currentKey;
    }
  }


  // ==========================================================
  // API
  // ==========================================================

  function callServer(
    operation,
    data = {}
  ) {

    return new Promise(function(
      resolve,
      reject
    ) {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const formData =
        new URLSearchParams();


      formData.append(
        'action',
        'api'
      );

      formData.append(
        'operation',
        operation
      );

      formData.append(
        'requestId',
        requestId
      );

      formData.append(
        'idToken',
        state.idToken || ''
      );

      formData.append(
        'message',
        data.message || ''
      );

      formData.append(
        'selectedDriverKey',
        data.selectedDriverKey || ''
      );


      fetch(

        API_URL,

        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            formData.toString()

        }

      ).catch(function(error) {

        console.warn(
          'API POST失敗',
          error
        );

      });


      pollApiResult_(
        requestId,
        resolve,
        reject,
        0
      );

    });
  }


  // ==========================================================
  // API結果取得
  // ==========================================================

  function pollApiResult_(
    requestId,
    resolve,
    reject,
    attempt
  ) {

    const MAX_ATTEMPTS = 40;
    const WAIT_MS = 500;


    if (attempt >= MAX_ATTEMPTS) {

      reject(
        new Error(
          'Apps Script APIの応答が20秒以内に返りませんでした'
        )
      );

      return;
    }


    const callbackName =
      'gasCallback_' +
      Date.now() +
      '_' +
      attempt;


    const script =
      document.createElement(
        'script'
      );


    let finished = false;


    function cleanup() {

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

      try {

        delete window[
          callbackName
        ];

      } catch (error) {

        window[
          callbackName
        ] = undefined;

      }
    }


    window[
      callbackName
    ] = function(response) {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();


      if (
        response &&
        (
          response.status === 'pending' ||
          response.status === 'processing'
        )
      ) {

        setTimeout(function() {

          pollApiResult_(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        }, WAIT_MS);

        return;
      }


      if (
        !response ||
        response.ok !== true
      ) {

        reject(

          new Error(

            response &&
            response.error

              ? response.error

              : 'Apps Script APIエラー'

          )

        );

        return;
      }


      resolve(
        response.data
      );
    };


    script.onerror = function() {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();


      setTimeout(function() {

        pollApiResult_(
          requestId,
          resolve,
          reject,
          attempt + 1
        );

      }, WAIT_MS);

    };


    script.src =

      API_URL +

      '?action=pollApi' +

      '&requestId=' +
      encodeURIComponent(
        requestId
      ) +

      '&callback=' +
      encodeURIComponent(
        callbackName
      ) +

      '&_=' +
      Date.now();


    document.body.appendChild(
      script
    );
  }


  // ==========================================================
  // driver_master取得
  // ==========================================================

  async function loadDriverList() {

    try {

      const list =
        await callServer(
          'getDriverList'
        );


      if (!Array.isArray(list)) {

        throw new Error(
          'driver_master一覧が不正です'
        );
      }


      state.drivers =
        list.filter(function(driver) {

          return (
            driver &&
            driver.driverKey &&
            driver.displayName
          );

        });


      state.driverListLoaded =
        true;


      renderDriverList();


      /*
       * すでに手動選択済みなら
       * その人物を維持
       */

      if (
        state.userSelectedManually &&
        state.driver
      ) {

        els.driverSelect.value =
          state.driver.driverKey;

        enableAttendance(
          state.driver
        );

        return;
      }


      /*
       * 最近人物が現在のdriver_masterに存在するなら
       * 正式データに置き換える
       */

      if (state.driver) {

        const officialDriver =
          state.drivers.find(
            function(driver) {

              return (
                driver.driverKey ===
                state.driver.driverKey
              );

            }
          );


        if (officialDriver) {

          state.driver =
            officialDriver;

          enableAttendance(
            officialDriver
          );

        }
      }


    } catch (error) {

      console.error(
        'driver_master取得失敗',
        error
      );


      /*
       * APIが失敗しても
       * 手動選択を利用可能にする
       */

      state.driverListLoaded =
        false;

      renderDriverList();


      if (state.driver) {

        enableAttendance(
          state.driver
        );
      }

    }
  }


  // ==========================================================
  // 日付
  // ==========================================================

  function pad2(value) {

    return String(
      value
    ).padStart(
      2,
      '0'
    );
  }


  function toTimeInput(date) {

    return (

      pad2(
        date.getHours()
      ) +

      ':' +

      pad2(
        date.getMinutes()
      )

    );
  }


  function toDateInput(date) {

    return (

      date.getFullYear() +

      '-' +

      pad2(
        date.getMonth() + 1
      ) +

      '-' +

      pad2(
        date.getDate()
      )

    );
  }


  function weekdayJa(date) {

    return [

      '日',
      '月',
      '火',
      '水',
      '木',
      '金',
      '土'

    ][
      date.getDay()
    ];
  }


  function dateLabel(date) {

    return (

      (date.getMonth() + 1) +
      '/' +
      date.getDate() +
      '(' +
      weekdayJa(date) +
      ')'

    );
  }


  function dateSlash(date) {

    return (

      date.getFullYear() +
      '/' +
      (date.getMonth() + 1) +
      '/' +
      date.getDate()

    );
  }


  function tomorrowDate() {

    const date =
      new Date();

    date.setDate(
      date.getDate() + 1
    );

    return date;
  }


  // ==========================================================
  // 次回出勤表現
  // ==========================================================

  function getNextAttendanceLabel(
    today,
    nextDate
  ) {

    const todayDate =
      new Date(

        today.getFullYear(),
        today.getMonth(),
        today.getDate()

      );


    const targetDate =
      new Date(

        nextDate.getFullYear(),
        nextDate.getMonth(),
        nextDate.getDate()

      );


    const diffDays =
      Math.round(

        (
          targetDate.getTime() -
          todayDate.getTime()
        ) /

        (
          1000 *
          60 *
          60 *
          24
        )

      );


    if (diffDays === 1) {
      return '明日';
    }


    if (diffDays === 2) {
      return '明後日';
    }


    const todayWeekday =
      todayDate.getDay() === 0
        ? 7
        : todayDate.getDay();


    const targetWeekday =
      targetDate.getDay() === 0
        ? 7
        : targetDate.getDay();


    const thisWeekMonday =
      new Date(
        todayDate
      );


    thisWeekMonday.setDate(

      todayDate.getDate() -
      (todayWeekday - 1)

    );


    const nextWeekMonday =
      new Date(
        thisWeekMonday
      );


    nextWeekMonday.setDate(
      thisWeekMonday.getDate() + 7
    );


    const targetWeekMonday =
      new Date(
        targetDate
      );


    targetWeekMonday.setDate(

      targetDate.getDate() -
      (targetWeekday - 1)

    );


    if (
      targetWeekMonday.getTime() ===
      nextWeekMonday.getTime()
    ) {

      return '来週';
    }


    const nextMonth =
      new Date(

        todayDate.getFullYear(),
        todayDate.getMonth() + 1,
        1

      );


    const targetMonth =
      new Date(

        targetDate.getFullYear(),
        targetDate.getMonth(),
        1

      );


    if (
      targetMonth.getTime() ===
      nextMonth.getTime()
    ) {

      return '来月';
    }


    return '次回';
  }


  // ==========================================================
  // 手動人物選択
  // ==========================================================

  els.driverSelect.addEventListener(
    'change',
    function() {

      const driverKey =
        els.driverSelect.value;


      if (!driverKey) {

        /*
         * placeholderに戻した場合
         */

        state.driver = null;
        state.userSelectedManually = false;

        els.btnIn.disabled = true;
        els.btnOut.disabled = true;
        els.sendBtn.disabled = true;

        setStatus('waiting');

        return;
      }


      const driver =
        findDriverByKey(
          driverKey
        );


      if (!driver) {

        alert(
          'この人物の情報を取得できませんでした。'
        );

        return;
      }


      /*
       * ★ 手動選択は自動判別を待たない
       */

      selectDriver(
        driver,
        true
      );
    }
  );


  // ==========================================================
  // 出勤
  // ==========================================================

  els.btnIn.addEventListener(
    'click',
    function() {

      if (!state.driver) {

        alert(
          '先に人物を選択してください。'
        );

        return;
      }


      setMode('in');
    }
  );


  // ==========================================================
  // 退勤
  // ==========================================================

  els.btnOut.addEventListener(
    'click',
    function() {

      if (!state.driver) {

        alert(
          '先に人物を選択してください。'
        );

        return;
      }


      setMode('out');
    }
  );


  // ==========================================================
  // メッセージ
  // ==========================================================

  function buildInMessage() {

    const today =
      new Date();

    return (

      'お疲れ様でございます。\n\n' +

      dateLabel(today) +
      '出勤いたしました。\n\n' +

      '本日もよろしくお願いいたします。'

    );
  }


  function buildOutMessage() {

    const today =
      new Date();

    let next =
      tomorrowDate();


    if (els.nextDate.value) {

      next =
        new Date(
          els.nextDate.value +
          'T00:00:00'
        );
    }


    const nextTime =
      els.nextTime.value ||
      '08:00';


    const nextLabel =
      getNextAttendanceLabel(
        today,
        next
      );


    return (

      'お疲れ様でございます。\n\n' +

      '業務完了いたしました。\n\n' +

      dateSlash(today) +
      '\n' +

      '稼働)' +
      (
        els.editClockInTime.value ||
        '00:00'
      ) +
      '-' +
      (
        els.clockOutTime.value ||
        '00:00'
      ) +
      '\n\n' +

      '本日は失礼させていただきます。\n\n' +

      '出勤) ' +
      dateLabel(next) +
      ' ' +
      nextTime +
      '\n\n' +

      nextLabel +
      'もよろしくお願いいたします。'

    );
  }


  function refreshPreview() {

    const message =
      state.mode === 'in'
        ? buildInMessage()
        : buildOutMessage();


    els.preview.textContent =
      message;


    els.preview.classList.add(
      'show'
    );


    return message;
  }


  // ==========================================================
  // モード
  // ==========================================================

  function setMode(mode) {

    state.mode =
      mode;


    els.editPanel.classList.add(
      'show'
    );


    if (mode === 'in') {

      els.inFields.classList.remove(
        'hidden'
      );

      els.outFields.classList.add(
        'hidden'
      );

      els.sendBtn.textContent =
        '出勤送信';


      const now =
        new Date();


      els.clockInTime.value =
        toTimeInput(now);


      state.lastStartTime =
        els.clockInTime.value;


    } else {

      els.inFields.classList.add(
        'hidden'
      );

      els.outFields.classList.remove(
        'hidden'
      );

      els.sendBtn.textContent =
        '退勤送信';


      const now =
        new Date();


      els.editClockInTime.value =
        state.lastStartTime ||
        toTimeInput(now);


      els.clockOutTime.value =
        toTimeInput(now);


      els.nextDate.value =
        toDateInput(
          tomorrowDate()
        );


      els.nextTime.value =
        '08:00';
    }


    refreshPreview();
  }


  // ==========================================================
  // 時刻変更
  // ==========================================================

  els.clockInTime.addEventListener(
    'input',
    function() {

      state.lastStartTime =
        els.clockInTime.value;

      refreshPreview();

    }
  );


  els.editClockInTime.addEventListener(
    'input',
    refreshPreview
  );


  els.clockOutTime.addEventListener(
    'input',
    refreshPreview
  );


  els.nextDate.addEventListener(
    'change',
    refreshPreview
  );


  els.nextTime.addEventListener(
    'input',
    refreshPreview
  );


  // ==========================================================
  // 送信
  // ==========================================================

  els.sendBtn.addEventListener(
    'click',
    async function() {

      if (!state.driver) {

        alert(
          '先に人物を選択してください。'
        );

        return;
      }


      const message =
        refreshPreview();


      try {

        els.sendBtn.disabled =
          true;


        const result =
          await callServer(

            'sendAttendance',

            {

              message:
                message,

              selectedDriverKey:
                state.driver.driverKey

            }

          );


        if (
          !result ||
          !result.ok
        ) {

          throw new Error(

            result &&
            result.error

              ? result.error

              : '送信結果を確認できませんでした'

          );
        }


        const title =
          state.mode === 'in'
            ? '出勤'
            : '退勤';


        addHistory(
          title +
          'を送信しました'
        );


        saveRecentDriver(
          state.driver
        );


        els.editPanel.classList.remove(
          'show'
        );


        state.mode =
          null;


      } catch (error) {

        console.error(
          error
        );


        alert(

          error &&
          error.message

            ? error.message

            : '送信に失敗しました'

        );

      } finally {

        els.sendBtn.disabled =
          false;
      }
    }
  );


  // ==========================================================
  // 履歴
  // ==========================================================

  function renderHistory() {

    if (!state.history.length) {

      els.historyList.innerHTML =
        '<li class="empty">まだ履歴はありません</li>';

      return;
    }


    els.historyList.innerHTML =
      state.history.map(function(item) {

        return (
          '<li>' +
          String(item.time) +
          '　' +
          String(item.text) +
          '</li>'
        );

      }).join('');
  }


  function addHistory(text) {

    state.history.unshift({

      time:
        new Date()
          .toLocaleString('ja-JP'),

      text:
        text

    });


    state.history =
      state.history.slice(
        0,
        5
      );


    renderHistory();
  }


  // ==========================================================
  // 自動本人判別
  //
  // ★ 5秒で「完了」にしない
  // ★ 成功時だけ「完了」
  // ★ 失敗時は「人物選択待ち」
  // ==========================================================

  async function autoDetectDriver() {

    setStatus(
      'detecting'
    );


    try {

      if (
        typeof liff ===
        'undefined'
      ) {

        state.autoDetectFinished =
          true;

        setStatus(
          'waiting'
        );

        return;
      }


      await liff.init({

        liffId:
          LIFF_ID,

        withLoginOnExternalBrowser:
          true

      });


      if (!liff.isLoggedIn()) {

        state.autoDetectFinished =
          true;

        setStatus(
          'waiting'
        );

        return;
      }


      const idToken =
        liff.getIDToken();


      if (!idToken) {

        state.autoDetectFinished =
          true;

        setStatus(
          'waiting'
        );

        return;
      }


      state.idToken =
        idToken;


      /*
       * 人物一覧取得
       */

      loadDriverList();


      /*
       * 自動本人判別
       */

      const info =
        await callServer(
          'getDriverInfo'
        );


      state.autoDetectFinished =
        true;


      /*
       * 手動選択済みなら
       * 自動判別結果で上書きしない
       */

      if (
        state.userSelectedManually &&
        state.driver
      ) {

        setStatus(
          'done'
        );

        return;
      }


      /*
       * 自動判別成功
       */

      if (
        info &&
        info.found &&
        info.driverKey
      ) {

        const driver =
          findDriverByKey(
            info.driverKey
          );


        if (driver) {

          selectDriver(
            driver,
            false
          );

          setStatus(
            'done'
          );

          return;
        }
      }


      /*
       * 自動判別できなかった
       *
       * ここで初めて
       * 「人物選択待ち」
       */

      setStatus(
        'waiting'
      );


    } catch (error) {

      console.error(
        '自動本人判別失敗',
        error
      );


      state.autoDetectFinished =
        true;


      /*
       * 自動判別失敗でも
       * 手動選択は使える
       */

      setStatus(
        'waiting'
      );
    }
  }


  // ==========================================================
  // 起動
  // ==========================================================

  window.addEventListener(
    'load',
    function() {

      /*
       * 最初から手動選択欄を作る
       */

      renderRecentDriversImmediately();


      /*
       * 自動判別開始
       */

      setTimeout(
        function() {

          autoDetectDriver();

        },
        50
      );

    }
  );

</script>
