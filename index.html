<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta

    content="width=device-width, initial-scale=1.0"
  >

  <title>運転手MENU</title>

  <script

  ></script>

  <!-- Google Cloud不要。端末側でOCRするための無料ライブラリ -->
  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"

  <style>

    :root {

      --bg:
        #eef9ff;

      --card:
        #ffffff;

      --line:
        #d5eaf7;

      --text:
        #17324d;

      --muted:
        #6b8296;

      --blue:
        #1676c7;

      --blue2:
        #2d88d8;

      --green:
        #18824e;

      --soft:
        #f6fbfe;

      --shadow:

          40,
          92,
          128,
          .10
        );

    }


    * {
      box-sizing:
        border-box;
    }


    body {

      margin:
        0;

      min-height:
        100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background:
        linear-gradient(
          #e6f7ff,
          #f8fcff
        );

      color:
        var(--text);

    }


    .page {

      width:
        min(
          760px,
          100%
        );

      margin:
        0 auto;

      padding:
        12px 10px 24px;

    }


    .hero {

      position:
        relative;

      overflow:
        hidden;

      padding:
        22px 14px 18px;

      border-radius:
        26px;

      text-align:
        center;

      background:
        linear-gradient(
          180deg,
          #bfeaff,
          #e9f9ff 72%,
          #98dc83 72%,
          #7ccf71 100%
        );

      box-shadow:
        var(--shadow);

    }


    .hero-car {

      font-size:
        48px;

      line-height:
        1;

    }


    .hero h1 {

      margin:
        6px 0 0;

      color:
        var(--blue);

      font-size:
        32px;

      line-height:
        1.1;

      font-weight:
        900;

    }


    .card {

      margin-top:
        12px;

      padding:
        13px;

      border-radius:
        24px;

      background:
        rgba(
          255,
          255,
          255,
          .97
        );

      box-shadow:
        var(--shadow);

    }


    .status {

      width:
        fit-content;

      min-height:
        42px;

      margin:
        0 auto 10px;

      padding:
        9px 16px;

      border-radius:
        999px;

      background:
        #f3fbff;

      border:
        1px solid
        var(--line);

        var(--blue);

      font-weight:
        900;

      text-align:
        center;

    }


    .status.done {

        #eefbf3;

      border-color:
        #ccefd8;

      color:
        var(--green);

    }


    .select-box,
    .mode-box,
    .preview-box,
    .field-box,
    .message-box,
    .history-box {

      border:
        1px solid
        var(--line);

      border-radius:
        16px;

      background:
        var(--soft);

    }


    .select-box {

      padding:

    }


    label.title {

      display:

      margin-bottom:
        6px;

      color:

      font-weight:

    select,

    .send-btn {

        none;

      margin-top:

    .message-box {

    .history-title {

      color:

      font-size:
        20px;

      text-align:

      font-weight:
        900;

    .history-list {

      list-style:

      margin:
        0;

    }


    .history-list li {

      grid-template-columns:

        auto

      gap:

      align-items:
        center;

      padding:
        9px 2px;

      border-bottom:

      font-size:
        12px;

      font-weight:
        900;

    }


    .history-list .time {

        var(--text);

      font-weight:
        900;

    }


    .history-list .ok {

      color:
        var(--green);

      font-weight:
        900;

    }

        #8095a5;

      text-align:
        center;

    }


    .hidden {

      display:
        none !important;

    }


    @media (max-width:480px) {

      .fields {

        grid-template-columns:
          1fr 1fr;

      }


      .history-list li {

        grid-template-columns:
          auto

          auto
          1fr;

        white-space:
          nowrap;

      }


      .history-list .ok {

        grid-column:
          4;

        text-align:
          right;

      }

<body>

<div class="page">

  <header class="hero">

    <div class="hero-car">
      🚙
    </div>

      運転手MENU

  </header>


  <main class="card">


    <div

      ⏳ 自動判別中...
    </div>


    <div class="select-box">

      <label
        class="title"
        for="driverSelect"

        人物選択
      </label>

        id="driverSelect"

        <option value="">

    <div class="mode-box">

        id="inMode"

        type="button"

        退勤
      </button>

    </div>


    <input

      type="file"

    <button

      type="button"

    <div
      id="notice"
      class="notice"

    <section

        class="photo-preview"

      <div class="ocr-title">
        OCR読み取り結果
      </div>


      <div
        id="ocrText"

      ></div>


      <div class="fields">


        <div class="field-box">

          <label

            報告日

          <input
            id="reportDate"
            type="date"

        </div>


        <div class="field-box">

          <label
            class="title"
            for="reportTime"

            読み取り時間

          <input

        </div>


        <div
          id="startField"
          class="field-box hidden"
        >

          <label
            class="title"
            for="startTime"
          >
            出勤時間
          </label>


          <input
            id="startTime"
            type="time"
          >

        </div>


        <div
          id="endField"
          class="field-box hidden"
        >

          <label
            class="title"
            for="endTime"
          >
            退勤時間
          </label>


          <input
            id="endTime"
            type="time"
          >

        </div>


        <div
          id="nextDateField"
          class="field-box hidden"
        >

          <label
            class="title"
            for="nextDate"
          >
            次回出勤日
          </label>


          <input
            id="nextDate"
            type="date"
          >

        </div>


        <div
          id="nextTimeField"
          class="field-box hidden"
        >

          <label
            class="title"
            for="nextTime"

            次回出勤時間
          </label>


          <input
            id="nextTime"
            type="time"

        </div>


        <div
          id="summary"

          前回残業

            0:00

          今月合計

            0:00
          </strong>

      </div>


      <div class="message-box">

    <section class="history-box">

    </section>


  </main>


  <div

      text-align:center;
      color:#8aa0b2;
      font-size:13px;
      padding:14px 0;
    "
  >
    勤怠管理Bot

</div>


<script>


const API_URL =
  'https://script.google.com/macros/s/AKfycbzQKsnHaMXieJriEYudokiGBkR3KrtpDm8HVpX1G9PyNqnKrGkoXbCDDiMEhbdgDVia/exec';


const LIFF_ID =
  '2011011273-HIdBF1sM';


const state = {

  idToken:
    '',

  drivers:
    [],

  driver:
    null,

  mode:
    'in',

  draft:
    null,

  workState:
    {
      hasWork:
        false,

      startTime:
        ''
    },

  summary:
    {
      previousOvertime:
        '0:00',

      monthlyOvertime:
        '0:00'
    }

};


const el = {

  status:
    document.getElementById(
      'status'
    ),

  driverSelect:
    document.getElementById(
      'driverSelect'
    ),

  inMode:
    document.getElementById(
      'inMode'
    ),

  outMode:
    document.getElementById(
      'outMode'
    ),

  photoInput:
    document.getElementById(
      'photoInput'
    ),

  uploadBtn:
    document.getElementById(
      'uploadBtn'
    ),

  notice:
    document.getElementById(
      'notice'
    ),

  previewWrap:
    document.getElementById(
      'previewWrap'
    ),

  photoPreview:
    document.getElementById(
      'photoPreview'
    ),

  ocrText:
    document.getElementById(
      'ocrText'
    ),

  reportDate:
    document.getElementById(
      'reportDate'
    ),

  reportTime:
    document.getElementById(
      'reportTime'
    ),

  startField:
    document.getElementById(
      'startField'
    ),

  startTime:
    document.getElementById(
      'startTime'
    ),

  endField:
    document.getElementById(
      'endField'
    ),

  endTime:
    document.getElementById(
      'endTime'
    ),

  nextDateField:
    document.getElementById(
      'nextDateField'
    ),

  nextDate:
    document.getElementById(
      'nextDate'
    ),

  nextTimeField:
    document.getElementById(
      'nextTimeField'
    ),

  nextTime:
    document.getElementById(
      'nextTime'
    ),

  summary:
    document.getElementById(
      'summary'
    ),

  messagePreview:
    document.getElementById(
      'messagePreview'
    ),

  sendBtn:
    document.getElementById(
      'sendBtn'
    ),

  historyList:
    document.getElementById(
      'historyList'
    )

};


// ============================================================
// API
// ============================================================

function callServer(
  operation,
  data = {}
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      params.append(
        'action',
        'api'
      );


      params.append(
        'operation',
        operation
      );


      params.append(
        'requestId',
        requestId
      );


      params.append(
        'idToken',
        state.idToken ||
        ''
      );


      Object.keys(
        data
      ).forEach(
        function(key) {

          params.append(
            key,
            data[key] == null
              ? ''
              : String(
                  data[key]
                )
          );

        }
      );


      fetch(
        API_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params.toString()

        }
      ).catch(
        function(error) {

          console.warn(
            error
          );

        }
      );


      pollApiResult_(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );
}


function pollApiResult_(
  requestId,
  resolve,
  reject,
  attempt
) {

  if (
    attempt >=
    40
  ) {

    reject(
      new Error(
        'Apps Script APIの応答が返りませんでした'
      )
    );

    return;
  }


  const callbackName =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt;


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );
    }


    try {

      delete window[
        callbackName
      ];

    } catch (_) {

      window[
        callbackName
      ] = undefined;

    }

  }


  window[
    callbackName
  ] = function(
    response
  ) {

    if (
      finished
    ) {
      return;
    }


    if (
      response &&
      (
        response.status ===
          'pending' ||

        response.status ===
          'processing'
      )
    ) {

      cleanup();


      setTimeout(
        function() {

          pollApiResult_(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );


      return;
    }


    finished =
      true;


    cleanup();


    if (
      !response ||
      response.ok !== true
    ) {

      reject(
        new Error(
          response &&
          response.error
            ? response.error
            : 'Apps Script APIエラー'
        )
      );

      return;
    }


    resolve(
      response.data
    );

  };


  script.onerror =
    function() {

      if (
        finished
      ) {
        return;
      }


      finished =
        true;


      cleanup();


      setTimeout(
        function() {

          pollApiResult_(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );
}


// ============================================================
// 表示
// ============================================================

function status(
  text
) {

  el.status.textContent =
    text;


  el.status.classList.toggle(
    'done',
    text === '✓ 完了'
  );
}


// ============================================================
// 人物
// ============================================================

function findDriver(
  key
) {

  if (!key) {
    return null;
  }


  return (
    state.drivers.find(
      function(driver) {

        return (
          driver.driverKey ===
          key
        );

      }
    ) ||
    null
  );
}


function renderDrivers() {

  el.driverSelect.innerHTML =
    '<option value="">人物を選択してください</option>';


  const recent =
    getRecentDrivers();


  const recentKeys =
    new Set(
      recent.map(
        function(x) {

          return x.driverKey;

        }
      )
    );


  if (
    recent.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '最近使った人物';


    recent.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  const others =
    state.drivers.filter(
      function(driver) {

        return (
          !recentKeys.has(
            driver.driverKey
          )
        );

      }
    );


  if (
    others.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      'その他の人物';


    others.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  if (
    state.driver
  ) {

    el.driverSelect.value =
      state.driver.driverKey;

  }

}


function getRecentDrivers() {

  try {

    return JSON.parse(
      localStorage.getItem(
        'driverRecent'
      ) ||
      '[]'
    );

  } catch (_) {

    return [];

  }

}


function saveRecent() {

  if (
    !state.driver
  ) {

    return;
  }


  let list =
    getRecentDrivers();


  list =
    list.filter(
      function(x) {

        return (
          x.driverKey !==
          state.driver.driverKey
        );

      }
    );


  list.unshift({

    driverKey:
      state.driver.driverKey,

    displayName:
      state.driver.displayName

  });


  localStorage.setItem(
    'driverRecent',
    JSON.stringify(
      list.slice(
        0,
        10
      )
    )
  );
}


function selectDriver(
  driver
) {

  if (!driver) {

    state.driver =
      null;


    el.sendBtn.disabled =
      true;


    status(
      '人物選択待ち'
    );


    el.historyList.innerHTML =
      '<li class="muted">人物を選択してください</li>';


    return;
  }


  state.driver =
    driver;


  el.driverSelect.value =
    driver.driverKey;


  status(
    '✓ 完了'
  );


  saveRecent();


  loadServerState();

}


// ============================================================
// データ読み込み
// ============================================================

async function loadDrivers() {

  try {

    const list =
      await callServer(
        'getDriverList'
      );


    state.drivers =
      Array.isArray(
        list
      )
        ? list
        : [];


    renderDrivers();


  } catch (error) {

    console.error(
      error
    );


    status(
      '人物選択待ち'
    );

  }

}


async function loadServerState() {

  if (
    !state.driver
  ) {

    return;
  }


  try {

    const results =
      await Promise.all([

        callServer(
          'getWorkState',
          {
            selectedDriverKey:
              state.driver.driverKey
          }
        ),

        callServer(
          'getAttendanceSummary',
          {
            selectedDriverKey:
              state.driver.driverKey
          }
        )

      ]);


    state.workState =
      results[0] || {

        hasWork:
          false,

        startTime:
          ''

      };


    state.summary =
      results[1] || {

        previousOvertime:
          '0:00',

        monthlyOvertime:
          '0:00'

      };


    renderSummary();


    await loadHistory();


  } catch (error) {

    console.warn(
      error
    );

  }

}


async function loadHistory() {

  if (
    !state.driver
  ) {

    return;
  }


  try {

    const list =
      await callServer(
        'getTodayHistory',
        {

          selectedDriverKey:
            state.driver.driverKey

        }
      );


    renderHistory(
      list ||
      []
    );


  } catch (error) {

    console.warn(
      error
    );

  }

}


function renderHistory(
  list
) {

  if (
    !list.length
  ) {

    el.historyList.innerHTML =
      '<li class="muted">まだ履歴はありません</li>';

    return;
  }


  el.historyList.innerHTML =
    list

      .map(
        function(x) {

          const time =
            x.type === '退勤'

              ? (
                (
                  x.startTime ||
                  ''
                ) +
                '→' +
                (
                  x.endTime ||
                  ''
                )
              )

              : (
                x.reportTime ||
                ''
              );


          return (

            '<li>' +

            '<span>' +
              escapeHtml(
                x.date
              ) +
            '</span>' +

            '<span class="type">' +
              escapeHtml(
                x.type
              ) +
            '</span>' +

            '<span class="time">' +
              escapeHtml(
                time
              ) +
            '</span>' +

            '<span class="sent">' +
              '送信 ' +
              escapeHtml(
                x.sentTime
              ) +
            '</span>' +

            '<span class="ok">' +
              '✓' +
              escapeHtml(
                x.status ||
                '完了'
              ) +
            '</span>' +

            '</li>'

          );

        }
      )

      .join('');

}


function renderSummary() {

  el.summary.innerHTML =

    '前回残業 <strong>' +

    escapeHtml(
      state.summary.previousOvertime ||
      '0:00'
    ) +

    '</strong>　今月合計 <strong>' +

    escapeHtml(
      state.summary.monthlyOvertime ||
      '0:00'
    ) +

    '</strong>';

}


// ============================================================
// モード
// ============================================================

function setMode(
  mode
) {

  state.mode =
    mode;


  state.draft =
    null;


  el.inMode.classList.toggle(
    'active',
    mode === 'in'
  );


  el.outMode.classList.toggle(
    'active',
    mode === 'out'
  );


  el.previewWrap.classList.remove(
    'show'
  );


  el.sendBtn.disabled =
    true;


  el.photoInput.value =
    '';


  el.notice.textContent =
    '';


  el.notice.classList.remove(
    'show'
  );


  if (
    mode === 'in'
  ) {

    el.startField.classList.add(
      'hidden'
    );

    el.endField.classList.add(
      'hidden'
    );

    el.nextDateField.classList.add(
      'hidden'
    );

    el.nextTimeField.classList.add(
      'hidden'
    );


  } else {

    el.startField.classList.remove(
      'hidden'
    );

    el.endField.classList.remove(
      'hidden'
    );

    el.nextDateField.classList.remove(
      'hidden'
    );

    el.nextTimeField.classList.remove(
      'hidden'
    );


    el.nextDate.value =
      tomorrow();


    el.nextTime.value =
      '08:00';

  }

}


// ============================================================
// LINE / LIFF
// ============================================================

async function autoDetect() {

  try {

    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    if (
      !liff.isLoggedIn()
    ) {

      status(
        '人物選択待ち'
      );

      return;
    }


    state.idToken =
      liff.getIDToken() ||
      '';


    const info =
      await callServer(
        'getDriverInfo'
      );


    if (
      info &&
      info.found
    ) {

      selectDriver(
        findDriver(
          info.driverKey
        )
      );

    } else {

      status(
        '人物選択待ち'
      );

    }


  } catch (error) {

    console.error(
      error
    );


    status(
      '人物選択待ち'
    );

  }

}


// ============================================================
// 画像圧縮
// ============================================================

function imageToDataUrl(
  file
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const img =
            new Image();


          img.onload =
            function() {

              const max =
                1800;


              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    img.width,
                    img.height
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  '2d',
                  {
                    alpha:
                      false
                  }
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  0.86
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            reader.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}


// ============================================================
// 無料OCR
// ============================================================

async function runBrowserOcr(
  dataUrl
) {

  if (
    !window.Tesseract
  ) {

    throw new Error(
      'OCRライブラリの読み込みに失敗しました。通信環境を確認してください。'
    );
  }


  const result =
    await Tesseract.recognize(

      dataUrl,

      'eng',

      {

        logger:
          function(
            message
          ) {

            if (
              !message
            ) {
              return;
            }


            if (
              message.status ===
                'recognizing text' &&
              message.progress
            ) {

              el.notice.textContent =

                '写真を読み取り中... ' +

                Math.round(
                  message.progress *
                  100
                ) +

                '%';

            }

          },

        tessedit_pageseg_mode:
          6

      }

    );


  return (

    result &&
    result.data

      ? String(
          result.data.text ||
          ''
        )

      : ''

  );
}


// ============================================================
// 写真アップロード
// ============================================================

async function uploadPhoto(
  file
) {

  if (
    !state.driver
  ) {

    alert(
      '先に人物を選択してください'
    );

    return;
  }


  el.notice.classList.add(
    'show'
  );


  el.notice.textContent =
    '写真を準備しています...';


  el.sendBtn.disabled =
    true;


  try {

    const dataUrl =
      await imageToDataUrl(
        file
      );


    el.photoPreview.src =
      dataUrl;


    /*
     * Google Cloudを使わず、
     * この端末内でOCR
     */

    const ocrText =
      await runBrowserOcr(
        dataUrl
      );


    el.notice.textContent =
      '読み取り結果を確認しています...';


    const result =
      await callServer(
        'ocrPhoto',
        {

          selectedDriverKey:
            state.driver.driverKey,

          mode:
            state.mode,

          imageBase64:
            dataUrl,

          fileName:
            file.name,

          ocrText:
            ocrText

        }
      );


    state.draft =
      result;


    el.previewWrap.classList.add(
      'show'
    );


    el.ocrText.textContent =
      result.ocrText ||
      '(文字を読み取れませんでした。時間を手入力してください)';


    el.reportDate.value =
      result.reportDate ||
      today();


    if (
      state.mode === 'in'
    ) {

      el.reportTime.value =
        result.ocrTime ||
        nowTime();


    } else {

      el.startTime.value =
        result.startTime ||
        state.workState.startTime ||
        '';


      el.endTime.value =
        result.endTime ||
        result.ocrTime ||
        nowTime();

    }


    renderSummary();


    refreshMessage();


    el.sendBtn.disabled =
      false;


    el.notice.textContent =
      '読み取り完了。時間を確認・修正して送信してください。';


  } catch (error) {

    console.error(
      error
    );


    el.notice.textContent =
      error.message ||
      'OCRに失敗しました。時間を手入力してください。';

  }

}


// ============================================================
// メッセージ生成
// ============================================================

function refreshMessage() {

  if (
    !state.driver
  ) {

    return;
  }


  let msg =
    '';


  if (
    state.mode === 'in'
  ) {

    msg =

      'お疲れ様でございます。\n\n' +

      '出社いたしました。\n\n' +

      '残業）' +

      (
        state.summary.previousOvertime ||
        '0:00'
      ) +

      '\n' +

      '累計）' +

      (
        state.summary.monthlyOvertime ||
        '0:00'
      ) +

      '\n\n' +

      '本日もよろしくお願い申し上げます。';


  } else {

    const d =
      el.reportDate.value ||
      today();


    const next =
      el.nextDate.value ||
      '';


    const nextT =
      el.nextTime.value ||
      '';


    const nextLine =
      next

        ? (
          '出勤）' +
          shortDate(
            next
          ) +
          ' ' +
          nextT +
          '\n\n' +

          nextLabel(
            next
          ) +

          'もよろしくお願いいたします。'
        )

        : '';


    msg =

      'お疲れ様でございます。\n\n' +

      '業務完了いたしました。\n\n' +

      d.replace(
        /-/g,
        '/'
      ) +

      '\n稼働）' +

      (
        el.startTime.value ||
        ''
      ) +

      '-' +

      (
        el.endTime.value ||
        ''
      ) +

      '\n\n' +

      '本日は失礼させていただきます。\n\n' +

      nextLine;

  }


  el.messagePreview.textContent =
    msg;

}


// ============================================================
// 送信
// ============================================================

async function sendDraft() {

  if (
    !state.draft ||
    !state.driver
  ) {

    return;
  }


  el.sendBtn.disabled =
    true;


  el.notice.classList.add(
    'show'
  );


  el.notice.textContent =
    '写真＋報告文章を送信中です...';


  try {

    refreshMessage();


    const result =
      await callServer(
        'sendAttendanceDraft',
        {

          draftId:
            state.draft.draftId,

          mode:
            state.mode,

          reportDate:
            el.reportDate.value,

          reportTime:
            state.mode === 'in'

              ? el.reportTime.value

              : el.endTime.value,

          startTime:
            state.mode === 'out'

              ? el.startTime.value

              : el.reportTime.value,

          endTime:
            state.mode === 'out'

              ? el.endTime.value

              : '',

          nextDate:
            state.mode === 'out'

              ? el.nextDate.value

              : '',

          nextTime:
            state.mode === 'out'

              ? el.nextTime.value

              : '',

          message:
            el.messagePreview.textContent

        }
      );


    if (
      !result ||
      !result.ok
    ) {

      throw new Error(
        '送信に失敗しました'
      );
    }


    el.notice.textContent =
      '送信完了しました。';


    saveRecent();


    state.draft =
      null;


    el.previewWrap.classList.remove(
      'show'
    );


    el.photoInput.value =
      '';


    await loadServerState();


  } catch (error) {

    console.error(
      error
    );


    el.notice.textContent =
      error.message ||
      '送信に失敗しました';


  } finally {

    el.sendBtn.disabled =
      !state.draft;

  }

}


// ============================================================
// イベント
// ============================================================

el.driverSelect.addEventListener(
  'change',
  function() {

    selectDriver(
      findDriver(
        el.driverSelect.value
      )
    );

  }
);


el.inMode.addEventListener(
  'click',
  function() {

    setMode(
      'in'
    );

  }
);


el.outMode.addEventListener(
  'click',
  function() {

    setMode(
      'out'
    );

  }
);


el.uploadBtn.addEventListener(
  'click',
  function() {

    if (
      !state.driver
    ) {

      alert(
        '先に人物を選択してください'
      );

      return;
    }


    el.photoInput.click();

  }
);


el.photoInput.addEventListener(
  'change',
  function() {

    if (
      el.photoInput.files[0]
    ) {

      uploadPhoto(
        el.photoInput.files[0]
      );

    }

  }
);


[
  'reportDate',
  'reportTime',
  'startTime',
  'endTime',
  'nextDate',
  'nextTime'
].forEach(
  function(id) {

    el[id].addEventListener(
      'input',
      refreshMessage
    );


    el[id].addEventListener(
      'change',
      refreshMessage
    );

  }
);


el.sendBtn.addEventListener(
  'click',
  sendDraft
);


window.addEventListener(
  'load',
  async function() {

    setMode(
      'in'
    );


    status(
      '⏳ 自動判別中...'
    );


    await loadDrivers();


    await autoDetect();

  }
);


// ============================================================
// Utility
// ============================================================

function today() {

  const d =
    new Date();


  return (

    d.getFullYear() +
    '-' +
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +
    '-' +
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )

  );
}


function nowTime() {

  const d =
    new Date();


  return (

    String(
      d.getHours()
    ).padStart(
      2,
      '0'
    ) +

    ':' +

    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    )

  );
}


function tomorrow() {

  const d =
    new Date();


  d.setDate(
    d.getDate() +
    1
  );


  return (

    d.getFullYear() +
    '-' +
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +
    '-' +
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )

  );
}


function shortDate(
  value
) {

  const parts =
    String(
      value ||
      ''
    ).split(
      '-'
    );


  if (
    parts.length !== 3
  ) {

    return value;
  }


  return (

    Number(
      parts[1]
    ) +

    '/' +

    Number(
      parts[2]
    )

  );
}


function nextLabel(
  value
) {

  if (!value) {
    return '次回';
  }


  const now =
    new Date();


  const target =
    new Date(
      value +
      'T00:00:00'
    );


  const todayDate =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const targetDate =
    new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );


  const diff =
    Math.round(
      (
        targetDate -
        todayDate
      ) /
      86400000
    );


  if (
    diff === 1
  ) {

    return '明日';
  }


  if (
    diff === 2
  ) {

    return '明後日';
  }


  return '次回';

}


function escapeHtml(
  value
) {

  return String(
    value ||
    ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#39;'
    );

}
