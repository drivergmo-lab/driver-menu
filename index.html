<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

/* ==========================================================
   BASE
========================================================== */

:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#ffffff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      var(--bg),
      var(--bg2)
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}


/* ==========================================================
   HERO
========================================================== */

.hero{
  overflow:hidden;

  padding:
    21px
    10px
    23px;

  border-radius:
    26px;

  text-align:
    center;

  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );

  box-shadow:
    var(--shadow);
}

.hero h1{
  margin:0;

  color:
    var(--blue);

  font-size:
    30px;

  line-height:
    1.15;

  font-weight:
    900;

  white-space:
    nowrap;
}


/* ==========================================================
   CARD
========================================================== */

.card{
  margin-top:
    12px;

  padding:
    13px;

  border-radius:
    24px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  box-shadow:
    var(--shadow);
}


/* ==========================================================
   MANAGEMENT BUTTONS
========================================================== */

.management-menu{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    8px;

  margin-bottom:
    12px;
}

.management-btn{
  min-height:
    54px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  font-size:
    16px;

  font-weight:
    900;

  background:
    #f7fcff;

  color:
    var(--blue);
}

.assignment-btn{
  background:
    #eef8ff;
}

.comp-btn{
  background:
    #f4fbf5;

  color:
    #18824e;
}


/* ==========================================================
   DRIVER SELECT
========================================================== */

.top-row{
  display:grid;

  grid-template-columns:
    158px
    minmax(0,1fr);

  gap:
    8px;

  align-items:
    stretch;
}

.status{
  min-height:
    78px;

  display:flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    7px;

  padding:
    8px;

  border-radius:
    20px;

  background:
    #f3fbff;

  border:
    1px solid
    var(--line);

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

  text-align:
    center;
}

.status.done{
  background:
    #eefbf3;

  border-color:
    #ccefd8;

  color:
    var(--green);
}

.select-box{
  padding:
    9px 11px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #f9fdff;
}

.select-box label{
  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;
}

select,
input[type="date"],
input[type="time"],
textarea{
  width:
    100%;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  outline:
    none;
}

select,
input[type="date"],
input[type="time"]{
  height:
    44px;

  padding:
    0 10px;

  font-size:
    16px;

  font-weight:
    800;
}


/* ==========================================================
   MODE BUTTONS
========================================================== */

.mode-box{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    10px;
}

.mode-btn{
  min-height:
    90px;

  border:
    0;

  border-radius:
    20px;

  font-size:
    28px;

  font-weight:
    900;
}

.mode-btn.in{
  background:
    linear-gradient(
      #73cdf8,
      #7dd77a
    );

  color:
    #084e78;
}

.mode-btn.out{
  background:
    linear-gradient(
      #1b357c,
      #0e1e4d
    );

  color:
    #ffffff;
}

.mode-btn.off{
  opacity:
    .38;

  filter:
    grayscale(.18);
}

.guide{
  margin:
    9px 4px;

  color:
    var(--blue);

  font-size:
    13px;

  font-weight:
    900;

  text-align:
    center;
}


/* ==========================================================
   PHOTO
========================================================== */

.upload-btn{
  width:
    100%;

  min-height:
    54px;

  border:
    1px solid
    #cfe8f7;

  border-radius:
    17px;

  background:
    #eaf7ff;

  color:
    var(--blue);

  font-size:
    17px;

  font-weight:
    900;
}

.upload-btn:disabled{
  opacity:
    .45;

  cursor:
    not-allowed;
}

.notice{
  display:
    none;

  margin-top:
    9px;

  padding:
    9px 11px;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    #5c7588;

  font-size:
    12px;

  line-height:
    1.45;

  text-align:
    center;
}

.notice.show{
  display:
    block;
}

.hidden{
  display:
    none !important;
}


/* ==========================================================
   PREVIEW
========================================================== */

.preview{
  display:
    none;

  margin-top:
    11px;
}

.preview.show{
  display:
    block;
}

.preview-box{
  padding:
    12px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #ffffff;
}

.photo-preview{
  display:
    block;

  width:
    100%;

  max-height:
    360px;

  object-fit:
    contain;

  border-radius:
    14px;

  background:
    #eef4f8;
}

.fields{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    9px;
}

.field{
  min-width:
    0;

  padding:
    9px;

  border:
    1px solid
    var(--line);

  border-radius:
    14px;

  background:
    var(--soft);
}

.field-title{
  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;
}

.summary{
  grid-column:
    1 / -1;

  padding:
    9px 10px;

  border:
    1px solid
    var(--line);

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    #446276;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;
}

.summary strong{
  color:
    var(--blue);
}


/* ==========================================================
   MESSAGE
========================================================== */

.message-section{
  margin-top:
    12px;
}

.message-title{
  margin:
    0 0 7px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;
}

.message-box{
  padding:
    11px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #f7fcff;
}

.message-preview{
  white-space:
    pre-line;

  font-size:
    14px;

  line-height:
    1.55;

  color:
    #15446e;

  font-weight:
    700;
}

.memo-input{
  display:
    block;

  width:
    100%;

  min-height:
    92px;

  margin-top:
    10px;

  padding:
    10px 11px;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    14px;

  line-height:
    1.55;

  resize:
    vertical;

  outline:
    none;
}

.send-btn{
  width:
    100%;

  min-height:
    54px;

  margin-top:
    9px;

  border:
    0;

  border-radius:
    17px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    18px;

  font-weight:
    900;
}

.send-btn:disabled{
  opacity:
    .45;

  cursor:
    not-allowed;
}


/* ==========================================================
   HISTORY
========================================================== */

.history{
  margin-top:
    16px;

  padding-top:
    13px;

  border-top:
    1px solid
    #e2eef6;
}

.history-title{
  margin:
    0 0 8px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

  text-align:
    center;
}


/* ==========================================================
   MANAGEMENT PANEL
========================================================== */

.management-panel{
  margin-top:
    8px;

  padding:
    6px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #ffffff;
}

.management-header{
  display:flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

  margin-bottom:
    7px;
}

.management-title{
  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;
}

.management-close{
  border:
    0;

  border-radius:
    10px;

  padding:
    7px 11px;

  background:
    #edf4f8;

  color:
    #526a7d;

  font-size:
    12px;

  font-weight:
    900;
}

.management-loading{
  padding:
    12px;

  color:
    #688094;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;
}


/* ==========================================================
   TABLE
========================================================== */

.management-table-wrap{
  overflow-x:
    hidden;

  max-width:
    100%;
}

.management-table{
  width:
    100%;

  min-width:
    0;

  table-layout:
    fixed;

  border-collapse:
    collapse;

  font-size:
    11px;
}

.management-table th,
.management-table td{
  padding:
    1px 2px;

  border:
    1px solid
    #dbeaf3;

  vertical-align:
    middle;

  overflow:
    hidden;
}

.management-table th{
  background:
    #eef8ff;

  color:
    #42647b;

  font-weight:
    900;

  white-space:
    normal;

  word-break:
    break-all;

  line-height:
    1.15;
}

.management-table td{
  background:
    #ffffff;
}

.management-table input,
.management-table select{
  width:
    100%;

  min-width:
    0;

  height:
    31px;

  padding:
    2px 3px;

  border:
    1px solid
    #d4e5ef;

  border-radius:
    7px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    11px;

  font-weight:
    700;

  outline:
    none;
}


/* ==========================================================
   ASSIGNMENT
========================================================== */

.assignment-panel
.management-table th,
.assignment-panel
.management-table td{
  width:
    20%;
}


/* ==========================================================
   現在月
========================================================== */

.assignment-panel
.management-table
tbody
tr.current-month-row > th,

.assignment-panel
.management-table
tbody
tr.current-month-row > td{

  background-color:
    #ffe6e6 !important;
}


.assignment-panel
.management-table
tbody
tr.current-month-row > td > select{

  background-color:
    #fff0f0 !important;

  border-color:
    #f3b6b6 !important;
}


.assignment-panel
.management-table
tbody
tr.current-month-row > th{

  color:
    #b33a3a !important;

  font-weight:
    900 !important;
}


/* ==========================================================
   COMP
========================================================== */

.comp-panel
.management-table th:nth-child(1),
.comp-panel
.management-table td:nth-child(1){
  width:
    19%;
}

.comp-panel
.management-table th:nth-child(2),
.comp-panel
.management-table td:nth-child(2){
  width:
    19%;
}

.comp-panel
.management-table th:nth-child(3),
.comp-panel
.management-table td:nth-child(3){
  width:
    24%;
}

.comp-panel
.management-table th:nth-child(4),
.comp-panel
.management-table td:nth-child(4){
  width:
    38%;
}

.management-section-title{
  margin:
    7px 0 5px;

  color:
    var(--blue);

  font-size:
    15px;

  font-weight:
    900;
}

.comp-panel{
  display:
    grid;

  gap:
    7px;
}

.management-add{
  width:
    100%;

  min-height:
    42px;

  margin:
    2px 0;

  border:
    1px dashed
    #8fc9ea;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    var(--blue);

  font-size:
    14px;

  font-weight:
    900;
}

.management-save{
  width:
    100%;

  min-height:
    46px;

  margin-top:
    8px;

  border:
    0;

  border-radius:
    14px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    16px;

  font-weight:
    900;
}

.management-save:disabled{
  opacity:
    .45;
}


/* ==========================================================
   FOOTER
========================================================== */

.footer{
  padding:
    14px 10px 4px;

  color:
    #8aa0b2;

  font-size:
    13px;

  text-align:
    center;
}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:480px){

  .page{
    padding:
      10px 9px 20px;
  }

  .hero{
    padding:
      20px 10px 21px;
  }

  .hero h1{
    font-size:
      30px;
  }

  .card{
    padding:
      11px;
  }

  .top-row{
    grid-template-columns:
      145px
      minmax(0,1fr);
  }

  .status{
    min-height:
      76px;

    font-size:
      17px;
  }

  .mode-btn{
    min-height:
      82px;

    font-size:
      25px;
  }

  .management-table{
    font-size:
      10px;
  }

  .management-table input,
  .management-table select{
    height:
      30px;

    padding:
      1px 2px;

    font-size:
      10px;
  }

}

</style>

</head>


<body>


<div class="page">


<header class="hero">

<h1>
🚙 運転手MENU
</h1>

</header>


<main class="card">


<!-- ======================================================
     MANAGEMENT BUTTONS
====================================================== -->

<div class="management-menu">

<button
  id="assignmentBtn"
  class="management-btn assignment-btn"
  type="button"
>
📋 担当表
</button>


<button
  id="compBtn"
  class="management-btn comp-btn"
  type="button"
>
🗓️ 代休取得
</button>

</div>


<!-- ======================================================
     DRIVER SELECT
====================================================== -->

<div class="top-row">


<div
  id="status"
  class="status"
>

<span id="statusIcon">
⏰
</span>

<span id="statusText">
⏳判別中⏳
</span>

</div>


<div class="select-box">

<label
  for="driverSelect"
>
選択
</label>


<select
  id="driverSelect"
>

<option value="">
選択して下さい
</option>

</select>

</div>

</div>


<!-- ======================================================
     MODE
====================================================== -->

<div class="mode-box">

<button
  id="inMode"
  class="mode-btn in"
  type="button"
  disabled
>
☀️出勤☀️
</button>


<button
  id="outMode"
  class="mode-btn out off"
  type="button"
  disabled
>
🌙退勤🌙
</button>

</div>


<div class="guide">
必要な場合は修正お願いします。
</div>


<input
  id="photoInput"
  type="file"
  accept="image/*"
  class="hidden"
>


<button
  id="uploadBtn"
  class="upload-btn"
  type="button"
  disabled
>
📷 写真を撮影・選択して読み取る
</button>


<div
  id="notice"
  class="notice"
></div>


<!-- ======================================================
     PREVIEW
====================================================== -->

<section
  id="preview"
  class="preview"
>

<div class="preview-box">


<img
  id="photoPreview"
  class="photo-preview"
  alt="勤怠写真"
>


<div class="fields">


<div class="field">

<label
  class="field-title"
  for="reportDate"
>
日付
</label>

<input
  id="reportDate"
  type="date"
>

</div>


<div class="field">

<label
  class="field-title"
  for="startTime"
>
出勤時間
</label>

<input
  id="startTime"
  type="time"
>

</div>


<div
  id="endField"
  class="field hidden"
>

<label
  class="field-title"
  for="endTime"
>
退勤時間
</label>

<input
  id="endTime"
  type="time"
>

</div>


<div
  id="nextDateField"
  class="field hidden"
>

<label
  class="field-title"
  for="nextDate"
>
次回出勤日
</label>

<input
  id="nextDate"
  type="date"
>

</div>


<div
  id="nextTimeField"
  class="field hidden"
>

<label
  class="field-title"
  for="nextTime"
>
次回出勤時間
</label>

<select
  id="nextTime"
></select>

</div>


<div
  id="summary"
  class="summary"
>
前回残業
<strong>0:00</strong>
　月間合計
<strong>0:00</strong>
</div>


</div>


<div class="message-section">

<div class="message-title">
報告文章
</div>


<div class="message-box">

<div
  id="messagePreview"
  class="message-preview"
></div>


<textarea
  id="memo"
  class="memo-input"
  placeholder="文章を入力できます"
></textarea>

</div>


</div>


<button
  id="sendBtn"
  class="send-btn"
  type="button"
  disabled
>
写真＋報告文章を送信
</button>


</div>

</section>


<!-- ======================================================
     HISTORY
====================================================== -->

<section class="history">

<h2 class="history-title">
＜履歴＞
</h2>

</section>


<!-- ======================================================
     MANAGEMENT
====================================================== -->

<section
  id="managementPanel"
  class="management-panel hidden"
>


<div class="management-header">


<div
  id="managementTitle"
  class="management-title"
>
📋 担当表
</div>


<button
  id="managementClose"
  class="management-close"
  type="button"
>
閉じる
</button>


</div>


<div
  id="managementLoading"
  class="management-loading"
>
読み込み中...
</div>


<div
  id="assignmentPanel"
  class="management-table-wrap assignment-panel hidden"
></div>


<div
  id="compPanel"
  class="comp-panel hidden"
></div>


<button
  id="managementSave"
  class="management-save hidden"
  type="button"
>
保存する
</button>


</section>


</main>


<footer class="footer">
勤怠管理Bot
</footer>


</div>


<script>


/* ==========================================================
   CONFIG
========================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbySmhEE3JyfWGxEylyWscOtqL3FTIH9Ww6nybcAGb0f_kw2QXVP-LaoVtT1eFRtv-4Lyw/exec';

const LIFF_ID =
'2011011273-HIdBF1s';

15000;


/* ==========================================================
   DOM
========================================================== */

const el = {

  status:
    document.getElementById(
      'status'
    ),

  statusIcon:
    document.getElementById(
      'statusIcon'
    ),

  statusText:
    document.getElementById(
      'statusText'
    ),

  driverSelect:
    document.getElementById(
      'driverSelect'
    ),

  assignmentBtn:
    document.getElementById(
      'assignmentBtn'
    ),

  compBtn:
    document.getElementById(
      'compBtn'
    ),

  managementPanel:
    document.getElementById(
      'managementPanel'
    ),

  managementTitle:
    document.getElementById(
      'managementTitle'
    ),

  managementLoading:
    document.getElementById(
      'managementLoading'
    ),

  assignmentPanel:
    document.getElementById(
      'assignmentPanel'
    ),

  compPanel:
    document.getElementById(
      'compPanel'
    ),

  managementSave:
    document.getElementById(
      'managementSave'
    ),

  managementClose:
    document.getElementById(
      'managementClose'
    ),

/* ==========================================================

========================================================== */

function pad2(
  value
){

  return String(
    value
  ).padStart(
    2,
    '0'
  );

}


function today(){

  const d =
    new Date();

  return(
    d.getFullYear() +
    '-' +
    pad2(
      d.getMonth()+1
    ) +
    '-' +
    pad2(
      d.getDate()
    )
  );

}


function nowTime(){

  const d =
    new Date();

  return(
    pad2(
      d.getHours()
    ) +
    ':' +
    pad2(
      d.getMinutes()
    )
  );

}


function tomorrow(){

  const d =
    new Date();

  d.setDate(
    d.getDate()+1
  );

  return(
    d.getFullYear() +
    '-' +
    pad2(
      d.getMonth()+1
    ) +
    '-' +
    pad2(
      d.getDate()
    )
  );

}


/* ==========================================================
   日付変換
   ★スプレッドシート 8/29
      →
      HTML date 2026-08-29
========================================================== */

function toDateInputValue(
  value
){

  const text =
    String(
      value ||
      ''
    ).trim();


  if(
    !text
  ){

    return '';

  }


  /*
   * yyyy-mm-dd
   */

  if(
    /^\d{4}-\d{1,2}-\d{1,2}$/.test(
      text
    )
  ){

    const parts =
      text.split('-');


    return(
      parts[0] +
      '-' +
      String(
        parts[1]
      ).padStart(
        2,
        '0'
      ) +
      '-' +
      String(
        parts[2]
      ).padStart(
        2,
        '0'
      )
    );

  }


  /*
   * yyyy/mm/dd
   */

  let match =
    text.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      match[1] +
      '-' +
      String(
        match[2]
      ).padStart(
        2,
        '0'
      ) +
      '-' +
      String(
        match[3]
      ).padStart(
        2,
        '0'
      )
    );

  }


  /*
   * yyyy/m/d 形式
   */

  match =
    text.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      match[1] +
      '-' +
      String(
        match[2]
      ).padStart(
        2,
        '0'
      ) +
      '-' +
      String(
        match[3]
      ).padStart(
        2,
        '0'
      )
    );

  }


  /*
   * m/d
   *
   * 例：
   * 8/29
   */

  match =
    text.match(
      /^(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    const year =
      new Date()
        .getFullYear();


    return(
      year +
      '-' +
      String(
        match[1]
      ).padStart(
        2,
        '0'
      ) +
      '-' +
      String(
        match[2]
      ).padStart(
        2,
        '0'
      )
    );

  }


  return '';

}


/* ==========================================================
   HTML date
   →
   スプレッドシート m/d
========================================================== */

function formatSheetDate(
  value
){

  const text =
    String(
      value ||
      ''
    ).trim();


  if(
    !text
  ){

    return '';

  }


  /*
   * yyyy-mm-dd
   */

  let match =
    text.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      Number(
        match[2]
      ) +
      '/' +
      Number(
        match[3]
      )
    );

  }


  /*
   * yyyy/mm/dd
   */

  match =
    text.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      Number(
        match[2]
      ) +
      '/' +
      Number(
        match[3]
      )
    );

  }


  /*
   * m/d
   */

  if(
    /^\d{1,2}\/\d{1,2}$/.test(
      text
    )
  ){

    return text;

  }


  return text;

}

function dateText(
  value
){

  if(
    !value
  ){

    return '';

  }


  const d =
    new Date(
      value +
      'T00:00:00'
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }


  const week=[
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  return(
    d.getFullYear() +
    '/' +
    (d.getMonth()+1) +
    '/' +
    d.getDate() +
    '(' +
    week[
      d.getDay()
    ] +
    ')'
  );

}

){

/* ==========================================================
   JSONP
========================================================== */

function callServer(
  operation,
  data={}
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const callback =
        'gasJsonp_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timer =
        setTimeout(
          ()=>{

            if(
              finished
            ){

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                'サーバー応答がタイムアウトしました'
              )
            );

          },
          API_TIMEOUT
        );


      function cleanup(){

        clearTimeout(
          timer
        );


        if(
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );

        }


        try{

          delete window[
            callback
          ];

        }catch(_){

          window[
            callback
          ] =
            undefined;

        }

      }


      window[
        callback
      ] =
        function(
          response
        ){

          if(
            finished
          ){

            return;

          }


          finished =
            true;


          cleanup();


          if(
            !response ||
            response.ok !==
            true
          ){

            reject(
              new Error(
                response &&
                response.error
                  ? response.error
                  : 'Apps Script APIエラー'
              )
            );

            return;

          }


          resolve(
            response.data
          );

        };


      script.onerror =
        function(){

          if(
            finished
          ){

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              'Apps Script APIに接続できませんでした'
            )
          );

        };


      const params =
        new URLSearchParams();


      params.set(
        'action',
        'api'
      );


      params.set(
        'operation',
        operation
      );


      params.set(
        'callback',
        callback
      );


      params.set(
        '_',
        String(
          Date.now()
        )
      );


      params.set(
        'idToken',
        state.idToken ||
        ''
      );


      Object.keys(
        data
      ).forEach(
        key=>{

          params.set(
            key,
            data[key] ===
              undefined ||
            data[key] ===
              null
              ? ''
              : String(
                  data[key]
                )
          );

        }
      );


      script.src =
        API_URL +
        '?' +
        params.toString();


      document.body.appendChild(
        script
      );

    }
  );

}

   NAME MASTER
========================================================== */

function getMasterDrivers(
  data
){

  if(
    data &&
    data.nameMaster &&
    Array.isArray(
      data.nameMaster.drivers
    )
  ){

    return data.nameMaster.drivers;

  }


  return [];

}


function getMasterOfficers(
  data
){

  if(
    data &&
    data.nameMaster &&
    Array.isArray(
      data.nameMaster.officers
    )
  ){

    return data.nameMaster.officers;

  }


  return [];

}


function normalizeDriverDisplay(
  value,
  drivers
){

  let current =
    String(
      value ||
      ''
    ).trim();


  if(
    current ===
    '田中'
  ){

    current =
      '田中（ひ）';

  }


  if(
    drivers.includes(
      current
    )
  ){

    return current;

  }


  const normalized =
    current.replace(
      /\s+/g,
      ''
    );


  const found =
    drivers.find(
      name=>{

        const n =
          String(
            name ||
            ''
          )
          .replace(
            /\s+/g,
            ''
          );


        if(
          n ===
          normalized
        ){

          return true;

        }


        const surname =
          String(
            name ||
            ''
          )
          .trim()
          .split(
            /\s+/
          )[0];


        return(
          current ===
          surname
        );

      }
    );


  return(
    found ||
    current
  );

}


function createNameSelect(
  list,
  currentValue,
  onChange
){

  const select =
    document.createElement(
      'select'
    );


  const current =
    normalizeDriverDisplay(
      currentValue,
      list
    );


  const blank =
    document.createElement(
      'option'
    );


  blank.value =
    '';


  blank.textContent =
    '';


  select.appendChild(
    blank
  );


  if(
    current &&
    !list.includes(
      current
    )
  ){

    const old =
      document.createElement(
        'option'
      );


    old.value =
      current;


    old.textContent =
      current;


    select.appendChild(
      old
    );

  }


  list.forEach(
    name=>{

      const option =
        document.createElement(
          'option'
        );


      option.value =
        name;


      option.textContent =
        name;


      select.appendChild(
        option
      );

    }
  );


  select.value =
    current;


  select.addEventListener(
    'change',
    ()=>{

      onChange(
        select.value
      );

    }
  );


  return select;

}

function renderAssignmentTable(

){

    el.assignmentPanel;


  wrap.innerHTML =
    '';


  wrap.classList.remove(
    'hidden'
  );


  const table =
    document.createElement(
      'table'
    );


  table.className =
    'management-table';


  const officers =
    Array.isArray(
      data.officers
    ) &&
    data.officers.length
      ? data.officers
      : [
          '安田副社長',
          '伊藤社長',
          '山下副社長',
          '西山副社長'
        ];


  const driverNames =
    getMasterDrivers(
      data
    );


  const header = [
    '月',
    ...officers
  ];


  const thead =
    document.createElement(
      'thead'
    );


  const hrow =
    document.createElement(
      'tr'
    );


  header.forEach(
    text=>{

      const th =
        document.createElement(
          'th'
        );


      th.textContent =
        text ===
        '伊藤副社長'
          ? '伊藤社長'
          : text;


      hrow.appendChild(
        th
      );

    }
  );


  thead.appendChild(
    hrow
  );


  table.appendChild(
    thead
  );


  const tbody =
    document.createElement(
      'tbody'
    );


  const currentMonth =
    new Date()
      .getMonth() +
    1;


  (
    Array.isArray(
      data.rows
    )
      ? data.rows
      : []
  )
  .forEach(
    (
      row,
      rowIndex
    )=>{

      const tr =
        document.createElement(
          'tr'
        );


      const monthText =
        String(
          row.month ||
          ''
        ).trim();


      const rowMonthMatch =
        monthText.match(
          /(\d{1,2})\s*月/
        );


      const rowMonth =
        rowMonthMatch
          ? Number(
              rowMonthMatch[1]
            )
          : Number(
              monthText.replace(
                /[^\d]/g,
                ''
              )
            );


      if(
        rowMonth ===
        currentMonth
      ){

        tr.classList.add(
          'current-month-row'
        );

      }


      const month =
        document.createElement(
          'th'
        );


      month.textContent =
        row.month ||
        '';


      tr.appendChild(
        month
      );


      officers.forEach(
        officer=>{

          const td =
            document.createElement(
              'td'
            );


          const select =
            createNameSelect(
              driverNames,

              row.assignments &&
              row.assignments[
                officer
              ]
                ? row.assignments[
                    officer
                  ]
                : '',

              value=>{

                if(
                  !data.rows[
                    rowIndex
                  ].assignments
                ){

                  data.rows[
                    rowIndex
                  ].assignments =
                    {};

                }


                data.rows[
                  rowIndex
                ].assignments[
                  officer
                ] =
                  value;

              }
            );


          td.appendChild(
            select
          );


          tr.appendChild(
            td
          );

        }
      );


      tbody.appendChild(
        tr
      );

    }
  );


  table.appendChild(
    tbody
  );


  wrap.appendChild(
    table
  );

}

   * 取得済み
   */

  wrap.appendChild(
    makeSection(
      '取得済み',
      data.completed,
      'completed',
      '担当者'
    )
  );

}


/* ==========================================================
   MANAGEMENT OPEN
========================================================== */

async function openManagement(
  mode
){

  managementMode =
    mode;


  managementState =
    null;


  el.managementPanel
    .classList
    .remove(
      'hidden'
    );


  el.managementTitle.textContent =
    mode ===
    'assignment'
      ? '📋 担当表'
      : '🗓️ 代休取得';


  el.managementLoading
    .classList
    .remove(
      'hidden'
    );


  el.managementLoading.textContent =
    '読み込み中...';


  el.assignmentPanel
    .classList
    .add(
      'hidden'
    );


  el.compPanel
    .classList
    .add(
      'hidden'
    );


  el.managementSave
    .classList
    .add(
      'hidden'
    );


  try{

    const result =
      await callServer(
        'getManagementData',
        {

          sheetType:
            mode,

          selectedDriverKey:
            state.driver
              ? state.driver.driverKey
              : ''

        }
      );


    if(
      !result ||
      result.ok !==
      true
    ){

      throw new Error(
        'データを取得できませんでした'
      );

    }


    managementState =
      result;


    el.managementLoading
      .classList
      .add(
        'hidden'
      );


    if(
      mode ===
      'assignment'
    ){

      renderAssignmentTable(
        result
      );

    }else{

      renderCompTable(
        result
      );

    }


    el.managementSave
      .classList
      .remove(
        'hidden'
      );


    setTimeout(
      ()=>{

        el.managementPanel
          .scrollIntoView({
            behavior:
              'smooth',
            block:
              'start'
          });

      },
      50
    );


  }catch(error){

    console.error(
      error
    );


    el.managementLoading.textContent =
      error.message ||
      '読み込みに失敗しました';

  }

}


el.assignmentBtn
  .addEventListener(
    'click',
    ()=>{

      openManagement(
        'assignment'
      );

    }
  );


el.compBtn
  .addEventListener(
    'click',
    ()=>{

      openManagement(
        'comp'
      );

    }
  );


el.managementClose
  .addEventListener(
    'click',
    ()=>{

      el.managementPanel
        .classList
        .add(
          'hidden'
        );

    }
  );


/* ==========================================================
   SAVE
========================================================== */

el.managementSave
  .addEventListener(
    'click',
    async()=>{

      if(
        !managementState
      ){

        return;

      }


      el.managementSave.disabled =
        true;


      el.managementSave.textContent =
        '保存中...';


      try{

        const result =
          await callServer(
            'saveManagementData',
            {

              sheetType:
                managementMode,

              selectedDriverKey:
                state.driver
                  ? state.driver.driverKey
                  : '',

              payload:
                JSON.stringify(
                  managementState
                )

            }
          );


        if(
          !result ||
          result.ok !==
          true
        ){

          throw new Error(
            '保存に失敗しました'
          );

        }


        alert(
          'スプレッドシートへ保存しました。'
        );


        await openManagement(
          managementMode
        );


      }catch(error){

        console.error(
          error
        );


        alert(
          error.message ||
          '保存に失敗しました'
        );


      }finally{

        el.managementSave.disabled =
          false;


        el.managementSave.textContent =
          '保存する';

      }

    }
  );


/* ==========================================================
   MODE
========================================================== */

function setMode(
  mode
){

  state.mode =
    mode;


  state.draft =
    null;


  el.inMode
    .classList
    .toggle(
      'off',
      mode !==
      'in'
    );


  el.outMode
    .classList
    .toggle(
      'off',
      mode !==
      'out'
    );


  el.preview
    .classList
    .remove(
      'show'
    );


  el.sendBtn.disabled =
    true;


  el.photoInput.value =
    '';


  showNotice(
    ''
  );


  if(
    mode ===
    'in'
  ){

    el.endField
      .classList
      .add(
        'hidden'
      );


    el.nextDateField
      .classList
      .add(
        'hidden'
      );


    el.nextTimeField
      .classList
      .add(
        'hidden'
      );


    el.reportDate.value =
      today();


    el.startTime.value =
      nowTime();


  }else{

    el.endField
      .classList
      .remove(
        'hidden'
      );


    el.nextDateField
      .classList
      .remove(
        'hidden'
      );


    el.nextTimeField
      .classList
      .remove(
        'hidden'
      );


    el.reportDate.value =
      today();


    el.endTime.value =
      nowTime();


    el.nextDate.value =
      tomorrow();


    el.nextTime.value =
      '08:00';

  }

  refreshMessage();

}


/* ==========================================================
   MESSAGE
========================================================== */

function buildReportBaseMessage(){

  if(
    state.mode ===
    'in'
  ){

    return(
      'お疲れ様でございます。\n' +
      dateText(
        el.reportDate.value ||
        today()
      ) +
      ' ' +
      (
        el.startTime.value ||
        nowTime()
      ) +
      '出勤いたしました。\n' +
      '本日もよろしくお願いいたします。\n' +
      '残業)' +
      (
        state.summary.previousOvertime ||
        '0:00'
      ) +
      '\n' +
      '合計)' +
      (
        state.summary.monthlyOvertime ||
        '0:00'
      ) +
      '\n' +
      '【MEMO】'
    );

  }


  return(
    'お疲れ様でございます。\n' +
    '業務完了いたしました。\n' +
    dateText(
      el.reportDate.value ||
      today()
    ) +
    '\n' +
    '稼働)' +
    (
      el.startTime.value ||
      '00:00'
    ) +
    '→' +
    (
      el.endTime.value ||
      nowTime()
    ) +
    '\n' +
    '本日は失礼させていただきます。\n' +
    '出勤) ' +
    shortDate(
      el.nextDate.value ||
      tomorrow()
    ) +
    ' ' +
    (
      el.nextTime.value ||
      '??:??'
    ) +
    '\n' +
    '明日もよろしくお願いいたします。\n' +
    '【MEMO】'
  );

}


function refreshMessage(){

  el.messagePreview.textContent =
    buildReportBaseMessage();

}


/* ==========================================================
   MANUAL DRIVER
========================================================== */

el.driverSelect
  .addEventListener(
    'change',
    async()=>{

      const driver =
        state.drivers.find(
          item =>
            item.driverKey ===
            el.driverSelect.value
        ) ||
        null;


      state.userSelectedManually =
        true;


      await selectDriver(
        driver,
        true
      );

    }
  );


/* ==========================================================
   SELECT DRIVER
========================================================== */

async function selectDriver(
  driver,
  manual=false
){

  state.driver =
    driver ||
    null;


  if(
    manual
  ){

    state.userSelectedManually =
      true;

  }


  if(
    !driver
  ){

    el.inMode.disabled =
      true;

    el.outMode.disabled =
      true;

    el.uploadBtn.disabled =
      true;


    setStatus(
      '右から選択',
      false
    );


    return;

  }


  el.inMode.disabled =
    false;

  el.outMode.disabled =
    false;

  el.uploadBtn.disabled =
    false;


  el.driverSelect.value =
    driver.driverKey;


  setStatus(
    '完了',
    true
  );

}


/* ==========================================================
   AUTO DETECT
========================================================== */

async function autoDetect(){

  setStatus(
    '判別中',
    false
  );


  try{

    if(
      typeof liff ===
      'undefined'
    ){

      throw new Error(
        'LIFF SDKが読み込まれていません'
      );

    }


    await liff.init({
      liffId:
        LIFF_ID
    });


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      !liff.isLoggedIn()
    ){

      state.idToken =
        '';


      setStatus(
        '右から選択',
        false
      );


      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      setStatus(
        '右から選択',
        false
      );


      return;

    }


    const info =
      await callServer(
        'getDriverInfo'
      );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      info &&
      info.found &&
      info.driverKey
    ){

      const driver =
        state.drivers.find(
          item =>
            item.driverKey ===
            info.driverKey
        );


      if(
        driver
      ){

        await selectDriver(
          driver,
          false
        );


        setStatus(
          '完了',
          true
        );


        return;

      }

    }


    setStatus(
      '右から選択',
      false
    );


  }catch(error){

    console.warn(
      '自動判別失敗',
      error
    );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

    }else{

      setStatus(
        '右から選択',
        false
      );

    }

  }

}


/* ==========================================================
   IN / OUT
========================================================== */

el.inMode
  .addEventListener(
    'click',
    ()=>{

      if(
        !state.driver
      ){

        alert(
          '先に人物を選択してください'
        );

        return;

      }


      setMode(
        'in'
      );

    }
  );


el.outMode
  .addEventListener(
    'click',
    ()=>{

      if(
        !state.driver
      ){

        alert(
          '先に人物を選択してください'
        );

        return;

      }


      setMode(
        'out'
      );

    }
  );


/* ==========================================================
   PHOTO
========================================================== */

el.uploadBtn
  .addEventListener(
    'click',
    ()=>{

      if(
        !state.driver
      ){

        alert(
          '先に人物を選択してください'
        );

        return;

      }


      el.photoInput.click();

    }
  );


el.photoInput
  .addEventListener(
    'change',
    ()=>{

      const file =
        el.photoInput.files &&
        el.photoInput.files[
          0
        ];


      if(
        !file
      ){

        return;

      }


      state.draft = {
        file:
          file
      };


      el.preview
        .classList
        .add(
          'show'
        );


      el.photoPreview.src =
        URL.createObjectURL(
          file
        );


      el.sendBtn.disabled =
        false;


      showNotice(
        '時間を確認して送信してください。'
      );

    }
  );


/* ==========================================================
   SEND
========================================================== */

el.sendBtn
  .addEventListener(
    'click',
    async()=>{

      if(
        !state.driver
      ){

        alert(
          '人物を選択してください'
        );

        return;

      }


      const memo =
        String(
          el.memo.value ||
          ''
        ).trim();


      const message =
        buildReportBaseMessage() +
        (
          memo
            ? '\n' +
              memo
            : ''
        );


      el.sendBtn.disabled =
        true;


      showNotice(
        '送信中です...'
      );


      try{

        const result =
          await callServer(
            'sendAttendance',
            {

              selectedDriverKey:
                state.driver.driverKey,

              message:
                message

            }
          );


        if(
          !result ||
          result.ok !==
          true
        ){

          throw new Error(
            '送信に失敗しました'
          );

        }


        showNotice(
          '送信完了しました。'
        );


        state.draft =
          null;


        el.preview
          .classList
          .remove(
            'show'
          );


        el.photoInput.value =
          '';


        el.memo.value =
          '';


      }catch(error){

        console.error(
          error
        );


        showNotice(
          error.message ||
          '送信に失敗しました'
        );


      }finally{

        el.sendBtn.disabled =
          false;

      }

    }
  );


/* ==========================================================
   INPUT CHANGE
========================================================== */

[
  el.reportDate,
  el.startTime,
  el.endTime,
  el.nextDate,
  el.nextTime,
  el.memo
]
.forEach(
  input=>{

    input.addEventListener(
      'input',
      refreshMessage
    );


    input.addEventListener(
      'change',
      refreshMessage
    );

  }
);


/* ==========================================================
   INIT
========================================================== */

window.addEventListener(
  'load',
  async()=>{

    el.reportDate.value =
      today();

    el.startTime.value =
      nowTime();

    el.nextDate.value =
      tomorrow();

    el.nextTime.value =
      '08:00';

    el.memo.value =
      '';


    state.driver =
      null;

    state.userSelectedManually =
      false;


    el.inMode.disabled =
      true;

    el.outMode.disabled =
      true;

    el.uploadBtn.disabled =
      true;


    setMode(
      'in'
    );


    setStatus(
      '判別中',
      false
    );


    /*
     * 運転手一覧を先に取得
     */

    await loadDrivers();


    /*
     * その後LINE判別
     */

    autoDetect();

  }
);

</script>
