<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#fff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--text);
  background:linear-gradient(var(--bg),var(--bg2));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}

.hero{
  overflow:hidden;
  padding:21px 10px 23px;
  border-radius:26px;
  text-align:center;
  background:linear-gradient(
    180deg,
    #bfeaff 0%,
    #e9f9ff 70%,
    #98dc83 70%,
    #7ccf71 100%
  );
  box-shadow:var(--shadow);
}

.hero h1{
  margin:0;
  color:var(--blue);
  font-size:30px;
  line-height:1.15;
  font-weight:900;
  white-space:nowrap;
}

.card{
  margin-top:12px;
  padding:13px;
  border-radius:24px;
  background:rgba(255,255,255,.97);
  box-shadow:var(--shadow);
}

.management-menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
  margin-bottom:12px;
}

.management-btn{
  min-height:54px;
  border:1px solid var(--line);
  border-radius:16px;
  font-size:16px;
  font-weight:900;
  background:#f7fcff;
  color:var(--blue);
}

.assignment-btn{background:#eef8ff}
.comp-btn{background:#f4fbf5;color:#18824e}

.top-row{
  display:grid;
  grid-template-columns:158px minmax(0,1fr);
  gap:8px;
  align-items:stretch;
}

.status{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px;
  border-radius:20px;
  background:#f3fbff;
  border:1px solid var(--line);
  color:var(--blue);
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.status.done{
  background:#eefbf3;
  border-color:#ccefd8;
  color:var(--green);
}

.select-box{
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#f9fdff;
}

.select-box label,.field-title{
  display:block;
  margin-bottom:5px;
  color:#637c90;
  font-size:13px;
  font-weight:900;
}

select,input[type="date"],input[type="time"],textarea{
  width:100%;
  border:1px solid #cfe4f3;
  border-radius:12px;
  background:#fff;
  color:var(--text);
  outline:none;
}

select,input[type="date"],input[type="time"]{
  height:44px;
  padding:0 10px;
  font-size:16px;
  font-weight:800;
}

textarea{
  padding:10px 11px;
  font-size:14px;
  line-height:1.5;
  resize:vertical;
}

select:focus,input:focus,textarea:focus{
  border-color:#63b4ea;
  box-shadow:0 0 0 3px rgba(99,180,234,.12);
}

.mode-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.mode-btn{
  min-height:90px;
  border:0;
  border-radius:20px;
  font-size:28px;
  font-weight:900;
}

.mode-btn.in{
  background:linear-gradient(#73cdf8,#7dd77a);
  color:#084e78;
}

.mode-btn.out{
  background:linear-gradient(#1b357c,#0e1e4d);
  color:#fff;
}

.mode-btn.off{
  opacity:.38;
  filter:grayscale(.18);
}

.guide{
  margin:9px 4px;
  color:var(--blue);
  font-size:13px;
  font-weight:900;
  text-align:center;
}

.upload-btn{
  width:100%;
  min-height:54px;
  border:1px solid #cfe8f7;
  border-radius:17px;
  background:#eaf7ff;
  color:var(--blue);
  font-size:17px;
  font-weight:900;
}

.upload-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.notice{
  display:none;
  margin-top:9px;
  padding:9px 11px;
  border-radius:12px;
  background:#f7fcff;
  color:#5c7588;
  font-size:12px;
  line-height:1.45;
  text-align:center;
}

.notice.show{display:block}
.hidden{display:none!important}

.preview{
  display:none;
  margin-top:11px;
}

.preview.show{display:block}

.preview-box{
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
}

.photo-preview{
  display:block;
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:14px;
  background:#eef4f8;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.field{
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--soft);
}

.summary{
  grid-column:1/-1;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#446276;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.summary strong{color:var(--blue)}

.message-section{margin-top:12px}

.message-title{
  margin:0 0 7px;
  color:var(--blue);
  font-size:20px;
  font-weight:900;
}

.message-box{
  padding:11px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#f7fcff;
}

.message-preview{
  white-space:pre-line;
  font-size:14px;
  line-height:1.55;
  color:#15446e;
  font-weight:700;
}

.memo-input{
  display:block;
  width:100%;
  min-height:92px;
  margin-top:10px;
  padding:10px 11px;
  border:1px solid #cfe4f3;
  border-radius:12px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  line-height:1.55;
  resize:vertical;
  outline:none;
}

.send-btn{
  width:100%;
  min-height:54px;
  margin-top:9px;
  border:0;
  border-radius:17px;
  background:linear-gradient(#56baf0,#2d88d8);
  color:#fff;
  font-size:18px;
  font-weight:900;
}

.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.history{
  margin-top:16px;
  padding-top:13px;
  border-top:1px solid #e2eef6;
}

.history-title{
  margin:0 0 8px;
  color:var(--blue);
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.history-list{
  list-style:none;
  padding:0;
  margin:0;
}

.history-list li{
  display:grid;
  grid-template-columns:84px 42px minmax(78px,1fr) 26px;
  gap:4px;
  align-items:center;
  padding:9px 1px;
  border-bottom:1px solid #edf4fa;
  color:#496173;
  font-size:12px;
  white-space:nowrap;
}

.history-ok{
  color:var(--green);
  font-size:16px;
  font-weight:900;
  text-align:right;
}

.empty{
  display:block!important;
  text-align:center;
  color:#7a90a3;
}

.management-panel{
  margin-top:8px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
}

.management-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}

.management-title{
  color:var(--blue);
  font-size:18px;
  font-weight:900;
}

.management-close{
  border:0;
  border-radius:10px;
  padding:7px 11px;
  background:#edf4f8;
  color:#526a7d;
  font-size:12px;
  font-weight:900;
}

.management-loading{
  padding:12px;
  color:#688094;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.management-table-wrap{
  overflow-x:hidden;
  max-width:100%;
}

.management-table{
  width:100%;
  min-width:0;
  table-layout:fixed;
  border-collapse:collapse;
  font-size:11px;
}

.management-table th,
.management-table td{
  padding:1px 2px;
  border:1px solid #dbeaf3;
  vertical-align:middle;
  overflow:hidden;
}

.management-table th{
  background:#eef8ff;
  color:#42647b;
  font-weight:900;
  white-space:normal;
  word-break:break-all;
  line-height:1.15;
}

.management-table td{background:#fff}

.management-table input,
.management-table select{
  width:100%;
  min-width:0;
  height:31px;
  padding:2px 3px;
  border:1px solid #d4e5ef;
  border-radius:7px;
  background:#fff;
  color:var(--text);
  font-size:11px;
  font-weight:700;
  outline:none;
}

.assignment-panel .management-table th,
.assignment-panel .management-table td{
  width:20%;
}

/* ★現在月だけ薄い赤 */
.management-table tr.current-month-row th,
.management-table tr.current-month-row td{
  background:#fff0f0;
}

.management-table tr.current-month-row input{
  background:#fff7f7;
  border-color:#f2bcbc;
}

.comp-panel .management-table th:nth-child(1),
.comp-panel .management-table td:nth-child(1){width:19%}

.comp-panel .management-table th:nth-child(2),
.comp-panel .management-table td:nth-child(2){width:19%}

.comp-panel .management-table th:nth-child(3),
.comp-panel .management-table td:nth-child(3){width:24%}

.comp-panel .management-table th:nth-child(4),
.comp-panel .management-table td:nth-child(4){width:38%}

.management-section-title{
  margin:7px 0 5px;
  color:var(--blue);
  font-size:15px;
  font-weight:900;
}

.comp-panel{
  display:grid;
  gap:7px;
}

.management-add{
  width:100%;
  min-height:42px;
  margin:2px 0;
  border:1px dashed #8fc9ea;
  border-radius:12px;
  background:#f7fcff;
  color:var(--blue);
  font-size:14px;
  font-weight:900;
}

.management-save{
  width:100%;
  min-height:46px;
  margin-top:8px;
  border:0;
  border-radius:14px;
  background:linear-gradient(#56baf0,#2d88d8);
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.footer{
  padding:14px 10px 4px;
  color:#8aa0b2;
  font-size:13px;
  text-align:center;
}

@media(max-width:480px){
  .page{padding:10px 9px 20px}
  .hero{padding:20px 10px 21px}
  .hero h1{font-size:30px}
  .card{padding:11px}
  .top-row{grid-template-columns:145px minmax(0,1fr)}
  .status{min-height:76px;font-size:17px}
  .mode-btn{min-height:82px;font-size:25px}
  .management-table{font-size:10px}
  .management-table input,
  .management-table select{
    height:30px;
    padding:1px 2px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="page">

<header class="hero">
  <h1>🚙 運転手MENU</h1>
</header>

<main class="card">

<div class="management-menu">
  <button id="assignmentBtn" class="management-btn assignment-btn" type="button">
    📋 担当表
  </button>
  <button id="compBtn" class="management-btn comp-btn" type="button">
    🗓️ 代休取得
  </button>
</div>

<div class="top-row">

<div id="status" class="status">
  <span id="statusIcon">⏰</span>
  <span id="statusText">⏳判別中⏳</span>
</div>

<div class="select-box">
  <label for="driverSelect">選択</label>
  <select id="driverSelect">
    <option value="">選択して下さい</option>
  </select>
</div>

</div>

<div class="mode-box">

<button id="inMode" class="mode-btn in" type="button" disabled>
  ☀️出勤☀️
</button>

<button id="outMode" class="mode-btn out off" type="button" disabled>
  🌙退勤🌙
</button>

</div>

<div class="guide">
  必要な場合は修正お願いします。
</div>

<input id="photoInput" type="file" accept="image/*" class="hidden">

<button id="uploadBtn" class="upload-btn" type="button" disabled>
  📷 写真を撮影・選択して読み取る
</button>

<div id="notice" class="notice"></div>

<section id="preview" class="preview">

<div class="preview-box">

<img id="photoPreview" class="photo-preview" alt="勤怠写真">

<div class="fields">

<div class="field">
<label class="field-title" for="reportDate">日付</label>
<input id="reportDate" type="date">
</div>

<div class="field">
<label class="field-title" for="startTime">出勤時間</label>
<input id="startTime" type="time">
</div>

<div id="endField" class="field hidden">
<label class="field-title" for="endTime">退勤時間</label>
<input id="endTime" type="time">
</div>

<div id="nextDateField" class="field hidden">
<label class="field-title" for="nextDate">次回出勤日</label>
<input id="nextDate" type="date">
</div>

<div id="nextTimeField" class="field hidden">
<label class="field-title" for="nextTime">次回出勤時間</label>
<select id="nextTime"></select>
</div>

<div id="summary" class="summary">
前回残業 <strong>0:00</strong>
　月間合計 <strong>0:00</strong>
</div>

</div>

<div class="message-section">

<div class="message-title">報告文章</div>

<div class="message-box">

<div id="messagePreview" class="message-preview"></div>

<textarea id="memo" class="memo-input" placeholder="文章を入力できます"></textarea>

</div>

</div>

<button id="sendBtn" class="send-btn" type="button" disabled>
写真＋報告文章を送信
</button>

</div>

</section>

<section class="history">

<h2 class="history-title">＜履歴＞</h2>

<ul id="historyList" class="history-list">
  <li class="empty">まだ履歴はありません</li>
</ul>

</section>

<section id="managementPanel" class="management-panel hidden">

<div class="management-header">

<div id="managementTitle" class="management-title">
📋 担当表
</div>

<button id="managementClose" class="management-close" type="button">
閉じる
</button>

</div>

<div id="managementLoading" class="management-loading">
読み込み中...
</div>

<div id="assignmentPanel" class="management-table-wrap assignment-panel hidden"></div>

<div id="compPanel" class="comp-panel hidden"></div>

<button id="managementSave" class="management-save hidden" type="button">
保存する
</button>

</section>

</main>

<footer class="footer">
勤怠管理Bot
</footer>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbySmhEE3JyfWGxEylyWscOtqL3FTIH9Ww6nybcAGb0f_kw2QXVP-LaoVtT1eFRtv-4Lyw/exec';

const LIFF_ID =
'2011011273-HIdBF1s';

const API_TIMEOUT=15000;

const el={
  status:document.getElementById('status'),
  statusIcon:document.getElementById('statusIcon'),
  statusText:document.getElementById('statusText'),
  driverSelect:document.getElementById('driverSelect'),
  assignmentBtn:document.getElementById('assignmentBtn'),
  compBtn:document.getElementById('compBtn'),
  managementPanel:document.getElementById('managementPanel'),
  managementTitle:document.getElementById('managementTitle'),
  managementLoading:document.getElementById('managementLoading'),
  assignmentPanel:document.getElementById('assignmentPanel'),
  compPanel:document.getElementById('compPanel'),
  managementSave:document.getElementById('managementSave'),
  managementClose:document.getElementById('managementClose'),
  inMode:document.getElementById('inMode'),
  outMode:document.getElementById('outMode'),
  uploadBtn:document.getElementById('uploadBtn'),
  photoInput:document.getElementById('photoInput'),
  notice:document.getElementById('notice'),
  preview:document.getElementById('preview'),
  photoPreview:document.getElementById('photoPreview'),
  reportDate:document.getElementById('reportDate'),
  startTime:document.getElementById('startTime'),
  endField:document.getElementById('endField'),
  endTime:document.getElementById('endTime'),
  nextDateField:document.getElementById('nextDateField'),
  nextDate:document.getElementById('nextDate'),
  nextTimeField:document.getElementById('nextTimeField'),
  nextTime:document.getElementById('nextTime'),
  summary:document.getElementById('summary'),
  messagePreview:document.getElementById('messagePreview'),
  memo:document.getElementById('memo'),
  sendBtn:document.getElementById('sendBtn'),
  historyList:document.getElementById('historyList')
};

const state={
  idToken:'',
  drivers:[],
  driver:null,
  mode:'in',
  draft:null,
  userSelectedManually:false,
  summary:{
    previousOvertime:'0:00',
    monthlyOvertime:'0:00'
  }
};

let managementMode='';
let managementState=null;

function pad2(v){
  return String(v).padStart(2,'0');
}

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function nowTime(){
  const d=new Date();
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function tomorrow(){
  const d=new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function dateText(v){
  if(!v)return '';
  const d=new Date(v+'T00:00:00');
  if(Number.isNaN(d.getTime()))return v;
  const w=['日','月','火','水','木','金','土'];
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'('+w[d.getDay()]+')';
}

function shortDate(v){
  if(!v)return '';
  const d=new Date(v+'T00:00:00');
  if(Number.isNaN(d.getTime()))return v;
  const w=['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+w[d.getDay()]+')';
}

function escapeHtml(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function setStatus(text,done){
  el.statusText.textContent=text;
  el.statusIcon.textContent=done?'✓':'⏰';
  el.status.classList.toggle('done',!!done);
}

function showNotice(text){
  el.notice.textContent=text||'';
  el.notice.classList.toggle('show',!!text);
}

function callServer(operation,data={}){
  return new Promise((resolve,reject)=>{

    const callback=
      'gasJsonp_'+
      Date.now()+'_'
      +
      Math.random().toString(36).slice(2);

    const script=document.createElement('script');

    let finished=false;

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('サーバー応答がタイムアウトしました'));
    },API_TIMEOUT);

    function cleanup(){
      clearTimeout(timer);
      if(script.parentNode)script.parentNode.removeChild(script);
      try{
        delete window[callback];
      }catch(_){
        window[callback]=undefined;
      }
    }

    window[callback]=response=>{
      if(finished)return;
      finished=true;
      cleanup();

      if(!response||response.ok!==true){
        reject(new Error(
          response&&response.error
            ?response.error
            :'Apps Script APIエラー'
        ));
        return;
      }

      resolve(response.data);
    };

    script.onerror=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('Apps Script APIに接続できませんでした'));
    };

    const params=new URLSearchParams();

    params.set('action','api');
    params.set('operation',operation);
    params.set('callback',callback);
    params.set('_',String(Date.now()));
    params.set('idToken',state.idToken||'');

    Object.keys(data).forEach(key=>{
      params.set(
        key,
        data[key]===undefined||data[key]===null
          ?''
          :String(data[key])
      );
    });

    script.src=API_URL+'?'+params.toString();

    document.body.appendChild(script);
  });
}

function buildNextTimeOptions(){
  el.nextTime.innerHTML='';

  for(let h=0;h<24;h++){
    for(let m=0;m<60;m++){
      const v=pad2(h)+':'+pad2(m);
      const o=document.createElement('option');
      o.value=v;
      o.textContent=v;
      el.nextTime.appendChild(o);
    }
  }

  const x=document.createElement('option');
  x.value='??:??';
  x.textContent='??:??';
  el.nextTime.appendChild(x);

  el.nextTime.value='08:00';
}

async function loadDrivers(){
  try{
    const list=await callServer('getDriverList');

    state.drivers=Array.isArray(list)?list:[];

    el.driverSelect.innerHTML=
      '<option value="">選択して下さい</option>';

    state.drivers.forEach(driver=>{
      const o=document.createElement('option');
      o.value=driver.driverKey;
      o.textContent=driver.displayName;
      el.driverSelect.appendChild(o);
    });

  }catch(error){
    console.error(error);
    state.drivers=[];
    el.driverSelect.innerHTML=
      '<option value="">選択して下さい</option>';
  }
}

function findDriver(key){
  return state.drivers.find(
    d=>d.driverKey===key
  )||null;
}

async function selectDriver(driver,manual=false){

  state.driver=driver||null;

  if(manual){
    state.userSelectedManually=true;
  }

  if(!driver){

    el.driverSelect.value='';
    el.inMode.disabled=true;
    el.outMode.disabled=true;
    el.uploadBtn.disabled=true;

    setStatus('右から選択',false);

    return;
  }

  el.driverSelect.value=driver.driverKey;
  el.inMode.disabled=false;
  el.outMode.disabled=false;
  el.uploadBtn.disabled=false;

  setStatus('完了',true);
}

function setMode(mode){
  state.mode=mode;
  state.draft=null;

  el.inMode.classList.toggle('off',mode!=='in');
  el.outMode.classList.toggle('off',mode!=='out');

  el.preview.classList.remove('show');
  el.sendBtn.disabled=true;
  el.photoInput.value='';
  showNotice('');

  if(mode==='in'){
    el.endField.classList.add('hidden');
    el.nextDateField.classList.add('hidden');
    el.nextTimeField.classList.add('hidden');

    el.reportDate.value=today();
    el.startTime.value=nowTime();

  }else{
    el.endField.classList.remove('hidden');
    el.nextDateField.classList.remove('hidden');
    el.nextTimeField.classList.remove('hidden');

    el.reportDate.value=today();
    el.endTime.value=nowTime();
    el.nextDate.value=tomorrow();
    el.nextTime.value='08:00';
  }

  refreshMessage();
}

function buildReportBaseMessage(){

  if(state.mode==='in'){
    return(
      'お疲れ様でございます。\n'+
      dateText(el.reportDate.value||today())+
      ' '+
      (el.startTime.value||nowTime())+
      '出勤いたしました。\n'+
      '本日もよろしくお願いいたします。\n'+
      '残業)'+
      (state.summary.previousOvertime||'0:00')+
      '\n'+
      '合計)'+
      (state.summary.monthlyOvertime||'0:00')+
      '\n'+
      '【MEMO】'
    );
  }

  return(
    'お疲れ様でございます。\n'+
    '業務完了いたしました。\n'+
    dateText(el.reportDate.value||today())+
    '\n'+
    '稼働)'+
    (el.startTime.value||'00:00')+
    '→'+
    (el.endTime.value||nowTime())+
    '\n'+
    '本日は失礼させていただきます。\n'+
    '出勤) '+
    shortDate(el.nextDate.value||tomorrow())+
    ' '+
    (el.nextTime.value||'??:??')+
    '\n'+
    '明日もよろしくお願いいたします。\n'+
    '【MEMO】'
  );
}

function refreshMessage(){
  el.messagePreview.textContent=
    buildReportBaseMessage();
}

function renderSummary(){
  el.summary.innerHTML=
    '前回残業 <strong>'+
    escapeHtml(
      state.summary.previousOvertime||'0:00'
    )+
    '</strong>　月間合計 <strong>'+
    escapeHtml(
      state.summary.monthlyOvertime||'0:00'
    )+
    '</strong>';
}

function renderHistory(list){
  if(!Array.isArray(list)||!list.length){
    el.historyList.innerHTML=
      '<li class="empty">まだ履歴はありません</li>';
    return;
  }

  el.historyList.innerHTML=list.map(item=>{

    const time=
      item.type==='退勤'
        ?(item.startTime||'')+'→'+(item.endTime||'')
        :(item.reportTime||item.startTime||'');

    return(
      '<li>'+
      '<span>'+escapeHtml(item.date||'')+'</span>'+
      '<span>'+escapeHtml(item.type||'')+'</span>'+
      '<span>'+escapeHtml(time)+'</span>'+
      '<span class="history-ok">✅</span>'+
      '</li>'
    );
  }).join('');
}

/* ============================================================
   担当表
   ★現在月を薄い赤で強調
============================================================ */

function renderAssignmentTable(data){

  const wrap=el.assignmentPanel;

  wrap.innerHTML='';
  wrap.classList.remove('hidden');

  const table=document.createElement('table');
  table.className='management-table';

  const officers=
    Array.isArray(data.officers)&&data.officers.length
      ?data.officers
      :[
        '安田副社長',
        '伊藤社長',
        '山下副社長',
        '西山副社長'
      ];

  const header=[
    '月',
    ...officers.map(
      n=>n==='伊藤副社長'?'伊藤社長':n
    )
  ];

  const thead=document.createElement('thead');
  const hrow=document.createElement('tr');

  header.forEach(text=>{
    const th=document.createElement('th');
    th.textContent=text;
    hrow.appendChild(th);
  });

  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');

  const currentMonth=new Date().getMonth()+1;

  (Array.isArray(data.rows)?data.rows:[])
  .forEach((row,i)=>{

    const tr=document.createElement('tr');

    const rowMonth=
      parseInt(
        String(row.month||'')
          .replace(/[^\d]/g,''),
        10
      );

    /* ★現在月だけ薄い赤 */
    if(rowMonth===currentMonth){
      tr.classList.add('current-month-row');
    }

    const month=document.createElement('th');
    month.textContent=row.month||'';
    tr.appendChild(month);

    officers.forEach(officer=>{

      const td=document.createElement('td');
      const input=document.createElement('input');

      input.type='text';

      input.value=
        row.assignments&&
        row.assignments[officer]
          ?row.assignments[officer]
          :'';

      input.addEventListener(
        'input',
        ()=>{
          if(!data.rows[i].assignments){
            data.rows[i].assignments={};
          }

          data.rows[i].assignments[officer]=
            input.value;
        }
      );

      td.appendChild(input);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
}

/* ============================================================
   名称マスター
============================================================ */

function getMasterDrivers(data){
  return(
    data&&
    data.nameMaster&&
    Array.isArray(data.nameMaster.drivers)
  )
    ?data.nameMaster.drivers
    :[];
}

function getMasterOfficers(data){
  return(
    data&&
    data.nameMaster&&
    Array.isArray(data.nameMaster.officers)
  )
    ?data.nameMaster.officers
    :[];
}

function driverMasterMatch(value,list){

  const current=String(value||'').trim();

  if(!current)return '';

  if(list.includes(current))return current;

  const normalized=
    current.replace(/\s+/g,'');

  return list.find(name=>{

    const master=
      String(name||'')
      .replace(/\s+/g,'');

    if(master===normalized)return true;

    const surname=
      String(name||'')
      .trim()
      .split(/\s+/)[0];

    return(
      current===surname||
      current.indexOf(surname)===0
    );

  })||current;
}

function createManagementSelect(
  values,
  currentValue,
  onChange,
  type
){

  const select=document.createElement('select');

  const list=
    Array.isArray(values)
      ?[...values]
      :[];

  let current=
    String(currentValue||'').trim();

  if(type==='driver'){
    current=driverMasterMatch(current,list);
  }

  const blank=document.createElement('option');
  blank.value='';
  blank.textContent='';
  select.appendChild(blank);

  if(current&&!list.includes(current)){
    const old=document.createElement('option');
    old.value=current;
    old.textContent=current;
    select.appendChild(old);
  }

  list.forEach(value=>{
    const o=document.createElement('option');
    o.value=value;
    o.textContent=value;
    select.appendChild(o);
  });

  select.value=current;

  select.addEventListener(
    'change',
    ()=>onChange(select.value)
  );

  return select;
}

/* ============================================================
   代休取得
============================================================ */

function renderCompTable(data){

  const wrap=el.compPanel;

  wrap.innerHTML='';
  wrap.classList.remove('hidden');

  const masterDrivers=
    getMasterDrivers(data);

  const masterOfficers=
    getMasterOfficers(data);

  data.planned=
    (
      Array.isArray(data.planned)
        ?data.planned
        :[]
    ).filter(row=>
      row.startDate||
      row.compDate||
      row.driver||
      row.officer
    );

  data.completed=
    (
      Array.isArray(data.completed)
        ?data.completed
        :[]
    ).filter(row=>
      row.startDate||
      row.compDate||
      row.driver||
      row.officer
    );

  function makeSection(
    title,
    rows,
    key
  ){

    const section=document.createElement('div');

    const titleEl=document.createElement('div');
    titleEl.className='management-section-title';
    titleEl.textContent=title;
    section.appendChild(titleEl);

    const table=document.createElement('table');
    table.className='management-table';

    const thead=document.createElement('thead');
    const hrow=document.createElement('tr');

    [
      '出勤日',
      '代休日',
      '担当者',
      '役員'
    ].forEach(text=>{
      const th=document.createElement('th');
      th.textContent=text;
      hrow.appendChild(th);
    });

    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody=document.createElement('tbody');

    rows.forEach((row,i)=>{

      const tr=document.createElement('tr');

      const inputCell=(field)=>{

        const td=document.createElement('td');
        const input=document.createElement('input');

        input.type='text';
        input.value=row[field]||'';

        input.addEventListener(
          'input',
          ()=>{
            managementState[key][i][field]=
              input.value;
          }
        );

        td.appendChild(input);
        tr.appendChild(td);
      };

      inputCell('startDate');
      inputCell('compDate');

      {
        const td=document.createElement('td');

        const select=createManagementSelect(
          masterDrivers,
          row.driver,
          value=>{
            managementState[key][i].driver=value;
          },
          'driver'
        );

        row.driver=select.value;

        td.appendChild(select);
        tr.appendChild(td);
      }

      {
        const td=document.createElement('td');

        const select=createManagementSelect(
          masterOfficers,
          row.officer,
          value=>{
            managementState[key][i].officer=value;
          },
          'officer'
        );

        row.officer=select.value;

        td.appendChild(select);
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    section.appendChild(table);

    return section;
  }

  wrap.appendChild(
    makeSection(
      '取得予定、未取得',
      data.planned,
      'planned'
    )
  );

  const add=document.createElement('button');
  add.type='button';
  add.className='management-add';
  add.textContent='＋ 予定を追加';

  add.addEventListener(
    'click',
    ()=>{
      data.planned.push({
        sheetRow:null,
        startDate:'',
        compDate:'',
        driver:'',
        officer:''
      });

      managementState=data;
      renderCompTable(data);
    }
  );

  wrap.appendChild(add);

  wrap.appendChild(
    makeSection(
      '取得済み',
      data.completed,
      'completed'
    )
  );
}

/* ============================================================
   管理画面
============================================================ */

async function openManagement(mode){

  managementMode=mode;
  managementState=null;

  el.managementPanel.classList.remove('hidden');
  el.managementTitle.textContent=
    mode==='assignment'
      ?'📋 担当表'
      :'🗓️ 代休取得';

  el.managementLoading.classList.remove('hidden');
  el.managementLoading.textContent='読み込み中...';

  el.assignmentPanel.classList.add('hidden');
  el.compPanel.classList.add('hidden');
  el.managementSave.classList.add('hidden');

  try{

    const result=await callServer(
      'getManagementData',
      {
        sheetType:mode,
        selectedDriverKey:
          state.driver
            ?state.driver.driverKey
            :''
      }
    );

    if(!result||result.ok!==true){
      throw new Error('データを取得できませんでした');
    }

    managementState=result;

    el.managementLoading.classList.add('hidden');

    if(mode==='assignment'){
      renderAssignmentTable(result);
    }else{
      renderCompTable(result);
    }

    el.managementSave.classList.remove('hidden');

  }catch(error){

    console.error(error);

    el.managementLoading.textContent=
      error.message||
      '読み込みに失敗しました';
  }
}

el.assignmentBtn.addEventListener(

);

el.compBtn.addEventListener(

el.managementClose.addEventListener(

el.managementSave.addEventListener(
  'click',
  async()=>{

    if(!managementState)return;

    el.managementSave.disabled=true;
    el.managementSave.textContent='保存中...';

    try{

      const result=await callServer(
        'saveManagementData',
        {
          sheetType:managementMode,
          selectedDriverKey:
            state.driver
              ?state.driver.driverKey
              :'',
          payload:JSON.stringify(managementState)
        }
      );

      if(!result||result.ok!==true){
        throw new Error('保存に失敗しました');
      }

      alert('スプレッドシートへ保存しました。');

      await openManagement(
        managementMode
      );

    }catch(error){

      console.error(error);

      alert(
        error.message||
        '保存に失敗しました'
      );

    }finally{

      el.managementSave.disabled=false;
      el.managementSave.textContent='保存する';
    }
  }
);

/* ============================================================
   写真
============================================================ */

function imageToDataUrl(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=new FileReader();

      reader.onload=()=>{

        const image=new Image();

        image.onload=()=>{

          const max=1800;

          const scale=Math.min(
            1,
            max/
            Math.max(
              image.width,
              image.height
            )
          );

          const canvas=document.createElement('canvas');

          canvas.width=
            Math.round(
              image.width*scale
            );

          canvas.height=
            Math.round(
              image.height*scale
            );

          const ctx=
            canvas.getContext(
              '2d',
              {alpha:false}
            );

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          resolve(
            canvas.toDataURL(
              'image/jpeg',
              .86
            )
          );
        };

        image.onerror=reject;
        image.src=reader.result;
      };

      reader.onerror=reject;
      reader.readAsDataURL(file);
    }
  );
}

async function runBrowserOcr(dataUrl){

  if(!window.Tesseract)return '';

  const result=
    await Tesseract.recognize(
      dataUrl,
      'eng',
      {
        logger:m=>{
          if(
            m&&
            m.status==='recognizing text'&&
            m.progress
          ){
            showNotice(
              '写真を読み取り中... '+
              Math.round(m.progress*100)+
              '%'
            );
          }
        },
        tessedit_pageseg_mode:6
      }
    );

  return result&&result.data
    ?String(result.data.text||'')
    :'';
}

async function uploadPhoto(file){

  if(!state.driver){
    alert('先に人物を選択してください');
    return;
  }

  showNotice('写真を読み込んでいます...');

  try{

    const dataUrl=
      await imageToDataUrl(file);

    el.photoPreview.src=dataUrl;

    await runBrowserOcr(dataUrl);

    state.draft={
      imageBase64:dataUrl
    };

    el.preview.classList.add('show');

    if(state.mode==='in'){
      el.startTime.value=nowTime();
    }else{
      el.endTime.value=nowTime();
    }

    refreshMessage();

    el.sendBtn.disabled=false;

    showNotice(
      '時間を確認・修正して送信してください。'
    );

  }catch(error){

    console.error(error);

    showNotice(
      '写真の読み取りに失敗しました。'
    );
  }
}

el.uploadBtn.addEventListener(
  'click',
  ()=>{
    if(!state.driver){
      alert('先に人物を選択してください');
      return;
    }

    el.photoInput.click();
  }
);

el.photoInput.addEventListener(
  'change',
  ()=>{
    const file=
      el.photoInput.files&&
      el.photoInput.files[0];

    if(file)uploadPhoto(file);
  }

/* ============================================================
   送信
============================================================ */

el.sendBtn.addEventListener(
  'click',
  async()=>{

    if(!state.driver){
      alert('人物を選択してください');
      return;
    }

    const memo=
      String(
        el.memo.value||''
      ).trim();

    const message=
      buildReportBaseMessage()+
      (memo?'\n'+memo:'');

    el.sendBtn.disabled=true;
    showNotice('送信中です...');

    try{

      const result=
        await callServer(
          'sendAttendance',
          {
            selectedDriverKey:
              state.driver.driverKey,
            message:message
          }
        );

      if(!result||result.ok!==true){
        throw new Error('送信に失敗しました');
      }

      showNotice('送信完了しました。');

      state.draft=null;
      el.preview.classList.remove('show');
      el.photoInput.value='';
      el.memo.value='';

    }catch(error){

      console.error(error);

      showNotice(
        error.message||
        '送信に失敗しました'
      );

    }finally{

      el.sendBtn.disabled=false;
    }
  }
);

/* ============================================================
   LINE自動判別
============================================================ */

async function autoDetect(){

  setStatus('判別中',false);

  try{

    if(
      typeof liff==='undefined'
    ){
      throw new Error(
        'LIFF SDKが読み込まれていません'
      );
    }

    await liff.init({
      liffId:LIFF_ID
    });

    if(
      state.userSelectedManually&&
      state.driver
    ){
      return;
    }

    if(!liff.isLoggedIn()){

      state.idToken='';

      setStatus(
        '右から選択',
        false
      );

      return;
    }

    state.idToken=
      liff.getIDToken()||'';

    if(!state.idToken){

      setStatus(
        '右から選択',
        false
      );

      return;
    }

    const info=
      await callServer(
        'getDriverInfo'
      );

    if(
      state.userSelectedManually&&
      state.driver
    ){
      return;
    }

    if(
      info&&
      info.found&&
      info.driverKey
    ){

      const driver=
        findDriver(
          info.driverKey
        );

      if(driver){

        await selectDriver(
          driver,
          false
        );

        setStatus(
          '完了',
          true
        );

        return;
      }
    }

    setStatus(
      '右から選択',
      false
    );

  }catch(error){

    console.warn(
      '自動判別失敗',
      error
    );

    if(
      state.userSelectedManually&&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

    }else{

      setStatus(
        '右から選択',
        false
      );
    }
  }
}
