<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root{
  --bg1:#e8f7ff;
  --bg2:#f7fcff;
  --card:rgba(255,255,255,.95);
  --line:#d8ebf7;
  --text:#17324d;
  --primary:#2d88d8;
  --shadow:0 14px 40px rgba(39,96,139,.10);
  --shadow-soft:0 8px 22px rgba(39,96,139,.08);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
}

body{
  min-height:100vh;
}

.page{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px 14px 28px;
}


/* タイトル */

.hero{
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:28px 16px 24px;
  border-radius:30px;
  background:linear-gradient(180deg,#bfeaff,#e9f9ff);
  box-shadow:var(--shadow-soft);
}

.hero:before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:0;
  height:40%;
  background:
    radial-gradient(
      ellipse at 10% 100%,
      #69be68 0 22%,
      transparent 23%
    ),
    radial-gradient(
      ellipse at 73% 100%,
      #69be68 0 22%,
      transparent 23%
    );
  opacity:.75;
}

.hero h1{
  position:relative;
  z-index:1;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  color:#1676c7;
  font-size:30px;
  line-height:1.2;
  font-weight:700;
}


/* メイン */

.main-card{
  margin-top:14px;
  padding:16px;
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow);
}


/* 人物状態 */

.driver-pill{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:fit-content;
  max-width:100%;
  min-height:44px;
  margin:0 auto 10px;
  padding:10px 18px;
  border-radius:999px;
  background:#f3fbff;
  border:1px solid #dceff9;
  color:#1676c7;
  font-size:16px;
  font-weight:900;
}

.driver-pill.done{
  color:#16804a;
  background:#eefbf3;
  border-color:#ccefd8;
}

.status-icon{
  font-size:18px;
}


/* 人物選択 */

.manual-select-area{
  margin-bottom:12px;
  padding:10px 12px;
  border:1px solid #dceff9;
  border-radius:16px;
  background:#f9fdff;
}

.manual-select-label{
  display:block;
  margin-bottom:6px;
  color:#61798e;
  font-size:13px;
  font-weight:800;
}

.driver-select{
  width:100%;
  height:46px;
  padding:0 10px;
  border:1px solid #cfe5f5;
  border-radius:12px;
  background:#fff;
  color:#17324d;
  font-size:16px;
  font-weight:800;
}


/* 出勤・退勤 */

.attendance-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.attendance-btn{
  position:relative;
  width:100%;
  height:88px;
  min-height:88px;
  border:0;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 18px rgba(39,96,139,.10);
  transition:transform .12s ease,opacity .12s ease;
}

.attendance-btn:active{
  transform:translateY(1px) scale(.99);
}

.attendance-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.attendance-text{
  position:relative;
  z-index:3;
  font-size:28px;
  font-weight:900;
  line-height:1;
  letter-spacing:.02em;
}

.btn-in{
  color:#0a4c7d;
  background:linear-gradient(
    180deg,
    #77d2ff,
    #c8efff 58%,
    #8ed777
  );
  border:1px solid #a8ddf7;
}

.btn-out{
  color:#fff;
  background:linear-gradient(
    180deg,
    #142c78,
    #10215c 60%,
    #07163f
  );
  border:1px solid #6077c5;
}


/* 案内 */

.guide{
  margin:10px 4px 8px;
  color:#1676c7;
  font-size:14px;
  font-weight:800;
  text-align:center;
}


/* 修正エリア */

.edit-panel{
  display:none;
  margin-top:8px;
  padding:13px;
  background:#fff;
  border-radius:22px;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(216,235,247,.9);
}

.edit-panel.show{
  display:block;
}

.two-column{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:7px;
  margin-bottom:7px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  margin-bottom:3px;
  color:#61798e;
  font-size:12px;
  font-weight:800;
}

.field input{
  width:100%;
  height:40px;
  padding:0;
  border:1px solid #cfe5f5;
  border-radius:13px;
  background:#fff;
  color:#0d2340;
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.single-field{
  margin-bottom:8px;
}

#nextDate{
  font-size:15px;
}


/* 送信文章 */

.preview{
  display:none;
  margin-top:9px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#f4faff;
  color:#14446e;
  font-size:14px;
  line-height:1.4;
  font-weight:600;
  white-space:pre-line;
}

.preview.show{
  display:block;
}


/* 送信ボタン */

.send-btn{
  width:100%;
  margin-top:7px;
  padding:14px 12px;
  border:0;
  border-radius:18px;
  background:linear-gradient(
    180deg,
    #56baf0,
    #2d88d8
  );
  color:#fff;
  font-size:20px;
  font-weight:900;
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* 履歴 */

.history{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid #e2eef6;
}

.history h3{
  margin:0 0 10px;
  color:#1676c7;
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.history h3:before{
  content:"🕘 ";
}

.history-list{
  list-style:none;
  margin:0;
  padding:0;
}

.history-list li{
  padding:9px 0;
  border-bottom:1px solid #edf4fa;
  color:#496173;
  font-size:14px;
}

.history-list .empty{
  text-align:center;
  color:#7a90a3;
}

.footer{
  padding:14px 10px 4px;
  color:#8aa0b2;
  font-size:14px;
  text-align:center;
}

.hidden{
  display:none!important;
}


/* スマホ */

@media(max-width:480px){

  .page{
    padding:12px 10px 20px;
  }

  .hero{
    padding:22px 12px 18px;
    border-radius:24px;
  }

  .hero h1{
    font-size:26px;
    gap:6px;
  }

  .main-card{
    margin-top:10px;
    padding:12px;
    border-radius:22px;
  }

  .driver-pill{
    min-height:42px;
    margin:0 auto 10px;
    padding:8px 15px;
    font-size:15px;
  }

  .driver-select{
    height:44px;
    font-size:15px;
  }

  .attendance-buttons{
    gap:7px;
  }

  .attendance-btn{
    height:72px;
    min-height:72px;
    border-radius:16px;
  }

  .attendance-text{
    font-size:25px;
  }

  .guide{
    margin-top:8px;
    margin-bottom:6px;
    font-size:13px;
  }

  .edit-panel{
    margin-top:6px;
    padding:13px 12px;
    border-radius:20px;
  }

  .field input{
    height:40px;
    font-size:20px;
  }

  .preview{
    line-height:1.4;
  }

}
</style>
</head>

<body>

<div class="page">

<header class="hero">
  <h1>🚙 運転手MENU</h1>
</header>

<main class="main-card">

<div
  id="statusPill"
  class="driver-pill"
>
  <span
    id="statusIcon"
    class="status-icon"
  >⏳</span>

  <span id="statusText">
    自動判別中...
  </span>
</div>


<div class="manual-select-area">

  <label
    class="manual-select-label"
    for="driverSelect"
  >
    人物選択
  </label>

  <select
    id="driverSelect"
    class="driver-select"
  >
    <option value="">
      人物を選択してください
    </option>
  </select>

</div>


<div class="attendance-buttons">

  <button
    id="btnIn"
    class="attendance-btn btn-in"
    type="button"
    disabled
  >
    <span class="attendance-text">
      ☀️ 出勤
    </span>
  </button>

  <button
    id="btnOut"
    class="attendance-btn btn-out"
    type="button"
    disabled
  >
    <span class="attendance-text">
      🌙 退勤
    </span>
  </button>

</div>


<div class="guide">
  必要な場合は修正お願いします。
</div>


<section
  id="editPanel"
  class="edit-panel"
>

  <!-- 「内容修正」の見出しは削除済み -->


  <div id="inFields">

    <div class="field single-field">

      <label for="clockInTime">
        出勤時間
      </label>

      <input
        id="clockInTime"
        type="time"
      >

    </div>

  </div>


  <div
    id="outFields"
    class="hidden"
  >

    <div class="two-column">

      <div class="field">

        <label for="editClockInTime">
          出勤時間
        </label>

        <input
          id="editClockInTime"
          type="time"
        >

      </div>

      <div class="field">

        <label for="clockOutTime">
          退勤時間
        </label>

        <input
          id="clockOutTime"
          type="time"
        >

      </div>

    </div>


    <div class="two-column">

      <div class="field">

        <label for="nextDate">
          次回出勤日
        </label>

        <input
          id="nextDate"
          type="date"
        >

      </div>

      <div class="field">

        <label for="nextTime">
          次回出勤時間
        </label>

        <input
          id="nextTime"
          type="time"
        >

      </div>

    </div>

  </div>


  <div
    id="preview"
    class="preview"
  ></div>


  <button
    id="sendBtn"
    class="send-btn"
    type="button"
    disabled
  >
    送信
  </button>

</section>


<section class="history">

  <h3>今日の履歴</h3>

  <ul
    id="historyList"
    class="history-list"
  >
    <li class="empty">
      まだ履歴はありません
    </li>
  </ul>

</section>

</main>


<footer class="footer">
  勤怠管理Bot
</footer>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbwcdo-FzaXTmRj2mVv-REGhopjLeDcr4XRkBO4s3v1mRKSjsjHHXu6Rh2N4I0Vi_ymv/exec';

const LIFF_ID =
  '2011011273-HIdBF1sM';

const RECENT_KEY =
  'driver_menu_recent_drivers_v1';

const HISTORY_KEY =
  'driver_menu_attendance_history_v1';

const WORK_KEY =
  'driver_menu_work_state_v1';


const $ =
  id =>
    document.getElementById(id);


const e = {

  status:
    $('statusPill'),

  icon:
    $('statusIcon'),

  statusText:
    $('statusText'),

  driver:
    $('driverSelect'),

  in:
    $('btnIn'),

  out:
    $('btnOut'),

  panel:
    $('editPanel'),

  inFields:
    $('inFields'),

  outFields:
    $('outFields'),

  inTime:
    $('clockInTime'),

  editIn:
    $('editClockInTime'),

  outTime:
    $('clockOutTime'),

  nextDate:
    $('nextDate'),

  nextTime:
    $('nextTime'),

  preview:
    $('preview'),

  send:
    $('sendBtn'),

  history:
    $('historyList')

};


const state = {

  driver:
    null,

  idToken:
    '',

  mode:
    null,

  start:
    '',

  history:
    [],

  drivers:
    [],

  manual:
    false

};


function todayKey(){

  const d =
    new Date();

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      '0'
    ) +
    '-' +
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )
  );

}


function time(d){

  return (
    String(
      d.getHours()
    ).padStart(
      2,
      '0'
    ) +
    ':' +
    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    )
  );

}


function dateInput(d){

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      '0'
    ) +
    '-' +
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    )
  );

}


function week(d){

  return [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ][d.getDay()];

}


function dateLabel(d){

  return (
    (d.getMonth()+1) +
    '/' +
    d.getDate() +
    '(' +
    week(d) +
    ')'
  );

}


function dateSlash(d){

  return (
    d.getFullYear() +
    '/' +
    (d.getMonth()+1) +
    '/' +
    d.getDate()
  );

}


function tomorrow(){

  const d =
    new Date();

  d.setDate(
    d.getDate()+1
  );

  return d;

}


function setStatus(s){

  e.status
    .classList
    .remove(
      'done'
    );


  if(
    s ===
    'done'
  ){

    e.icon.textContent =
      '✓';

    e.statusText.textContent =
      '完了';

    e.status
      .classList
      .add(
        'done'
      );

    return;

  }


  if(
    s ===
    'waiting'
  ){

    e.icon.textContent =
      '👤';

    e.statusText.textContent =
      '人物選択待ち';

    return;

  }


  e.icon.textContent =
    '⏳';

  e.statusText.textContent =
    '自動判別中...';

}


function recent(){

  try{

    return JSON.parse(
      localStorage.getItem(
        RECENT_KEY
      ) ||
      '[]'
    );

  }catch(_){

    return [];

  }

}


function saveRecent(d){

  if(!d){
    return;
  }


  let list =
    recent()
      .filter(
        item =>
          item.driverKey !==
          d.driverKey
      );


  list.unshift({

    driverKey:
      d.driverKey,

    displayName:
      d.displayName

  });


  localStorage.setItem(

    RECENT_KEY,

    JSON.stringify(
      list.slice(
        0,
        10
      )
    )

  );

}


function findDriver(key){

  return (
    state.drivers.find(
      d =>
        d.driverKey ===
        key
    ) ||

    recent().find(
      d =>
        d.driverKey ===
        key
    ) ||

    null
  );

}


function selectDriver(
  driver,
  manual = true
){

  if(!driver){
    return;
  }


  state.driver =
    driver;

  state.manual =
    manual;


  saveRecent(
    driver
  );


  e.driver.value =
    driver.driverKey;


  e.in.disabled =
    false;

  e.out.disabled =
    false;


  loadWork();

  setStatus(
    'done'
  );

}


function syncDriver(){

  const driver =
    findDriver(
      e.driver.value
    );


  if(driver){

    selectDriver(
      driver,
      true
    );

    return true;

  }


  return false;

}


function renderDrivers(){

  const current =
    state.driver
      ? state.driver.driverKey
      : e.driver.value;


  e.driver.innerHTML =
    '<option value="">人物を選択してください</option>';


  const recentDrivers =
    recent();


  const used =
    new Set(
      recentDrivers.map(
        item =>
          item.driverKey
      )
    );


  if(
    recentDrivers.length
  ){

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '最近使った人物';


    recentDrivers.forEach(
      item => {

        const driver =
          findDriver(
            item.driverKey
          ) ||
          item;


        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    e.driver.appendChild(
      group
    );

  }


  const others =
    state.drivers.filter(
      driver =>
        !used.has(
          driver.driverKey
        )
    );


  if(
    others.length
  ){

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      'その他の人物';


    others.forEach(
      driver => {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    e.driver.appendChild(
      group
    );

  }


  if(current){

    e.driver.value =
      current;

  }

}


function callServer(
  operation,
  data = {}
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      Object.entries({

        action:
          'api',

        operation:
          operation,

        requestId:
          requestId,

        idToken:
          state.idToken ||
          '',

        ...data

      }).forEach(
        (
          [key,value]
        ) => {

          params.append(
            key,
            value ?? ''
          );

        }
      );


      fetch(
        API_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params

        }
      )
      .catch(
        () => {}
      );


      poll(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


function poll(
  requestId,
  resolve,
  reject,
  attempt
){

  if(
    attempt >=
    40
  ){

    reject(
      new Error(
        'Apps Script APIから応答がありません'
      )
    );

    return;

  }


  const callback =
    'gas_' +
    Date.now() +
    '_' +
    attempt;


  const script =
    document.createElement(
      'script'
    );


  function cleanup(){

    script.remove();


    try{

      delete window[
        callback
      ];

    }catch(_){}

  }


  window[
    callback
  ] =
    response => {

      cleanup();


      if(
        response &&
        (
          response.status ===
            'pending' ||

          response.status ===
            'processing'
        )
      ){

        setTimeout(
          () => {

            poll(
              requestId,
              resolve,
              reject,
              attempt + 1
            );

          },
          500
        );

        return;

      }


      if(
        !response ||
        response.ok !==
          true
      ){

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );

        return;

      }


      resolve(
        response.data
      );

    };


  script.onerror =
    () => {

      cleanup();


      setTimeout(
        () => {

          poll(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    callback +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}


async function loadDrivers(){

  try{

    const list =
      await callServer(
        'getDriverList'
      );


    state.drivers =
      Array.isArray(
        list
      )
        ? list
        : [];


    renderDrivers();

  }catch(error){

    console.error(
      error
    );

  }

}


function saveWork(){

  if(
    !state.driver
  ){
    return;
  }


  localStorage.setItem(

    WORK_KEY,

    JSON.stringify({

      date:
        todayKey(),

      driverKey:
        state.driver.driverKey,

      startTime:
        state.start

    })

  );

}


function loadWork(){

  try{

    const work =
      JSON.parse(
        localStorage.getItem(
          WORK_KEY
        ) ||
        'null'
      );


    if(
      work &&
      work.date ===
        todayKey() &&
      (
        !state.driver ||
        work.driverKey ===
          state.driver.driverKey
      )
    ){

      state.start =
        work.startTime ||
        '';

    }

  }catch(_){}

}


function nextLabel(
  target
){

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const date =
    new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );


  const diff =
    Math.round(
      (
        date -
        today
      ) /
      86400000
    );


  if(
    diff ===
    1
  ){
    return '明日';
  }


  if(
    diff ===
    2
  ){
    return '明後日';
  }


  return '次回';

}


/* 出勤文章：空行なし */

function inMessage(){

  const d =
    new Date();


  return (
    'お疲れ様でございます。\n' +
    dateLabel(d) +
    '出勤いたしました。\n' +
    '本日もよろしくお願いいたします。'
  );

}


function outMessage(){

  const d =
    new Date();


  const next =
    e.nextDate.value
      ? new Date(
          e.nextDate.value +
          'T00:00:00'
        )
      : tomorrow();


  const start =
    e.editIn.value ||
    state.start ||
    '00:00';


  const end =
    e.outTime.value ||
    '00:00';


  return (
    'お疲れ様でございます。\n\n' +
    '業務完了いたしました。\n\n' +
    dateSlash(d) +
    '\n' +
    '稼働)' +
    start +
    '-' +
    end +
    '\n\n' +
    '本日は失礼させていただきます。\n\n' +
    '出勤) ' +
    dateLabel(next) +
    ' ' +
    (
      e.nextTime.value ||
      '08:00'
    ) +
    '\n\n' +
    nextLabel(next) +
    'もよろしくお願いいたします。'
  );

}


function refresh(){

  const message =
    state.mode ===
      'in'
      ? inMessage()
      : outMessage();


  e.preview.textContent =
    message;


  e.preview
    .classList
    .add(
      'show'
    );


  return message;

}


function setMode(
  mode
){

  state.mode =
    mode;


  e.panel
    .classList
    .add(
      'show'
    );


  const now =
    new Date();


  if(
    mode ===
    'in'
  ){

    e.inFields
      .classList
      .remove(
        'hidden'
      );


    e.outFields
      .classList
      .add(
        'hidden'
      );


    e.send.textContent =
      '出勤送信';


    e.inTime.value =
      time(now);


    state.start =
      e.inTime.value;

  }else{

    e.inFields
      .classList
      .add(
        'hidden'
      );


    e.outFields
      .classList
      .remove(
        'hidden'
      );


    e.send.textContent =
      '退勤送信';


    loadWork();


    e.editIn.value =
      state.start ||
      time(now);


    e.outTime.value =
      time(now);


    e.nextDate.value =
      dateInput(
        tomorrow()
      );


    e.nextTime.value =
      '08:00';

  }


  refresh();


  setTimeout(
    () => {

      if(
        window.matchMedia(
          '(max-width:480px)'
        ).matches
      ){

        e.panel.scrollIntoView({

          behavior:
            'smooth',

          block:
            'center'

        });

      }

    },
    150
  );

}


function renderHistory(){

  if(
    !state.history.length
  ){

    e.history.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';

    return;

  }


  e.history.innerHTML =
    state.history
      .map(
        item => {

          return (
            '<li>' +
            item.time +
            '　' +
            item.text +
            '</li>'
          );

        }
      )
      .join('');

}


function loadHistory(){

  try{

    state.history =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) ||
        '[]'
      );


    if(
      !Array.isArray(
        state.history
      )
    ){

      state.history =
        [];

    }

  }catch(_){

    state.history =
      [];

  }


  renderHistory();

}


function addHistory(
  text
){

  state.history.unshift({

    time:
      new Date()
        .toLocaleString(
          'ja-JP'
        ),

    text:
      text

  });


  state.history =
    state.history.slice(
      0,
      50
    );


  localStorage.setItem(

    HISTORY_KEY,

    JSON.stringify(
      state.history
    )

  );


  renderHistory();

}


e.driver.onchange =
  () => {

    const driver =
      findDriver(
        e.driver.value
      );


    if(driver){

      selectDriver(
        driver,
        true
      );

    }

  };


e.in.onclick =
  () => {

    if(
      !state.driver &&
      !syncDriver()
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }


    setMode(
      'in'
    );

  };


e.out.onclick =
  () => {

    if(
      !state.driver &&
      !syncDriver()
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }


    setMode(
      'out'
    );

  };


e.inTime.oninput =
  () => {

    state.start =
      e.inTime.value;

    refresh();

  };


e.editIn.oninput =
  () => {

    state.start =
      e.editIn.value;

    refresh();

  };


e.outTime.oninput =
  refresh;


e.nextTime.oninput =
  refresh;


e.nextDate.onchange =
  refresh;


e.send.onclick =
  async () => {

    if(
      !state.driver
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }


    let message;


    if(
      state.mode ===
      'in'
    ){

      if(
        !e.inTime.value
      ){

        alert(
          '出勤時間を入力してください。'
        );

        return;

      }


      state.start =
        e.inTime.value;


      saveWork();


      message =
        inMessage();

    }else{

      if(
        !e.editIn.value ||
        !e.outTime.value
      ){

        alert(
          '出勤時間・退勤時間を確認してください。'
        );

        return;

      }


      state.start =
        e.editIn.value;


      saveWork();


      message =
        outMessage();

    }


    try{

      e.send.disabled =
        true;


      const result =
        await callServer(
          'sendAttendance',
          {

            message:
              message,

            selectedDriverKey:
              state.driver.driverKey

          }
        );


      if(
        !result ||
        !result.ok
      ){

        throw new Error(
          result &&
          result.error
            ? result.error
            : '送信に失敗しました'
        );

      }


      addHistory(
        (
          state.mode ===
          'in'
            ? '出勤'
            : '退勤'
        ) +
        'を送信しました'
      );


      saveRecent(
        state.driver
      );


      e.panel
        .classList
        .remove(
          'show'
        );


      state.mode =
        null;


    }catch(error){

      alert(
        error.message ||
        '送信に失敗しました'
      );

    }finally{

      e.send.disabled =
        false;

    }

  };


async function autoDetect(){

  setStatus(
    'detecting'
  );


  try{

    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    if(
      !liff.isLoggedIn()
    ){

      setStatus(
        'waiting'
      );

      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      setStatus(
        'waiting'
      );

      return;

    }


    const info =
      await callServer(
        'getDriverInfo'
      );


    if(
      state.manual &&
      state.driver
    ){

      return;

    }


    if(
      info &&
      info.found
    ){

      const driver =
        findDriver(
          info.driverKey
        );


      if(driver){

        selectDriver(
          driver,
          false
        );

        return;

      }

    }


    setStatus(
      'waiting'
    );


  }catch(error){

    console.error(
      error
    );


    setStatus(
      'waiting'
    );

  }

}


window.addEventListener(
  'load',
  () => {

    loadHistory();

    loadWork();

    renderDrivers();

    loadDrivers();


    setTimeout(
      autoDetect,
      100
    );

  }
);

</script>
