<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>運転手MENU</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    :root {
      --bg1: #e8f7ff;
      --bg2: #f7fcff;
      --card: rgba(255,255,255,.95);
      --line: #d8ebf7;
      --text: #17324d;
      --muted: #6b8296;
      --primary: #2d88d8;
      --primary2: #56baf0;
      --shadow: 0 14px 40px rgba(39,96,139,.10);
      --shadow-soft: 0 8px 22px rgba(39,96,139,.08);
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          180deg,
          var(--bg1),
          var(--bg2)
        );
    }


    body {
      min-height: 100vh;
    }


    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }


    /* =========================================================
       ヘッダー
       ========================================================= */

    .hero {
      position: relative;
      overflow: hidden;

      text-align: center;

      padding: 28px 16px 24px;

      border-radius: 30px;

      background:

        radial-gradient(
          circle at 18% 18%,
          rgba(255,255,255,.86) 0 6%,
          transparent 6.5%
        ),

        radial-gradient(
          circle at 82% 22%,
          rgba(255,255,255,.84) 0 6%,
          transparent 6.5%
        ),

        linear-gradient(
          180deg,
          #bfeaff 0%,
          #e9f9ff 100%
        );

      box-shadow: var(--shadow-soft);

      border:
        1px solid rgba(255,255,255,.7);

      isolation: isolate;
    }


    .hero::before {
      content: "";

      position: absolute;

      left: -10%;
      right: -10%;
      bottom: 0;

      height: 40%;

      background:

        radial-gradient(
          ellipse at 10% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),

        radial-gradient(
          ellipse at 28% 100%,
          rgba(121,208,114,.92) 0 18%,
          transparent 19%
        ),

        radial-gradient(
          ellipse at 73% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),

        radial-gradient(
          ellipse at 92% 100%,
          rgba(121,208,114,.92) 0 16%,
          transparent 17%
        );

      opacity: .75;

      pointer-events: none;
    }


    .hero-car {
      position: relative;
      z-index: 1;

      font-size: 56px;
      line-height: 1;

      margin-bottom: 8px;
    }


    .hero h1 {
      position: relative;
      z-index: 1;

      margin: 0;

      color: #1676c7;

      font-size: 38px;
      line-height: 1.12;
      font-weight: 900;
    }


    .hero p {
      position: relative;
      z-index: 1;

      margin: 10px 0 0;

      color: var(--muted);

      font-size: 17px;
      font-weight: 700;
    }


    /* =========================================================
       メイン
       ========================================================= */

    .main-card {
      margin-top: 14px;

      padding: 16px;

      background: var(--card);

      border-radius: 28px;

      box-shadow: var(--shadow);

      border:
        1px solid rgba(255,255,255,.75);
    }


    /* =========================================================
       現在選択中の人物
       ========================================================= */

    .driver-pill {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      width: fit-content;
      max-width: 100%;

      min-height: 44px;

      margin:
        0 auto 10px;

      padding:
        10px 18px;

      border-radius: 999px;

      background: #f3fbff;

      border:
        1px solid #dceff9;

      color: #1676c7;

      font-weight: 900;

      text-align: center;
    }


    .driver-pill small {
      color: var(--muted);
      font-weight: 700;
    }


    /* =========================================================
       人物選択
       ========================================================= */

    .manual-select-area {
      margin: 0 0 12px;

      padding: 10px 12px;

      border:
        1px solid #dceff9;

      border-radius: 16px;

      background: #f9fdff;
    }


    .manual-select-label {
      display: block;

      margin-bottom: 6px;

      color: #61798e;

      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }


    .driver-select {
      display: block;

      width: 100%;
      height: 46px;

      padding: 0 10px;

      border:
        1px solid #cfe5f5;

      border-radius: 12px;

      background: #ffffff;

      color: #17324d;

      font-family: inherit;

      font-size: 16px;
      font-weight: 800;

      outline: none;
    }


    .driver-select:focus {
      border-color: #63b4ea;

      box-shadow:
        0 0 0 3px rgba(99,180,234,.14);
    }


    /* =========================================================
       出勤・退勤
       ========================================================= */

    .attendance-buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      width: 100%;
    }


    .attendance-btn {
      position: relative;

      width: 100%;
      height: 170px;

      border: 0;

      border-radius: 24px;

      overflow: hidden;

      cursor: pointer;

      font-family: inherit;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 10px 22px rgba(39,96,139,.12);

      transition:
        transform .12s ease,
        opacity .12s ease;

      isolation: isolate;
    }


    .attendance-btn:active {
      transform:
        translateY(1px) scale(.99);
    }


    .attendance-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }


    .scene {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
    }


    .attendance-text {
      position: relative;

      z-index: 3;

      font-size: 38px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: .04em;
    }


    .btn-in {
      color: #0a4c7d;

      background:
        linear-gradient(
          180deg,
          #77d2ff 0%,
          #c8efff 58%,
          #8ed777 100%
        );

      border:
        1px solid #a8ddf7;
    }


    .btn-out {
      color: #ffffff;

      background:
        linear-gradient(
          180deg,
          #142c78 0%,
          #10215c 60%,
          #07163f 100%
        );

      border:
        1px solid #6077c5;
    }


    /* =========================================================
       案内
       ========================================================= */

    .guide {
      margin: 16px 4px 10px;

      color: #1676c7;

      font-size: 15px;
      line-height: 1.55;
      font-weight: 800;

      text-align: center;
    }


    /* =========================================================
       内容修正
       ========================================================= */

    .edit-panel {
      display: none;

      margin-top: 14px;

      padding: 13px;

      background: #ffffff;

      border-radius: 22px;

      box-shadow: var(--shadow-soft);

      border:
        1px solid rgba(216,235,247,.9);
    }


    .edit-panel.show {
      display: block;
    }


    .edit-title {
      margin: 0 0 10px;

      color: #1676c7;

      font-size: 26px;
      font-weight: 900;

      text-align: center;
    }


    .edit-title::before {
      content: "✎ ";

      color: #68aee6;
    }


    .two-column {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;

      margin-bottom: 7px;
    }


    .field {
      min-width: 0;
    }


    .field label {
      display: block;

      margin: 0 0 3px;

      color: #61798e;

      font-size: 12px;
      line-height: 1.1;
      font-weight: 800;
    }


    /* =========================================================
       スマホの日時入力の余白対策
       ========================================================= */

    .field input {

      display: block;

      width: 100%;

      min-width: 0;

      height: 40px;
      min-height: 40px;

      padding: 0;
      margin: 0;

      border:
        1px solid #cfe5f5;

      border-radius: 13px;

      outline: none;

      background: #ffffff;

      color: #0d2340;

      font-family: inherit;

      font-size: 20px;

      font-weight: 900;

      line-height: 1;

      text-align: center;

      vertical-align: middle;

      appearance: none;
      -webkit-appearance: none;
    }


    .field input::-webkit-date-and-time-value {

      margin: 0;

      padding: 0;

      height: auto;

      line-height: 1;

      text-align: center;
    }


    .field input::-webkit-inner-spin-button {
      margin: 0;
    }


    .field input:focus {

      border-color:
        #63b4ea;

      box-shadow:
        0 0 0 3px
        rgba(99,180,234,.14);
    }


    #nextDate {

      font-size: 15px;

      letter-spacing: -.7px;

      padding: 0;
    }


    .single-field {
      margin-bottom: 8px;
    }


    /* =========================================================
       プレビュー
       ========================================================= */

    .preview {
      display: none;

      margin-top: 9px;

      padding: 13px 15px;

      border:
        1px solid var(--line);

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #f9fdff 0%,
          #eef8ff 100%
        );

      color: #14446e;

      font-size: 14px;
      line-height: 1.7;
      font-weight: 600;

      white-space: pre-line;
    }


    .preview.show {
      display: block;
    }


    /* =========================================================
       送信
       ========================================================= */

    .send-btn {

      display: block;

      width: 100%;

      margin-top: 7px;

      padding: 14px 12px;

      border: 0;

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          #56baf0 0%,
          #2d88d8 100%
        );

      color: #ffffff;

      font-family: inherit;

      font-size: 20px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 10px 20px rgba(45,136,216,.18);
    }


    .send-btn:disabled {

      opacity: .55;

      cursor:
        not-allowed;
    }


    /* =========================================================
       今日の履歴
       ========================================================= */

    .history {

      margin-top:
        18px;

      padding-top:
        14px;

      border-top:
        1px solid #e2eef6;
    }


    .history h3 {

      margin:
        0 0 10px;

      color:
        #1676c7;

      font-size:
        20px;

      font-weight:
        900;

      text-align:
        center;
    }


    .history h3::before {

      content:
        "🕘 ";
    }


    .history-list {

      list-style:
        none;

      margin:
        0;

      padding:
        0;
    }


    .history-list li {

      padding:
        9px 0;

      border-bottom:
        1px solid #edf4fa;

      color:
        #496173;

      font-size:
        14px;

      line-height:
        1.45;
    }


    .history-list .empty {

      color:
        #7a90a3;

      text-align:
        center;
    }


    .footer {

      padding:
        14px 10px 4px;

      color:
        #8aa0b2;

      font-size:
        14px;

      text-align:
        center;
    }


    .hidden {
      display:
        none !important;
    }


    /* =========================================================
       スマホ
       ========================================================= */

    @media (max-width: 480px) {

      .page {

        padding:
          12px 10px 20px;
      }


      .hero {

        padding:
          22px 12px 18px;

        border-radius:
          24px;
      }


      .hero-car {

        font-size:
          48px;
      }


      .hero h1 {

        font-size:
          32px;
      }


      .hero p {

        font-size:
          14px;
      }


      .main-card {

        margin-top:
          10px;

        padding:
          12px;

        border-radius:
          22px;
      }


      .driver-pill {

        justify-content:
          center;

        width:
          fit-content;

        max-width:
          100%;

        margin:
          0 auto 10px;

        padding:
          9px 14px;

        font-size:
          15px;

        text-align:
          center;
      }


      .driver-select {

        height:
          44px;

        font-size:
          15px;
      }


      .attendance-buttons {

        gap:
          8px;
      }


      .attendance-btn {

        height:
          126px;

        border-radius:
          18px;
      }


      .attendance-text {

        font-size:
          30px;
      }


      .guide {

        margin-top:
          14px;

        margin-bottom:
          8px;

        font-size:
          13px;
      }


      .edit-panel {

        margin-top:
          12px;

        padding:
          13px 12px;

        border-radius:
          20px;
      }


      .edit-title {

        margin-bottom:
          9px;

        font-size:
          25px;

        text-align:
          center;
      }


      .field input {

        height:
          40px;

        min-height:
          40px;

        padding:
          0;

        font-size:
          20px;
      }


      .field input::-webkit-date-and-time-value {

        margin:
          0;

        padding:
          0;

        height:
          auto;

        line-height:
          1;
      }


      .preview {

        margin-top:
          9px;

        padding:
          13px 15px;

        font-size:
          14px;

        line-height:
          1.7;
      }


      .send-btn {

        margin-top:
          7px;

        padding:
          14px 12px;

        font-size:
          20px;
      }


      .history h3 {

        width:
          100%;

        text-align:
          center;

        font-size:
          20px;
      }

    }

  </style>

</head>


<body>


  <div class="page">


    <!-- =======================================================
         ヘッダー
         ======================================================= -->

    <header class="hero">

      <div class="hero-car">
        🚙
      </div>

      <h1>
        運転手MENU
      </h1>

      <p>
        本人を自動判定して開きます
      </p>

    </header>


    <!-- =======================================================
         メイン
         ======================================================= -->

    <main class="main-card">


      <!-- =====================================================
           現在選択中の人物
           ===================================================== -->

      <div class="driver-pill">

        <span id="driverIcon">
          🚙
        </span>

        <span id="driverName">
          人物を選択してください
        </span>

        <small id="driverMeta">
        </small>

      </div>


      <!-- =====================================================
           人物選択
           ===================================================== -->

      <div
        id="manualSelectArea"
        class="manual-select-area"
      >

        <label
          class="manual-select-label"
          for="driverSelect"
        >
          人物選択
        </label>


        <select
          id="driverSelect"
          class="driver-select"
        >

          <option value="">
            読み込み中...
          </option>

        </select>

      </div>


      <!-- =====================================================
           出勤・退勤
           ===================================================== -->

      <div class="attendance-buttons">


        <!-- 出勤 -->

        <button
          id="btnIn"
          class="attendance-btn btn-in"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >

            <defs>

              <linearGradient
                id="daySky"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#41b2ff"
                />

                <stop
                  offset="60%"
                  stop-color="#9ce0ff"
                />

                <stop
                  offset="100%"
                  stop-color="#dff6ff"
                />

              </linearGradient>


              <linearGradient
                id="hillGreen"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#73d151"
                />

                <stop
                  offset="100%"
                  stop-color="#388e3c"
                />

              </linearGradient>

            </defs>


            <rect
              width="320"
              height="220"
              fill="url(#daySky)"
            />


            <circle
              cx="65"
              cy="55"
              r="33"
              fill="#ffe082"
            />


            <circle
              cx="65"
              cy="55"
              r="48"
              fill="#ffb74d"
              opacity=".18"
            />


            <g
              fill="#ffffff"
              opacity=".94"
            >

              <ellipse
                cx="190"
                cy="70"
                rx="38"
                ry="16"
              />

              <ellipse
                cx="220"
                cy="80"
                rx="48"
                ry="18"
              />

            </g>


            <path
              d="
                M-10,160
                C58,120 100,152 160,132
                C210,116 240,150 330,124
                L330,220
                L-10,220
                Z
              "
              fill="url(#hillGreen)"
            />


            <path
              d="
                M-10,182
                C76,160 112,190 170,174
                C224,160 252,184 330,164
                L330,220
                L-10,220
                Z
              "
              fill="#2e7d32"
              opacity=".75"
            />


            <rect
              x="-10"
              y="190"
              width="340"
              height="30"
              fill="#eaf6ff"
              opacity=".95"
            />


            <rect
              x="-10"
              y="192"
              width="340"
              height="4"
              rx="2"
              fill="#ffffff"
            />


            <rect
              x="-10"
              y="200"
              width="340"
              height="4"
              rx="2"
              fill="#ffffff"
            />

          </svg>


          <span class="attendance-text">
            出勤
          </span>

        </button>


        <!-- 退勤 -->

        <button
          id="btnOut"
          class="attendance-btn btn-out"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >

            <defs>

              <linearGradient
                id="nightSky"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#0b1742"
                />

                <stop
                  offset="60%"
                  stop-color="#0f2b6b"
                />

                <stop
                  offset="100%"
                  stop-color="#183b8a"
                />

              </linearGradient>


              <linearGradient
                id="buildingGrad"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#091333"
                />

                <stop
                  offset="100%"
                  stop-color="#050a1c"
                />

              </linearGradient>

            </defs>


            <rect
              width="320"
              height="220"
              fill="url(#nightSky)"
            />


            <g fill="#fff59d">

              <circle
                cx="30"
                cy="30"
                r="2"
              />

              <circle
                cx="65"
                cy="65"
                r="1.5"
              />

              <circle
                cx="105"
                cy="25"
                r="2.5"
              />

              <circle
                cx="170"
                cy="35"
                r="2"
              />

              <circle
                cx="235"
                cy="60"
                r="2.5"
              />

              <circle
                cx="275"
                cy="30"
                r="2"
              />

            </g>


            <circle
              cx="90"
              cy="72"
              r="32"
              fill="#ffee58"
            />


            <circle
              cx="106"
              cy="58"
              r="32"
              fill="#0b1742"
            />


            <g
              opacity=".4"
              fill="#1e3a78"
            >

              <ellipse
                cx="180"
                cy="80"
                rx="44"
                ry="16"
              />

              <ellipse
                cx="215"
                cy="90"
                rx="52"
                ry="18"
              />

            </g>


            <g fill="url(#buildingGrad)">

              <rect
                x="205"
                y="108"
                width="28"
                height="85"
              />

              <rect
                x="245"
                y="126"
                width="30"
                height="67"
              />

              <rect
                x="276"
                y="92"
                width="34"
                height="101"
              />

            </g>


            <g
              fill="#ffeb3b"
              opacity=".85"
            >

              <rect
                x="218"
                y="120"
                width="5"
                height="6"
              />

              <rect
                x="228"
                y="135"
                width="5"
                height="6"
              />

              <rect
                x="253"
                y="138"
                width="5"
                height="6"
              />

              <rect
                x="264"
                y="150"
                width="5"
                height="6"
              />

              <rect
                x="284"
                y="105"
                width="5"
                height="6"
              />

              <rect
                x="296"
                y="120"
                width="5"
                height="6"
              />

            </g>


            <rect
              x="-10"
              y="190"
              width="340"
              height="30"
              fill="#0d1b3e"
            />


            <rect
              x="-10"
              y="192"
              width="340"
              height="4"
              fill="#6482ad"
            />


            <rect
              x="-10"
              y="200"
              width="340"
              height="4"
              fill="#6482ad"
            />

          </svg>


          <span class="attendance-text">
            退勤
          </span>

        </button>

      </div>


      <!-- =====================================================
           案内
           ===================================================== -->

      <div class="guide">

        出勤時間・退勤時間・次回出勤日時は必要な場合 修正してください。

      </div>


      <!-- =====================================================
           内容修正
           ===================================================== -->

      <section
        id="editPanel"
        class="edit-panel"
      >

        <h2 class="edit-title">
          内容修正
        </h2>


        <!-- 出勤 -->

        <div id="inFields">

          <div class="field single-field">

            <label
              for="clockInTime"
            >
              出勤時間
            </label>


            <input
              id="clockInTime"
              type="time"
            />

    function getRecentDrivers() {

        const list =
          JSON.parse(
            raw

        if (
          !Array.isArray(list)

          return [];
        }


        return list
          .filter(
            function(item) {

              return (

                item &&
                item.driverKey &&
                item.displayName

              );
            }
          )
          .slice(
            0,
            MAX_RECENT_DRIVERS
          );


      } catch (
        error

        !driver.displayName

          displayName:

        list =

            MAX_RECENT_DRIVERS

          RECENT_DRIVERS_KEY,

    function pad2(
      value
    ) {

        value

    function toTimeInput(

    ) {

        )

    function toDateInput(

        '-' +

        pad2(

        ) +

        '-' +

        pad2(
          date.getDate()
        )

    function weekdayJa(
      date
    ) {

      return [

        '日',
        '月',
        '火',
        '水',
        '木',
        '金',
        '土'

      ][
        date.getDay()
      ];
    }


    function dateLabel(
      date
    ) {

      return (

        (date.getMonth() + 1) +

        '/' +

        date.getDate() +

        '(' +

        weekdayJa(
          date
        ) +

        ')'

      );
    }


    function dateSlash(
      date
    ) {

      return (

        date.getFullYear() +

        '/' +

        (date.getMonth() + 1) +

        '/' +

        date.getDate()

      );
    }

    // ==========================================================
    // 次回出勤日の表現
    // ==========================================================

    function getNextAttendanceLabel(
      today,
      nextDate
    ) {

      const todayDate =
        new Date(

          today.getFullYear(),
          today.getMonth(),
          today.getDate()

        );


      const targetDate =
        new Date(

          nextDate.getFullYear(),
          nextDate.getMonth(),
          nextDate.getDate()

        );


      const diffMs =
        targetDate.getTime() -
        todayDate.getTime();


      const diffDays =
        Math.round(

          diffMs /

          (
            1000 *
            60 *
            60 *
            24
          )

        );


      if (
        diffDays === 1
      ) {

        return '明日';
      }


      if (
        diffDays === 2
      ) {

        return '明後日';
      }


      const todayDay =
        todayDate.getDay();


      const targetDay =
        targetDate.getDay();


      const todayWeekday =
        todayDay === 0
          ? 7
          : todayDay;


      const targetWeekday =
        targetDay === 0
          ? 7
          : targetDay;


      const thisWeekMonday =
        new Date(
          todayDate
        );


      thisWeekMonday.setDate(

        todayDate.getDate() -
        (
          todayWeekday - 1
        )

      );


      const nextWeekMonday =
        new Date(
          thisWeekMonday
        );


      nextWeekMonday.setDate(

        thisWeekMonday.getDate() +
        7

      );


      const targetWeekMonday =
        new Date(
          targetDate
        );


      targetWeekMonday.setDate(

        targetDate.getDate() -
        (
          targetWeekday - 1
        )

      );


      if (
        targetWeekMonday.getTime() ===
        nextWeekMonday.getTime()
      ) {

        return '来週';
      }


      const nextMonth =
        new Date(

          todayDate.getFullYear(),
          todayDate.getMonth() + 1,
          1

        );


      const targetMonth =
        new Date(

          targetDate.getFullYear(),
          targetDate.getMonth(),
          1

        );


      if (
        targetMonth.getTime() ===
        nextMonth.getTime()
      ) {

        return '来月';
      }


      return '次回';
    }


    // ==========================================================
    // Apps Script API
    // ==========================================================

    function callServer(
      operation,
      data = {}
    ) {

      return new Promise(

        function(
          resolve,
          reject
        ) {


          const requestId =
            'req_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .slice(2);


          const formData =
            new URLSearchParams();


          formData.append(
            'action',
            'api'
          );


          formData.append(
            'operation',
            operation
          );


          formData.append(
            'requestId',
            requestId
          );


          formData.append(
            'idToken',
            state.idToken ||
            ''
          );


          if (
            data.message
          ) {

            formData.append(
              'message',
              data.message
            );
          }


          if (
            data.selectedDriverKey
          ) {

            formData.append(
              'selectedDriverKey',
              data.selectedDriverKey
            );
          }


          fetch(

            API_URL,

            {

              method:
                'POST',

              mode:
                'no-cors',

              headers: {

                'Content-Type':
                  'application/x-www-form-urlencoded;charset=UTF-8'

              },

              body:
                formData.toString()

            }

          )

          .catch(

            function(error) {

              console.error(
                'POST error:',
                error
              );

            }

          );


          pollApiResult_(
            requestId,
            resolve,
            reject,
            0
          );

        }

      );
    }


    // ==========================================================
    // API結果取得
    // ==========================================================

    function pollApiResult_(
      requestId,
      resolve,
      reject,
      attempt
    ) {

      const MAX_ATTEMPTS =
        40;


      const WAIT_MS =
        500;


      if (
        attempt >= MAX_ATTEMPTS
      ) {

        reject(

          new Error(
            'Apps Script APIの応答が20秒以内に返りませんでした'
          )

        );


        return;
      }


      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        attempt;


      let script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      function cleanup() {

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );
        }


        try {

          delete window[
            callbackName
          ];

        } catch (
          error
        ) {

          window[
            callbackName
          ] = undefined;
        }
      }


      window[
        callbackName
      ] = function(
        response
      ) {


        if (
          finished
        ) {

          return;
        }


        finished =
          true;


        cleanup();


        if (
          response &&
          (
            response.status ===
              'pending' ||

            response.status ===
              'processing'
          )
        ) {

          setTimeout(

            function() {

              pollApiResult_(
                requestId,
                resolve,
                reject,
                attempt + 1
              );

            },

            WAIT_MS

          );


          return;
        }


        if (
          !response ||
          response.ok !== true
        ) {

          reject(

            new Error(

              response &&
              response.error

                ? response.error

                : 'Apps Script APIエラー'

            )

          );


          return;
        }


        resolve(
          response.data
        );

      };


      script.onerror =
        function() {

          if (
            finished
          ) {

            return;
          }


          finished =
            true;


          cleanup();


          setTimeout(

            function() {

              pollApiResult_(
                requestId,
                resolve,
                reject,
                attempt + 1
              );

            },

            WAIT_MS

          );

        };


      script.src =

        API_URL +

        '?action=pollApi' +

        '&requestId=' +
        encodeURIComponent(
          requestId
        ) +

        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +

        '&_=' +
        Date.now();


      document.body.appendChild(
        script
      );
    }

    ) {

      if (!driver) {

      state.driver =

      state.manualSelectedDriverKey =
        manual

      els.driverSelect.value =

       */

      saveRecentDriver(

    function applyDriverByKey(
      driverKey,
      manual
    ) {

      const driver =
        state.drivers.find(

          function(item) {

            return (
              item.driverKey ===
              driverKey
            );

          }

        );


      if (!driver) {

        /*
         * サーバー一覧がまだ届いていない場合、
         * 過去履歴の人物を仮選択する。
         *
         * 実送信時にdriver_masterを再確認する。
         */

        const recent =
          getRecentDrivers();


        const recentDriver =
          recent.find(

            function(item) {

              return (
                item.driverKey ===
                driverKey
              );

            }

          );


        if (
          recentDriver
        ) {

          state.driver = {

            driverKey:
              recentDriver.driverKey,

            displayName:
              recentDriver.displayName

          };


          state.manualSelectedDriverKey =
            manual
              ? recentDriver.driverKey
              : '';


          state.userSelectedManually =
            manual;


          els.driverIcon.textContent =
            '🚙';


          els.driverName.textContent =
            recentDriver.displayName +
            ' さん';


          els.driverMeta.textContent =
            recentDriver.driverKey
              ? ' / ' +
                recentDriver.driverKey
              : '';


          els.btnIn.disabled =
            false;


          els.btnOut.disabled =
            false;


          els.sendBtn.disabled =
            false;


          saveRecentDriver(
            state.driver
          );
        }


        return;
      }


      applyDriver(
        driver,
        manual
      );
    }

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(

        '&gt;'

        '&quot;'
      )

      .replace(
        /'/g,
        '&#39;'
      );

        mode === 'in'
      ) {

        els.inFields.classList.remove(
          'hidden'
        );


        els.outFields.classList.add(
          'hidden'
        );


        els.sendBtn.textContent =
          '出勤送信';


        const now =
          new Date();


        els.clockInTime.value =
          toTimeInput(
            now
          );


        state.lastStartTime =
          els.clockInTime.value;


      } else {

        els.inFields.classList.add(
          'hidden'
        );


        els.outFields.classList.remove(
          'hidden'
        );


        els.sendBtn.textContent =
          '退勤送信';


        const now =
          new Date();


        els.editClockInTime.value =

          state.lastStartTime ||

          toTimeInput(
            now
          );


        els.clockOutTime.value =
          toTimeInput(
            now
          );


        els.nextDate.value =
          toDateInput(
            tomorrowDate()
          );


        els.nextTime.value =
          '08:00';
      }


      refreshPreview();
    }


    // ==========================================================
    // LIFF本人確認
    //
    // ポイント:
    // 「待ってから人物選択」ではなく
    // 「人物選択を先に出して、自動判別は裏で行う」
    // ==========================================================

    async function resolveDriver() {

      /*
       * まず過去履歴を即表示
       * ネットワークを一切待たない
       */

      renderRecentDriversImmediately();


      /*
       * 過去に使った人物があれば
       * 最初の人物を画面上だけ仮表示
       *
       * ただし、送信を押す前に
       * driver_masterで再確認される。
       */

      const recent =
        getRecentDrivers();


      if (
        recent.length > 0
      ) {

        applyDriverByKey(
          recent[0].driverKey,
          true
        );
      }


      /*
       * ここから自動判別を裏で実行
       */

      try {

        if (
          typeof liff ===
          'undefined'
        ) {

          return;
        }


        await liff.init({

          liffId:
            LIFF_ID,

          withLoginOnExternalBrowser:
            true

        });


        /*
         * ログインしていない場合
         * ログイン処理
         */

        if (
          !liff.isLoggedIn()
        ) {

          liff.login({

            redirectUri:
              window.location.href

          });


          return;
        }


        /*
         * IDトークン取得
         */

        const idToken =
          liff.getIDToken();


        if (!idToken) {

          return;
        }


        state.idToken =
          idToken;


        /*
         * サーバーから人物一覧を取得
         *
         * 手動選択を既に使える状態でも、
         * 最新のdriver_masterと照合するため取得する。
         */

        loadDriverList()

          .catch(

            function(error) {

              console.warn(
                '人物一覧の取得に失敗:',
                error
              );

            }

          );


        /*
         * 自動本人判別
         */

        const info =
          await callServer(
            'getDriverInfo'
          );


        /*
         * 手動選択中なら
         * 自動判別結果で上書きしない
         */

        if (
          state.userSelectedManually
        ) {

          return;
        }


        if (
          info &&
          info.found
        ) {

          state.autoDetectedDriverKey =
            info.driverKey;


          applyDriverByKey(

            info.driverKey,

            false

          );
        }


      } catch (
        error
      ) {

        /*
         * 自動判別に失敗しても
         * 手動選択はそのまま使える。
         */

        console.warn(
          '自動本人判別に失敗:',
          error
        );

      }

    }


    // ==========================================================
    // 手動人物選択
    // ==========================================================

    els.driverSelect.addEventListener(

      'change',

      function() {

        const driverKey =
          els.driverSelect.value;


        if (!driverKey) {

          return;
        }


        state.userSelectedManually =
          true;


        applyDriverByKey(

          driverKey,

          true

        );

      }

    );


    // ==========================================================
    // 出勤
    // ==========================================================

    els.btnIn.addEventListener(

      'click',

      function() {

        if (
          !state.driver
        ) {

          return;
        }


        setMode(
          'in'
        );

      }

    );


    // ==========================================================
    // 退勤
    // ==========================================================

    els.btnOut.addEventListener(

      'click',

      function() {

        if (
          !state.driver
        ) {

          return;
        }


        setMode(
          'out'
        );

      }

    );


    // ==========================================================
    // 入力変更
    // ==========================================================

    els.clockInTime.addEventListener(

      'input',

      function() {

        state.lastStartTime =
          els.clockInTime.value;


        refreshPreview();

      }

    );


    els.editClockInTime.addEventListener(
      'input',
      refreshPreview
    );


    els.clockOutTime.addEventListener(
      'input',
      refreshPreview
    );


    els.nextDate.addEventListener(
      'change',
      refreshPreview
    );


    els.nextTime.addEventListener(
      'input',
      refreshPreview
    );


    // ==========================================================
    // 送信
    // ==========================================================

    els.sendBtn.addEventListener(

      'click',

      async function() {


        if (
          !state.driver
        ) {

          return;
        }


        /*
         * ID Tokenがまだ無くても、
         * 自動判別とは別に手動選択ができるようにする。
         *
         * 送信API側ではselectedDriverKeyを優先する。
         */

        const message =
          refreshPreview();


        try {

          els.sendBtn.disabled =
            true;


          const result =
            await callServer(

              'sendAttendance',

              {

                message:
                  message,

                selectedDriverKey:
                  state.driver.driverKey

              }

            );


          if (
            !result ||
            !result.ok
          ) {

            throw new Error(
              '送信結果を確認できませんでした'
            );
          }


          const title =

            state.mode === 'in'

              ? '出勤'

              : '退勤';


          addHistory(

            title +
            'を送信しました'

          );


          /*
           * 送信成功した人物を
           * 次回すぐ選べるよう保存
           */

          saveRecentDriver(
            state.driver
          );


          /*
           * 最新の人物選択順を反映
           */

          try {

            await loadDriverList();

          } catch (
            refreshError
          ) {

            console.warn(
              refreshError
            );
          }


          els.editPanel.classList.remove(
            'show'
          );


          state.mode =
            null;


        } catch (
          error
        ) {

          console.error(
            error
          );


          /*
           * 手動選択した人物が
           * 最新driver_masterに存在しない場合など
           */

          alert(

            error &&
            error.message

              ? error.message

              : '送信に失敗しました'

          );


        } finally {

          els.sendBtn.disabled =
            false;
        }

      }

    );


    // ==========================================================
    // 起動
    // ==========================================================

    window.addEventListener(

      'load',

      function() {

        /*
         * まず画面を表示
         * その後、自動判別を裏で開始
         */

        resolveDriver();

      }

    );

  </script>

</body>
</html>
