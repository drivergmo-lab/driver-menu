<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

:root{

  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#ffffff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);

}


*{

  box-sizing:border-box;

}


html,
body{

  margin:0;
  padding:0;

}


body{

  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      var(--bg),
      var(--bg2)
    );

}


button,
input,
select,
textarea{

  font:inherit;

}


button{

  cursor:pointer;

}


.page{

  width:min(760px,100%);

  margin:0 auto;

  padding:
    12px
    10px
    24px;

}


/* ============================================================
   ヘッダー
============================================================ */

.hero{

  position:relative;

  overflow:hidden;

  padding:
    21px
    10px
    23px;

  border-radius:26px;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );

  box-shadow:
    var(--shadow);

}


.hero h1{

  margin:0;

  color:
    var(--blue);

  font-size:
    30px;

  line-height:
    1.15;

  font-weight:
    900;

  white-space:
    nowrap;

}


/* ============================================================
   メインカード
============================================================ */

.card{

  margin-top:
    12px;

  padding:
    13px;

  border-radius:
    24px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  box-shadow:
    var(--shadow);

}


/* ============================================================
   担当表・代休取得ボタン
============================================================ */

.management-menu{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    8px;

  margin-bottom:
    12px;

}


.management-btn{

  min-height:
    54px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  font-size:
    16px;

  font-weight:
    900;

  background:
    #f7fcff;

  color:
    var(--blue);

}


.management-btn:active{

  transform:
    scale(.99);

}


.assignment-btn{

  background:
    #eef8ff;

}


.comp-btn{

  background:
    #f4fbf5;

  color:
    #18824e;

}


/* ============================================================
   人物判別
============================================================ */

.top-row{

  display:grid;

  grid-template-columns:
    158px
    minmax(0,1fr);

  gap:
    8px;

  align-items:
    stretch;

}


.status{

  min-height:
    78px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    7px;

  padding:
    8px;

  border-radius:
    20px;

  background:
    #f3fbff;

  border:
    1px solid
    var(--line);

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

  text-align:
    center;

}


.status.done{

  background:
    #eefbf3;

  border-color:
    #ccefd8;

  color:
    var(--green);

}


.select-box{

  padding:
    9px 11px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #f9fdff;

}


.select-box label,
.field-title{

  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;

}


/* ============================================================
   入力
============================================================ */

select,
input[type="date"],
input[type="time"],
textarea{

  width:
    100%;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  outline:
    none;

}


select,
input[type="date"],
input[type="time"]{

  height:
    44px;

  padding:
    0 10px;

  font-size:
    16px;

  font-weight:
    800;

}


textarea{

  padding:
    10px 11px;

  font-size:
    14px;

  line-height:
    1.5;

  resize:
    vertical;

}


select:focus,
input:focus,
textarea:focus{

  border-color:
    #63b4ea;

  box-shadow:
    0 0 0 3px
    rgba(
      99,
      180,
      234,
      .12
    );

}


/* ============================================================
   出勤・退勤
============================================================ */

.mode-box{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    10px;

}


.mode-btn{

  min-height:
    90px;

  border:
    0;

  border-radius:
    20px;

  font-size:
    28px;

  font-weight:
    900;

  transition:
    .12s;

}


.mode-btn:active{

  transform:
    scale(.99);

}


.mode-btn.in{

  background:
    linear-gradient(
      #73cdf8,
      #7dd77a
    );

  color:
    #084e78;

}


.mode-btn.out{

  background:
    linear-gradient(
      #1b357c,
      #0e1e4d
    );

  color:
    #ffffff;

}


.mode-btn.off{

  opacity:
    .38;

  filter:
    grayscale(.18);

}


.guide{

  margin:
    9px 4px;

  color:
    var(--blue);

  font-size:
    13px;

  font-weight:
    900;

  text-align:
    center;

}


/* ============================================================
   写真
============================================================ */

.upload-btn{

  width:
    100%;

  min-height:
    54px;

  border:
    1px solid
    #cfe8f7;

  border-radius:
    17px;

  background:
    #eaf7ff;

  color:
    var(--blue);

  font-size:
    17px;

  font-weight:
    900;

}


.upload-btn:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}


.notice{

  display:none;

  margin-top:
    9px;

  padding:
    9px 11px;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    #5c7588;

  font-size:
    12px;

  line-height:
    1.45;

  text-align:
    center;

}


.notice.show{

  display:block;

}


.hidden{

  display:none !important;

}


.preview{

  display:none;

  margin-top:
    11px;

}


.preview.show{

  display:block;

}


.preview-box{

  padding:
    12px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #ffffff;

}


.photo-preview{

  display:block;

  width:
    100%;

  max-height:
    360px;

  object-fit:
    contain;

  border-radius:
    14px;

  background:
    #eef4f8;

}


/* ============================================================
   時刻入力
============================================================ */

.fields{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    9px;

}


.field{

  min-width:
    0;

  padding:
    9px;

  border:
    1px solid
    var(--line);

  border-radius:
    14px;

  background:
    var(--soft);

}


.field-title{

  margin-bottom:
    4px;

}


#nextDate{

  font-size:
    15px;

  letter-spacing:
    -.4px;

}


.summary{

  grid-column:
    1 / -1;

  padding:
    9px 10px;

  border:
    1px solid
    var(--line);

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    #446276;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;

}


.summary strong{

  color:
    var(--blue);

}


/* ============================================================
   報告文章
============================================================ */

.message-section{

  margin-top:
    12px;

}


.message-title{

  margin:
    0 0 7px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

}


.message-box{

  padding:
    11px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #f7fcff;

}


.message-preview{

  white-space:
    pre-line;

  font-size:
    14px;

  line-height:
    1.55;

  color:
    #15446e;

  font-weight:
    700;

}


.memo-input{

  display:block;

  width:
    100%;

  min-height:
    92px;

  margin-top:
    10px;

  padding:
    10px 11px;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    14px;

  line-height:
    1.55;

  resize:
    vertical;

  outline:
    none;

}


.memo-input::placeholder{

  color:
    #93a8b7;

}


.send-btn{

  width:
    100%;

  min-height:
    54px;

  margin-top:
    9px;

  border:
    0;

  border-radius:
    17px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    18px;

  font-weight:
    900;

}


.send-btn:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}


/* ============================================================
   履歴
============================================================ */

.history{

  margin-top:
    16px;

  padding-top:
    13px;

  border-top:
    1px solid
    #e2eef6;

}


.history-title{

  margin:
    0 0 8px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

  text-align:
    center;

}


.history-list{

  list-style:
    none;

  padding:
    0;

  margin:
    0;

}


.history-list li{

  display:grid;

  grid-template-columns:
    84px
    42px
    minmax(78px,1fr)
    26px;

  gap:
    4px;

  align-items:
    center;

  padding:
    9px 1px;

  border-bottom:
    1px solid
    #edf4fa;

  color:
    #496173;

  font-size:
    12px;

  white-space:
    nowrap;

}


.history-date{

  font-weight:
    800;

}


.history-type{

  color:
    var(--blue);

  font-weight:
    900;

}


.history-time{

  color:
    var(--text);

  font-weight:
    900;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

}


.history-ok{

  color:
    var(--green);

  font-size:
    16px;

  font-weight:
    900;

  text-align:
    right;

}


.empty{

  display:block !important;

  text-align:
    center;

  color:
    #7a90a3;

}


/* ============================================================
   担当表・代休取得 表示エリア
============================================================ */

.management-panel{

  margin-top:
    10px;

  padding:
    8px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #ffffff;

}


.management-header{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:
    8px;

  margin-bottom:
    8px;

}


.management-title{

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

}


.management-close{

  border:
    0;

  border-radius:
    10px;

  padding:
    7px 11px;

  background:
    #edf4f8;

  color:
    #526a7d;

  font-size:
    12px;

  font-weight:
    900;

}


.management-loading{

  padding:
    18px;

  color:
    #688094;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;

}


.management-table-wrap{

  width:
    100%;

  max-width:
    100%;

  overflow:
    hidden;

}


.management-table{

  width:
    100%;

  max-width:
    100%;

  table-layout:
    fixed;

  border-collapse:
    collapse;

  font-size:
    11px;

}


.management-table th,
.management-table td{

  padding:
    2px;

  border:
    1px solid
    #dbeaf3;

  vertical-align:
    middle;

  overflow:
    hidden;

}


.management-table th{

  background:
    #eef8ff;

  color:
    #42647b;

  font-weight:
    900;

  white-space:
    normal;

  word-break:
    keep-all;

  line-height:
    1.15;

}


.management-table td{

  background:
    #ffffff;

}


.management-table input,
.management-table select{

  width:
    100%;

  min-width:
    0;

  height:
    34px;

  margin:
    0;

  padding:
    2px 4px;

  border:
    1px solid
    #d4e5ef;

  border-radius:
    7px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    11px;

  font-weight:
    700;

  outline:
    none;

}


.management-table select{

  padding-right:
    1px;

}


/* 担当表 */

.assignment-panel
.management-table
th:first-child,
.assignment-panel
.management-table
td:first-child{

  width:
    18%;

}


.assignment-panel
.management-table
th:not(:first-child),
.assignment-panel
.management-table
td:not(:first-child){

  width:
    20.5%;

}


/* 代休取得 */

.comp-panel
.management-table
th:nth-child(1),
.comp-panel
.management-table
td:nth-child(1){

  width:
    19%;

}


.comp-panel
.management-table
th:nth-child(2),
.comp-panel
.management-table
td:nth-child(2){

  width:
    19%;

}


.comp-panel
.management-table
th:nth-child(3),
.comp-panel
.management-table
td:nth-child(3){

  width:
    23%;

}


.comp-panel
.management-table
th:nth-child(4),
.comp-panel
.management-table
td:nth-child(4){

  width:
    39%;

}


.management-section-title{

  margin:
    8px 0 5px;

  color:
    var(--blue);

  font-size:
    15px;

  font-weight:
    900;

}


.comp-panel{

  display:grid;

  gap:
    7px;

}


.management-add{

  width:
    100%;

  min-height:
    44px;

  margin:
    2px 0 4px;

  border:
    1px dashed
    #8fc9ea;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    var(--blue);

  font-size:
    14px;

  font-weight:
    900;

}


.management-add:active{

  transform:
    scale(.99);

}


.management-save{

  width:
    100%;

  min-height:
    48px;

  margin-top:
    10px;

  border:
    0;

  border-radius:
    15px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    16px;

  font-weight:
    900;

}


.management-save:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}


.management-panel.hidden,
.comp-panel.hidden,
.management-table-wrap.hidden,
.management-save.hidden{

  display:none !important;

}


/* ============================================================
   フッター
============================================================ */

.footer{

  padding:
    14px 10px 4px;

  color:
    #8aa0b2;

  font-size:
    13px;

  text-align:
    center;

}


/* ============================================================
   スマホ
============================================================ */

@media(
  max-width:480px
){

  .page{

    padding:
      10px 9px 20px;

  }


  .hero{

    padding:
      20px 10px 21px;

  }


  .hero h1{

    font-size:
      30px;

  }


  .card{

    padding:
      11px;

  }


  .top-row{

    grid-template-columns:
      145px
      minmax(0,1fr);

  }


  .status{

    min-height:
      76px;

    font-size:
      17px;

  }


  .mode-btn{

    min-height:
      82px;

    font-size:
      25px;

  }


  .history-list li{

    grid-template-columns:
      auto
      auto
      minmax(70px,1fr)
      24px;

  }


  .management-panel{

    padding:
      7px;

  }


  .management-table{

    font-size:
      10px;

  }


  .management-table th,
  .management-table td{

    padding:
      1px;

  }


  .management-table input,
  .management-table select{

    height:
      34px;

    padding:
      1px 3px;

    font-size:
      11px;

  }

}

</style>

</head>


<body>


<div class="page">


<header class="hero">

  <h1>
    🚙 運転手MENU
  </h1>

</header>


<main class="card">


<!-- ==========================================================
     担当表・代休取得ボタン
========================================================== -->

<div class="management-menu">

  <button
    id="assignmentBtn"
    class="management-btn assignment-btn"
    type="button"
  >
    📋 担当表
  </button>


  <button
    id="compBtn"
    class="management-btn comp-btn"
    type="button"
  >
    🗓️ 代休取得
  </button>

</div>


<!-- ==========================================================
     人物選択
========================================================== -->

<div class="top-row">


  <div
    id="status"
    class="status"
  >

    <span id="statusIcon">
      ⏰
    </span>

    <span id="statusText">
      ⏳判別中⏳
    </span>

  </div>


  <div class="select-box">

    <label for="driverSelect">
      選択
    </label>

    <select id="driverSelect">

      <option value="">
        ⏳判別中⏳
      </option>

    </select>

  </div>


</div>


<!-- ==========================================================
     出勤・退勤
========================================================== -->

<div class="mode-box">


  <button
    id="inMode"
    class="mode-btn in"
    type="button"
    disabled
  >
    ☀️出勤☀️
  </button>


  <button
    id="outMode"
    class="mode-btn out off"
    type="button"
    disabled
  >
    🌙退勤🌙
  </button>


</div>


<div class="guide">

  必要な場合は修正お願いします。

</div>


<!-- ==========================================================
     写真
========================================================== -->

<input
  id="photoInput"
  type="file"
  accept="image/*"
  class="hidden"
>


<button
  id="uploadBtn"
  class="upload-btn"
  type="button"
  disabled
>
  📷 写真を撮影・選択して読み取る
</button>


<div
  id="notice"
  class="notice"
></div>


<!-- ==========================================================
     写真プレビュー
========================================================== -->

<section
  id="preview"
  class="preview"
>


<div class="preview-box">


<img
  id="photoPreview"
  class="photo-preview"
  alt="勤怠写真"
>


<div class="fields">


<div class="field">

  <label
    class="field-title"
    for="reportDate"
  >
    日付
  </label>

  <input
    id="reportDate"
    type="date"
  >

</div>


<div class="field">

  <label
    class="field-title"
    for="startTime"
  >
    出勤時間
  </label>

  <input
    id="startTime"
    type="time"
  >

</div>


<div
  id="endField"
  class="field hidden"
>

  <label
    class="field-title"
    for="endTime"
  >
    退勤時間
  </label>

  <input
    id="endTime"
    type="time"
  >

</div>


<div
  id="nextDateField"
  class="field hidden"
>

  <label
    class="field-title"
    for="nextDate"
  >
    次回出勤日
  </label>

  <input
    id="nextDate"
    type="date"
  >

</div>


<div
  id="nextTimeField"
  class="field hidden"
>

  <label
    class="field-title"
    for="nextTime"
  >
    次回出勤時間
  </label>

  <select id="nextTime"></select>

</div>


<div
  id="summary"
  class="summary"
>

  前回残業

  <strong>
    0:00
  </strong>

  　

  月間合計

  <strong>
    0:00
  </strong>

</div>


</div>


<!-- ==========================================================
     報告文章
========================================================== -->

<div class="message-section">


<div class="message-title">

  報告文章

</div>


<div class="message-box">


<div
  id="messagePreview"
  class="message-preview"
></div>


<textarea
  id="memo"
  class="memo-input"
  placeholder="文章を入力できます"
></textarea>


</div>


</div>


<button
  id="sendBtn"
  class="send-btn"

/* ============================================================
   日付
============================================================ */

function pad2(value){

  return String(value)
    .padStart(
      2,
      '0'
    );

}


function today(){

  const d =
    new Date();


  return (
    d.getFullYear() +
    '-' +
    pad2(
      d.getMonth() + 1
    ) +
    '-' +
    pad2(
      d.getDate()
    )
  );

}


function nowTime(){

  const d =
    new Date();


  return (
    pad2(
      d.getHours()
    ) +
    ':' +
    pad2(
      d.getMinutes()
    )
  );

}


function tomorrow(){

  const d =
    new Date();


  d.setDate(
    d.getDate() + 1
  );


  return (
    d.getFullYear() +
    '-' +
    pad2(
      d.getMonth() + 1
    ) +
    '-' +
    pad2(
      d.getDate()
    )
  );

}


function dateText(value){

  if(!value){

    return '';

  }


  const d =
    new Date(
      value +
      'T00:00:00'
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }


  const week = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  return (
    d.getFullYear() +
    '/' +
    (
      d.getMonth() + 1
    ) +
    '/' +
    d.getDate() +
    '(' +
    week[
      d.getDay()
    ] +
    ')'
  );

}


function shortDate(value){

  if(!value){

    return '';

  }


  const d =
    new Date(
      value +
      'T00:00:00'
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }


  const week = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  return (
    (
      d.getMonth() + 1
    ) +
    '/' +
    d.getDate() +
    '(' +
    week[
      d.getDay()
    ] +
    ')'
  );

}


function nextAttendancePrefix(value){

  if(!value){

    return '';

  }


  const base =
    new Date(
      today() +
      'T00:00:00'
    );


  const target =
    new Date(
      value +
      'T00:00:00'
    );


  const baseDay =
    base.getDay() ||
    7;


  const targetDay =
    target.getDay() ||
    7;


  const monday =
    new Date(
      base
    );


  monday.setDate(
    base.getDate() -
    baseDay +
    1
  );


  const nextMonday =
    new Date(
      monday
    );


  nextMonday.setDate(
    monday.getDate() +
    7
  );


  const targetMonday =
    new Date(
      target
    );


  targetMonday.setDate(
    target.getDate() -
    targetDay +
    1
  );


  return (
    nextMonday.getTime() ===
    targetMonday.getTime()
  )
    ? '来週'
    : '';

}

/* ============================================================

async function callServer(
  operation,
  data = {}
){

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      params.append(
        'action',
        'api'
      );


      params.append(
        'operation',
        operation
      );


      params.append(
        'requestId',
        requestId
      );


      params.append(
        'idToken',
        state.idToken ||
        ''
      );


      Object.keys(
        data
      ).forEach(
        key => {

          params.append(
            key,
            data[key] ?? ''
          );

        }
      );


      fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params.toString(),

          mode:
            'no-cors'

        }
      )
      .catch(
        error => {

          console.warn(
            'API POST失敗',
            error
          );

        }
      );


      pollApi(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


/* ============================================================
   APIポーリング
============================================================ */

function pollApi(
  requestId,
  resolve,
  reject,
  attempt
){

  if(
    attempt >=
    50
  ){

    reject(
      new Error(
        'サーバー応答がタイムアウトしました'
      )
    );

    return;

  }


  const callback =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup(){

    if(
      script.parentNode
    ){

      script.parentNode.removeChild(
        script
      );

    }


    try{

      delete window[
        callback
      ];

    }catch(_){

      window[
        callback
      ] = undefined;

    }

  }


  window[
    callback
  ] =
    function(response){


      if(finished){

        return;

      }


      finished =
        true;


      cleanup();


      if(
        response &&
        (
          response.status ===
            'pending' ||
          response.status ===
            'processing'
        )
      ){

        setTimeout(
          () => {

            pollApi(
              requestId,
              resolve,
              reject,
              attempt + 1
            );

          },
          500
        );


        return;

      }


      if(
        !response ||
        response.ok !==
          true
      ){

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );


        return;

      }


      resolve(
        response.data
      );

    };


  script.onerror =
    function(){


      if(finished){

        return;

      }


      finished =
        true;


      cleanup();


      setTimeout(
        () => {

          pollApi(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callback
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}

          tr.appendChild(

          );

      );

  );

  );

/* ============================================================
   既存値と名称マスターを合わせる
============================================================ */

function driverMasterMatch(
  currentValue,
  masterDrivers
){

  const current =
    String(
      currentValue ||
      ''
    ).trim();


  if(!current){

    return '';

  }


  if(
    masterDrivers.includes(
      current
    )
  ){

    return current;

  }


  const normalizedCurrent =
    current.replace(
      /\s+/g,
      ''
    );


  const found =
    masterDrivers.find(
      name => {


        const normalizedName =
          String(
            name ||
            ''
          )
          .replace(
            /\s+/g,
            ''
          );


        if(
          normalizedName ===
          normalizedCurrent
        ){

          return true;

        }


        const surname =
          String(
            name ||
            ''
          )
          .trim()
          .split(
            /\s+/
          )[0];


        if(
          current ===
          surname
        ){

          return true;

        }


        if(
          current.indexOf(
            surname
          ) ===
          0
        ){

          return true;

        }


        if(
          surname &&
          current.includes(
            surname
          )
        ){

          return true;

        }


        return false;

      }
    );


  return (
    found ||
    current
  );

}


/* ============================================================
   SELECT作成
============================================================ */

function createManagementSelect(
  values,
  currentValue,
  onChange,
  type
){


  const select =
    document.createElement(
      'select'
    );


  const list =
    Array.isArray(
      values
    )
      ? [...values]
      : [];


  let current =
    String(
      currentValue ||
      ''
    ).trim();


  if(
    type ===
    'driver'
  ){

    current =
      driverMasterMatch(
        current,
        list
      );

  }


  const blank =
    document.createElement(
      'option'
    );


  blank.value =
    '';


  blank.textContent =
    '';


  select.appendChild(
    blank
  );


  /*
   * 既存データがマスターに存在しない場合も
   * 勝手に消さない。
   */
  if(
    current &&
    !list.includes(
      current
    )
  ){

    const existing =
      document.createElement(
        'option'
      );


    existing.value =
      current;


    existing.textContent =
      current;


    select.appendChild(
      existing
    );

  }


  list.forEach(
    value => {


      const option =
        document.createElement(
          'option'
        );


      option.value =
        value;


      option.textContent =
        value;


      select.appendChild(
        option
      );

    }
  );


  select.value =
    current;


  select.addEventListener(
    'change',
    () => {

      onChange(
        select.value
      );

    }
  );


  return select;

}


/* ============================================================
   代休取得の不要行判定
============================================================ */

function isCompJunkRow(row){


  if(!row){

    return true;

  }


  const startDate =
    String(
      row.startDate ||
      ''
    ).trim();


  const compDate =
    String(
      row.compDate ||
      ''
    ).trim();


  const driver =
    String(
      row.driver ||
      ''
    ).trim();


  const officer =
    String(
      row.officer ||
      ''
    ).trim();


  /*
   * 完全な空行はデータ表示時には不要
   */
  if(
    !startDate &&
    !compDate &&
    !driver &&
    !officer
  ){

    return true;

  }


  /*
   * 「取得済み」タイトルが
   * データとして入ってしまった場合
   */
  if(
    startDate ===
      '取得済み' ||
    compDate ===
      '取得済み' ||
    driver ===
      '取得済み' ||
    officer ===
      '取得済み'
  ){

    return true;

  }


  /*
   * 列見出しがデータとして
   * 入ってしまった場合
   */
  if(
    (
      startDate ===
        '出勤日' ||
      startDate ===
        '代休日' ||
      startDate ===
        '担当者' ||
      startDate ===
        '運転手' ||
      startDate ===
        '役員'
    ) ||
    (
      compDate ===
        '出勤日' ||
      compDate ===
        '代休日' ||
      compDate ===
        '担当者' ||
      compDate ===
        '運転手' ||
      compDate ===
        '役員'
    ) ||
    (
      driver ===
        '出勤日' ||
      driver ===
        '代休日' ||
      driver ===
        '担当者' ||
      driver ===
        '運転手' ||
      driver ===
        '役員'
    ) ||
    (
      officer ===
        '出勤日' ||
      officer ===
        '代休日' ||
      officer ===
        '担当者' ||
      officer ===
        '運転手' ||
      officer ===
        '役員'
    )
  ){

    return true;

  }


  return false;

}

/* ============================================================
   履歴
============================================================ */

function normalizeHistoryType(item){

  const raw =
    String(
      item.type ||
      item.mode ||
      ''
    )
    .trim()
    .toLowerCase();


  if(
    raw ===
      'in' ||
    raw ===
      '出勤' ||
    raw ===
      '出勤時'
  ){

    return '出勤';

  }


  if(
    raw ===
      'out' ||
    raw ===
      '退勤' ||
    raw ===
      '退勤時'
  ){

    return '退勤';

  }


  return '';

}


function normalizeHistoryDate(item){

  const value =
    item.date ||
    item.reportDate ||
    '';


  if(!value){

    return '';

  }


  const text =
    String(
      value
    );


  let match =
    text.match(
      /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/
    );


  if(match){

    return (
      match[1] +
      '/' +
      Number(
        match[2]
      ) +
      '/' +
      Number(
        match[3]
      )
    );

  }


  match =
    text.match(
      /^(\d{1,2})[\/-](\d{1,2})/
    );


  if(match){

    const now =
      new Date();


    return (
      now.getFullYear() +
      '/' +
      Number(
        match[1]
      ) +
      '/' +
      Number(
        match[2]
      )
    );

  }


  return text;

}


function renderHistory(list){

  if(
    !Array.isArray(
      list
    ) ||
    !list.length
  ){

    el.historyList.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';

    return;

  }


  const sorted =
    [...list]
    .sort(
      (
        a,
        b
      ) =>
        Number(
          b.savedAt ||
          0
        ) -
        Number(
          a.savedAt ||
          0
        )
    );


  el.historyList.innerHTML =
    sorted.map(
      item => {


        const type =
          normalizeHistoryType(
            item
          );


        const date =
          normalizeHistoryDate(
            item
          );


        let time =
          '';


        if(
          type ===
          '退勤'
        ){

          time =
            (
              item.startTime ||
              '0:00'
            ) +
            '→' +
            (
              item.endTime ||
              '0:00'
            );

        }else if(
          type ===
          '出勤'
        ){

          time =
            item.reportTime ||
            item.startTime ||
            '0:00';

        }


        return (
          '<li>' +
          '<span class="history-date">' +
          escapeHtml(
            date
          ) +
          '</span>' +
          '<span class="history-type">' +
          escapeHtml(
            type
          ) +
          '</span>' +
          '<span class="history-time">' +
          escapeHtml(
            time
          ) +
          '</span>' +
          '<span class="history-ok">✅</span>' +
          '</li>'
        );

      }
    )
    .join('');

}

/* ============================================================
   画像縮小
============================================================ */

function imageToDataUrl(file){

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const reader =
        new FileReader();


      reader.onload =
        function(){


          const image =
            new Image();


          image.onload =
            function(){


              const max =
                1800;


              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                Math.round(
                  image.width *
                  scale
                );


              canvas.height =
                Math.round(
                  image.height *
                  scale
                );


              const context =
                canvas.getContext(
                  '2d',
                  {
                    alpha:
                      false
                  }
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .86
                )
              );

            };


          image.onerror =
            reject;


          image.src =
            reader.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* ============================================================
   OCR
============================================================ */

async function runBrowserOcr(
  dataUrl
){

  if(
    !window.Tesseract
  ){

    throw new Error(
      'OCRライブラリの読み込みに失敗しました'
    );

  }


  const result =
    await Tesseract.recognize(
      dataUrl,
      'eng',
      {

        logger:
          message => {


            if(
              message &&
              message.status ===
                'recognizing text' &&
              message.progress
            ){

              showNotice(
                '写真を読み取り中... ' +
                Math.round(
                  message.progress *
                  100
                ) +
                '%'
              );

            }

          },

        tessedit_pageseg_mode:
          6

      }
    );


  return (
    result &&
    result.data
  )
    ? String(
        result.data.text ||
        ''
      )
    : '';

}

        'in'
      ){

        el.startTime.value =
          nowTime();

      }else{

        el.startTime.value =
          state.workState.startTime ||
          '';

        el.endTime.value =
          nowTime();

      }


      refreshMessage();


      el.sendBtn.disabled =
        false;


      showNotice(
        '自動読み取りに失敗したため、時間を手動で確認・修正してください。'
      );


    }catch(secondError){


      console.error(
        secondError
      );


      showNotice(
        '写真の読み取りに失敗しました。'
      );

    }

  }

}


/* ============================================================
   送信
============================================================ */

async function sendDraft(){


  if(
    !state.driver
  ){

    alert(
      '人物を選択してください'
    );

    return;

  }


  const message =
    buildCompleteMessage();


  el.sendBtn.disabled =
    true;


  showNotice(
    '報告文章を送信中です...'
  );


  try{


    const result =
      await callServer(
        'sendAttendance',
        {

          selectedDriverKey:
            state.driver.driverKey,

          message:
            message

        }
      );


    if(
      !result ||
      result.ok !==
        true
    ){

      throw new Error(
        '送信に失敗しました'
      );

    }


    showNotice(
      '送信完了しました。'
    );


    state.draft =
      null;


    el.preview.classList.remove(
      'show'
    );


    el.photoInput.value =
      '';


    el.memo.value =
      '';


  }catch(error){


    console.error(
      error
    );


    showNotice(
      error.message ||
      '送信に失敗しました'
    );


  }finally{


    el.sendBtn.disabled =
      false;

  }

}

/* ============================================================
   自動本人判別
============================================================ */

async function autoDetect(){


  setStatus(
    '判別中',
    false
  );


  try{


    if(
      typeof liff ===
      'undefined'
    ){

      throw new Error(
        'LIFF SDKが読み込まれていません'
      );

    }


    await withTimeout(
      liff.init({
        liffId:
          LIFF_ID
      }),
      AUTO_DETECT_TIMEOUT
    );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

      return;

    }


    if(
      !liff.isLoggedIn()
    ){

      setStatus(
        '右から選択',
        false
      );

      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      setStatus(
        '右から選択',
        false
      );

      return;

    }


    const info =
      await withTimeout(
        callServer(
          'getDriverInfo'
        ),
        AUTO_DETECT_TIMEOUT
      );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

      return;

    }


    if(
      info &&
      info.found &&
      info.driverKey
    ){

      const driver =
        findDriver(
          info.driverKey
        );


      if(driver){

        await selectDriver(
          driver,
          false
        );


        setStatus(
          '完了',
          true
        );


        return;

      }

    }


    setStatus(
      '右から選択',
      false
    );


  }catch(error){


    console.warn(
      '自動判別終了',
      error
    );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

    }else{

      setStatus(
        '右から選択',
        false
      );

    }

  }

}
