<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>運転手MENU</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg1: #e8f7ff;
      --bg2: #f7fcff;
      --card: rgba(255,255,255,.95);
      --line: #d8ebf7;
      --text: #17324d;
      --muted: #6b8296;
      --primary: #2d88d8;
      --primary2: #56baf0;
      --shadow: 0 14px 40px rgba(39,96,139,.10);
      --shadow-soft: 0 8px 22px rgba(39,96,139,.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 28px 16px 24px;
      border-radius: 30px;
      background:
        radial-gradient(
          circle at 18% 18%,
          rgba(255,255,255,.86) 0 6%,
          transparent 6.5%
        ),
        radial-gradient(
          circle at 82% 22%,
          rgba(255,255,255,.84) 0 6%,
          transparent 6.5%
        ),
        linear-gradient(
          180deg,
          #bfeaff 0%,
          #e9f9ff 100%
        );
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,.7);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
      height: 40%;
      background:
        radial-gradient(
          ellipse at 10% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),
        radial-gradient(
          ellipse at 28% 100%,
          rgba(121,208,114,.92) 0 18%,
          transparent 19%
        ),
        radial-gradient(
          ellipse at 73% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),
        radial-gradient(
          ellipse at 92% 100%,
          rgba(121,208,114,.92) 0 16%,
          transparent 17%
        );
      opacity: .75;
      pointer-events: none;
    }

    .hero-car {
      position: relative;
      z-index: 1;
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #1676c7;
      font-size: 38px;
      line-height: 1.12;
      font-weight: 900;
    }

    .hero p {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
    }

    .main-card {
      margin-top: 14px;
      padding: 16px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.75);
    }

    .driver-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
      min-height: 44px;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #f3fbff;
      border: 1px solid #dceff9;
      color: #1676c7;
      font-weight: 900;
    }

    .driver-pill small {
      color: var(--muted);
      font-weight: 700;
    }

    .status {
      display: block;
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: #eef9ff;
      color: #1676c7;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
      border: 1px solid #d8ebf7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.error {
      background: #fff1f1;
      border-color: #ffd1d1;
      color: #a33;
    }

    .status.success {
      background: #effcf3;
      border-color: #ccefd7;
      color: #247344;
    }

    .attendance-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .attendance-btn {
      position: relative;
      width: 100%;
      height: 170px;
      border: 0;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(39,96,139,.12);
      transition: transform .12s ease, opacity .12s ease;
      isolation: isolate;
    }

    .attendance-btn:active {
      transform: translateY(1px) scale(.99);
    }

    .attendance-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .attendance-text {
      position: relative;
      z-index: 3;
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .btn-in {
      color: #0a4c7d;
      background:
        linear-gradient(
          180deg,
          #77d2ff 0%,
          #c8efff 58%,
          #8ed777 100%
        );
      border: 1px solid #a8ddf7;
    }

    .btn-out {
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          #142c78 0%,
          #10215c 60%,
          #07163f 100%
        );
      border: 1px solid #6077c5;
    }

    .guide {
      margin: 16px 4px 10px;
      color: #1676c7;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 800;
      text-align: center;
    }

    .edit-panel {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(216,235,247,.9);
    }

    .edit-panel.show {
      display: block;
    }

    .edit-title {
      margin: 0 0 10px;
      color: #1676c7;
      font-size: 26px;
      font-weight: 900;
    }

    .edit-title::before {
      content: "✎ ";
      color: #68aee6;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #61798e;
      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      display: block;
      width: 100%;
      height: 60px;
      padding: 6px 8px;
      border: 1px solid #cfe5f5;
      border-radius: 15px;
      outline: none;
      background: #ffffff;
      color: #0d2340;
      font-family: inherit;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .field input:focus {
      border-color: #63b4ea;
      box-shadow: 0 0 0 3px rgba(99,180,234,.14);
    }

    .single-field {
      margin-bottom: 10px;
    }

    .preview {
      display: none;
      margin-top: 12px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, #f9fdff 0%, #eef8ff 100%);
      color: #14446e;
      font-size: 15px;
      line-height: 1.75;
      font-weight: 600;
      white-space: pre-line;
    }

    .preview.show {
      display: block;
    }

    .send-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 17px 12px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #56baf0 0%, #2d88d8 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(45,136,216,.18);
    }

    .send-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .history {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e2eef6;
    }

    .history h3 {
      margin: 0 0 10px;
      color: #1676c7;
      font-size: 20px;
      font-weight: 900;
    }

    .history h3::before {
      content: "🕘 ";
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .history-list li {
      padding: 9px 0;
      border-bottom: 1px solid #edf4fa;
      color: #496173;
      font-size: 14px;
      line-height: 1.45;
    }

    .history-list .empty {
      color: #7a90a3;
    }

    .footer {
      padding: 14px 10px 4px;
      color: #8aa0b2;
      font-size: 14px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .page {
        padding: 12px 10px 20px;
      }

      .hero {
        padding: 22px 12px 18px;
        border-radius: 24px;
      }

      .hero-car {
        font-size: 48px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 14px;
      }

      .main-card {
        margin-top: 10px;
        padding: 12px;
        border-radius: 22px;
      }

      .attendance-buttons {
        gap: 8px;
      }

      .attendance-btn {
        height: 126px;
        border-radius: 18px;
      }

      .attendance-text {
        font-size: 30px;
      }

      .guide {
        font-size: 13px;
      }

      .field input {
        height: 54px;
        font-size: 22px;
      }

      .send-btn {
        font-size: 20px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <header class="hero">
      <div class="hero-car">🚙</div>
      <h1>運転手MENU</h1>
      <p>本人を自動判定して開きます</p>
    </header>


    <main class="main-card">

      <div class="driver-pill">
        <span id="driverIcon">⏳</span>
        <span id="driverName">読み込み中...</span>
        <small id="driverMeta"></small>
      </div>


      <div id="status" class="status">
        JavaScript起動待ち...
      </div>


      <div class="attendance-buttons">

        <!-- 出勤 -->
        <button
          id="btnIn"
          class="attendance-btn btn-in"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <defs>

                <stop offset="0%" stop-color="#41b2ff"/>
                <stop offset="60%" stop-color="#9ce0ff"/>
                <stop offset="100%" stop-color="#dff6ff"/>
              </linearGradient>

              <linearGradient id="hillGreen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#73d151"/>
                <stop offset="100%" stop-color="#388e3c"/>
              </linearGradient>
            </defs>

            <rect width="320" height="220" fill="url(#daySky)"/>

            <circle cx="65" cy="55" r="33" fill="#ffe082"/>
            <circle cx="65" cy="55" r="48" fill="#ffb74d" opacity=".18"/>

            <g fill="#ffffff" opacity=".94">
              <ellipse cx="190" cy="70" rx="38" ry="16"/>
              <ellipse cx="220" cy="80" rx="48" ry="18"/>
            </g>

            <path
              d="M-10,160 C58,120 100,152 160,132 C210,116 240,150 330,124 L330,220 L-10,220 Z"
              fill="url(#hillGreen)"
            />

            <path
              d="M-10,182 C76,160 112,190 170,174 C224,160 252,184 330,164 L330,220 L-10,220 Z"
              fill="#2e7d32"
              opacity=".75"
            />

            <rect x="-10" y="190" width="340" height="30" fill="#eaf6ff" opacity=".95"/>
            <rect x="-10" y="192" width="340" height="4" rx="2" fill="#ffffff"/>
            <rect x="-10" y="200" width="340" height="4" rx="2" fill="#ffffff"/>
          </svg>

          <span class="attendance-text">出勤</span>
        </button>


        <!-- 退勤 -->
        <button
          id="btnOut"
          class="attendance-btn btn-out"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <defs>
              <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0b1742"/>
                <stop offset="60%" stop-color="#0f2b6b"/>
                <stop offset="100%" stop-color="#183b8a"/>
              </linearGradient>

              <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#091333"/>

              </linearGradient>
            </defs>

            <rect width="320" height="220" fill="url(#nightSky)"/>

            <g fill="#fff59d">
              <circle cx="30" cy="30" r="2"/>
              <circle cx="65" cy="65" r="1.5"/>
              <circle cx="105" cy="25" r="2.5"/>
              <circle cx="170" cy="35" r="2"/>
              <circle cx="235" cy="60" r="2.5"/>
              <circle cx="275" cy="30" r="2"/>
            </g>

            <circle cx="90" cy="72" r="32" fill="#ffee58"/>
            <circle cx="106" cy="58" r="32" fill="#0b1742"/>

            <g opacity=".4" fill="#1e3a78">
              <ellipse cx="180" cy="80" rx="44" ry="16"/>

            </g>

            <g fill="url(#buildingGrad)">
              <rect x="205" y="108" width="28" height="85"/>

            </g>

            <g fill="#ffeb3b" opacity=".85">
              <rect x="218" y="120" width="5" height="6"/>
              <rect x="228" y="135" width="5" height="6"/>
              <rect x="253" y="138" width="5" height="6"/>
              <rect x="264" y="150" width="5" height="6"/>
              <rect x="284" y="105" width="5" height="6"/>

            </g>

            <rect x="-10" y="190" width="340" height="30" fill="#0d1b3e"/>
            <rect x="-10" y="192" width="340" height="4" fill="#6482ad"/>
            <rect x="-10" y="200" width="340" height="4" fill="#6482ad"/>
          </svg>

          <span class="attendance-text">退勤</span>
        </button>

      </div>


      <div class="guide">
        出勤時刻・退勤時刻・次回出勤日時を確認して、必要なら修正してください。
      </div>


      <section id="editPanel" class="edit-panel">

        <h2 class="edit-title">内容修正</h2>


        <div id="inFields">

          <div class="field single-field">
            <label for="clockInTime">出勤時刻</label>
            <input id="clockInTime" type="time">
          </div>

        </div>


        <div id="outFields" class="hidden">

          <div class="two-column">

            <div class="field">
              <label for="editClockInTime">出勤時刻</label>
              <input id="editClockInTime" type="time">
            </div>

            <div class="field">
              <label for="clockOutTime">退勤時刻</label>
              <input id="clockOutTime" type="time">
            </div>

          </div>


          <div class="two-column">

            <div class="field">
              <label for="nextDate">次回出勤日</label>
              <input id="nextDate" type="date">
            </div>

            <div class="field">
              <label for="nextTime">次回出勤時間</label>
              <input id="nextTime" type="time">
            </div>

          </div>

        </div>


        <div id="preview" class="preview"></div>


        <button
          id="sendBtn"
          class="send-btn"
          type="button"
          disabled

          送信

      <section class="history">

        <h3>今日の履歴</h3>

        <ul id="historyList" class="history-list">
          <li class="empty">まだ履歴はありません</li>
        </ul>

    </main>


    <footer class="footer">
      勤怠管理Bot

  </div>


  <script>

    // ============================================================
    // ★★★★★ 設定はここだけ ★★★★★
    // ============================================================

    // Apps Script ウェブアプリURL
    const API_URL =
      'https://script.google.com/macros/s/AKfycbySZ6bhrlPbyqqoI41PLzzj2rpARayPFIm04LiR7C4pfEaL__kkWblnkNnZIjfECrfW/exec';

    // LINE LIFF ID
    const LIFF_ID =
      '2011011273-HIdBF1sM';


    // ============================================================
    // ★★★★★ ここから下は基本的に変更しない ★★★★★
    // ============================================================


    const els = {

      driverIcon:
        document.getElementById('driverIcon'),

      driverName:
        document.getElementById('driverName'),

      driverMeta:
        document.getElementById('driverMeta'),

      status:
        document.getElementById('status'),

      btnIn:
        document.getElementById('btnIn'),

      btnOut:
        document.getElementById('btnOut'),

      editPanel:
        document.getElementById('editPanel'),

      inFields:
        document.getElementById('inFields'),

      outFields:
        document.getElementById('outFields'),

      clockInTime:
        document.getElementById('clockInTime'),

      editClockInTime:
        document.getElementById('editClockInTime'),

      clockOutTime:
        document.getElementById('clockOutTime'),

      nextDate:
        document.getElementById('nextDate'),

      nextTime:
        document.getElementById('nextTime'),

      preview:
        document.getElementById('preview'),

      sendBtn:
        document.getElementById('sendBtn'),

      historyList:
        document.getElementById('historyList')

    };


    const state = {

      driver: null,

      idToken: '',

      mode: null,

      lastStartTime: '',

      history: []

    };


    // ============================================================
    // ステータス表示
    // ============================================================

    function setStatus(text, type = '') {

      els.status.textContent = text;

      els.status.className = 'status';

      if (type) {
        els.status.classList.add(type);
      }
    }


    // ============================================================
    // 日時
    // ============================================================

    function pad2(value) {
      return String(value).padStart(2, '0');
    }


    function toTimeInput(date) {

      return (
        pad2(date.getHours()) +
        ':' +
        pad2(date.getMinutes())
      );
    }


    function toDateInput(date) {

      return (
        date.getFullYear() +
        '-' +
        pad2(date.getMonth() + 1) +
        '-' +
        pad2(date.getDate())
      );
    }


    function weekdayJa(date) {

      return [
        '日',
        '月',
        '火',
        '水',
        '木',
        '金',
        '土'
      ][date.getDay()];
    }


    function dateLabel(date) {

      return (
        (date.getMonth() + 1) +
        '/' +
        date.getDate() +
        '(' +
        weekdayJa(date) +
        ')'
      );
    }


    function dateSlash(date) {

      return (
        date.getFullYear() +
        '/' +
        (date.getMonth() + 1) +
        '/' +
        date.getDate()
      );
    }


    function tomorrowDate() {

      const date = new Date();

      date.setDate(
        date.getDate() + 1
      );

      return date;
    }


    // ============================================================
    // Apps Script API
    // ============================================================

    function callServer(action, data = {}) {

      return new Promise((resolve, reject) => {

        const requestId =
          'req_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2);


        const iframe =
          document.createElement('iframe');


        const iframeName =
          'gas_api_' + requestId;


        iframe.name = iframeName;
        iframe.style.display = 'none';
        iframe.setAttribute('aria-hidden', 'true');


        document.body.appendChild(iframe);


        const form =
          document.createElement('form');


        form.method = 'POST';
        form.action = API_URL;
        form.target = iframeName;
        form.style.display = 'none';


        const fields = {

          action: action,

          requestId: requestId,

          idToken:
            state.idToken || '',

          message:
            data.message || ''

        };


        Object.keys(fields).forEach(function(key) {

          const input =
            document.createElement('input');

          input.type = 'hidden';

          input.name = key;

          input.value =
            String(fields[key] || '');

          form.appendChild(input);

        });


        document.body.appendChild(form);


        let finished = false;


        function cleanup() {

          window.removeEventListener(
            'message',
            onMessage
          );


          if (form.parentNode) {
            form.parentNode.removeChild(form);
          }


          setTimeout(function() {

            if (iframe.parentNode) {
              iframe.parentNode.removeChild(iframe);
            }

          }, 100);

        }


        function fail(error) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(error);
        }


        function onMessage(event) {

          const response =
            event.data || {};


          if (
            response.type !==
            'gasApiResponse'
          ) {
            return;
          }


          if (
            response.requestId !==
            requestId
          ) {
            return;
          }


          if (
            event.source !==
            iframe.contentWindow
          ) {
            return;
          }


          if (finished) {
            return;
          }


          finished = true;

          cleanup();


          const payload =
            response.payload || {};


          if (
            payload.ok === true
          ) {

            resolve(
              payload.data
            );

          } else {

            reject(
              new Error(
                payload.error ||
                'Apps Script APIエラー'
              )
            );
          }

        }


        window.addEventListener(
          'message',
          onMessage
        );


        form.submit();


        setTimeout(function() {

          fail(
            new Error(
              'Apps Script APIの応答が20秒以内に返りませんでした'
            )
          );

        }, 20000);

      });
    }


    // ============================================================
    // HTMLエスケープ
    // ============================================================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    // ============================================================
    // 履歴
    // ============================================================

    function renderHistory() {

      if (!state.history.length) {

        els.historyList.innerHTML =
          '<li class="empty">まだ履歴はありません</li>';

        return;
      }


      els.historyList.innerHTML =
        state.history
          .map(function(item) {

            return (
              '<li>' +
              escapeHtml(item.time) +
              '　' +
              escapeHtml(item.text) +
              '</li>'
            );

          })
          .join('');
    }


    function addHistory(text) {

      state.history.unshift({

        time:
          new Date().toLocaleString('ja-JP'),

        text: text

      });


      state.history =
        state.history.slice(0, 5);


      renderHistory();
    }


    // ============================================================
    // 出勤メッセージ
    // ============================================================

    function buildInMessage() {

      const today =
        new Date();


      return (
        'お疲れ様でございます。\n\n' +
        dateLabel(today) +
        '出勤いたしました。\n\n' +
        '本日もよろしくお願いいたします。'
      );
    }


    // ============================================================
    // 退勤メッセージ
    // ============================================================

    function buildOutMessage() {

      const today =
        new Date();


      let next =
        tomorrowDate();


      if (
        els.nextDate.value
      ) {

        next =
          new Date(
            els.nextDate.value +
            'T00:00:00'
          );
      }


      const nextTime =
        els.nextTime.value ||
        '08:00';


      return (
        'お疲れ様でございます。\n\n' +
        '業務完了いたしました。\n\n' +

        dateSlash(today) +
        '\n' +

        '稼働)' +
        (els.editClockInTime.value || '00:00') +
        '-' +
        (els.clockOutTime.value || '00:00') +
        '\n\n' +

        '本日は失礼させていただきます。\n\n' +

        '出勤) ' +
        dateLabel(next) +
        ' ' +
        nextTime +
        '\n\n' +

        '明日もよろしくお願いいたします。'
      );
    }


    // ============================================================
    // プレビュー
    // ============================================================

    function refreshPreview() {

      let message = '';


      if (
        state.mode === 'in'
      ) {

        message =
          buildInMessage();

      } else {

        message =
          buildOutMessage();
      }


      els.preview.textContent =
        message;


      els.preview.classList.add(
        'show'
      );


      return message;
    }


    // ============================================================
    // 出勤・退勤選択
    // ============================================================

    function setMode(mode) {

      state.mode = mode;


      els.editPanel.classList.add(
        'show'
      );


      if (
        mode === 'in'
      ) {

        els.inFields.classList.remove(
          'hidden'
        );

        els.outFields.classList.add(
          'hidden'
        );


        els.sendBtn.textContent =
          '出勤送信';


        const now =
          new Date();


        els.clockInTime.value =
          toTimeInput(now);


        state.lastStartTime =
          els.clockInTime.value;


      } else {

        els.inFields.classList.add(
          'hidden'
        );

        els.outFields.classList.remove(
          'hidden'
        );


        els.sendBtn.textContent =
          '退勤送信';


        const now =
          new Date();


        els.editClockInTime.value =
          state.lastStartTime ||
          toTimeInput(now);


        els.clockOutTime.value =
          toTimeInput(now);


        els.nextDate.value =
          toDateInput(
            tomorrowDate()
          );


        els.nextTime.value =
          '08:00';
      }


      refreshPreview();
    }


    // ============================================================
    // LIFF本人確認
    // ============================================================

    async function resolveDriver() {

      setStatus(
        '① JavaScript起動しました'
      );


      try {

        if (
          typeof liff === 'undefined'
        ) {

          throw new Error(
            'LIFF SDKを読み込めませんでした'
          );
        }


        setStatus(
          '② LIFF初期化中...'
        );


        console.log(
          'LIFF ID:',
          LIFF_ID
        );


        console.log(
          'Current URL:',
          window.location.href
        );


        console.log(
          'API URL:',
          API_URL
        );


        await liff.init({

          liffId:
            LIFF_ID

        });


        setStatus(
          '③ LIFF初期化成功',
          'success'
        );


        if (
          !liff.isLoggedIn()
        ) {

          setStatus(
            '④ LINEログインへ移動します...'
          );


          liff.login({

            redirectUri:
              window.location.href

          });


          return;
        }


        setStatus(
          '⑤ LINEログイン済み',
          'success'
        );


        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'IDトークンを取得できません。openid設定を確認してください。'
          );
        }


        state.idToken =
          idToken;


        setStatus(
          '⑥ IDトークン取得成功',
          'success'
        );


        setStatus(
          '⑦ driver_master照合中...'
        );


        const info =
          await callServer(
            'getDriverInfo'
          );


        if (
          !info ||
          !info.found
        ) {

          els.driverIcon.textContent =
            '⚠️';


          els.driverName.textContent =
            '未登録';


          els.driverMeta.textContent =
            info &&
            info.lineUserId
              ? ' / ' +
                info.lineUserId
              : '';


          setStatus(
            'driver_masterにこのLINEユーザーが登録されていません。\n\n' +
            (
              info &&
              info.reason
                ? info.reason
                : ''
            ),
            'error'
          );


          return;
        }


        state.driver =
          info;


        els.driverIcon.textContent =
          '🚙';


        els.driverName.textContent =
          info.displayName +
          ' さん';


        els.driverMeta.textContent =
          info.driverKey
            ? ' / ' +
              info.driverKey
            : '';


        els.btnIn.disabled =
          false;


        els.btnOut.disabled =
          false;


        els.sendBtn.disabled =
          false;


        setStatus(
          '⑧ 本人確認完了：' +
          info.displayName +
          ' さん',
          'success'
        );


      } catch (error) {

        console.error(
          'LIFF ERROR:',
          error
        );


        els.driverIcon.textContent =
          '⚠️';


        els.driverName.textContent =
          'LIFFエラー';


        let message = '';


        if (error) {

          if (error.code) {

            message +=
              'code: ' +
              error.code +
              '\n';
          }


          if (error.message) {

            message +=
              'message: ' +
              error.message +
              '\n';
          }


          if (error.name) {

            message +=
              'name: ' +
              error.name +
              '\n';
          }
        }


        if (!message) {

          message =
            String(error);
        }


        message +=
          '\n\n現在URL:\n' +
          window.location.href;


        message +=
          '\n\nLIFF ID:\n' +
          LIFF_ID;


        setStatus(
          'LIFF初期化エラー\n' +
          message,
          'error'
        );
      }
    }


    // ============================================================
    // ボタン
    // ============================================================

    els.btnIn.addEventListener(
      'click',
      function() {

        if (!state.driver) {
          return;
        }

        setMode('in');
      }
    );


    els.btnOut.addEventListener(
      'click',
      function() {

        if (!state.driver) {
          return;
        }

        setMode('out');
      }
    );


    // ============================================================
    // 入力変更
    // ============================================================

    els.clockInTime.addEventListener(
      'input',
      function() {

        state.lastStartTime =
          els.clockInTime.value;

        refreshPreview();
      }
    );


    els.editClockInTime.addEventListener(
      'input',
      refreshPreview
    );


    els.clockOutTime.addEventListener(
      'input',
      refreshPreview
    );


    els.nextDate.addEventListener(
      'change',
      refreshPreview
    );


    els.nextTime.addEventListener(
      'input',
      refreshPreview
    );


    // ============================================================
    // LINEグループへ送信
    // ============================================================

    els.sendBtn.addEventListener(
      'click',
      async function() {

        if (!state.driver) {

          setStatus(
            '本人情報が取得できていません。',
            'error'
          );

          return;
        }


        if (!state.idToken) {

          setStatus(
            'LINE認証情報が取得できていません。',
            'error'
          );

          return;
        }


        if (!state.mode) {

          setStatus(
            '出勤または退勤を選択してください。',
            'error'
          );

          return;
        }


        const message =
          refreshPreview();


        try {

          els.sendBtn.disabled =
            true;


          setStatus(
            'LINEグループへ送信中...'
          );


          const result =
            await callServer(
              'sendAttendance',
              {
                message:
                  message
              }
            );


          if (
            !result ||
            !result.ok
          ) {

            throw new Error(
              '送信結果を確認できませんでした'
            );
          }


          const title =
            state.mode === 'in'
              ? '出勤'
              : '退勤';


          addHistory(
            title +
            'を送信しました'
          );


          setStatus(
            result.displayName +
            'さんの勤怠グループへ送信しました。',
            'success'
          );


        } catch (error) {

          console.error(error);


          const errorMessage =
            error &&
            error.message
              ? error.message
              : String(error);


          setStatus(
            '送信失敗\n' +
            errorMessage,
            'error'
          );


        } finally {

          els.sendBtn.disabled =
            false;
        }
      }
    );


    // ============================================================
    // 起動
    // ============================================================

    window.addEventListener(
      'load',
      function() {

        setStatus(
          '① JavaScript起動しました'
        );


        resolveDriver();
      }
    );

  </script>

</body>

</html>
