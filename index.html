<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

/* ==========================================================
   BASE
========================================================== */

:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#ffffff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
  --current:#ffe6e6;
  --current-input:#fff0f0;
  --current-border:#f3b6b6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      var(--bg),
      var(--bg2)
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}


/* ==========================================================
   HERO
========================================================== */

.hero{
  overflow:hidden;

  padding:
    21px
    10px
    23px;

  border-radius:
    26px;

  text-align:
    center;

  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );

  box-shadow:
    var(--shadow);
}

.hero h1{
  margin:0;

  color:
    var(--blue);

  font-size:
    30px;

  line-height:
    1.15;

  font-weight:
    900;

  white-space:
    nowrap;
}


/* ==========================================================
   CARD
========================================================== */

.card{
  margin-top:
    12px;

  padding:
    13px;

  border-radius:
    24px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  box-shadow:
    var(--shadow);
}


/* ==========================================================
   MANAGEMENT BUTTONS
========================================================== */

.management-menu{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    8px;

  margin-bottom:
    12px;
}

.management-btn{
  min-height:
    54px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  font-size:
    16px;

  font-weight:
    900;

  background:
    #f7fcff;

  color:
    var(--blue);
}

.assignment-btn{
  background:
    #eef8ff;
}

.comp-btn{
  background:
    #f4fbf5;

  color:
    #18824e;
}


/* ==========================================================
   DRIVER SELECT
========================================================== */

.top-row{
  display:grid;

  grid-template-columns:
    158px
    minmax(0,1fr);

  gap:
    8px;

  align-items:
    stretch;
}

.status{
  min-height:
    78px;

  display:flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    7px;

  padding:
    8px;

  border-radius:
    20px;

  background:
    #f3fbff;

  border:
    1px solid
    var(--line);

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

  text-align:
    center;
}

.status.done{
  background:
    #eefbf3;

  border-color:
    #ccefd8;

  color:
    var(--green);
}

.select-box{
  padding:
    9px 11px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #f9fdff;
}

.select-box label{
  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;
}

select,
input[type="date"],
input[type="time"],
textarea{
  width:
    100%;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  outline:
    none;
}

select,
input[type="date"],
input[type="time"]{
  height:
    44px;

  padding:
    0 10px;

  font-size:
    16px;

  font-weight:
    800;
}


/* ==========================================================
   MODE
========================================================== */

.mode-box{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    10px;
}

.mode-btn{
  min-height:
    90px;

  border:
    0;

  border-radius:
    20px;

  font-size:
    28px;

  font-weight:
    900;
}

.mode-btn.in{
  background:
    linear-gradient(
      #73cdf8,
      #7dd77a
    );

  color:
    #084e78;
}

.mode-btn.out{
  background:
    linear-gradient(
      #1b357c,
      #0e1e4d
    );

  color:
    #ffffff;
}

.mode-btn.off{
  opacity:
    .38;

  filter:
    grayscale(.18);
}

.guide{
  margin:
    9px 4px;

  color:
    var(--blue);

  font-size:
    13px;

  font-weight:
    900;

  text-align:
    center;
}


/* ==========================================================
   PHOTO
========================================================== */

.upload-btn{
  width:
    100%;

  min-height:
    54px;

  border:
    1px solid
    #cfe8f7;

  border-radius:
    17px;

  background:
    #eaf7ff;

  color:
    var(--blue);

  font-size:
    17px;

  font-weight:
    900;
}

.upload-btn:disabled{
  opacity:
    .45;

  cursor:
    not-allowed;
}

.notice{
  display:
    none;

  margin-top:
    9px;

  padding:
    9px 11px;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    #5c7588;

  font-size:
    12px;

  line-height:
    1.45;

  text-align:
    center;
}

.notice.show{
  display:
    block;
}

.hidden{
  display:
    none !important;
}


/* ==========================================================
   PREVIEW
========================================================== */

.preview{
  display:
    none;

  margin-top:
    11px;
}

.preview.show{
  display:
    block;
}

.preview-box{
  padding:
    12px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #ffffff;
}

.photo-preview{
  display:
    block;

  width:
    100%;

  max-height:
    360px;

  object-fit:
    contain;

  border-radius:
    14px;

  background:
    #eef4f8;
}

.fields{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    9px;
}

.field{
  min-width:
    0;

  padding:
    9px;

  border:
    1px solid
    var(--line);

  border-radius:
    14px;

  background:
    var(--soft);
}

.field-title{
  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;
}

.summary{
  grid-column:
    1/-1;

  padding:
    9px 10px;

  border:
    1px solid
    var(--line);

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    #446276;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;
}

.summary strong{
  color:
    var(--blue);
}


/* ==========================================================
   MESSAGE
========================================================== */

.message-section{
  margin-top:
    12px;
}

.message-title{
  margin:
    0 0 7px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;
}

.message-box{
  padding:
    11px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #f7fcff;
}

.message-preview{
  white-space:
    pre-line;

  font-size:
    14px;

  line-height:
    1.55;

  color:
    #15446e;

  font-weight:
    700;
}

.memo-input{
  display:
    block;

  width:
    100%;

  min-height:
    92px;

  margin-top:
    10px;

  padding:
    10px 11px;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    14px;

  line-height:
    1.55;

  resize:
    vertical;

  outline:
    none;
}

.send-btn{
  width:
    100%;

  min-height:
    54px;

  margin-top:
    9px;

  border:
    0;

  border-radius:
    17px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    18px;

  font-weight:
    900;
}

.send-btn:disabled{
  opacity:
    .45;

  cursor:
    not-allowed;
}


/* ==========================================================
   HISTORY
========================================================== */

.history{
  margin-top:
    16px;

  padding-top:
    13px;

  border-top:
    1px solid
    #e2eef6;
}

.history-title{
  margin:
    0 0 8px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

  text-align:
    center;
}


/* ==========================================================
   MANAGEMENT PANEL
========================================================== */

.management-panel{
  margin-top:
    8px;

  padding:
    6px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #ffffff;
}

.management-header{
  display:flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

  margin-bottom:
    7px;
}

.management-title{
  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;
}

.management-close{
  border:
    0;

  border-radius:
    10px;

  padding:
    7px 11px;

  background:
    #edf4f8;

  color:
    #526a7d;

  font-size:
    12px;

  font-weight:
    900;
}

.management-loading{
  padding:
    12px;

  color:
    #688094;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;
}


/* ==========================================================
   ASSIGNMENT VIEW
========================================================== */

.assignment-toolbar{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-bottom:6px;
}

.assignment-info{
  min-width:0;

  color:#6a8190;

  font-size:11px;

  font-weight:800;
}

.assignment-sort-note{
  padding:4px 7px;

  border-radius:8px;

  background:#f5f9fc;

  color:#648095;

  font-size:10px;

  font-weight:900;

  white-space:nowrap;
}


/* ==========================================================
   TABLE
========================================================== */

.management-table-wrap{
  overflow-x:
    hidden;

  max-width:
    100%;
}

.management-table{
  width:
    100%;

  min-width:
    0;

  table-layout:
    fixed;

  border-collapse:
    collapse;

  font-size:
    11px;
}

.management-table th,
.management-table td{
  padding:
    1px 2px;

  border:
    1px solid
    #dbeaf3;

  vertical-align:
    middle;

  overflow:
    hidden;
}

.management-table th{
  background:
    #eef8ff;

  color:
    #42647b;

  font-weight:
    900;

  white-space:
    normal;

  word-break:
    break-all;

  line-height:
    1.15;
}

.management-table td{
  background:
    #ffffff;
}

.management-table input,
.management-table select{
  width:
    100%;

  min-width:
    0;

  height:
    31px;

  padding:
    2px 3px;

  border:
    1px solid
    #d4e5ef;

  border-radius:
    7px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    11px;

  font-weight:
    700;

  outline:
    none;
}


/* ==========================================================
   CURRENT MONTH
========================================================== */

.assignment-panel
.management-table
tbody
tr.current-month-row > th,

.assignment-panel
.management-table
tbody
tr.current-month-row > td{
  background-color:
    var(--current)
    !important;
}

.assignment-panel
.management-table
tbody
tr.current-month-row > td > select{
  background-color:
    var(--current-input)
    !important;

  border-color:
    var(--current-border)
    !important;
}

.assignment-panel
.management-table
tbody
tr.current-month-row > th{
  color:
    #b33a3a
    !important;

  font-weight:
    900
    !important;
}


/* ==========================================================
   DATE DISPLAY
========================================================== */

.comp-date-wrap{
  position:
    relative;

  width:
    100%;

  height:
    31px;
}

.comp-date-display{
  position:
    absolute;

  left:
    0;

  top:
    0;

  width:
    100%;

  height:
    31px;

  margin:
    0;

  padding:
    2px 4px;

  border:
    1px solid
    #d4e5ef;

  border-radius:
    7px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    11px;

  font-weight:
    700;

  line-height:
    25px;

  white-space:
    nowrap;

  overflow:
    hidden;

  pointer-events:
    none;
}

.comp-date-picker{
  position:
    absolute;

  left:
    0;

  top:
    0;

  width:
    100%;

  height:
    31px;

  margin:
    0;

  padding:
    0;

  opacity:
    0;

  cursor:
    pointer;

  z-index:
    2;
}


/* ==========================================================
   ASSIGNMENT TABLE
========================================================== */

.assignment-panel
.management-table th:first-child,
.assignment-panel
.management-table td:first-child{
  width:18%;
}

.assignment-panel
.management-table th:not(:first-child),
.assignment-panel
.management-table td:not(:first-child){
  width:20.5%;
}


/* ==========================================================
   OFFICER STACK
========================================================== */

.officer-stack{
  display:
    flex;

  flex-direction:
    column;

  gap:
    3px;

  width:
    100%;
}

.officer-row{
  display:
    flex;

  align-items:
    center;

  gap:
    3px;

  width:
    100%;
}

.officer-row select{
  flex:
    1 1 auto;

  width:
    100%;

  min-width:
    0;
}

.officer-remove{
  flex:
    0 0 21px;

  width:
    21px;

  height:
    21px;

  padding:
    0;

  border:
    0;

  border-radius:
    6px;

  background:
    #f0f5f8;

  color:
    #7a909f;

  font-size:
    11px;

  line-height:
    21px;

  text-align:
    center;
}

.officer-add{
  width:
    100%;

  min-height:
    22px;

  margin-top:
    1px;

  padding:
    1px 3px;

  border:
    1px dashed
    #a8d1e8;

  border-radius:
    6px;

  background:
    #f8fcff;

  color:
    var(--blue);

  font-size:
    9px;

  font-weight:
    900;

  line-height:
    18px;
}


/* ==========================================================
   COMP
========================================================== */

.comp-panel
.management-table th:nth-child(1),
.comp-panel
.management-table td:nth-child(1){
  width:
    19%;
}

.comp-panel
.management-table th:nth-child(2),
.comp-panel
.management-table td:nth-child(2){
  width:
    19%;
}

.comp-panel
.management-table th:nth-child(3),
.comp-panel
.management-table td:nth-child(3){
  width:
    24%;
}

.comp-panel
.management-table th:nth-child(4),
.comp-panel
.management-table td:nth-child(4){
  width:
    38%;
}

.management-section-title{
  margin:
    7px 0 5px;

  color:
    var(--blue);

  font-size:
    15px;

  font-weight:
    900;
}

.comp-panel{
  display:
    grid;

  gap:
    7px;
}


/* ==========================================================
   ADD MONTH
========================================================== */

.month-add-wrap{
  margin-top:
    8px;

  padding-top:
    8px;

  border-top:
    1px solid
    #e5eff6;
}

.month-add-title{
  margin-bottom:
    6px;

  color:
    #6b8292;

  font-size:
    11px;

  font-weight:
    900;

  text-align:
    center;
}

.month-add-row{
  display:grid;

  grid-template-columns:
    1fr
    auto;

  gap:
    6px;

  align-items:
    center;
}

.month-add-select{
  width:
    100%;

  height:
    38px;

  padding:
    0 8px;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    10px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    13px;

  font-weight:
    800;
}

.month-add-btn{
  min-height:
    38px;

  padding:
    0 12px;

  border:
    0;

  border-radius:
    10px;

  background:
    #eef8ff;

  color:
    var(--blue);

  font-size:
    12px;

  font-weight:
    900;

  white-space:
    nowrap;
}


/* ==========================================================
   SAVE
========================================================== */

.management-save{
  width:
    100%;

  min-height:
    46px;

  margin-top:
    8px;

  border:
    0;

  border-radius:
    14px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    16px;

  font-weight:
    900;
}

.management-save:disabled{
  opacity:
    .45;
}


/* ==========================================================
   FOOTER
========================================================== */

.footer{
  padding:
    14px 10px 4px;

  color:
    #8aa0b2;

  font-size:
    13px;

  text-align:
    center;
}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:480px){

  .page{
    padding:
      10px 9px 20px;
  }

  .hero{
    padding:
      20px 10px 21px;
  }

  .hero h1{
    font-size:
      30px;
  }

  .card{
    padding:
      11px;
  }

  .top-row{
    grid-template-columns:
      145px
      minmax(0,1fr);
  }

  .status{
    min-height:
      76px;

    font-size:
      17px;
  }

  .mode-btn{
    min-height:
      82px;

    font-size:
      25px;
  }

  .management-table{
    font-size:
      10px;
  }

  .management-table input,
  .management-table select{
    height:
      30px;

    padding:
      1px 2px;

    font-size:
      10px;
  }

  .comp-date-wrap{
    height:
      30px;
  }

  .comp-date-display{
    height:
      30px;

    line-height:
      24px;

    font-size:
      10px;

    padding:
      2px 3px;
  }

  .comp-date-picker{
    height:
      30px;
  }

  .officer-add{
    font-size:
      9px;
  }

  .officer-remove{
    flex-basis:
      20px;

    width:
      20px;

    height:
      20px;

    line-height:
      20px;
  }

  .month-add-row{
    grid-template-columns:
      minmax(0,1fr)
      auto;
  }

  .month-add-btn{
    padding:
      0 10px;
  }

}

</style>

</head>


<body>


<div class="page">


<header class="hero">

<h1>
🚙 運転手MENU
</h1>

</header>


<main class="card">


<!-- ======================================================
     MANAGEMENT BUTTONS
====================================================== -->

<div class="management-menu">

<button
  id="assignmentBtn"
  class="management-btn assignment-btn"
  type="button"
>
📋 担当表
</button>

<button
  id="compBtn"
  class="management-btn comp-btn"
  type="button"
>
🗓️ 代休取得
</button>

</div>


<!-- ======================================================
     DRIVER
====================================================== -->

<div class="top-row">

<div
  id="status"
  class="status"
>

<span id="statusIcon">
⏰
</span>

<span id="statusText">
⏳判別中⏳
</span>

</div>


<div class="select-box">

<label for="driverSelect">
選択
</label>

<select id="driverSelect">

<option value="">
選択して下さい
</option>

</select>

</div>

</div>


<!-- ======================================================
     MODE
====================================================== -->

<div class="mode-box">

<button
  id="inMode"
  class="mode-btn in"
  type="button"
  disabled
>
☀️出勤☀️
</button>

<button
  id="outMode"

/* ==========================================================

function toDateInputValue(
  value
){

  const text =
    String(
      value ||
      ''
    ).trim();


  if(
    !text
  ){

    return '';

  }


  let match =
    text.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      match[1] +
      '-' +
      pad2(
        match[2]
      ) +
      '-' +
      pad2(
        match[3]
      )
    );

  }


  match =
    text.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      match[1] +
      '-' +
      pad2(
        match[2]
      ) +
      '-' +
      pad2(
        match[3]
      )
    );

  }


  match =
    text.match(
      /^(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      new Date().getFullYear() +
      '-' +
      pad2(
        match[1]
      ) +
      '-' +
      pad2(
        match[2]
      )
    );

  }


  return '';

}


function formatSheetDate(
  value
){

  const text =
    String(
      value ||
      ''
    ).trim();


  if(
    !text
  ){

    return '';

  }


  let match =
    text.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      Number(
        match[2]
      ) +
      '/' +
      Number(
        match[3]
      )
    );

  }


  match =
    text.match(
      /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/
    );


  if(
    match
  ){

    return(
      Number(
        match[2]
      ) +
      '/' +
      Number(
        match[3]
      )
    );

  }


  return text;

}


function formatDisplayDate(

/* ==========================================================
   API / JSONP
========================================================== */

function callServer(
  operation,
  data={}
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const callback =
        'gasJsonp_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timer =
        setTimeout(
          ()=>{

            if(
              finished
            ){

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                'サーバー応答がタイムアウトしました'
              )
            );

          },
          API_TIMEOUT
        );


      function cleanup(){

        clearTimeout(
          timer
        );


        if(
          script.parentNode
        ){

          script.parentNode
            .removeChild(
              script
            );

        }


        try{

          delete window[
            callback
          ];

        }catch(_){

          window[
            callback
          ] =
            undefined;

        }

      }


      window[
        callback
      ] =
        function(
          response
        ){

          if(
            finished
          ){

            return;

          }


          finished =
            true;


          cleanup();


          if(
            !response ||
            response.ok !==
            true
          ){

            reject(
              new Error(
                response &&
                response.error
                  ? response.error
                  : 'Apps Script APIエラー'
              )
            );


            return;

          }


          resolve(
            response.data
          );

        };


      script.onerror =
        function(){

          if(
            finished
          ){

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              'Apps Script APIに接続できませんでした'
            )
          );

        };


      const params =
        new URLSearchParams();


      params.set(
        'action',
        'api'
      );


      params.set(
        'operation',
        operation
      );


      params.set(
        'callback',
        callback
      );


      params.set(
        '_',
        String(
          Date.now()
        )
      );


      params.set(
        'idToken',
        state.idToken ||
        ''
      );


      Object.keys(
        data
      ).forEach(
        key=>{

          params.set(
            key,
            data[key] ===
              undefined ||
            data[key] ===
              null
              ? ''
              : String(
                  data[key]
                )
          );

        }
      );


      script.src =
        API_URL +
        '?' +
        params.toString();


      document.body.appendChild(
        script
      );

    }
  );

}

function normalizeDriverDisplay(
  value,
  drivers
){

  let current =
    String(
      value ||
      ''
    ).trim();


  if(
    current ===
    '田中'
  ){

    current =
      '田中（ひ）';

  }


  if(
    drivers.includes(
      current
    )
  ){

    return current;

  }


  const normalized =
    current.replace(
      /\s+/g,
      ''
    );


  const found =
    drivers.find(
      name=>{

        const n =
          String(
            name ||
            ''
          )
          .replace(
            /\s+/g,
            ''
          );


        if(
          n ===
          normalized
        ){

          return true;

        }


        const surname =
          String(
            name ||
            ''
          )
          .trim()
          .split(
            /\s+/
          )[0];


        return(
          current ===
          surname
        );

      }
    );


  return(
    found ||
    current
  );

}

            current;


          old.textContent =
            current;


          select.appendChild(
            old
          );

        }


        select.value =
          current;


        select.addEventListener(
          'change',
          ()=>{

            values[index] =
              select.value;


            update();

          }
        );


        row.appendChild(
          select
        );


        if(
          values.length > 1

            document.createElement(

            );


          remove.type =
            'button';


          remove.className =
            'officer-remove';


          remove.textContent =

          remove.addEventListener(
            'click',
            ()=>{

              values.splice(
                index,
                1

              if(
                !values.length
              ){

                values =
                  [''];

              }


              update();


              render();

            }
          );


          row.appendChild(
            remove
          );

        }


        stack.appendChild(

        );

        );


        update();


        render();

      }
    );


    stack.appendChild(
      add
    );

  }


  render();


  return stack;

}


/* ==========================================================
   ASSIGNMENT
========================================================== */

function getCurrentYearMonth(){

  const d =
    new Date();


  return {
    year:
      d.getFullYear(),

    month:
      d.getMonth()+1
  };

}


function sortAssignmentRows(
  rows
){

  const current =
    getCurrentYearMonth();


  const currentIndex =
    current.year * 100 +
    current.month;


  return [
    ...rows
  ].sort(
    (
      a,
      b
    )=>{

      const aIndex =
        a.year * 100 +
        a.month;


      const bIndex =
        b.year * 100 +
        b.month;


      function distance(
        value
      ){

        let d =
          value -
          currentIndex;


        if(
          d < 0
        ){

          d += 1200;

        }


        return d;

      }


      return(
        distance(aIndex) -
        distance(bIndex)
      );

    }
  );

}


function makeFutureMonths(
  rows,
  count
){

  const existing =
    new Set(
      rows.map(
        row =>
          row.yearMonth
      )
    );


  const result =
    [];


  const now =
    new Date();


  let cursor =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );


  for(
    let i=0;
    result.length < count;
    i++
  ){

    const year =
      cursor.getFullYear();


    const month =
      cursor.getMonth()+1;


    const yearMonth =
      year +
      '/' +
      month;


    if(
      !existing.has(
        yearMonth
      )
    ){

      result.push({

        sheetRow:
          null,

        year:
          year,

        month:
          month,

        yearMonth:
          yearMonth,

        displayMonth:
          yearMonth,

        assignments:{

          ...(rows[0] &&
              rows[0].assignments
              ? Object.fromEntries(
                  Object.keys(
                    rows[0].assignments
                  )
                  .map(
                    key=>[
                      key,
                      ''
                    ]
                  )
                )
              : {}
          )

        }

      });

    }


    cursor.setMonth(
      cursor.getMonth()+1
    );

  }


  return result;

}


function renderAssignmentTable(
  data
){

  const wrap =
    el.assignmentPanel;


  wrap.innerHTML =
    '';


  wrap.classList.remove(
    'hidden'
  );


  const driverNames =
    getMasterDrivers(
      data
    );


  /*
   * 元データ
   */

  const sourceRows =
    Array.isArray(
      data.rows
    )
      ? data.rows
      : [];


  /*
   * 現在月を先頭にして
   * 12か月だけ表示
   */

  let rows =
    sortAssignmentRows(
      sourceRows
    );


  /*
   * 現在月から12か月分を生成
   * 足りない月は画面上だけ追加
   */

  const current =
    getCurrentYearMonth();


  const rowMap =
    new Map();


  rows.forEach(
    row => {

      rowMap.set(
        row.yearMonth,
        row
      );

    }
  );


  const displayRows =
    [];


  for(
    let i=0;
    i<12;
    i++
  ){

    const d =
      new Date(
        current.year,
        current.month-1+i,
        1
      );


    const year =
      d.getFullYear();


    const month =
      d.getMonth()+1;


    const yearMonth =
      year +
      '/' +
      month;


    if(
      rowMap.has(
        yearMonth
      )
    ){

      displayRows.push(
        rowMap.get(
          yearMonth
        )
      );

    }else{

      displayRows.push({

        sheetRow:
          null,

        year:
          year,

        month:
          month,

        yearMonth:
          yearMonth,

        displayMonth:
          yearMonth,

        assignments:
          {}

      });

    }

  }


  /*
   * 役員
   */

  const officers =
    Array.isArray(
      data.officers
    ) &&
    data.officers.length
      ? data.officers
      : [
          '安田副社長',
          '伊藤社長',
          '山下副社長',
          '西山副社長'
        ];


  /*
   * 操作用配列
   */

  data.rows =
    displayRows;


  /* --------------------------------------------------------
     タイトル
  -------------------------------------------------------- */

  const toolbar =
    document.createElement(
      'div'
    );


  toolbar.className =
    'assignment-toolbar';


  const info =
    document.createElement(
      'div'
    );


  info.className =
    'assignment-info';


  info.textContent =
    '現在月を先頭に12か月表示';


  const note =
    document.createElement(
      'div'
    );


  note.className =
    'assignment-sort-note';


  note.textContent =
    '過去月も保存';


  toolbar.appendChild(
    info
  );


  toolbar.appendChild(
    note
  );


  wrap.appendChild(
    toolbar
  );


  /* --------------------------------------------------------
     table
  -------------------------------------------------------- */

  const table =
    document.createElement(
      'table'
    );


  table.className =
    'management-table';


  const thead =
    document.createElement(
      'thead'
    );


  const hrow =
    document.createElement(
      'tr'
    );


  const h1 =
    document.createElement(
      'th'
    );


  h1.textContent =
    '月';


  hrow.appendChild(
    h1
  );


  officers.forEach(
    officer=>{

      const th =
        document.createElement(
          'th'
        );


      th.textContent =
        officer ===
        '伊藤副社長'
          ? '伊藤社長'
          : officer;


      hrow.appendChild(
        th
      );

    }
  );


  thead.appendChild(
    hrow
  );


  table.appendChild(
    thead
  );


  const tbody =
    document.createElement(
      'tbody'
    );


  displayRows.forEach(
    (
      row,
      rowIndex
    )=>{

      const tr =
        document.createElement(
          'tr'
        );


      const now =
        getCurrentYearMonth();


      const isCurrent =
        Number(
          row.year
        ) ===
        Number(
          now.year
        ) &&
        Number(
          row.month
        ) ===
        Number(
          now.month
        );


      if(
        isCurrent
      ){

        tr.classList.add(
          'current-month-row'
        );

      }


      const monthCell =
        document.createElement(
          'th'
        );


      monthCell.textContent =
        row.month +
        '月';


      tr.appendChild(
        monthCell
      );


      officers.forEach(
        officer=>{

          const td =
            document.createElement(
              'td'
            );


          const select =
            createNameSelect(
              driverNames,

              row.assignments &&
              row.assignments[
                officer
              ]
                ? row.assignments[
                    officer
                  ]
                : '',

              value=>{

                if(
                  !data.rows[
                    rowIndex
                  ].assignments
                ){

                  data.rows[
                    rowIndex
                  ].assignments =
                    {};

                }


                data.rows[
                  rowIndex
                ].assignments[
                  officer
                ] =
                  value;

              }
            );


          td.appendChild(
            select
          );


          tr.appendChild(
            td
          );

        }
      );


      tbody.appendChild(
        tr
      );

    }
  );


  table.appendChild(
    tbody
  );


  wrap.appendChild(
    table
  );


  /* --------------------------------------------------------
     月追加
  -------------------------------------------------------- */

  const addWrap =
    document.createElement(
      'div'
    );


  addWrap.className =
    'month-add-wrap';


  const addTitle =
    document.createElement(
      'div'
    );


  addTitle.className =
    'month-add-title';


  addTitle.textContent =
    '必要な月を追加';


  addWrap.appendChild(
    addTitle
  );


  const addRow =
    document.createElement(
      'div'
    );


  addRow.className =
    'month-add-row';


  const addSelect =
    document.createElement(
      'select'
    );


  addSelect.className =
    'month-add-select';


  /*
   * 現在月から24か月先まで
   */

  const existingMonths =
    new Set(
      displayRows.map(
        row =>
          row.yearMonth
      )
    );


  const candidates =
    [];


  const base =
    new Date(
      current.year,
      current.month-1,
      1
    );


  for(
    let i=0;
    i<24;
    i++
  ){

    const d =
      new Date(
        base.getFullYear(),
        base.getMonth()+i,
        1
      );


    const year =
      d.getFullYear();


    const month =
      d.getMonth()+1;


    const yearMonth =
      year +
      '/' +
      month;


    if(
      !existingMonths.has(
        yearMonth
      )
    ){

      candidates.push({
        year:
          year,

        month:
          month,

        yearMonth:
          yearMonth

      });

    }

  }


  if(
    candidates.length ===
    0
  ){

    const none =
      document.createElement(
        'option'
      );


    none.value =
      '';


    none.textContent =
      '追加できる月はありません';


    addSelect.appendChild(
      none
    );


  }else{

    candidates.forEach(
      item=>{

        const option =
          document.createElement(
            'option'
          );


        option.value =
          item.yearMonth;


        option.textContent =
          item.year +
          '/' +
          item.month +
          '月';


        addSelect.appendChild(
          option
        );

      }
    );

  }


  const addButton =
    document.createElement(
      'button'
    );


  addButton.type =
    'button';


  addButton.className =
    'month-add-btn';


  addButton.textContent =
    '＋ 月を追加';


  addButton.disabled =
    candidates.length ===
    0;


  addButton.addEventListener(
    'click',
    ()=>{

      const value =
        addSelect.value;


      if(
        !value
      ){

        return;

      }


      const parts =
        value.split('/');


      const year =
        Number(
          parts[0]
        );


      const month =
        Number(
          parts[1]
        );


      /*
       * 現在の表示12か月に
       * 新しい月を追加
       */

      data.rows.push({

        sheetRow:
          null,

        year:
          year,

        month:
          month,

        yearMonth:
          value,

        displayMonth:
          value,

        assignments:
          {}

      });


      renderAssignmentTable(
        data
      );

    }
  );


  addRow.appendChild(
    addSelect
  );


  addRow.appendChild(
    addButton
  );


  addWrap.appendChild(
    addRow
  );


  wrap.appendChild(
    addWrap
  );

}

          );

            document.createElement(
              'td'
            );

              row.startDate,

                  key
                ][
                  rowIndex
                ].startDate =

              }
            );


          td.appendChild(
            dateInput
          );


          tr.appendChild(
            td
          );

        }


        /* ==================================================
           代休日
        ================================================== */

        {

          const td =
            document.createElement(
              'td'
            );


          const dateInput =
            createDateInput(
              row.compDate,

              value=>{

                managementState[
                  key
                ][
                  rowIndex
                ].compDate =
                  value;

              }
            );


          td.appendChild(
            dateInput

          tr.appendChild(

          );

          ''

      renderCompTable(
        data

    }
  );


  wrap.appendChild(
    addBtn
  );


  /* ======================================================
     取得済み
  ====================================================== */

  wrap.appendChild(
    makeSection(
      '取得済み',
      data.completed,
      'completed',
      '担当者'
    )
  );

async function openManagement(
  mode
){

  managementMode =
    mode;


  managementState =
    null;


  el.managementPanel
    .classList
    .remove(
      'hidden'
    );


  el.managementTitle.textContent =
    mode ===
    'assignment'
      ? '📋 担当表'
      : '🗓️ 代休取得';


  el.managementLoading
    .classList
    .remove(
      'hidden'
    );


  el.managementLoading.textContent =
    '読み込み中...';


  el.assignmentPanel
    .classList
    .add(
      'hidden'
    );


  el.compPanel
    .classList
    .add(
      'hidden'
    );


  el.managementSave
    .classList
    .add(
      'hidden'
    );


  try{

    const result =
      await callServer(
        'getManagementData',
        {

          sheetType:
            mode,

          selectedDriverKey:
            state.driver
              ? state.driver.driverKey
              : ''

        }
      );


    if(
      !result ||
      result.ok !==
      true
    ){

      throw new Error(
        'データを取得できませんでした'
      );

    }


    managementState =
      result;


    el.managementLoading
      .classList
      .add(
        'hidden'
      );


    if(
      mode ===
      'assignment'
    ){

      renderAssignmentTable(
        result
      );

    }else{

      renderCompTable(
        result
      );

    }


    el.managementSave
      .classList
      .remove(
        'hidden'
      );


    setTimeout(
      ()=>{

        el.managementPanel
          .scrollIntoView({

            behavior:
              'smooth',

            block:
              'start'

          });

      },
      50
    );


  }catch(error){

    console.error(
      error
    );


    el.managementLoading.textContent =
      error.message ||
      '読み込みに失敗しました';

  }

}

   SAVE
========================================================== */

el.managementSave
  .addEventListener(
    'click',
    async()=>{

      if(
        !managementState
      ){

        return;

      }


      el.managementSave.disabled =
        true;


      el.managementSave.textContent =
        '保存中...';


      try{

        const result =
          await callServer(
            'saveManagementData',
            {

              sheetType:
                managementMode,

              selectedDriverKey:
                state.driver
                  ? state.driver.driverKey
                  : '',

              payload:
                JSON.stringify(
                  managementState
                )

            }
          );


        if(
          !result ||
          result.ok !==
          true
        ){

          throw new Error(
            '保存に失敗しました'
          );

        }


        alert(
          'スプレッドシートへ保存しました。'
        );


        await openManagement(
          managementMode
        );


      }catch(error){

        console.error(
          error
        );


        alert(
          error.message ||
          '保存に失敗しました'
        );


      }finally{

        el.managementSave.disabled =
          false;


        el.managementSave.textContent =
          '保存する';

      }

    }
  );

  state.mode =
    mode;


  state.draft =
    null;


  el.inMode

    .toggle(
      'off',
      mode !==
      'in'
    );


  el.outMode
    .classList
    .toggle(
      'off',
      mode !==
      'out'
    );


  el.preview

      'show'
    );

  el.photoInput.value =

      .add(

    el.nextTimeField

        !state.driver
      ){

        alert(
          '人物を選択してください'
        );


        return;

      }


      const memo =
        String(
          el.memo.value ||
          ''
        ).trim();


      const message =
        buildReportBaseMessage() +
        (
          memo
            ? '\n' +
              memo
            : ''
        );


      el.sendBtn.disabled =
        true;


      showNotice(
        '送信中です...'
      );


      try{

        const result =
          await callServer(
            'sendAttendance',
            {

              selectedDriverKey:
                state.driver.driverKey,

              message:
                message

            }
          );


        if(
          !result ||
          result.ok !==
          true
        ){

          throw new Error(
            '送信に失敗しました'
          );

        }


        showNotice(
          '送信完了しました。'
        );


        state.draft =
          null;


        el.preview
          .classList
          .remove(
            'show'
          );


        el.photoInput.value =
          '';


        el.memo.value =
          '';


      }catch(error){

        console.error(
          error
        );


        showNotice(
          error.message ||
          '送信に失敗しました'
        );


      }finally{

        el.sendBtn.disabled =
          false;

      }

    }
  );


/* ==========================================================
   INPUT EVENTS
========================================================== */

[
  el.reportDate,
  el.startTime,
  el.endTime,
  el.nextDate,
  el.nextTime,
  el.memo
]
.forEach(
  input=>{

    input.addEventListener(
      'input',
      refreshMessage
    );


    input.addEventListener(
      'change',
      refreshMessage
    );

  }
);


/* ==========================================================
   AUTO DETECT
========================================================== */

async function autoDetect(){

  setStatus(
    '判別中',
    false
  );


  try{

    if(
      typeof liff ===
      'undefined'
    ){

      throw new Error(
        'LIFF SDKが読み込まれていません'
      );

    }


    await liff.init({
      liffId:
        LIFF_ID
    });


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      !liff.isLoggedIn()
    ){

      state.idToken =
        '';


      setStatus(
        '右から選択',
        false
      );


      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      setStatus(
        '右から選択',
        false
      );


      return;

    }


    const info =
      await callServer(
        'getDriverInfo'
      );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      return;

    }


    if(
      info &&
      info.found &&
      info.driverKey
    ){

      const driver =
        findDriver(
          info.driverKey
        );


      if(
        driver
      ){

        await selectDriver(
          driver,
          false
        );


        setStatus(
          '完了',
          true
        );


        return;

      }

    }


    setStatus(
      '右から選択',
      false
    );


  }catch(error){

    console.warn(
      '自動判別失敗',
      error
    );


    if(
      state.userSelectedManually &&
      state.driver
    ){

      setStatus(
        '完了',
        true
      );

    }else{

      setStatus(
        '右から選択',
        false
      );

    }

  }

}


/* ==========================================================
   NEXT TIME
========================================================== */

function buildNextTimeOptions(){

  el.nextTime.innerHTML =
    '';


  for(
    let hour=0;
    hour<24;
    hour++
  ){

    for(
      let minute=0;
      minute<60;
      minute++
    ){

      const value =
        pad2(
          hour
        ) +
        ':' +
        pad2(
          minute
        );


      const option =
        document.createElement(
          'option'
        );


      option.value =
        value;


      option.textContent =
        value;


      el.nextTime.appendChild(
        option
      );

    }

  }


  const unknown =
    document.createElement(
      'option'
    );


  unknown.value =
    '??:??';


  unknown.textContent =
    '??:??';


  el.nextTime.appendChild(
    unknown
  );


  el.nextTime.value =
    '08:00';

}


/* ==========================================================
   INIT
========================================================== */

window.addEventListener(
  'load',
  async()=>{

    buildNextTimeOptions();


    el.reportDate.value =
      today();


    el.startTime.value =
      nowTime();


    el.nextDate.value =
      tomorrow();


    el.nextTime.value =
      '08:00';


    el.memo.value =
      '';


    state.driver =
      null;


    state.userSelectedManually =
      false;


    el.inMode.disabled =
      true;


    el.outMode.disabled =
      true;


    el.uploadBtn.disabled =
      true;


    setMode(
      'in'
    );


    setStatus(
      '判別中',
      false
    );


    await loadDrivers();


    autoDetect();

  }
);
