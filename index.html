<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#fff;
  --line:#d5eaf7;
  --text:#17324d;
  --muted:#6b8296;
  --blue:#1676c7;
  --blue2:#2d88d8;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--text);
  background:linear-gradient(var(--bg),var(--bg2));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}
.hero{
  position:relative;
  overflow:hidden;
  padding:21px 10px 23px;
  border-radius:26px;
  text-align:center;
  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );
  box-shadow:var(--shadow);
}
.hero h1{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--blue);
  font-size:30px;
  line-height:1.15;
  font-weight:900;
  white-space:nowrap;
}
.card{
  margin-top:12px;
  padding:13px;
  border-radius:24px;
  background:rgba(255,255,255,.97);
  box-shadow:var(--shadow);
}
.top-row{
  display:grid;
  grid-template-columns:158px minmax(0,1fr);
  gap:8px;
  align-items:stretch;
}
.status{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px;
  border-radius:20px;
  background:#f3fbff;
  border:1px solid var(--line);
  color:var(--blue);
  font-size:18px;
  font-weight:900;
  text-align:center;
}
.status.done{
  background:#eefbf3;
  border-color:#ccefd8;
  color:var(--green);
}
.select-box{
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#f9fdff;
}
.select-box label,
.field-title,
.memo-title{
  display:block;
  margin-bottom:5px;
  color:#637c90;
  font-size:13px;
  font-weight:900;
}
select,
input[type="date"],
input[type="time"],
textarea{
  width:100%;
  border:1px solid #cfe4f3;
  border-radius:12px;
  background:#fff;
  color:var(--text);
  outline:none;
}
select,
input[type="date"],
input[type="time"]{
  height:44px;
  padding:0 10px;
  font-size:16px;
  font-weight:800;
}
select:focus,
input:focus,
textarea:focus{
  border-color:#63b4ea;
  box-shadow:0 0 0 3px rgba(99,180,234,.12);
}
.assignment{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  margin-top:8px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#f6fcff;
  color:#496a82;
  font-size:14px;
  font-weight:900;
  text-align:center;
}
.assignment.ready{
  color:var(--blue);
  background:#eef9ff;
}
.mode-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.mode-btn{
  min-height:90px;
  border:0;
  border-radius:20px;
  font-size:28px;
  font-weight:900;
  transition:.12s;
}
.mode-btn:active{transform:scale(.99)}
.mode-btn.in{
  background:linear-gradient(#73cdf8,#7dd77a);
  color:#084e78;
}
.mode-btn.out{
  background:linear-gradient(#1b357c,#0e1e4d);
  color:#fff;
}
.mode-btn.off{
  opacity:.38;
  filter:grayscale(.18);
}
.guide{
  margin:9px 4px;
  color:var(--blue);
  font-size:13px;
  font-weight:900;
  text-align:center;
}
.upload-btn{
  width:100%;
  min-height:54px;
  border:1px solid #cfe8f7;
  border-radius:17px;
  background:#eaf7ff;
  color:var(--blue);
  font-size:17px;
  font-weight:900;
}
.upload-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.notice{
  display:none;
  margin-top:9px;
  padding:9px 11px;
  border-radius:12px;
  background:#f7fcff;
  color:#5c7588;
  font-size:12px;
  line-height:1.45;
  text-align:center;
}
.notice.show{display:block}
.preview{
  display:none;
  margin-top:11px;
}
.preview.show{display:block}
.preview-box{
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
}
.photo-preview{
  display:block;
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:14px;
  background:#eef4f8;
}
.ocr-title{
  margin:11px 0 5px;
  color:var(--blue);
  font-size:16px;
  font-weight:900;
}
.ocr-text{
  max-height:120px;
  overflow:auto;
  padding:8px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#f9fdff;
  color:#526c80;
  font-size:11px;
  white-space:pre-wrap;
}
.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}
.field{
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--soft);
}
.field.full{grid-column:1/-1}
.field-title{margin-bottom:4px}
#nextDate{font-size:15px;letter-spacing:-.4px}
.summary{
  grid-column:1/-1;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#446276;
  text-align:center;
  font-size:13px;
  font-weight:800;
}
.summary strong{color:var(--blue)}
.message-box{
  margin-top:9px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#f7fcff;
}
.message-preview{
  white-space:pre-line;
  font-size:14px;
  line-height:1.7;
  color:#15446e;
  font-weight:700;
}
.memo-title{
  margin-top:10px;
}
#memo{
  min-height:90px;
  margin-top:5px;
  padding:10px;
  resize:vertical;
  font-size:14px;
}
.send-btn{
  width:100%;
  min-height:54px;
  margin-top:9px;
  border:0;
  border-radius:17px;
  background:linear-gradient(#56baf0,#2d88d8);
  color:#fff;
  font-size:18px;
  font-weight:900;
}
.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.history{
  margin-top:16px;
  padding-top:13px;
  border-top:1px solid #e2eef6;
}
.history-title{
  margin:0 0 8px;
  color:var(--blue);
  font-size:20px;
  font-weight:900;
  text-align:center;
}
.history-list{
  list-style:none;
  padding:0;
  margin:0;
}
.history-list li{
  display:grid;
  grid-template-columns:84px 42px minmax(78px,1fr) 26px;
  gap:4px;
  align-items:center;
  padding:9px 1px;
  border-bottom:1px solid #edf4fa;
  color:#496173;
  font-size:12px;
  white-space:nowrap;
}
.history-date{font-weight:800}
.history-type{
  color:var(--blue);
  font-weight:900;
}
.history-time{
  color:var(--text);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
}
.history-ok{
  color:var(--green);
  font-size:16px;
  font-weight:900;
  text-align:right;
}
.empty{
  display:block!important;
  text-align:center;
  color:#7a90a3;
}
.footer{
  padding:14px 10px 4px;
  color:#8aa0b2;
  font-size:13px;
  text-align:center;
}
.hidden{display:none!important}
@media(max-width:480px){
  .page{padding:10px 9px 20px}
  .hero{padding:20px 10px 21px}
  .hero h1{font-size:30px}
  .card{padding:11px}
  .top-row{grid-template-columns:145px minmax(0,1fr)}
  .status{min-height:76px;font-size:17px}
  .mode-btn{min-height:82px;font-size:25px}
  .history-list li{
    grid-template-columns:auto auto minmax(70px,1fr) 24px;
  }
}
</style>
</head>

<body>

<div class="page">

<header class="hero">
  <h1>🚙 運転手MENU</h1>
</header>

<main class="card">

  <div class="top-row">

    <div id="status" class="status">
      <span id="statusIcon">⏳</span>
      <span id="statusText">自動判別中...</span>
    </div>

    <div class="select-box">
      <label for="driverSelect">人物選択</label>
      <select id="driverSelect">
        <option value="">人物を選択してください</option>
      </select>
    </div>

  </div>

  <div id="assignment" class="assignment">
    👔 今月の担当：確認中...
  </div>

  <div class="mode-box">

    <button
      id="inMode"
      class="mode-btn in"
      type="button"
      disabled
    >
      ☀️ 出勤
    </button>

    <button
      id="outMode"
      class="mode-btn out off"
      type="button"
      disabled
    >
      🌙 退勤
    </button>

  </div>

  <div class="guide">
    必要な場合は修正お願いします。
  </div>

  <!-- ★ captureを削除して写真ライブラリも選択可能 -->
  <input
    id="photoInput"
    type="file"
    accept="image/*"
    class="hidden"
  >

  <button
    id="uploadBtn"
    class="upload-btn"
    type="button"
    disabled
  >
    📷 写真を撮影・選択して読み取る
  </button>

  <div id="notice" class="notice"></div>

  <section id="preview" class="preview">

    <div class="preview-box">

      <img
        id="photoPreview"
        class="photo-preview"
        alt="勤怠写真"
      >

      <div class="ocr-title">
        📷 写真の読み取り結果
      </div>

      <div
        id="ocrText"
        class="ocr-text"
      ></div>

      <div class="fields">

        <div class="field">
          <label
            class="field-title"
            for="reportDate"
          >
            日付
          </label>

          <input
            id="reportDate"
            type="date"
          >
        </div>

        <div class="field">
          <label
            class="field-title"
            for="reportTime"
          >
            時間
          </label>

          <input
            id="reportTime"
            type="time"
          >
        </div>

        <div
          id="startField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="startTime"
          >
            出勤時間
          </label>

          <input
            id="startTime"
            type="time"
          >
        </div>

        <div
          id="endField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="endTime"
          >
            退勤時間
          </label>

          <input
            id="endTime"
            type="time"
          >
        </div>

        <div
          id="nextDateField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="nextDate"
          >
            次回出勤日
          </label>

          <input
            id="nextDate"
            type="date"
          >
        </div>

        <div
          id="nextTimeField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="nextTime"
          >
            次回出勤時間
          </label>

          <input
            id="nextTime"
            type="time"
            value="08:00"
          >
        </div>

        <div
          id="summary"
          class="summary"
        >
          前回残業 <strong>0:00</strong>
          　
          月間合計 <strong>0:00</strong>
        </div>

      </div>

      <div class="message-box">

        <div class="ocr-title">
          送信する文章
        </div>

        <div
          id="messagePreview"
          class="message-preview"
        ></div>

        <div class="memo-title">
          追加文章（任意）
        </div>

        <textarea
          id="memo"
          placeholder="追加文章を入力できます"
        ></textarea>

      </div>

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        disabled
      >
        写真＋報告文章を送信
      </button>

    </div>

  </section>

  <section class="history">

    <h2 class="history-title">
      履歴
    </h2>

    <ul
      id="historyList"
      class="history-list"
    >
      <li class="empty">
        人物を選択すると履歴を表示します
      </li>
    </ul>

  </section>

</main>

<footer class="footer">
  勤怠管理Bot
</footer>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbySmhEE3JyfWGxEylyWscOtqL3FTIH9Ww6nybcAGb0f_kw2QXVP-LaoVtT1eFRtv-4Lyw/exec';

const LIFF_ID =
  '2011011273-HIdBF1sM';


const el = {

  status:
    document.getElementById('status'),

  statusIcon:
    document.getElementById('statusIcon'),

  statusText:
    document.getElementById('statusText'),

  driverSelect:
    document.getElementById('driverSelect'),

  assignment:
    document.getElementById('assignment'),

  inMode:
    document.getElementById('inMode'),

  outMode:
    document.getElementById('outMode'),

  uploadBtn:
    document.getElementById('uploadBtn'),

  photoInput:
    document.getElementById('photoInput'),

  notice:
    document.getElementById('notice'),

  preview:
    document.getElementById('preview'),

  photoPreview:
    document.getElementById('photoPreview'),

  ocrText:
    document.getElementById('ocrText'),

  reportDate:
    document.getElementById('reportDate'),

  reportTime:
    document.getElementById('reportTime'),

  startField:
    document.getElementById('startField'),

  endField:
    document.getElementById('endField'),

  startTime:
    document.getElementById('startTime'),

  endTime:
    document.getElementById('endTime'),

  nextDateField:
    document.getElementById('nextDateField'),

  nextTimeField:
    document.getElementById('nextTimeField'),

  nextDate:
    document.getElementById('nextDate'),

  nextTime:
    document.getElementById('nextTime'),

  summary:
    document.getElementById('summary'),

  messagePreview:
    document.getElementById('messagePreview'),

  memo:
    document.getElementById('memo'),

  sendBtn:
    document.getElementById('sendBtn'),

  historyList:
    document.getElementById('historyList')

};


const state = {

  idToken:
    '',

  drivers:
    [],

  driver:
    null,

  mode:
    'in',

  draft:
    null,

  workState:{
    hasWork:false,
    startTime:''
  },

  summary:{
    previousOvertime:'0:00',
    monthlyOvertime:'0:00'
  },

  history:
    []

};


function pad2(value){

  return String(
    value
  ).padStart(
    2,
    '0'
  );

}


function today(){

  const d=new Date();

  return(
    d.getFullYear()+
    '-' +
    pad2(d.getMonth()+1)+
    '-' +
    pad2(d.getDate())
  );

}


function nowTime(){

  const d=new Date();

  return(
    pad2(d.getHours())+
    ':'+
    pad2(d.getMinutes())
  );

}


function tomorrow(){

  const d=new Date();

  d.setDate(
    d.getDate()+1
  );

  return(
    d.getFullYear()+
    '-' +
    pad2(d.getMonth()+1)+
    '-' +
    pad2(d.getDate())
  );

}


function dateText(value){

  if(!value)return '';

  const d=new Date(
    value+'T00:00:00'
  );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return value;
  }

  const week=[
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return(
    d.getFullYear()+
    '/' +
    (d.getMonth()+1)+
    '/' +
    d.getDate()+
    '('+
    week[d.getDay()]+
    ')'
  );

}


function shortDate(value){

  if(!value)return '';

  const d=new Date(
    value+'T00:00:00'
  );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return value;
  }

  const week=[
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return(
    (d.getMonth()+1)+
    '/' +
    d.getDate()+
    '('+
    week[d.getDay()]+
    ')'
  );

}


function nextAttendanceLabel(value){

  if(!value)return '次回';

  const base=
    new Date(
      today()+'T00:00:00'
    );

  const target=
    new Date(
      value+'T00:00:00'
    );

  const diff=
    Math.round(
      (
        target.getTime()-
        base.getTime()
      )/
      86400000
    );

  if(diff===1){
    return '明日';
  }

  if(diff===2){
    return '明後日';
  }

  const baseDay=
    base.getDay()||7;

  const targetDay=
    target.getDay()||7;

  const monday=
    new Date(base);

  monday.setDate(
    base.getDate()-
    baseDay+
    1
  );

  const nextMonday=
    new Date(monday);

  nextMonday.setDate(
    monday.getDate()+7
  );

  const targetMonday=
    new Date(target);

  targetMonday.setDate(
    target.getDate()-
    targetDay+
    1
  );

  if(
    nextMonday.getTime()===
    targetMonday.getTime()
  ){
    return '来週';
  }

  return '次回';
}


function escapeHtml(value){

  return String(
    value??''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#39;'
  );

}


function setStatus(
  text,
  done
){

  el.statusText.textContent=
    text;

  el.statusIcon.textContent=
    done
      ? '✓'
      : '⏳';

  el.status.classList.toggle(
    'done',
    !!done
  );

}


function showNotice(text){

  el.notice.textContent=
    text||'';

  el.notice.classList.toggle(
    'show',
    !!text
  );

}


/* ============================================================
   API
   ============================================================ */

async function callServer(
  operation,
  data={}
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const requestId=
        'req_'+
        Date.now()+
        '_'+
        Math.random()
          .toString(36)
          .slice(2);

      const params=
        new URLSearchParams();

      params.append(
        'action',
        'api'
      );

      params.append(
        'operation',
        operation
      );

      params.append(
        'requestId',
        requestId
      );

      params.append(
        'idToken',
        state.idToken||''
      );

      Object.keys(data).forEach(
        key=>{
          params.append(
            key,
            data[key]??''
          );
        }
      );

      fetch(
        API_URL,
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body:
            params.toString(),
          mode:'no-cors'
        }
      )
      .catch(
        error=>{
          console.warn(
            'API POST失敗',
            error
          );
        }
      );

      pollApi(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


function pollApi(
  requestId,
  resolve,
  reject,
  attempt
){

  if(
    attempt>=50
  ){

    reject(
      new Error(
        'サーバー応答がタイムアウトしました'
      )
    );

    return;
  }

  const callback=
    'gasCallback_'+
    Date.now()+
    '_'+
    attempt;

  const script=
    document.createElement(
      'script'
    );

  let finished=false;

  function cleanup(){

    if(
      script.parentNode
    ){
      script.parentNode.removeChild(
        script
      );
    }

    try{
      delete window[callback];
    }catch(_){
      window[callback]=undefined;
    }

  }

  window[callback]=
    function(response){

      if(finished){
        return;
      }

      finished=true;
      cleanup();

      if(
        response&&
        (
          response.status==='pending'||
          response.status==='processing'
        )
      ){

        setTimeout(
          ()=>{
            pollApi(
              requestId,
              resolve,
              reject,
              attempt+1
            );
          },
          500
        );

        return;
      }

      if(
        !response||
        response.ok!==true
      ){

        reject(
          new Error(
            response&&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );

        return;
      }

      resolve(
        response.data
      );

    };

  script.onerror=
    function(){

      if(finished){
        return;
      }

      finished=true;
      cleanup();

      setTimeout(
        ()=>{
          pollApi(
            requestId,
            resolve,
            reject,
            attempt+1
          );
        },
        500
      );

    };

  script.src=
    API_URL+
    '?action=pollApi'+
    '&requestId='+
    encodeURIComponent(
      requestId
    )+
    '&callback='+
    encodeURIComponent(
      callback
    )+
    '&_='+
    Date.now();

  document.body.appendChild(
    script
  );

}


/* ============================================================
   人物
   ============================================================ */

function findDriver(key){

  return(
    state.drivers.find(
      driver=>
        driver.driverKey===
        key
    )||
    null
  );

}


async function loadDrivers(){

  try{

    const list=
      await callServer(
        'getDriverList'
      );

    state.drivers=
      Array.isArray(list)
        ? list
        : [];

    renderDrivers();

  }catch(error){

    console.error(
      '人物一覧取得失敗',
      error
    );

    showNotice(
      '人物一覧を取得できませんでした'
    );

  }

}


function renderDrivers(){

  el.driverSelect.innerHTML=
    '<option value="">人物を選択してください</option>';

  state.drivers.forEach(
    driver=>{

      const option=
        document.createElement(
          'option'
        );

      option.value=
        driver.driverKey;

      option.textContent=
        driver.displayName;

      el.driverSelect.appendChild(
        option
      );

    }
  );

  if(state.driver){

    el.driverSelect.value=
      state.driver.driverKey;

  }

}


async function selectDriver(driver){

  if(!driver){

    state.driver=null;

    el.inMode.disabled=true;
    el.outMode.disabled=true;
    el.uploadBtn.disabled=true;

    el.assignment.textContent=
      '👔 今月の担当：未選択';

    el.historyList.innerHTML=
      '<li class="empty">人物を選択すると履歴を表示します</li>';

    setStatus(
      '人物を選択してください',
      false
    );

    return;
  }

  state.driver=
    driver;

  el.driverSelect.value=
    driver.driverKey;

  el.inMode.disabled=false;
  el.outMode.disabled=false;
  el.uploadBtn.disabled=false;

  setStatus(
    '完了',
    true
  );

  await Promise.allSettled([
    loadCurrentAssignment(),
    loadServerState()
  ]);

}


async function autoDetect(){

  setStatus(
    '自動判別中...',
    false
  );

  try{

    if(
      typeof liff==='undefined'
    ){
      throw new Error(
        'LIFF SDKが読み込まれていません'
      );
    }

    await liff.init({
      liffId:LIFF_ID
    });

    if(
      !liff.isLoggedIn()
    ){

      setStatus(
        'LINEログインが必要です',
        false
      );

      return;
    }

    state.idToken=
      liff.getIDToken()||
      '';

    if(
      !state.idToken
    ){

      throw new Error(
        'LINE ID Tokenを取得できませんでした'
      );

    }

    const info=
      await callServer(
        'getDriverInfo'
      );

    console.log(
      'getDriverInfo:',
      info
    );

    if(
      info&&
      info.found&&
      info.driverKey
    ){

      const driver=
        findDriver(
          info.driverKey
        );

      if(driver){

        await selectDriver(
          driver
        );

        setStatus(
          '完了',
          true
        );

        return;
      }

    }

    setStatus(
      '人物を選択してください',
      false
    );

  }catch(error){

    console.error(
      '自動判別失敗:',
      error
    );

    setStatus(
      '人物を選択してください',
      false
    );

    showNotice(
      '自動判別できませんでした。人物を選択してください。'
    );

  }

}

   今月の担当
   ============================================================ */

async function loadCurrentAssignment(){

  if(!state.driver){

    el.assignment.textContent=
      '👔 今月の担当：未選択';

    return;
  }

  el.assignment.textContent=
    '👔 今月の担当：確認中...';

  try{

    const result=
      await callServer(
        'getCurrentAssignment',
        {
          selectedDriverKey:
            state.driver.driverKey
        }
      );

    if(
      result&&
      result.found&&
      result.officerName
    ){

      el.assignment.textContent=
        '👔 今月の担当：'+
        result.officerName;

      el.assignment.classList.add(
        'ready'
      );

    }else{

      el.assignment.textContent=
        '👔 今月の担当：未設定';

      el.assignment.classList.remove(
        'ready'
      );

    }

  }catch(error){

    console.error(
      '担当取得失敗',
      error
    );

    el.assignment.textContent=
      '👔 今月の担当：取得できません';

  }

}

function setMode(mode){

  state.mode=
    mode;

  state.draft=
    null;

  el.inMode.classList.toggle(
    'off',
    mode!=='in'
  );

  el.outMode.classList.toggle(
    'off',
    mode!=='out'
  );

  el.preview.classList.remove(
    'show'
  );

  el.sendBtn.disabled=
    true;

  el.photoInput.value=
    '';

  showNotice('');

  if(mode==='in'){

    el.startField.classList.add(
      'hidden'
    );

    el.endField.classList.add(
      'hidden'
    );

    el.nextDateField.classList.add(
      'hidden'
    );

    el.nextTimeField.classList.add(
      'hidden'
    );

  }else{

    el.startField.classList.remove(
      'hidden'
    );

    el.endField.classList.remove(
      'hidden'
    );

    el.nextDateField.classList.remove(
      'hidden'
    );

    el.nextTimeField.classList.remove(
      'hidden'
    );

    el.nextDate.value=
      tomorrow();

    el.nextTime.value=
      '08:00';

    el.startTime.value=
      state.workState.startTime||
      '';

    el.endTime.value=
      nowTime();

  }

}
