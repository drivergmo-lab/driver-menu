<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

:root{

  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#ffffff;
  --line:#d5eaf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);

}


*{

  box-sizing:border-box;

}


html,
body{

  margin:0;
  padding:0;

}


body{

  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      var(--bg),
      var(--bg2)
    );

}


button,
input,
select,
textarea{

  font:inherit;

}


button{

  cursor:pointer;

}


.page{

  width:min(760px,100%);

  margin:0 auto;

  padding:
    12px
    10px
    24px;

}


/* ============================================================
   ヘッダー
============================================================ */

.hero{

  position:relative;

  overflow:hidden;

  padding:
    21px
    10px
    23px;

  border-radius:26px;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      #bfeaff 0%,
      #e9f9ff 70%,
      #98dc83 70%,
      #7ccf71 100%
    );

  box-shadow:
    var(--shadow);

}


.hero h1{

  margin:0;

  color:
    var(--blue);

  font-size:
    30px;

  line-height:
    1.15;

  font-weight:
    900;

  white-space:
    nowrap;

}


/* ============================================================
   メインカード
============================================================ */

.card{

  margin-top:
    12px;

  padding:
    13px;

  border-radius:
    24px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  box-shadow:
    var(--shadow);

}


/* ============================================================
   担当表・代休取得ボタン
============================================================ */

.management-menu{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    8px;

  margin-bottom:
    12px;

}


.management-btn{

  min-height:
    54px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  font-size:
    16px;

  font-weight:
    900;

  background:
    #f7fcff;

  color:
    var(--blue);

}


.management-btn:active{

  transform:
    scale(.99);

}


.assignment-btn{

  background:
    #eef8ff;

}


.comp-btn{

  background:
    #f4fbf5;

  color:
    #18824e;

}


/* ============================================================
   人物判別
============================================================ */

.top-row{

  display:grid;

  grid-template-columns:
    158px
    minmax(0,1fr);

  gap:
    8px;

  align-items:
    stretch;

}


.status{

  min-height:
    78px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:
    7px;

  padding:
    8px;

  border-radius:
    20px;

  background:
    #f3fbff;

  border:
    1px solid
    var(--line);

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

  text-align:
    center;

}


.status.done{

  background:
    #eefbf3;

  border-color:
    #ccefd8;

  color:
    var(--green);

}


.select-box{

  padding:
    9px 11px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #f9fdff;

}


.select-box label,
.field-title{

  display:block;

  margin-bottom:
    5px;

  color:
    #637c90;

  font-size:
    13px;

  font-weight:
    900;

}


/* ============================================================
   入力
============================================================ */

select,
input[type="date"],
input[type="time"],
textarea{

  width:
    100%;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  outline:
    none;

}


select,
input[type="date"],
input[type="time"]{

  height:
    44px;

  padding:
    0 10px;

  font-size:
    16px;

  font-weight:
    800;

}


textarea{

  padding:
    10px 11px;

  font-size:
    14px;

  line-height:
    1.5;

  resize:
    vertical;

}


select:focus,
input:focus,
textarea:focus{

  border-color:
    #63b4ea;

  box-shadow:
    0 0 0 3px
    rgba(
      99,
      180,
      234,
      .12
    );

}


/* ============================================================
   出勤・退勤
============================================================ */

.mode-box{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    10px;

}


.mode-btn{

  min-height:
    90px;

  border:
    0;

  border-radius:
    20px;

  font-size:
    28px;

  font-weight:
    900;

  transition:
    .12s;

}


.mode-btn:active{

  transform:
    scale(.99);

}


.mode-btn.in{

  background:
    linear-gradient(
      #73cdf8,
      #7dd77a
    );

  color:
    #084e78;

}


.mode-btn.out{

  background:
    linear-gradient(
      #1b357c,
      #0e1e4d
    );

  color:
    #ffffff;

}


.mode-btn.off{

  opacity:
    .38;

  filter:
    grayscale(.18);

}


.guide{

  margin:
    9px 4px;

  color:
    var(--blue);

  font-size:
    13px;

  font-weight:
    900;

  text-align:
    center;

}


/* ============================================================
   写真
============================================================ */

.upload-btn{

  width:
    100%;

  min-height:
    54px;

  border:
    1px solid
    #cfe8f7;

  border-radius:
    17px;

  background:
    #eaf7ff;

  color:
    var(--blue);

  font-size:
    17px;

  font-weight:
    900;

}


.upload-btn:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}


.notice{

  display:none;

  margin-top:
    9px;

  padding:
    9px 11px;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    #5c7588;

  font-size:
    12px;

  line-height:
    1.45;

  text-align:
    center;

}


.notice.show{

  display:block;

}


.hidden{

  display:none !important;

}


.preview{

  display:none;

  margin-top:
    11px;

}


.preview.show{

  display:block;

}


.preview-box{

  padding:
    12px;

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  background:
    #ffffff;

}


.photo-preview{

  display:block;

  width:
    100%;

  max-height:
    360px;

  object-fit:
    contain;

  border-radius:
    14px;

  background:
    #eef4f8;

}


/* ============================================================
   時刻
============================================================ */

.fields{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    9px;

}


.field{

  min-width:
    0;

  padding:
    9px;

  border:
    1px solid
    var(--line);

  border-radius:
    14px;

  background:
    var(--soft);

}


.field-title{

  margin-bottom:
    4px;

}


#nextDate{

  font-size:
    15px;

  letter-spacing:
    -.4px;

}


.summary{

  grid-column:
    1 / -1;

  padding:
    9px 10px;

  border:
    1px solid
    var(--line);

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    #446276;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;

}


.summary strong{

  color:
    var(--blue);

}


/* ============================================================
   報告文章
============================================================ */

.message-section{

  margin-top:
    12px;

}


.message-title{

  margin:
    0 0 7px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

}


.message-box{

  padding:
    11px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #f7fcff;

}


.message-preview{

  white-space:
    pre-line;

  font-size:
    14px;

  line-height:
    1.55;

  color:
    #15446e;

  font-weight:
    700;

}


.memo-input{

  display:block;

  width:
    100%;

  min-height:
    92px;

  margin-top:
    10px;

  padding:
    10px 11px;

  border:
    1px solid
    #cfe4f3;

  border-radius:
    12px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    14px;

  line-height:
    1.55;

  resize:
    vertical;

  outline:
    none;

}


.memo-input::placeholder{

  color:
    #93a8b7;

}


.send-btn{

  width:
    100%;

  min-height:
    54px;

  margin-top:
    9px;

  border:
    0;

  border-radius:
    17px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    18px;

  font-weight:
    900;

}


.send-btn:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}


/* ============================================================
   履歴
============================================================ */

.history{

  margin-top:
    16px;

  padding-top:
    13px;

  border-top:
    1px solid
    #e2eef6;

}


.history-title{

  margin:
    0 0 8px;

  color:
    var(--blue);

  font-size:
    20px;

  font-weight:
    900;

  text-align:
    center;

}


.history-list{

  list-style:
    none;

  padding:
    0;

  margin:
    0;

}


.history-list li{

  display:grid;

  grid-template-columns:
    84px
    42px
    minmax(78px,1fr)
    26px;

  gap:
    4px;

  align-items:
    center;

  padding:
    9px 1px;

  border-bottom:
    1px solid
    #edf4fa;

  color:
    #496173;

  font-size:
    12px;

  white-space:
    nowrap;

}


.history-date{

  font-weight:
    800;

}


.history-type{

  color:
    var(--blue);

  font-weight:
    900;

}


.history-time{

  color:
    var(--text);

  font-weight:
    900;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

}


.history-ok{

  color:
    var(--green);

  font-size:
    16px;

  font-weight:
    900;

  text-align:
    right;

}


.empty{

  display:block !important;

  text-align:
    center;

  color:
    #7a90a3;

}


/* ============================================================
   管理画面
============================================================ */

.management-panel{

  margin-top:
    8px;

  padding:
    6px;

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  background:
    #ffffff;

}


.management-header{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:
    8px;

  margin-bottom:
    7px;

}


.management-title{

  color:
    var(--blue);

  font-size:
    18px;

  font-weight:
    900;

}


.management-close{

  border:
    0;

  border-radius:
    10px;

  padding:
    7px 11px;

  background:
    #edf4f8;

  color:
    #526a7d;

  font-size:
    12px;

  font-weight:
    900;

}


.management-loading{

  padding:
    12px;

  color:
    #688094;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    800;

}


.management-table-wrap{

  overflow-x:
    hidden;

  max-width:
    100%;

}


.management-table{

  width:
    100%;

  min-width:
    0;

  table-layout:
    fixed;

  border-collapse:
    collapse;

  font-size:
    11px;

}


.management-table th,
.management-table td{

  padding:
    1px 2px;

  border:
    1px solid
    #dbeaf3;

  vertical-align:
    middle;

  overflow:
    hidden;

}


.management-table th{

  background:
    #eef8ff;

  color:
    #42647b;

  font-weight:
    900;

  white-space:
    normal;

  word-break:
    break-all;

  line-height:
    1.15;

}


.management-table td{

  background:
    #ffffff;

}


.management-table input,
.management-table select{

  width:
    100%;

  min-width:
    0;

  height:
    31px;

  padding:
    2px 3px;

  border:
    1px solid
    #d4e5ef;

  border-radius:
    7px;

  background:
    #ffffff;

  color:
    var(--text);

  font-size:
    11px;

  font-weight:
    700;

  outline:
    none;

}


.assignment-panel
.management-table
th,
.assignment-panel
.management-table
td{

  width:
    20%;

}


.comp-panel
.management-table
th:nth-child(1),
.comp-panel
.management-table
td:nth-child(1){

  width:
    19%;

}


.comp-panel
.management-table
th:nth-child(2),
.comp-panel
.management-table
td:nth-child(2){

  width:
    19%;

}


.comp-panel
.management-table
th:nth-child(3),
.comp-panel
.management-table
td:nth-child(3){

  width:
    24%;

}


.comp-panel
.management-table
th:nth-child(4),
.comp-panel
.management-table
td:nth-child(4){

  width:
    38%;

}


.management-section-title{

  margin:
    7px 0 5px;

  color:
    var(--blue);

  font-size:
    15px;

  font-weight:
    900;

}


.comp-panel{

  display:grid;

  gap:
    7px;

}


.management-add{

  width:
    100%;

  min-height:
    42px;

  margin:
    2px 0;

  border:
    1px dashed
    #8fc9ea;

  border-radius:
    12px;

  background:
    #f7fcff;

  color:
    var(--blue);

  font-size:
    14px;

  font-weight:
    900;

}


.management-save{

  width:
    100%;

  min-height:
    46px;

  margin-top:
    8px;

  border:
    0;

  border-radius:
    14px;

  background:
    linear-gradient(
      #56baf0,
      #2d88d8
    );

  color:
    #ffffff;

  font-size:
    16px;

  font-weight:
    900;

}


.management-save:disabled{

  opacity:
    .45;

}


.footer{

  padding:
    14px 10px 4px;

  color:
    #8aa0b2;

  font-size:
    13px;

  text-align:
    center;

}


/* ============================================================
   スマホ
============================================================ */

@media(max-width:480px){

  .page{

    padding:
      10px 9px 20px;

  }


  .hero{

    padding:
      20px 10px 21px;

  }


  .hero h1{

    font-size:
      30px;

  }


  .card{

    padding:
      11px;

  }


  .top-row{

    grid-template-columns:
      145px
      minmax(0,1fr);

  }


  .status{

    min-height:
      76px;

    font-size:
      17px;

  }


  .mode-btn{

    min-height:
      82px;

    font-size:
      25px;

  }


  .management-table{

    font-size:
      10px;

  }


  .management-table th,
  .management-table td{

    padding:
      1px;

  }


  .management-table input,
  .management-table select{

    height:
      30px;

    padding:
      1px 2px;

    font-size:
      10px;

  }

}

</style>

</head>


<body>


<div class="page">


<header class="hero">

<h1>
🚙 運転手MENU
</h1>

</header>


<main class="card">


<!-- ============================================================
     管理ボタン
============================================================ -->

<div class="management-menu">

<button
id="assignmentBtn"
class="management-btn assignment-btn"
type="button"
>
📋 担当表
</button>


<button
id="compBtn"
class="management-btn comp-btn"
type="button"
>
🗓️ 代休取得
</button>

</div>


<!-- ============================================================
     人物選択
============================================================ -->

<div class="top-row">


<div
id="status"
class="status"
>

<span id="statusIcon">
⏰
</span>

<span id="statusText">
⏳判別中⏳
</span>

</div>


<div class="select-box">

<label for="driverSelect">
選択
</label>

<select id="driverSelect">

<option value="">
選択して下さい
</option>

</select>

</div>


</div>


<!-- ============================================================
     出勤・退勤
============================================================ -->

<div class="mode-box">


<button
id="inMode"
class="mode-btn in"
type="button"
disabled
>
☀️出勤☀️
</button>


<button
id="outMode"
class="mode-btn out off"
type="button"
disabled
>
🌙退勤🌙
</button>


</div>


<div class="guide">

必要な場合は修正お願いします。

</div>


<input
id="photoInput"
type="file"
accept="image/*"
class="hidden"
>


<button
id="uploadBtn"
class="upload-btn"
type="button"
disabled
>
📷 写真を撮影・選択して読み取る
</button>


<div
id="notice"
class="notice"
></div>


<!-- ============================================================
     プレビュー
============================================================ -->

<section
id="preview"
class="preview"
>


<div class="preview-box">


<img
id="photoPreview"
class="photo-preview"
alt="勤怠写真"
>


<div class="fields">


<div class="field">

<label
class="field-title"
for="reportDate"
>
日付
</label>

<input
id="reportDate"
type="date"
>

</div>


<div class="field">

<label
class="field-title"
for="startTime"
>
出勤時間
</label>

<input
id="startTime"
type="time"
>

</div>


<div
id="endField"
class="field hidden"
>

<label
class="field-title"
for="endTime"
>
退勤時間
</label>

<input
id="endTime"
type="time"
>

</div>


<div
id="nextDateField"
class="field hidden"
>

<label
class="field-title"
for="nextDate"
>
次回出勤日
</label>

<input
id="nextDate"
type="date"
>

</div>


<div
id="nextTimeField"
class="field hidden"
>

<label
class="field-title"
for="nextTime"
>
次回出勤時間
</label>

<select id="nextTime"></select>

</div>


<div
id="summary"
class="summary"
>

前回残業
<strong>0:00</strong>

　

月間合計
<strong>0:00</strong>

</div>


</div>


<div class="message-section">


<div class="message-title">

報告文章

</div>


<div class="message-box">


<div
id="messagePreview"
class="message-preview"
></div>


<textarea
id="memo"
class="memo-input"
placeholder="文章を入力できます"
></textarea>


</div>


</div>


<button
id="sendBtn"
class="send-btn"
type="button"
disabled
>

写真＋報告文章を送信

</button>


</div>


</section>


<!-- ============================================================
     履歴
============================================================ -->

<section class="history">


<h2 class="history-title">

＜履歴＞

</h2>


<ul
id="historyList"
class="history-list"
>

<li class="empty"></li>

</ul>


</section>


<!-- ============================================================
     管理画面
============================================================ -->

<section
id="managementPanel"
class="management-panel hidden"
>


<div class="management-header">


<div
id="managementTitle"
class="management-title"
>

📋 担当表

</div>


<button
id="managementClose"
class="management-close"
type="button"
>

閉じる

</button>


</div>


<div
id="managementLoading"
class="management-loading"
>

読み込み中...

</div>


<div
id="assignmentPanel"
class="management-table-wrap assignment-panel hidden"
></div>


<div
id="compPanel"
class="comp-panel hidden"
></div>


<button
id="managementSave"
class="management-save hidden"
type="button"
>

保存する

</button>


</section>


</main>


<footer class="footer">

勤怠管理Bot

</footer>


</div>


<script>

/* ============================================================
   設定

/* ============================================================
   GET + JSONP API
============================================================ */

function callServer(
operation,
data={}
){

return new Promise(
(
resolve,
reject
)=>{


const callback =

'gasJsonp_' +

Date.now() +

'_' +

Math.random()
.toString(36)
.slice(2);


const script =

document.createElement(
'script'
);


let finished =
false;


const timer =

setTimeout(
()=>{

if(finished){
return;
}

finished=true;

cleanup();

reject(
new Error(
'サーバー応答がタイムアウトしました'
)
);

},
API_TIMEOUT
);


function cleanup(){

clearTimeout(
timer
);

if(
script.parentNode
){

script.parentNode
.removeChild(
script
);

}

try{

delete window[
callback
];

}catch(_){

window[
callback
]=undefined;

}

}


window[
callback
]=
function(response){

if(finished){
return;
}

finished=true;

cleanup();


if(
!response ||
response.ok !== true
){

reject(
new Error(

response &&
response.error

? response.error

: 'Apps Script APIエラー'

)
);

return;

}


resolve(
response.data
);

};


script.onerror =
function(){

if(finished){
return;
}

finished=true;

cleanup();

reject(
new Error(
'Apps Script APIに接続できませんでした'
)
);

};


const params =

new URLSearchParams();


params.set(
'action',
'api'
);


params.set(
'operation',
operation
);


params.set(
'callback',
callback
);


params.set(
'_',
String(
Date.now()
)
);


params.set(
'idToken',
state.idToken ||
''
);


Object.keys(
data
)
.forEach(
key=>{

let value =
data[key];

if(
value === undefined ||
value === null
){

value='';

}

params.set(
key,
String(value)
);

}
);


script.src =

API_URL +

'?' +

params.toString();


document.body.appendChild(
script
);


}
);

}

/* ============================================================
   運転手名マッチ
============================================================ */

function driverMasterMatch(
currentValue,
masterDrivers
){

const current =

String(
currentValue ||
''
)
.trim();


if(!current){

return '';

}


if(
masterDrivers.includes(
current
)
){

return current;

}


const normalizedCurrent =

current.replace(
/\s+/g,
''
);


const found =

masterDrivers.find(
name=>{


const normalizedName =

String(
name ||
''
)

.replace(
/\s+/g,
''
);


if(
normalizedName ===
normalizedCurrent
){

return true;

}


const surname =

String(
name ||
''
)

.trim()

.split(
/\s+/
)[0];


if(
current ===
surname
){

return true;

}


if(
current.indexOf(
surname
) === 0
){

return true;

}


return false;


}
);


return found ||
current;

}

/* ============================================================
   画像
============================================================ */

function imageToDataUrl(file){

return new Promise(
(
resolve,
reject
)=>{


const reader =

new FileReader();


reader.onload =
function(){


const image =

new Image();


image.onload =
function(){


const max =
1800;


const scale =

Math.min(

1,

max /

Math.max(
image.width,
image.height
)

);


const canvas =

document.createElement(
'canvas'
);


canvas.width =

Math.round(
image.width *
scale
);


canvas.height =

Math.round(
image.height *
scale
);


const context =

canvas.getContext(
'2d',
{
alpha:false
}
);


context.drawImage(

image,

0,

0,

canvas.width,

canvas.height

);


resolve(

canvas.toDataURL(
'image/jpeg',
.86
)

);


};


image.onerror =
reject;


image.src =
reader.result;


};


reader.onerror =
reject;


reader.readAsDataURL(
file
);


}
);

}


/* ============================================================
   OCR
============================================================ */

async function runBrowserOcr(
dataUrl
){

if(
!window.Tesseract
){

return '';

}


const result =

await Tesseract.recognize(
dataUrl,
'eng',
{

logger:
message=>{


if(
message &&
message.status ===
'recognizing text' &&
message.progress
){

showNotice(

'写真を読み取り中... '

+

Math.round(
message.progress *
100
)

+

'%'

);

}


},

tessedit_pageseg_mode:
6

}
);


return(

result &&
result.data

? String(
result.data.text ||
''
)

: ''

);

}

/* ============================================================
   自動本人判別
============================================================ */

async function autoDetect(){

setStatus(
'判別中',
false
);


try{


if(
typeof liff ===
'undefined'
){

throw new Error(
'LIFF SDKなし'
);

}


await liff.init({

liffId:
LIFF_ID

});


/*
 * 手動選択済みなら
 * 自動判別で上書きしない
 */

if(
state.userSelectedManually &&
state.driver
){

setStatus(
'完了',
true
);

return;

}


/*
 * LINEログインしていない
 */

if(
!liff.isLoggedIn()
){

state.idToken =
'';


setStatus(
'右から選択',
false
);


return;

}


state.idToken =

liff.getIDToken() ||
'';


if(
!state.idToken
){

setStatus(
'右から選択',
false
);

return;

}


/*
 * Apps Scriptで本人照合
 */

const info =

await callServer(
'getDriverInfo'
);


if(
state.userSelectedManually &&
state.driver
){

return;

}


if(
info &&
info.found &&
info.driverKey
){

const driver =

findDriver(
info.driverKey
);


if(driver){

await selectDriver(
driver,
false
);


setStatus(
'完了',
true
);


return;

}

}


setStatus(
'右から選択',
false
);


}catch(error){


console.warn(
'自動判別失敗',
error
);


if(
state.userSelectedManually &&
state.driver
){

setStatus(
'完了',
true
);

}else{

setStatus(
'右から選択',
false
);

}


}

}
