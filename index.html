<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#eef9ff;
  --bg2:#f8fcff;
  --card:#fff;
  --line:#d5eaf7;
  --text:#17324d;
  --muted:#6b8296;
  --blue:#1676c7;
  --blue2:#2d88d8;
  --green:#18824e;
  --soft:#f6fbfe;
  --shadow:0 12px 34px rgba(40,92,128,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--text);
  background:linear-gradient(var(--bg),var(--bg2));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.page{
  width:min(760px,100%);
  margin:0 auto;
  padding:12px 10px 24px;
}
.hero{
  position:relative;
  overflow:hidden;
  padding:18px 14px 20px;
  border-radius:26px;
  text-align:center;
  background:linear-gradient(180deg,#bfeaff 0%,#e9f9ff 70%,#98dc83 70%,#7ccf71 100%);
  box-shadow:var(--shadow);
}
.hero-car{
  position:relative;
  z-index:1;
  font-size:48px;
  line-height:1;
}
.hero h1{
  position:relative;
  z-index:1;
  margin:6px 0 0;
  color:var(--blue);
  font-size:32px;
  line-height:1.1;
  font-weight:900;
  white-space:nowrap;
}
.card{
  margin-top:12px;
  padding:13px;
  border-radius:24px;
  background:rgba(255,255,255,.97);
  box-shadow:var(--shadow);
}
.top-row{
  display:grid;
  grid-template-columns:158px minmax(0,1fr);
  gap:8px;
  align-items:stretch;
}
.status{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px;
  border-radius:20px;
  background:#f3fbff;
  border:1px solid var(--line);
  color:var(--blue);
  font-size:18px;
  font-weight:900;
  text-align:center;
}
.status.done{
  background:#eefbf3;
  border-color:#ccefd8;
  color:var(--green);
}
.status-icon{line-height:1}
.select-box{
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#f9fdff;
}
.select-box label,
.field-title{
  display:block;
  margin-bottom:5px;
  color:#637c90;
  font-size:13px;
  font-weight:900;
}
select,
input[type="date"],
input[type="time"],
textarea{
  width:100%;
  border:1px solid #cfe4f3;
  border-radius:12px;
  background:#fff;
  color:var(--text);
  outline:none;
}
select,
input[type="date"],
input[type="time"]{
  height:44px;
  padding:0 10px;
  font-size:16px;
  font-weight:800;
}
select:focus,
input:focus,
textarea:focus{
  border-color:#63b4ea;
  box-shadow:0 0 0 3px rgba(99,180,234,.12);
}
.assignment{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  margin-top:8px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#f6fcff;
  color:#496a82;
  font-size:14px;
  font-weight:900;
  text-align:center;
}
.assignment.ready{
  color:var(--blue);
  background:#eef9ff;
}
.mode-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.mode-btn{
  min-height:90px;
  border:0;
  border-radius:20px;
  font-size:28px;
  font-weight:900;
  transition:.12s;
}
.mode-btn:active{transform:scale(.99)}
.mode-btn.in{
  background:linear-gradient(#73cdf8,#7dd77a);
  color:#084e78;
}
.mode-btn.out{
  background:linear-gradient(#1b357c,#0e1e4d);
  color:#fff;
}
.mode-btn.off{
  opacity:.38;
  filter:grayscale(.18);
}
.guide{
  margin:9px 4px;
  color:var(--blue);
  font-size:13px;
  font-weight:900;
  text-align:center;
}
.upload-btn{
  width:100%;
  min-height:54px;
  border:1px solid #cfe8f7;
  border-radius:17px;
  background:#eaf7ff;
  color:var(--blue);
  font-size:17px;
  font-weight:900;
}
.upload-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.notice{
  display:none;
  margin-top:9px;
  padding:9px 11px;
  border-radius:12px;
  background:#f7fcff;
  color:#5c7588;
  font-size:12px;
  line-height:1.45;
  text-align:center;
}
.notice.show{display:block}
.preview{
  display:none;
  margin-top:11px;
}
.preview.show{display:block}
.preview-box{
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
}
.photo-preview{
  display:block;
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:14px;
  background:#eef4f8;
}
.ocr-title{
  margin:11px 0 5px;
  color:var(--blue);
  font-size:16px;
  font-weight:900;
}
.ocr-text{
  max-height:120px;
  overflow:auto;
  padding:8px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#f9fdff;
  color:#526c80;
  font-size:11px;
  white-space:pre-wrap;
}
.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}
.field{
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--soft);
}
.field.full{grid-column:1/-1}
.field-title{margin-bottom:4px}
#nextDate{font-size:15px;letter-spacing:-.4px}
.summary{
  grid-column:1/-1;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#446276;
  text-align:center;
  font-size:13px;
  font-weight:800;
}
.summary strong{color:var(--blue)}
.message-box{
  margin-top:9px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#f7fcff;
}
.message-preview{
  white-space:pre-line;
  font-size:14px;
  line-height:1.7;
  color:#15446e;
  font-weight:700;
}
.memo-title{
  margin-top:10px;
  color:#637c90;
  font-size:13px;
  font-weight:900;
}
#memo{
  min-height:90px;
  margin-top:5px;
  padding:10px;
  resize:vertical;
  font-size:14px;
}
.send-btn{
  width:100%;
  min-height:54px;
  margin-top:9px;
  border:0;
  border-radius:17px;
  background:linear-gradient(#56baf0,#2d88d8);
  color:#fff;
  font-size:18px;
  font-weight:900;
}
.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.history{
  margin-top:16px;
  padding-top:13px;
  border-top:1px solid #e2eef6;
}
.history-title{
  margin:0 0 8px;
  color:var(--blue);
  font-size:20px;
  font-weight:900;
  text-align:center;
}
.history-list{
  list-style:none;
  padding:0;
  margin:0;
}
.history-list li{
  display:grid;
  grid-template-columns:84px 42px minmax(78px,1fr) 26px;
  gap:4px;
  align-items:center;
  padding:9px 1px;
  border-bottom:1px solid #edf4fa;
  color:#496173;
  font-size:12px;
  white-space:nowrap;
}
.history-date{font-weight:800}
.history-type{
  color:var(--blue);
  font-weight:900;
}
.history-time{
  color:var(--text);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
}
.history-ok{
  color:var(--green);
  font-size:16px;
  font-weight:900;
  text-align:right;
}
.empty{
  display:block !important;
  text-align:center;
  color:#7a90a3;
}
.footer{
  padding:14px 10px 4px;
  color:#8aa0b2;
  font-size:13px;
  text-align:center;
}
.hidden{display:none!important}
@media(max-width:480px){
  .page{padding:10px 9px 20px}
  .hero{padding:20px 10px 18px}
  .hero h1{font-size:30px}
  .hero-car{font-size:44px}
  .card{padding:11px}
  .top-row{grid-template-columns:145px minmax(0,1fr)}
  .status{min-height:76px;font-size:17px}
  .mode-btn{min-height:82px;font-size:25px}
  .history-list li{
    grid-template-columns:auto auto minmax(70px,1fr) 24px;
  }
}
</style>
</head>

<body>

<div class="page">

<header class="hero">
  <div class="hero-car">🚙</div>
  <h1>運転手MENU</h1>
</header>

<main class="card">

  <div class="top-row">

    <div id="status" class="status">
      <span id="statusIcon">⏳</span>
      <span id="statusText">自動判別中...</span>
    </div>

    <div class="select-box">
      <label for="driverSelect">人物選択</label>
      <select id="driverSelect">
        <option value="">人物を選択してください</option>
      </select>
    </div>

  </div>

  <div id="assignment" class="assignment">
    👔 今月の担当：確認中...
  </div>

  <div class="mode-box">

    <button
      id="inMode"
      class="mode-btn in"
      type="button"
      disabled
    >
      ☀️ 出勤
    </button>

    <button
      id="outMode"
      class="mode-btn out off"
      type="button"
      disabled
    >
      🌙 退勤
    </button>

  </div>

  <div class="guide">
    必要な場合は修正お願いします。
  </div>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
    class="hidden"
  >

  <button
    id="uploadBtn"
    class="upload-btn"
    type="button"
    disabled
  >
    📷 写真を撮影・選択して読み取る
  </button>

  <div id="notice" class="notice"></div>

  <section id="preview" class="preview">

    <div class="preview-box">

      <img
        id="photoPreview"
        class="photo-preview"
        alt="勤怠写真"
      >

      <div class="ocr-title">
        📷 読み取り済み
      </div>

      <div
        id="ocrText"
        class="ocr-text"
      ></div>

      <div class="fields">

        <div class="field">
          <label
            class="field-title"
            for="reportDate"
          >
            日付
          </label>
          <input
            id="reportDate"
            type="date"
          >
        </div>

        <div class="field">
          <label
            class="field-title"
            for="reportTime"
          >
            時間
          </label>
          <input
            id="reportTime"
            type="time"
          >
        </div>

        <div
          id="startField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="startTime"
          >
            出勤時間
          </label>
          <input
            id="startTime"
            type="time"
          >
        </div>

        <div
          id="endField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="endTime"
          >
            退勤時間
          </label>
          <input
            id="endTime"
            type="time"
          >
        </div>

        <div
          id="nextDateField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="nextDate"
          >
            次回出勤日
          </label>
          <input
            id="nextDate"
            type="date"
          >
        </div>

        <div
          id="nextTimeField"
          class="field hidden"
        >
          <label
            class="field-title"
            for="nextTime"
          >
            次回出勤時間
          </label>
          <input
            id="nextTime"
            type="time"
            value="08:00"
          >
        </div>

        <div
          id="summary"
          class="summary"
        >
          前回残業 <strong>0:00</strong>
         　
          月間合計 <strong>0:00</strong>
        </div>

      </div>

      <div class="message-box">

        <div class="ocr-title">
          送信する文章
        </div>

        <div
          id="messagePreview"
          class="message-preview"
        ></div>

        <div class="memo-title">
          追加文章（任意）
        </div>

        <textarea
          id="memo"
          placeholder="追加文章を入力できます"
        ></textarea>

      </div>

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        disabled
      >
        写真＋報告文章を送信
      </button>

    </div>

  </section>

  <section class="history">

    <h2 class="history-title">
      履歴
    </h2>

    <ul
      id="historyList"
      class="history-list"
    >
      <li class="empty">
        人物を選択すると履歴を表示します
      </li>
    </ul>

  </section>

</main>

<footer class="footer">
  勤怠管理Bot
</footer>

</div>

<script>
/* ============================================================
   設定
   ============================================================ */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxh00lpilu_kVj-GYhippy6yYHRBd-Bl4B1W2mBfhKpewXgTc45vN7f1noLMt8kaprsw/exec';

const LIFF_ID =
  '2011011273-HIdBF1sM';

const STORAGE_RECENT =
  'driver_menu_recent_v3';

const STORAGE_HISTORY =
  'driver_menu_history_v3';

const STORAGE_WORK =
  'driver_menu_work_v3';


/* ============================================================
   DOM
   ============================================================ */

const el = {
  status:
    document.getElementById('status'),

  statusIcon:
    document.getElementById('statusIcon'),

  statusText:
    document.getElementById('statusText'),

  driverSelect:
    document.getElementById('driverSelect'),

  assignment:
    document.getElementById('assignment'),

  inMode:
    document.getElementById('inMode'),

  outMode:
    document.getElementById('outMode'),

  uploadBtn:
    document.getElementById('uploadBtn'),

  photoInput:
    document.getElementById('photoInput'),

  notice:
    document.getElementById('notice'),

  preview:
    document.getElementById('preview'),

  photoPreview:
    document.getElementById('photoPreview'),

  ocrText:
    document.getElementById('ocrText'),

  reportDate:
    document.getElementById('reportDate'),

  reportTime:
    document.getElementById('reportTime'),

  startField:
    document.getElementById('startField'),

  endField:
    document.getElementById('endField'),

  startTime:
    document.getElementById('startTime'),

  endTime:
    document.getElementById('endTime'),

  nextDateField:
    document.getElementById('nextDateField'),

  nextTimeField:
    document.getElementById('nextTimeField'),

  nextDate:
    document.getElementById('nextDate'),

  nextTime:
    document.getElementById('nextTime'),

  summary:
    document.getElementById('summary'),

  messagePreview:
    document.getElementById('messagePreview'),

  memo:
    document.getElementById('memo'),

  sendBtn:
    document.getElementById('sendBtn'),

  historyList:
    document.getElementById('historyList')
};


/* ============================================================
   STATE
   ============================================================ */

const state = {
  idToken: '',

  drivers: [],

  driver: null,

  mode: 'in',

  draft: null,

  workState: {
    hasWork: false,
    startTime: ''
  },

  summary: {
    previousOvertime: '0:00',
    monthlyOvertime: '0:00'
  },

  history: []
};


/* ============================================================
   共通
   ============================================================ */

function pad2(value) {
  return String(value).padStart(2, '0');
}


function today() {
  const d = new Date();

  return (
    d.getFullYear() +
    '-' +
    pad2(d.getMonth() + 1) +
    '-' +
    pad2(d.getDate())
  );
}


function nowTime() {
  const d = new Date();

  return (
    pad2(d.getHours()) +
    ':' +
    pad2(d.getMinutes())
  );
}


function tomorrow() {
  const d = new Date();

  d.setDate(
    d.getDate() + 1
  );

  return (
    d.getFullYear() +
    '-' +
    pad2(d.getMonth() + 1) +
    '-' +
    pad2(d.getDate())
  );
}


function dateText(value) {
  if (!value) return '';

  const d =
    new Date(
      value + 'T00:00:00'
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return value;
  }

  const week = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return (
    d.getFullYear() +
    '/' +
    (d.getMonth() + 1) +
    '/' +
    d.getDate() +
    '(' +
    week[d.getDay()] +
    ')'
  );
}


function shortDate(value) {
  if (!value) return '';

  const d =
    new Date(
      value + 'T00:00:00'
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return value;
  }

  const week = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  return (
    (d.getMonth() + 1) +
    '/' +
    d.getDate() +
    '(' +
    week[d.getDay()] +
    ')'
  );
}


function nextAttendanceLabel(
  value
) {
  if (!value) return '次回';

  const a =
    new Date(
      today() + 'T00:00:00'
    );

  const b =
    new Date(
      value + 'T00:00:00'
    );

  const diff =
    Math.round(
      (
        b.getTime() -
        a.getTime()
      ) / 86400000
    );

  if (diff === 1) {
    return '明日';
  }

  if (diff === 2) {
    return '明後日';
  }

  const aw =
    a.getDay() || 7;

  const bw =
    b.getDay() || 7;

  const aMonday =
    new Date(a);

  aMonday.setDate(
    a.getDate() -
    aw +
    1
  );

  const nextMonday =
    new Date(
      aMonday
    );

  nextMonday.setDate(
    aMonday.getDate() +
    7
  );

  const bMonday =
    new Date(b);

  bMonday.setDate(
    b.getDate() -
    bw +
    1
  );

  if (
    nextMonday.getTime() ===
    bMonday.getTime()
  ) {
    return '来週';
  }

  const nextMonth =
    new Date(
      a.getFullYear(),
      a.getMonth() + 1,
      1
    );

  const bMonth =
    new Date(
      b.getFullYear(),
      b.getMonth(),
      1
    );

  if (
    nextMonth.getTime() ===
    bMonth.getTime()
  ) {
    return '来月';
  }

  return '次回';
}


function escapeHtml(value) {
  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#39;'
    );
}


function setStatus(
  text,
  done
) {
  el.statusText.textContent =
    text;

  el.statusIcon.textContent =
    done
      ? '✓'
      : '⏳';

  el.status.classList.toggle(
    'done',
    !!done
  );
}


function showNotice(
  text
) {
  el.notice.textContent =
    text || '';

  el.notice.classList.toggle(
    'show',
    !!text
  );
}


/* ============================================================
   API
   ============================================================ */

async function callServer(
  operation,
  data = {}
) {
  return new Promise(
    (
      resolve,
      reject
    ) => {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();

      params.append(
        'action',
        'api'
      );

      params.append(
        'operation',
        operation
      );

      params.append(
        'requestId',
        requestId
      );

      params.append(
        'idToken',
        state.idToken || ''
      );


      Object.keys(data)
        .forEach(
          key => {

            params.append(
              key,
              data[key] ??
              ''
            );

          }
        );


      fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'
          },

          body:
            params.toString(),

          mode:
            'no-cors'
        }
      )
      .catch(
        error => {
          console.warn(
            'API POST失敗',
            error
          );
        }
      );


      pollApi(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );
}


function pollApi(
  requestId,
  resolve,
  reject,
  attempt
) {
  if (
    attempt >= 45
  ) {
    reject(
      new Error(
        'サーバー応答がタイムアウトしました'
      )
    );

    return;
  }


  const callback =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt;


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup() {

    if (
      script.parentNode
    ) {
      script.parentNode.removeChild(
        script
      );
    }

    try {
      delete window[callback];
    } catch (_) {
      window[callback] =
        undefined;
    }

  }


  window[callback] =
    function(response) {

      if (
        finished
      ) {
        return;
      }


      finished =
        true;

      cleanup();


      if (
        response &&
        (
          response.status ===
            'pending' ||

          response.status ===
            'processing'
        )
      ) {

        setTimeout(
          () => {

            pollApi(
              requestId,
              resolve,
              reject,
              attempt + 1
            );

          },
          450
        );

        return;
      }


      if (
        !response ||
        response.ok !== true
      ) {

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );

        return;
      }


      resolve(
        response.data
      );

    };


  script.onerror =
    function() {

      if (
        finished
      ) {
        return;
      }


      finished =
        true;

      cleanup();


      setTimeout(
        () => {

          pollApi(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        450
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callback
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );
}

function findDriver(
  key
) {
  return (
    state.drivers.find(
      d =>
        d.driverKey ===
        key
    ) ||
    null
  );
}


function saveRecentDriver() {

  if (
    !state.driver ||
    !state.driver.driverKey
  ) {
    return;
  }


  let list = [];

  try {

    list =
      JSON.parse(
        localStorage.getItem(
          STORAGE_RECENT
        ) ||
        '[]'
      );

    if (
      !Array.isArray(list)
    ) {
      list = [];
    }

  } catch (_) {
    list = [];
  }


  list =
    list.filter(
      item =>
        item.driverKey !==
        state.driver.driverKey
    );


  list.unshift({
    driverKey:
      state.driver.driverKey,

    displayName:
      state.driver.displayName
  });


  localStorage.setItem(
    STORAGE_RECENT,
    JSON.stringify(
      list.slice(
        0,
        10
      )
    )
  );
}


function getRecentDrivers() {

  try {

    const list =
      JSON.parse(
        localStorage.getItem(
          STORAGE_RECENT
        ) ||
        '[]'
      );

    return Array.isArray(list)
      ? list
      : [];

  } catch (_) {

    return [];

  }

}


function renderDrivers() {

  const current =
    state.driver
      ? state.driver.driverKey
      : '';


  el.driverSelect.innerHTML =
    '<option value="">人物を選択してください</option>';


  const recent =
    getRecentDrivers();


  const recentKeys =
    new Set(
      recent.map(
        item =>
          item.driverKey
      )
    );


  const recentDrivers =
    state.drivers.filter(
      driver =>
        recentKeys.has(
          driver.driverKey
        )
    );


  const otherDrivers =
    state.drivers.filter(
      driver =>
        !recentKeys.has(
          driver.driverKey
        )
    );


  if (
    recentDrivers.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );

    group.label =
      '最近使った人物';


    recentDrivers.forEach(
      driver => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;

        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  if (
    otherDrivers.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );

    group.label =
      'その他の人物';


    otherDrivers.forEach(
      driver => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          driver.driverKey;

        option.textContent =
          driver.displayName;

        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  if (current) {
    el.driverSelect.value =
      current;
  }

}


async function loadDrivers() {

  try {

    const list =
      await callServer(
        'getDriverList'
      );


    state.drivers =
      Array.isArray(list)
        ? list
        : [];


    renderDrivers();


  } catch (error) {

    console.warn(
      '人物一覧取得失敗',
      error
    );

    renderDrivers();

  }

}


async function selectDriver(
  driver
) {

  if (!driver) {

    state.driver =
      null;

    el.inMode.disabled =
      true;

    el.outMode.disabled =
      true;

    el.uploadBtn.disabled =
      true;

    el.assignment.textContent =
      '👔 今月の担当：未選択';

    el.historyList.innerHTML =
      '<li class="empty">人物を選択すると履歴を表示します</li>';

    setStatus(
      '人物選択待ち',
      false
    );

    return;

  }


  state.driver =
    driver;


  el.driverSelect.value =
    driver.driverKey;


  el.inMode.disabled =
    false;

  el.outMode.disabled =
    false;

  el.uploadBtn.disabled =
    false;


  setStatus(
    '完了',
    true
  );


  saveRecentDriver();


  await Promise.allSettled([
    loadCurrentAssignment(),
    loadServerState()
  ]);

}

async function loadCurrentAssignment() {

  if (
    !state.driver
  ) {

    el.assignment.textContent =
      '👔 今月の担当：未選択';

    return;

  }


  el.assignment.textContent =
    '👔 今月の担当：確認中...';


  try {

    const result =
      await callServer(
        'getCurrentAssignment',
        {
          selectedDriverKey:
            state.driver.driverKey
        }
      );


    if (
      result &&
      result.found &&
      result.officerName
    ) {

      el.assignment.textContent =
        '👔 今月の担当：' +
        result.officerName;

      el.assignment.classList.add(

      );

    }


    el.assignment.textContent =
      '👔 今月の担当：未設定';

    el.assignment.classList.remove(
      'ready'
    );

  } catch (error) {

    console.warn(
      '担当取得失敗',
      error
    );

    el.assignment.textContent =
      '👔 今月の担当：取得できません';

  }

}

function setMode(
  mode
) {

  state.mode =
    mode;

  state.draft =
    null;


  el.inMode.classList.toggle(
    'active',
    mode === 'in'
  );

  el.outMode.classList.toggle(
    'active',
    mode === 'out'
  );


  el.inMode.classList.toggle(
    'off',
    mode !== 'in'
  );

  el.outMode.classList.toggle(
    'off',
    mode !== 'out'
  );


  el.preview.classList.remove(
    'show'
  );

  el.sendBtn.disabled =
    true;


  el.photoInput.value =
    '';


  showNotice('');


  if (
    mode === 'in'
  ) {

    el.startField.classList.add(
      'hidden'
    );

    el.endField.classList.add(
      'hidden'
    );

    el.nextDateField.classList.add(
      'hidden'
    );

    el.nextTimeField.classList.add(
      'hidden'
    );

  } else {

    el.startField.classList.remove(
      'hidden'
    );

    el.endField.classList.remove(
      'hidden'
    );

    el.nextDateField.classList.remove(
      'hidden'
    );

    el.nextTimeField.classList.remove(
      'hidden'
    );


    el.nextDate.value =
      tomorrow();

    el.nextTime.value =
      '08:00';

    el.startTime.value =
      state.workState.startTime ||
      '';

    el.endTime.value =
      nowTime();

  }

}

   サーバー状態
   ============================================================ */

async function loadServerState() {

  if (
    !state.driver
  ) {
    return;
  }


  try {

    const [
      work,
      summary,
      history
    ] =
      await Promise.all([

        callServer(
          'getWorkState',
          {
            selectedDriverKey:
              state.driver.driverKey
          }
        ),

        callServer(
          'getAttendanceSummary',
          {
            selectedDriverKey:
              state.driver.driverKey
          }
        ),

        callServer(
          'getTodayHistory',
          {
            selectedDriverKey:
              state.driver.driverKey
          }
        )

      ]);


    state.workState =
      work || {
        hasWork:
          false,

        startTime:
          ''
      };


    state.summary =
      summary || {
        previousOvertime:
          '0:00',

        monthlyOvertime:
          '0:00'
      };


    state.history =
      Array.isArray(history)
        ? history
        : [];


    renderSummary();
    renderHistory(
      state.history
    );


    localStorage.setItem(
      STORAGE_HISTORY,
      JSON.stringify(
        state.history
      )
    );


    localStorage.setItem(
      STORAGE_WORK,
      JSON.stringify({
        date:
          today(),

        driverKey:
          state.driver.driverKey,

        startTime:
          state.workState.startTime ||
          ''
      })
    );

  } catch (error) {

    console.warn(
      'サーバー状態取得失敗',
      error
    );

  }

}


function renderSummary() {

  el.summary.innerHTML =

    escapeHtml(

      '0:00'
    ) +
    '</strong>　月間合計 <strong>' +

    ) +
    '</strong>';

}


/* ============================================================
   履歴
   ============================================================ */

function renderHistory(
  list
) {

  if (
    !Array.isArray(list) ||
    !list.length
  ) {

    el.historyList.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';

    return;

  }


  const sorted =
    [...list].sort(
      (
        a,
        b
      ) =>
        Number(
          b.savedAt ||
          0
        ) -
        Number(
          a.savedAt ||
          0
        )
    );


  el.historyList.innerHTML =
    sorted
      .map(
        item => {

          let time =
            '';


          if (
            item.type ===
            '退勤'
          ) {

            time =
              (item.startTime ||
                '0:00') +
              '→' +
              (item.endTime ||
                '0:00');

          } else {

            time =
              item.reportTime ||
              item.startTime ||
              '';

          }


          return (
            '<li>' +

              '<span class="history-date">' +
                escapeHtml(
                  item.date ||
                  ''
                ) +
              '</span>' +

              '<span class="history-type">' +
                escapeHtml(
                  item.type ||
                  ''
                ) +
              '</span>' +

              '<span class="history-time">' +
                escapeHtml(
                  time
                ) +
              '</span>' +

              '<span class="history-ok">✅</span>' +

            '</li>'
          );

        }
      )
      .join('');

}
