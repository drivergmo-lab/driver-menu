<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>運転手MENU</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <style>

    :root {
      --bg1: #e8f7ff;
      --bg2: #f7fcff;
      --card: rgba(255,255,255,.95);
      --line: #d8ebf7;
      --text: #17324d;
      --muted: #6b8296;
      --primary: #2d88d8;
      --primary2: #56baf0;
      --shadow: 0 14px 40px rgba(39,96,139,.10);
      --shadow-soft: 0 8px 22px rgba(39,96,139,.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          var(--bg1),
          var(--bg2)
        );
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    /* =========================================================
       ヘッダー
       ========================================================= */

    .hero {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 28px 16px 24px;
      border-radius: 30px;

      background:

        radial-gradient(
          circle at 18% 18%,
          rgba(255,255,255,.86) 0 6%,
          transparent 6.5%
        ),

        radial-gradient(
          circle at 82% 22%,
          rgba(255,255,255,.84) 0 6%,
          transparent 6.5%
        ),

        linear-gradient(
          180deg,
          #bfeaff 0%,
          #e9f9ff 100%
        );

      box-shadow:
        var(--shadow-soft);

      border:
        1px solid rgba(255,255,255,.7);

      isolation:
        isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
      height: 40%;

      background:

        radial-gradient(
          ellipse at 10% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),

        radial-gradient(
          ellipse at 28% 100%,
          rgba(121,208,114,.92) 0 18%,
          transparent 19%
        ),

        radial-gradient(
          ellipse at 73% 100%,
          rgba(105,190,104,.95) 0 22%,
          transparent 23%
        ),

        radial-gradient(
          ellipse at 92% 100%,
          rgba(121,208,114,.92) 0 16%,
          transparent 17%
        );

      opacity: .75;
      pointer-events: none;
    }

    .hero-car {
      position: relative;
      z-index: 1;
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #1676c7;
      font-size: 38px;
      line-height: 1.12;
      font-weight: 900;
    }

    /* =========================================================
       メインカード
       ========================================================= */

    .main-card {
      margin-top: 14px;
      padding: 16px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.75);
    }

    /* =========================================================
       状態表示
       ========================================================= */

    .driver-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      width: fit-content;
      max-width: 100%;
      min-height: 44px;

      margin: 0 auto 10px;
      padding: 10px 18px;

      border-radius: 999px;

      background: #f3fbff;
      border: 1px solid #dceff9;

      color: #1676c7;

      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .driver-pill.done {
      color: #16804a;
      background: #eefbf3;
      border-color: #ccefd8;
    }

    .status-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* =========================================================
       人物選択
       ========================================================= */

    .manual-select-area {
      margin: 0 0 12px;
      padding: 10px 12px;

      border: 1px solid #dceff9;
      border-radius: 16px;

      background: #f9fdff;
    }

    .manual-select-label {
      display: block;
      margin-bottom: 6px;

      color: #61798e;

      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .driver-select {
      display: block;
      width: 100%;
      height: 46px;

      padding: 0 10px;

      border: 1px solid #cfe5f5;
      border-radius: 12px;

      background: #ffffff;
      color: #17324d;

      font-family: inherit;
      font-size: 16px;
      font-weight: 800;

      outline: none;
    }

    .driver-select:focus {
      border-color: #63b4ea;

      box-shadow:
        0 0 0 3px
        rgba(99,180,234,.14);
    }

    /* =========================================================
       出勤・退勤
       ========================================================= */

    .attendance-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .attendance-btn {
      position: relative;
      width: 100%;
      height: 170px;

      border: 0;
      border-radius: 24px;
      overflow: hidden;

      cursor: pointer;
      font-family: inherit;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 10px 22px
        rgba(39,96,139,.12);

      transition:
        transform .12s ease,
        opacity .12s ease;

      isolation: isolate;
    }

    .attendance-btn:active {
      transform:
        translateY(1px)
        scale(.99);
    }

    .attendance-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .scene {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
    }

    .attendance-text {
      position: relative;
      z-index: 3;

      font-size: 38px;
      line-height: 1;

      font-weight: 900;
      letter-spacing: .04em;
    }

    .btn-in {
      color: #0a4c7d;

      background:
        linear-gradient(
          180deg,
          #77d2ff 0%,
          #c8efff 58%,
          #8ed777 100%
        );

      border:
        1px solid #a8ddf7;
    }

    .btn-out {
      color: #ffffff;

      background:
        linear-gradient(
          180deg,
          #142c78 0%,
          #10215c 60%,
          #07163f 100%
        );

      border:
        1px solid #6077c5;
    }

    /* =========================================================
       案内
       ========================================================= */

    .guide {
      margin:
        16px 4px 10px;

      color:
        #1676c7;

      font-size:
        15px;

      line-height:
        1.55;

      font-weight:
        800;

      text-align:
        center;
    }

    /* =========================================================
       内容修正
       ========================================================= */

    .edit-panel {
      display: none;

      margin-top:
        14px;

      padding:
        13px;

      background:
        #ffffff;

      border-radius:
        22px;

      box-shadow:
        var(--shadow-soft);

      border:
        1px solid rgba(216,235,247,.9);

      scroll-margin-top:
        70px;

      scroll-margin-bottom:
        70px;
    }

    .edit-panel.show {
      display:
        block;
    }

    .edit-title {
      margin:
        0 0 10px;

      color:
        #1676c7;

      font-size:
        26px;

      font-weight:
        900;

      text-align:
        center;
    }

    .edit-title::before {
      content:
        "✎ ";

      color:
        #68aee6;
    }

    .two-column {
      display:
        grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

      gap:
        7px;

      margin-bottom:
        7px;
    }

    .field {
      min-width:
        0;
    }

    .field label {
      display:
        block;

      margin:
        0 0 3px;

      color:
        #61798e;

      font-size:
        12px;

      line-height:
        1.1;

      font-weight:
        800;
    }

    .field input {
      display:
        block;

      width:
        100%;

      min-width:
        0;

      height:
        40px;

      min-height:
        40px;

      padding:
        0;

      margin:
        0;

      border:
        1px solid #cfe5f5;

      border-radius:
        13px;

      outline:
        none;

      background:
        #ffffff;

      color:
        #0d2340;

      font-family:
        inherit;

      font-size:
        20px;

      font-weight:
        900;

      line-height:
        1;

      text-align:
        center;

      vertical-align:
        middle;

      appearance:
        none;

      -webkit-appearance:
        none;
    }

    .field input::-webkit-date-and-time-value {
      margin:
        0;

      padding:
        0;

      height:
        auto;

      line-height:
        1;

      text-align:
        center;
    }

    #nextDate {
      font-size:
        15px;

      letter-spacing:
        -.7px;
    }

    .single-field {
      margin-bottom:
        8px;
    }

    /* =========================================================
       プレビュー
       ========================================================= */

    .preview {
      display:
        none;

      margin-top:
        9px;

      padding:
        13px 15px;

      border:
        1px solid var(--line);

      border-radius:
        18px;

      background:
        linear-gradient(
          135deg,
          #f9fdff 0%,
          #eef8ff 100%
        );

      color:
        #14446e;

      font-size:
        14px;

      line-height:
        1.7;

      font-weight:
        600;

      white-space:
        pre-line;
    }

    .preview.show {
      display:
        block;
    }

    /* =========================================================
       送信
       ========================================================= */

    .send-btn {
      display:
        block;

      width:
        100%;

      margin-top:
        7px;

      padding:
        14px 12px;

      border:
        0;

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          #56baf0 0%,
          #2d88d8 100%
        );

      color:
        #ffffff;

      font-family:
        inherit;

      font-size:
        20px;

      font-weight:
        900;

      cursor:
        pointer;
    }

    .send-btn:disabled {
      opacity:
        .55;

      cursor:
        not-allowed;
    }

    /* =========================================================
       今日の履歴
       ========================================================= */

    .history {
      margin-top:
        18px;

      padding-top:
        14px;

      border-top:
        1px solid #e2eef6;
    }

    .history h3 {
      margin:
        0 0 10px;

      color:
        #1676c7;

      font-size:
        20px;

      font-weight:
        900;

      text-align:
        center;
    }

    .history h3::before {
      content:
        "🕘 ";
    }

    .history-list {
      list-style:
        none;

      margin:
        0;

      padding:
        0;
    }

    .history-list li {
      padding:
        9px 0;

      border-bottom:
        1px solid #edf4fa;

      color:
        #496173;

      font-size:
        14px;

      line-height:
        1.45;
    }

    .history-list .empty {
      color:
        #7a90a3;

      text-align:
        center;
    }

    .footer {
      padding:
        14px 10px 4px;

      color:
        #8aa0b2;

      font-size:
        14px;

      text-align:
        center;
    }

    .hidden {
      display:
        none !important;
    }

    /* =========================================================
       スマホ
       ========================================================= */

    @media (max-width:480px) {

      .page {
        padding:
          12px 10px 20px;
      }

      .hero {
        padding:
          22px 12px 18px;

        border-radius:
          24px;
      }

      .hero-car {
        font-size:
          48px;
      }

      .hero h1 {
        font-size:
          32px;
      }

      .main-card {
        margin-top:
          10px;

        padding:
          12px;

        border-radius:
          22px;
      }

      .driver-pill {
        min-height:
          42px;

        margin:
          0 auto 10px;

        padding:
          8px 15px;

        font-size:
          15px;
      }

      .driver-select {
        height:
          44px;

        font-size:
          15px;
      }

      .attendance-buttons {
        gap:
          8px;
      }

      .attendance-btn {
        height:
          126px;

        border-radius:
          18px;
      }

      .attendance-text {
        font-size:
          30px;
      }

      .guide {
        margin-top:
          14px;

        margin-bottom:
          8px;

        font-size:
          13px;
      }

      .edit-panel {

        margin-top:
          12px;

        padding:
          13px 12px;

        border-radius:
          20px;

        scroll-margin-top:
          70px;

        scroll-margin-bottom:
          70px;
      }

      .edit-title {
        margin-bottom:
          9px;

        font-size:
          25px;
      }

      .field input {
        height:
          40px;

        min-height:
          40px;

        padding:
          0;

        font-size:
          20px;
      }

      .field input::-webkit-date-and-time-value {
        margin:
          0;

        padding:
          0;

        height:
          auto;

        line-height:
          1;
      }

      .history h3 {
        width:
          100%;

        font-size:
          20px;
      }

    }

  </style>

</head>


<body>

  <div class="page">


    <!-- =======================================================
         ヘッダー
         ======================================================= -->

    <header class="hero">

      <div class="hero-car">
        🚙
      </div>

      <h1>
        運転手MENU
      </h1>

    </header>


    <main class="main-card">


      <!-- =====================================================
           状態表示
           ===================================================== -->

      <div
        id="statusPill"
        class="driver-pill"
      >

        <span
          id="statusIcon"
          class="status-icon"
        >
          ⏳
        </span>

        <span
          id="statusText"
        >
          自動判別中...
        </span>

      </div>


      <!-- =====================================================
           人物選択
           ===================================================== -->

      <div
        class="manual-select-area"
      >

        <label
          class="manual-select-label"
          for="driverSelect"
        >
          人物選択
        </label>


        <select
          id="driverSelect"
          class="driver-select"
        >

          <option value="">
            人物を選択してください
          </option>

        </select>

      </div>


      <!-- =====================================================
           出勤・退勤
           ===================================================== -->

      <div
        class="attendance-buttons"
      >

        <!-- 出勤 -->

        <button
          id="btnIn"
          class="attendance-btn btn-in"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >

            <defs>

              <linearGradient
                id="daySky"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#41b2ff"
                />

                <stop
                  offset="60%"
                  stop-color="#9ce0ff"
                />

                <stop
                  offset="100%"
                  stop-color="#dff6ff"
                />

              </linearGradient>


              <linearGradient
                id="hillGreen"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#73d151"
                />

                <stop
                  offset="100%"
                  stop-color="#388e3c"
                />

              </linearGradient>

            </defs>


            <rect
              width="320"
              height="220"
              fill="url(#daySky)"
            />


            <circle
              cx="65"
              cy="55"
              r="33"
              fill="#ffe082"
            />


            <circle
              cx="65"
              cy="55"
              r="48"
              fill="#ffb74d"
              opacity=".18"
            />


            <g
              fill="#ffffff"
              opacity=".94"
            >

              <ellipse
                cx="190"
                cy="70"
                rx="38"
                ry="16"
              />

              <ellipse
                cx="220"
                cy="80"
                rx="48"
                ry="18"
              />

            </g>


            <path
              d="
                M-10,160
                C58,120 100,152 160,132
                C210,116 240,150 330,124
                L330,220
                L-10,220
                Z
              "
              fill="url(#hillGreen)"
            />


            <path
              d="
                M-10,182
                C76,160 112,190 170,174
                C224,160 252,184 330,164
                L330,220
                L-10,220
                Z
              "
              fill="#2e7d32"
              opacity=".75"
            />


            <rect
              x="-10"
              y="190"
              width="340"
              height="30"
              fill="#eaf6ff"
              opacity=".95"
            />


            <rect
              x="-10"
              y="192"
              width="340"
              height="4"
              rx="2"
              fill="#ffffff"
            />


            <rect
              x="-10"
              y="200"
              width="340"
              height="4"
              rx="2"
              fill="#ffffff"
            />

          </svg>


          <span
            class="attendance-text"
          >
            出勤
          </span>

        </button>


        <!-- 退勤 -->

        <button
          id="btnOut"
          class="attendance-btn btn-out"
          type="button"
          disabled
        >

          <svg
            class="scene"
            viewBox="0 0 320 220"
            preserveAspectRatio="none"
            aria-hidden="true"
          >

            <defs>

              <linearGradient
                id="nightSky"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#0b1742"
                />

                <stop
                  offset="60%"
                  stop-color="#0f2b6b"
                />

                <stop
                  offset="100%"
                  stop-color="#183b8a"
                />

              </linearGradient>


              <linearGradient
                id="buildingGrad"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#091333"
                />

                <stop
                  offset="100%"
                  stop-color="#050a1c"
                />

              </linearGradient>

            </defs>


            <rect
              width="320"
              height="220"
              fill="url(#nightSky)"
            />


            <g fill="#fff59d">

              <circle
                cx="30"
                cy="30"
                r="2"
              />

              <circle
                cx="65"
                cy="65"
                r="1.5"
              />

              <circle
                cx="105"
                cy="25"
                r="2.5"
              />

              <circle
                cx="170"
                cy="35"
                r="2"
              />

              <circle
                cx="235"
                cy="60"
                r="2.5"
              />

              <circle
                cx="275"
                cy="30"
                r="2"
              />

            </g>


            <circle
              cx="90"
              cy="72"
              r="32"
              fill="#ffee58"
            />


            <circle
              cx="106"
              cy="58"
              r="32"
              fill="#0b1742"
            />


            <g
              opacity=".4"
              fill="#1e3a78"
            >

              <ellipse
                cx="180"
                cy="80"
                rx="44"
                ry="16"
              />

              <ellipse
                cx="215"
                cy="90"
                rx="52"
                ry="18"
              />

            </g>


            <g fill="url(#buildingGrad)">

              <rect
                x="205"
                y="108"
                width="28"
                height="85"
              />

              <rect
                x="245"
                y="126"
                width="30"
                height="67"
              />

              <rect
                x="276"
                y="92"
                width="34"
                height="101"
              />

            </g>


            <g
              fill="#ffeb3b"
              opacity=".85"
            >

              <rect
                x="218"
                y="120"
                width="5"
                height="6"
              />

              <rect
                x="228"
                y="135"
                width="5"
                height="6"
              />

              <rect
                x="253"
                y="138"
                width="5"
                height="6"
              />

              <rect
                x="264"
                y="150"
                width="5"
                height="6"
              />

              <rect
                x="284"
                y="105"
                width="5"
                height="6"
              />

              <rect
                x="296"
                y="120"
                width="5"
                height="6"
              />

            </g>


            <rect
              x="-10"
              y="190"
              width="340"
              height="30"
              fill="#0d1b3e"
            />


            <rect
              x="-10"
              y="192"
              width="340"
              height="4"
              fill="#6482ad"
            />


            <rect
              x="-10"
              y="200"
              width="340"
              height="4"
              fill="#6482ad"
            />

          </svg>


          <span
            class="attendance-text"
          >
            退勤
          </span>

        </button>

      </div>


      <!-- =====================================================
           案内
           ===================================================== -->

      <div class="guide">
        必要な場合は修正お願いします。
      </div>


      <!-- =====================================================
           内容修正
           ===================================================== -->

      <section
        id="editPanel"
        class="edit-panel"
      >

        <h2
          class="edit-title"
        >
          内容修正
        </h2>


        <!-- 出勤 -->

        <div
          id="inFields"
        >

          <div
            class="field single-field"
          >

            <label
              for="clockInTime"
            >
              出勤時間
            </label>


            <input
              id="clockInTime"
              type="time"
            />

          </div>

        </div>


        <!-- 退勤 -->

        <div
          id="outFields"
          class="hidden"
        >

          <div
            class="two-column"
          >

            <div
              class="field"
            >

              <label

          els.driverSelect.value ||
          ''

      if (!driverKey) {
        return false;
      }


      const driver =
        findDriverByKey(

      state.driver =

      state.userSelectedManually =

      setStatus(

      setStatus(
        'done'

      return true;

    // ==========================================================
    // driverKey検索
    // ==========================================================

    function findDriverByKey(
      driverKey
    ) {

      if (!driverKey) {
        return null;
      }


      const serverDriver =
        state.drivers.find(
          function(driver) {

            return (
              driver.driverKey ===
              driverKey
            );

          }
        );


      if (
        serverDriver
      ) {

        return serverDriver;
      }


      const recent =
        getRecentDrivers();


      const recentDriver =
        recent.find(
          function(driver) {

            return (
              driver.driverKey ===
              driverKey
            );

          }
        );


      if (
        recentDriver
      ) {

        return recentDriver;
      }


      return null;
    }


    // ==========================================================
    // 最近人物取得
    // ==========================================================

    function getRecentDrivers() {

      const result = [];


      for (
        const key of RECENT_KEYS
      ) {

        try {

          const raw =
            localStorage.getItem(
              key
            );


          if (!raw) {
            continue;
          }


          const list =
            JSON.parse(
              raw
            );


          if (
            !Array.isArray(
              list
            )
          ) {

            continue;
          }


          for (
            const item of list
          ) {

            if (
              !item ||
              !item.driverKey ||
              !item.displayName
            ) {

              continue;
            }


            const exists =
              result.some(
                function(existing) {

                  return (
                    existing.driverKey ===
                    item.driverKey
                  );

                }
              );


            if (!exists) {

              result.push({

                driverKey:
                  item.driverKey,

                displayName:
                  item.displayName

              });

            }
          }


        } catch (
          error
        ) {

          console.warn(
            '人物履歴読み込み失敗',
            error
          );

        }
      }


      return result.slice(
        0,
        MAX_RECENT_DRIVERS
      );
    }


    // ==========================================================
    // 最近人物保存
    // ==========================================================

    function saveRecentDriver(
      driver
    ) {

      if (
        !driver ||
        !driver.driverKey ||
        !driver.displayName
      ) {

        return;
      }


      try {

        let list =
          getRecentDrivers();


        list =
          list.filter(
            function(item) {

              return (
                item.driverKey !==
                driver.driverKey
              );

            }
          );


        list.unshift({

          driverKey:
            driver.driverKey,

          displayName:
            driver.displayName

        });


        list =
          list.slice(
            0,
            MAX_RECENT_DRIVERS
          );


        localStorage.setItem(

          'driver_menu_recent_drivers_v1',

          JSON.stringify(
            list
          )

        );

      } catch (
        error
      ) {

        console.warn(
          '人物履歴保存失敗',
          error
        );

      }
    }

    // ==========================================================

    // ==========================================================

    function loadWorkState() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY_WORK
          );


        if (!raw) {
          return;
        }


        const data =
          JSON.parse(
            raw
          );


        if (!data) {
          return;
        }


        /*
         * 今日以外のデータは使用しない
         */

        if (
          data.date !==
          getTodayKey()
        ) {

          return;
        }


        /*
         * 人物が決まっている場合は
         * 別人物の時間を使わない
         */

        if (
          state.driver &&
          data.driverKey &&
          state.driver.driverKey !==
            data.driverKey
        ) {

          return;
        }


        if (
          data.startTime
        ) {

          state.lastStartTime =
            data.startTime;

        }

      } catch (
        error
      ) {

        console.warn(
          '出勤状態読み込み失敗',
          error
        );

      }
    }

    function renderDriverList() {

    // ==========================================================
    // API
    // ==========================================================

    function callServer(
      operation,
      data = {}
    ) {

      return new Promise(
        function(
          resolve,
          reject
        ) {

          const requestId =
            'req_' +
            Date.now() +
            '_' +
            Math.random()
              .toString(36)
              .slice(2);


          const formData =
            new URLSearchParams();


          formData.append(
            'action',
            'api'
          );


          formData.append(
            'operation',
            operation
          );


          formData.append(
            'requestId',
            requestId
          );


          formData.append(
            'idToken',
            state.idToken ||
            ''
          );


          formData.append(
            'message',
            data.message ||
            ''
          );


          formData.append(
            'selectedDriverKey',
            data.selectedDriverKey ||
            ''
          );


          fetch(
            API_URL,
            {

              method:
                'POST',

              mode:
                'no-cors',

              headers: {

                'Content-Type':
                  'application/x-www-form-urlencoded;charset=UTF-8'

              },

              body:
                formData.toString()

            }
          ).catch(
            function(error) {

              console.warn(
                'API POST失敗',
                error
              );

            }
          );


          pollApiResult_(
            requestId,
            resolve,
            reject,
            0
          );
        }
      );
    }


    // ==========================================================
    // API結果取得
    // ==========================================================

    function pollApiResult_(
      requestId,
      resolve,
      reject,
      attempt
    ) {

      const MAX_ATTEMPTS =
        40;


      const WAIT_MS =
        500;


      if (
        attempt >=
        MAX_ATTEMPTS
      ) {

        reject(
          new Error(
            'Apps Script APIの応答が20秒以内に返りませんでした'
          )
        );


        return;
      }


      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        attempt;


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      function cleanup() {

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );
        }


        try {

          delete window[
            callbackName
          ];

        } catch (
          error
        ) {

          window[
            callbackName
          ] = undefined;
        }
      }


      window[
        callbackName
      ] = function(
        response
      ) {

        if (
          finished
        ) {

          return;
        }


        finished =
          true;


        cleanup();


        if (
          response &&
          (
            response.status ===
              'pending' ||

            response.status ===
              'processing'
          )
        ) {

          setTimeout(
            function() {

              pollApiResult_(
                requestId,
                resolve,
                reject,
                attempt + 1
              );

            },
            WAIT_MS
          );


          return;
        }


        if (
          !response ||
          response.ok !==
            true
        ) {

          reject(
            new Error(
              response &&
              response.error
                ? response.error
                : 'Apps Script APIエラー'
            )
          );


          return;
        }


        resolve(
          response.data
        );
      };


      script.onerror =
        function() {

          if (
            finished
          ) {

            return;
          }


          finished =
            true;


          cleanup();


          setTimeout(
            function() {

              pollApiResult_(
                requestId,
                resolve,
                reject,
                attempt + 1
              );

            },
            WAIT_MS
          );
        };


      script.src =
        API_URL +
        '?action=pollApi' +
        '&requestId=' +
        encodeURIComponent(
          requestId
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&_=' +
        Date.now();


      document.body.appendChild(
        script
      );
    }


    // ==========================================================
    // driver_master取得
    //
    // LIFFログインを待たずに実行
    // ==========================================================

    async function loadDriverList() {

      try {

        const list =
          await callServer(
            'getDriverList'
          );


        if (
          !Array.isArray(
            list
          )
        ) {

          throw new Error(
            'driver_master一覧が不正です'
          );
        }


        state.drivers =
          list.filter(
            function(driver) {

              return (
                driver &&
                driver.driverKey &&
                driver.displayName
              );

            }
          );


        state.driverListLoaded =
          true;


        renderDriverList();


        if (
          state.userSelectedManually &&
          state.driver
        ) {

          els.driverSelect.value =
            state.driver.driverKey;


          enableAttendance(
            state.driver
          );


          setStatus(
            'done'
          );


          return;
        }


        if (
          state.driver
        ) {

          const officialDriver =
            state.drivers.find(
              function(driver) {

                return (
                  driver.driverKey ===
                  state.driver.driverKey
                );

              }
            );


          if (
            officialDriver
          ) {

            state.driver =
              officialDriver;


            enableAttendance(
              officialDriver
            );


            setStatus(
              'done'
            );
          }
        }


        setTimeout(
          function() {

            syncDriverFromSelect();

          },
          100
        );


      } catch (
        error
      ) {

        console.error(
          'driver_master取得失敗',
          error
        );


        state.driverListLoaded =
          false;


        renderDriverList();


        setTimeout(
          function() {

            syncDriverFromSelect();

          },
          100
        );
      }
    }

    function pad2(
      value
    ) {

      return String(
        value
      ).padStart(
        2,
        '0'
      );
    }


    function toTimeInput(
      date
    ) {

      return (
        pad2(
          date.getHours()
        ) +
        ':' +
        pad2(
          date.getMinutes()
        )
      );
    }


    function toDateInput(
      date
    ) {

      return (
        date.getFullYear() +
        '-' +
        pad2(
          date.getMonth() + 1
        ) +
        '-' +
        pad2(
          date.getDate()
        )
      );
    }


    function weekdayJa(
      date
    ) {

      return [
        '日',
        '月',
        '火',
        '水',
        '木',
        '金',
        '土'
      ][
        date.getDay()
      ];
    }


    function dateLabel(
      date
    ) {

      return (
        (date.getMonth() + 1) +
        '/' +
        date.getDate() +
        '(' +
        weekdayJa(date) +
        ')'
      );
    }


    function dateSlash(
      date
    ) {

      return (
        date.getFullYear() +
        '/' +
        (date.getMonth() + 1) +
        '/' +
        date.getDate()
      );
    }


    function tomorrowDate() {

      const date =
        new Date();


      date.setDate(
        date.getDate() + 1
      );


      return date;
    }


    // ==========================================================
    // 次回出勤表現
    // ==========================================================

    function getNextAttendanceLabel(
      today,
      nextDate
    ) {

      const todayDate =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          today.getDate()
        );


      const targetDate =
        new Date(
          nextDate.getFullYear(),
          nextDate.getMonth(),
          nextDate.getDate()
        );


      const diffDays =
        Math.round(
          (
            targetDate.getTime() -
            todayDate.getTime()
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (
        diffDays ===
        1
      ) {

        return '明日';
      }


      if (
        diffDays ===
        2
      ) {

        return '明後日';
      }


      const todayWeekday =
        todayDate.getDay() ===
        0
          ? 7
          : todayDate.getDay();


      const targetWeekday =
        targetDate.getDay() ===
        0
          ? 7
          : targetDate.getDay();


      const thisWeekMonday =
        new Date(
          todayDate
        );


      thisWeekMonday.setDate(
        todayDate.getDate() -
        (
          todayWeekday - 1
        )
      );


      const nextWeekMonday =
        new Date(
          thisWeekMonday
        );


      nextWeekMonday.setDate(
        thisWeekMonday.getDate() + 7
      );


      const targetWeekMonday =
        new Date(
          targetDate
        );


      targetWeekMonday.setDate(
        targetDate.getDate() -
        (
          targetWeekday - 1
        )
      );


      if (
        targetWeekMonday.getTime() ===
        nextWeekMonday.getTime()
      ) {

        return '来週';
      }


      const nextMonth =
        new Date(
          todayDate.getFullYear(),
          todayDate.getMonth() + 1,
          1
        );


      const targetMonth =
        new Date(
          targetDate.getFullYear(),
          targetDate.getMonth(),
          1
        );


      if (
        targetMonth.getTime() ===
        nextMonth.getTime()
      ) {

        return '来月';
      }


      return '次回';
    }


    // ==========================================================
    // 手動人物選択
    // ==========================================================

    els.driverSelect.addEventListener(
      'change',
      function() {

        const driverKey =
          String(
            els.driverSelect.value ||
            ''
          ).trim();


        if (!driverKey) {

          state.driver =
            null;


          state.userSelectedManually =
            false;


          els.btnIn.disabled =
            true;


          els.btnOut.disabled =
            true;


          els.sendBtn.disabled =
            true;


          setStatus(
            'waiting'
          );


          return;
        }


        const driver =
          findDriverByKey(
            driverKey
          );


        if (!driver) {

          alert(
            'この人物の情報を取得できませんでした。'
          );


          return;
        }


        selectDriver(
          driver,
          true
        );
      }
    );


    // ==========================================================
    // 出勤
    // ==========================================================

    els.btnIn.addEventListener(
      'click',
      function() {

        if (
          !state.driver
        ) {

          syncDriverFromSelect();
        }


        if (
          !state.driver
        ) {

          alert(
            '先に人物を選択してください。'
          );


          return;
        }


        setMode(
          'in'
        );
      }
    );


    // ==========================================================
    // 退勤
    // ==========================================================

    els.btnOut.addEventListener(
      'click',
      function() {

        if (
          !state.driver
        ) {

          syncDriverFromSelect();
        }


        if (
          !state.driver
        ) {

          alert(
            '先に人物を選択してください。'
          );


          return;
        }


        setMode(
          'out'
        );
      }
    );


    // ==========================================================
    // 出勤メッセージ
    // ==========================================================

    function buildInMessage() {

      const today =
        new Date();


      return (
        'お疲れ様でございます。\n\n' +
        dateLabel(today) +
        '出勤いたしました。\n\n' +
        '本日もよろしくお願いいたします。'
      );
    }


    // ==========================================================
    // 退勤メッセージ
    // ==========================================================

    function buildOutMessage() {

      const today =
        new Date();


      let next =
        tomorrowDate();


      if (
        els.nextDate.value
      ) {

        next =
          new Date(
            els.nextDate.value +
            'T00:00:00'
          );
      }


      const nextTime =
        els.nextTime.value ||
        '08:00';


      const nextLabel =
        getNextAttendanceLabel(
          today,
          next
        );


      /*
       * 退勤時の出勤時間は
       * 現在時刻ではなく、
       * 確定した出勤時間を使う。
       */

      const startTime =
        els.editClockInTime.value ||
        state.lastStartTime ||
        '00:00';


      const endTime =
        els.clockOutTime.value ||
        '00:00';


      return (
        'お疲れ様でございます。\n\n' +
        '業務完了いたしました。\n\n' +
        dateSlash(today) +
        '\n' +
        '稼働)' +
        startTime +
        '-' +
        endTime +
        '\n\n' +
        '本日は失礼させていただきます。\n\n' +
        '出勤) ' +
        dateLabel(next) +
        ' ' +
        nextTime +
        '\n\n' +
        nextLabel +
        'もよろしくお願いいたします。'
      );
    }


    function refreshPreview() {

      const message =
        state.mode === 'in'
          ? buildInMessage()
          : buildOutMessage();


      els.preview.textContent =
        message;


      els.preview.classList.add(
        'show'
      );


      return message;
    }


    // ==========================================================
    // モード
    // ==========================================================

    function setMode(
      mode
    ) {

      state.mode =
        mode;


      els.editPanel.classList.add(
        'show'
      );


      if (
        mode === 'in'
      ) {

        els.inFields.classList.remove(
          'hidden'
        );


        els.outFields.classList.add(
          'hidden'
        );


        els.sendBtn.textContent =
          '出勤送信';


        const now =
          new Date();


        els.clockInTime.value =
          toTimeInput(
            now
          );


        /*
         * ここではまだ確定しない。
         *
         * 出勤送信時に
         * 実際に画面で設定されている時刻を保存する。
         */

        state.lastStartTime =
          els.clockInTime.value;


      } else {

        els.inFields.classList.add(
          'hidden'
        );


        els.outFields.classList.remove(
          'hidden'
        );


        els.sendBtn.textContent =
          '退勤送信';


        const now =
          new Date();


        /*
         * ★重要
         *
         * 今日保存された出勤時間を復元
         */

        loadWorkState();


        /*
         * 出勤時間は
         * 保存済みの時間を優先
         */

        els.editClockInTime.value =
          state.lastStartTime ||
          toTimeInput(
            now
          );


        /*
         * 退勤時間だけ現在時刻
         */

        els.clockOutTime.value =
          toTimeInput(
            now
          );


        /*
         * 次回出勤
         */

        els.nextDate.value =
          toDateInput(
            tomorrowDate()
          );


        els.nextTime.value =
          '08:00';
      }


      refreshPreview();


      /*
       * ======================================================
       * スマホでは内容修正を画面中央へ
       * ======================================================
       */

      setTimeout(
        function() {

          const isMobile =
            window.matchMedia(
              '(max-width: 480px)'
            ).matches;


          if (
            isMobile
          ) {

            els.editPanel.scrollIntoView({

              behavior:
                'smooth',

              block:
                'center'

            });

          }

        },
        150
      );
    }


    // ==========================================================
    // 出勤時間変更
    // ==========================================================

    els.clockInTime.addEventListener(
      'input',
      function() {

        state.lastStartTime =
          els.clockInTime.value;


        refreshPreview();
      }
    );


    // ==========================================================
    // 退勤時の出勤時間変更
    // ==========================================================

    els.editClockInTime.addEventListener(
      'input',
      function() {

        /*
         * 退勤画面で出勤時間を修正した場合も
         * stateに反映する
         */

        state.lastStartTime =
          els.editClockInTime.value;


        refreshPreview();
      }
    );


    // ==========================================================
    // 退勤時間変更
    // ==========================================================

    els.clockOutTime.addEventListener(
      'input',
      refreshPreview
    );


    // ==========================================================
    // 次回出勤日
    // ==========================================================

    els.nextDate.addEventListener(
      'change',
      refreshPreview
    );


    // ==========================================================
    // 次回出勤時間
    // ==========================================================

    els.nextTime.addEventListener(
      'input',
      refreshPreview
    );


    // ==========================================================
    // 送信
    // ==========================================================

    els.sendBtn.addEventListener(
      'click',
      async function() {

        /*
         * スマホ対策
         */

        if (
          !state.driver
        ) {

          syncDriverFromSelect();
        }


        if (
          !state.driver
        ) {

          alert(
            '先に人物を選択してください。'
          );


          return;
        }


        /*
         * 送信直前に
         * もう一度確認
         */

        let message =
          refreshPreview();


        /*
         * 出勤の場合
         *
         * 画面で確定した出勤時刻を保存
         */

        if (
          state.mode ===
          'in'
        ) {

          const confirmedStartTime =
            els.clockInTime.value;


          if (
            !confirmedStartTime
          ) {

            alert(
              '出勤時間を入力してください。'
            );


            return;
          }


          state.lastStartTime =
            confirmedStartTime;


          saveWorkState();


          /*
           * 保存した確定値で
           * メッセージを再生成
           */

          message =
            buildInMessage();
        }


        /*
         * 退勤の場合
         *
         * 出勤時間を維持
         */

        if (
          state.mode ===
          'out'
        ) {

          const startTime =
            els.editClockInTime.value;


          const endTime =
            els.clockOutTime.value;


          if (
            !startTime
          ) {

            alert(
              '出勤時間が設定されていません。'
            );


            return;
          }


          if (
            !endTime
          ) {

            alert(
              '退勤時間が設定されていません。'
            );


            return;
          }


          state.lastStartTime =
            startTime;


          saveWorkState();


          /*
           * 確定値でメッセージを再生成
           */

          message =
            buildOutMessage();
        }


        try {

          els.sendBtn.disabled =
            true;


          const result =
            await callServer(
              'sendAttendance',
              {

                message:
                  message,

                selectedDriverKey:
                  state.driver.driverKey

              }
            );


          if (
            !result ||
            !result.ok
          ) {

            throw new Error(

              result &&
              result.error
                ? result.error
                : '送信結果を確認できませんでした'

            );
          }


          const title =
            state.mode === 'in'
              ? '出勤'
              : '退勤';


          /*
           * 履歴を永続保存
           */

          addHistory(
            title +
            'を送信しました'
          );


          /*
           * 最近人物も保存
           */

          saveRecentDriver(
            state.driver
          );


          /*
           * 送信成功後の表示
           */

          els.editPanel.classList.remove(
            'show'
          );


          state.mode =
            null;


        } catch (
          error
        ) {

          console.error(
            error
          );


          alert(
            error &&
            error.message
              ? error.message
              : '送信に失敗しました'
          );


        } finally {

          els.sendBtn.disabled =
            false;
        }
      }
    );


    // ==========================================================
    // 履歴表示
    // ==========================================================

    function renderHistory() {

      if (
        !state.history.length
      ) {

        els.historyList.innerHTML =
          '<li class="empty">まだ履歴はありません</li>';

        return;
      }


      els.historyList.innerHTML =
        state.history.map(
          function(item) {

            return (
              '<li>' +
              escapeHtml(
                String(
                  item.time
                )
              ) +
              '　' +
              escapeHtml(
                String(
                  item.text
                )
              ) +
              '</li>'
            );

          }
        ).join('');
    }


    // ==========================================================
    // HTMLエスケープ
    // ==========================================================

    function escapeHtml(
      value
    ) {

      return String(
        value
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#39;'
        );
    }


    // ==========================================================
    // 履歴追加
    // ==========================================================

    function addHistory(
      text
    ) {

      state.history.unshift({

        time:
          new Date()
            .toLocaleString(
              'ja-JP'
            ),

        text:
          text

      });


      /*
       * 最大50件
       */

      state.history =
        state.history.slice(
          0,
          50
        );


      /*
       * ★永続保存
       */

      saveHistoryToStorage();


      renderHistory();
    }


    // ==========================================================
    // 自動本人判別
    //
    // 人物一覧取得とは独立
    // ==========================================================

    async function autoDetectDriver() {

      setStatus(
        'detecting'
      );


      try {

        if (
          typeof liff ===
          'undefined'
        ) {

          setStatus(
            'waiting'
          );


          return;
        }


        await liff.init({

          liffId:
            LIFF_ID,

          withLoginOnExternalBrowser:
            true

        });


        if (
          !liff.isLoggedIn()
        ) {

          setStatus(
            'waiting'
          );


          return;
        }


        const idToken =
          liff.getIDToken();


        if (
          !idToken
        ) {

          setStatus(
            'waiting'
          );


          return;
        }


        state.idToken =
          idToken;


        /*
         * 自動本人判別
         */

        const info =
          await callServer(
            'getDriverInfo'
          );


        /*
         * 手動選択済みなら
         * 自動判別結果で上書きしない
         */

        if (
          state.userSelectedManually &&
          state.driver
        ) {

          setStatus(
            'done'
          );


          return;
        }


        /*
         * 自動判別成功
         */

        if (
          info &&
          info.found &&
          info.driverKey
        ) {

          const driver =
            findDriverByKey(
              info.driverKey
            );


          if (
            driver
          ) {

            selectDriver(
              driver,
              false
            );


            setStatus(
              'done'
            );


            return;
          }
        }


        /*
         * 自動判別できなかった
         */

        setStatus(
          'waiting'
        );


      } catch (
        error
      ) {

        console.error(
          '自動本人判別失敗',
          error
        );


        setStatus(
          'waiting'
        );
      }
    }


    // ==========================================================
    // 起動
    // ==========================================================

    window.addEventListener(
      'load',
      function() {

        /*
         * ★ 保存済み履歴を復元
         */

        loadHistoryFromStorage();


        /*
         * ★ 今日の出勤状態を復元
         */

        loadWorkState();


        /*
         * 最近人物
         */

        renderRecentDriversImmediately();


        /*
         * driver_master
         */

        loadDriverList();


        /*
         * 自動本人判別
         */

        setTimeout(
          function() {

            autoDetectDriver();

          },
          100
        );

      }
    );


    // ==========================================================
    // iPhone / LINEブラウザ対策
    // ==========================================================

    window.addEventListener(
      'pageshow',
      function() {

        setTimeout(
          function() {

            syncDriverFromSelect();


            /*
             * 履歴も再読み込み
             */

            loadHistoryFromStorage();


            /*
             * 出勤状態も再読み込み
             */

            loadWorkState();

          },
          100
        );

      }
    );


    // ==========================================================
    // フォーカス復帰時
    // ==========================================================

    window.addEventListener(
      'focus',
      function() {

        setTimeout(
          function() {

            syncDriverFromSelect();


            loadHistoryFromStorage();


            loadWorkState();

          },
          100
        );

      }
    );

  </script>
