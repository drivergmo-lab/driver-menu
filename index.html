<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>
<title>運転手MENU</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

:root{
  --bg1:#e8f7ff;
  --bg2:#f7fcff;
  --card:rgba(255,255,255,.96);
  --line:#d8ebf7;
  --text:#17324d;
  --blue:#1676c7;
  --green:#16804a;
  --shadow:0 14px 40px rgba(39,96,139,.10);
  --shadow-soft:0 8px 22px rgba(39,96,139,.08);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    "Hiragino Sans",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
}

body{
  min-height:100vh;
}

.page{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:12px 10px 26px;
}


/* =========================================================
   タイトル
   ========================================================= */

.hero{
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:22px 12px 18px;
  border-radius:24px;
  background:linear-gradient(180deg,#bfeaff,#e9f9ff);
  box-shadow:var(--shadow-soft);
}

.hero:before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:0;
  height:40%;
  background:
    radial-gradient(
      ellipse at 10% 100%,
      #69be68 0 22%,
      transparent 23%
    ),
    radial-gradient(
      ellipse at 73% 100%,
      #69be68 0 22%,
      transparent 23%
    );
  opacity:.75;
}

.hero h1{
  position:relative;
  z-index:1;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  color:#1676c7;
  font-size:26px;
  line-height:1.2;
  font-weight:700;
}


/* =========================================================
   メイン
   ========================================================= */

.main-card{
  margin-top:10px;
  padding:12px;
  background:var(--card);
  border-radius:22px;
  box-shadow:var(--shadow);
}


/* =========================================================
   自動判別 ＋ 人物選択 横並び
   ========================================================= */

.driver-top-row{
  display:grid;
  grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr);
  gap:8px;
  align-items:stretch;
  margin-bottom:10px;
}


/* 左側 */

.driver-pill{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  width:100%;
  min-width:0;
  min-height:72px;

  margin:0;
  padding:8px;

  border-radius:16px;

  background:#f3fbff;
  border:1px solid #dceff9;

  color:#1676c7;

  font-size:14px;
  font-weight:900;

  white-space:nowrap;
}

.driver-pill.done{
  color:#16804a;
  background:#eefbf3;
  border-color:#ccefd8;
}

.status-icon{
  flex:0 0 auto;
  font-size:17px;
}

#statusText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* 右側 */

.manual-select-area{
  display:flex;
  flex-direction:column;
  justify-content:center;

  min-width:0;
  min-height:72px;

  margin:0;
  padding:7px 9px;

  border:1px solid #dceff9;
  border-radius:16px;

  background:#f9fdff;
}

.manual-select-label{
  display:block;
  margin:0 0 4px;
  color:#61798e;
  font-size:11px;
  font-weight:800;
}

.driver-select{
  display:block;
  width:100%;
  min-width:0;
  height:39px;
  padding:0 7px;

  border:1px solid #cfe5f5;
  border-radius:11px;

  background:#fff;
  color:#17324d;

  font-size:13px;
  font-weight:800;
}


/* =========================================================
   出勤・退勤
   ========================================================= */

.attendance-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.attendance-btn{
  position:relative;
  width:100%;
  height:72px;
  min-height:72px;

  border:0;
  border-radius:16px;

  overflow:hidden;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 8px 18px rgba(39,96,139,.10);

  opacity:.45;

  transition:
    opacity .15s ease,
    filter .15s ease,
    transform .12s ease;
}

.attendance-btn.active{
  opacity:1;
  filter:none;
}

.attendance-btn:not(.active){
  filter:saturate(.75);
}

.attendance-btn:active{
  transform:translateY(1px) scale(.99);
}

.attendance-btn:disabled{
  cursor:not-allowed;
}

.attendance-text{
  position:relative;
  z-index:3;
  font-size:25px;
  font-weight:900;
  line-height:1;
}

.btn-in{
  color:#0a4c7d;
  background:
    linear-gradient(
      180deg,
      #77d2ff,
      #c8efff 58%,
      #8ed777
    );
  border:1px solid #a8ddf7;
}

.btn-out{
  color:#fff;
  background:
    linear-gradient(
      180deg,
      #142c78,
      #10215c 60%,
      #07163f
    );
  border:1px solid #6077c5;
}


/* =========================================================
   写真
   ========================================================= */

.photo-area{
  margin-top:9px;
}

.photo-input{
  display:none;
}

.photo-btn{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;
  min-height:52px;

  padding:10px 12px;

  border:1px solid #cfe8f7;
  border-radius:16px;

  background:#eaf7ff;
  color:#1676c7;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}

.photo-btn:active{
  transform:translateY(1px);
}

.photo-hint{
  margin-top:5px;
  color:#7d95a6;
  font-size:11px;
  text-align:center;
}


/* =========================================================
   通知
   ========================================================= */

.notice{
  display:none;
  margin-top:8px;
  padding:8px 10px;

  border:1px solid #dceff9;
  border-radius:12px;

  background:#f7fcff;
  color:#61798e;

  font-size:12px;
  line-height:1.45;

  text-align:center;
}

.notice.show{
  display:block;
}


/* =========================================================
   編集
   ========================================================= */

.edit-panel{
  display:none;
  margin-top:8px;
  padding:12px;

  background:#fff;

  border-radius:20px;
  border:1px solid rgba(216,235,247,.9);

  box-shadow:var(--shadow-soft);
}

.edit-panel.show{
  display:block;
}


/* =========================================================
   写真プレビュー
   ========================================================= */

.photo-preview-wrap{
  display:none;
  margin-bottom:10px;
  padding:8px;

  border:1px solid var(--line);
  border-radius:16px;

  background:#f8fcff;
}

.photo-preview-wrap.show{
  display:block;
}

.photo-preview{
  display:block;
  width:100%;
  max-height:260px;

  object-fit:contain;

  border-radius:12px;
  background:#edf4f8;
}


/* =========================================================
   OCR
   ========================================================= */

.ocr-result-note{
  display:none;

  margin:8px 0;
  padding:8px 10px;

  border:1px solid #d9edf9;
  border-radius:12px;

  background:#f4fbff;
  color:#557389;

  font-size:11px;
  line-height:1.45;

  text-align:center;
}

.ocr-result-note.show{
  display:block;
}


/* =========================================================
   入力欄
   ========================================================= */

.field{
  min-width:0;
}

.field label{
  display:block;
  margin:0 0 3px;

  color:#61798e;

  font-size:12px;
  font-weight:800;
}

.field input{
  display:block;

  width:100%;
  min-width:0;
  height:40px;

  padding:0 6px;

  border:1px solid #cfe5f5;
  border-radius:13px;

  background:#fff;
  color:#0d2340;

  font-size:20px;
  font-weight:900;

  text-align:center;
  outline:none;
}

.field input:focus{
  border-color:#63b4ea;
  box-shadow:0 0 0 3px rgba(99,180,234,.14);
}

.two-column{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:7px;
  margin-bottom:7px;
}

.single-field{
  margin-bottom:7px;
}

#reportDate,
#outReportDate,
#nextDate{
  font-size:14px;
}


/* =========================================================
   送信文章
   ========================================================= */

.preview{
  display:none;

  margin-top:9px;
  padding:13px 15px;

  border:1px solid var(--line);
  border-radius:18px;

  background:#f4faff;
  color:#14446e;

  font-size:14px;
  line-height:1.4;
  font-weight:600;

  white-space:pre-line;

  word-break:break-word;
  overflow-wrap:anywhere;
}

.preview.show{
  display:block;
}


/* =========================================================
   追加文章
   ========================================================= */

.extra-label{
  display:block;
  margin:10px 0 5px;

  color:#61798e;

  font-size:12px;
  font-weight:800;
}

.extra-message{
  width:100%;
  min-height:78px;

  padding:9px 10px;

  resize:vertical;

  border:1px solid #cfe5f5;
  border-radius:13px;

  background:#fff;
  color:#17324d;

  font-family:inherit;
  font-size:13px;
  line-height:1.5;

  outline:none;
}

.extra-message:focus{
  border-color:#63b4ea;
  box-shadow:0 0 0 3px rgba(99,180,234,.14);
}


/* =========================================================
   送信
   ========================================================= */

.send-btn{
  width:100%;

  margin-top:7px;
  padding:14px 12px;

  border:0;
  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      #56baf0,
      #2d88d8
    );

  color:#fff;

  font-size:20px;
  font-weight:900;

  cursor:pointer;
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =========================================================
   履歴
   ========================================================= */

.history{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid #e2eef6;
}

.history h3{
  margin:0 0 10px;

  color:#1676c7;

  font-size:20px;
  font-weight:900;

  text-align:center;
}

.history h3:before{
  content:"🕘 ";
}

.history-list{
  list-style:none;
  margin:0;
  padding:0;
}

.history-list li{
  padding:9px 0;

  border-bottom:1px solid #edf4fa;

  color:#496173;

  font-size:13px;
  line-height:1.4;
}

.history-list .empty{
  color:#7a90a3;
  text-align:center;
}

.footer{
  padding:14px 10px 4px;
  color:#8aa0b2;
  font-size:13px;
  text-align:center;
}

.hidden{
  display:none!important;
}


/* =========================================================
   小さいスマホ
   ========================================================= */

@media(max-width:380px){

  .driver-top-row{
    grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);
    gap:6px;
  }

  .driver-pill{
    padding:6px;
    font-size:12px;
  }

  .status-icon{
    font-size:15px;
  }

  .manual-select-area{
    padding:6px 7px;
  }

  .driver-select{
    font-size:12px;
  }

  .attendance-text{
    font-size:22px;
  }

}

</style>
</head>


<body>

<div class="page">


<header class="hero">
  <h1>🚙 運転手MENU</h1>
</header>


<main class="main-card">


<!-- =======================================================
     自動判別 ＋ 人物選択
     ======================================================= -->

<div class="driver-top-row">


  <!-- 左 -->

  <div
    id="statusPill"
    class="driver-pill"
  >

    <span
      id="statusIcon"
      class="status-icon"
    >
      ⏳
    </span>

    <span id="statusText">
      自動判別中...
    </span>

  </div>


  <!-- 右 -->

  <div class="manual-select-area">

    <label
      class="manual-select-label"
      for="driverSelect"
    >
      人物選択
    </label>

    <select
      id="driverSelect"
      class="driver-select"
    >

      <option value="">
        人物を選択してください
      </option>

    </select>

  </div>


</div>


<!-- =======================================================
     出勤・退勤
     ======================================================= -->

<div class="attendance-buttons">

  <button
    id="btnIn"
    class="attendance-btn btn-in"
    type="button"
    disabled
  >

    <span class="attendance-text">
      ☀️ 出勤
    </span>

  </button>


  <button
    id="btnOut"
    class="attendance-btn btn-out"
    type="button"
    disabled
  >

    <span class="attendance-text">
      🌙 退勤
    </span>

  </button>

</div>


<!-- =======================================================
     写真
     ======================================================= -->

<div class="photo-area">

  <input
    id="photoInput"
    class="photo-input"
    type="file"
    accept="image/*"
  >

  <button
    id="photoBtn"
    class="photo-btn"
    type="button"
  >
    📷 写真を撮影・選択して読み取る
  </button>

  <div class="photo-hint">
    カメラ撮影・過去の写真のどちらも選べます
  </div>

</div>


<div
  id="notice"
  class="notice"
></div>


<!-- =======================================================
     編集
     ======================================================= -->

<section
  id="editPanel"
  class="edit-panel"
>


  <div
    id="photoPreviewWrap"
    class="photo-preview-wrap"
  >

    <img
      id="photoPreview"
      class="photo-preview"
      alt="勤怠写真"
    >

  </div>


  <div
    id="ocrNote"
    class="ocr-result-note"
  ></div>


  <!-- =====================================================
       出勤
       ===================================================== -->

  <div id="inFields">

    <div class="two-column">

      <div class="field">

        <label for="reportDate">
          出勤日
        </label>

        <input
          id="reportDate"
          type="date"
        >

      </div>


      <div class="field">

        <label for="clockInTime">
          出勤時間
        </label>

        <input
          id="clockInTime"
          type="time"
        >

      </div>

    </div>

  </div>


  <!-- =====================================================
       退勤
       ===================================================== -->

  <div
    id="outFields"
    class="hidden"
  >


    <!-- 1 出勤日 -->

    <div class="field single-field">

      <label for="outReportDate">
        出勤日
      </label>

      <input
        id="outReportDate"
        type="date"
      >

    </div>


    <!-- 2 出勤時間 / 3 退勤時間 -->

    <div class="two-column">

      <div class="field">

        <label for="editClockInTime">
          出勤時間
        </label>

        <input
          id="editClockInTime"
          type="time"
        >

      </div>


      <div class="field">

        <label for="clockOutTime">
          退勤時間
        </label>

        <input
          id="clockOutTime"
          type="time"
        >

      </div>

    </div>


    <!-- 4 次回出勤日 -->

    <div class="field single-field">

      <label for="nextDate">
        次回出勤日
      </label>

      <input
        id="nextDate"
        type="date"
      >

    </div>


    <!-- 5 次回出勤時間 -->

    <div class="field single-field">

      <label for="nextTime">
        次回出勤時間
      </label>

      <input
        id="nextTime"
        type="time"
        value="08:00"
      >

    </div>

  </div>


  <!-- =====================================================
       送信文章
       ===================================================== -->

  <div
    id="preview"
    class="preview"
  ></div>


  <!-- =====================================================
       追加文章
       ===================================================== -->

  <label
    class="extra-label"
    for="extraMessage"
  >
    追加文章（任意）
  </label>


  <textarea
    id="extraMessage"
    class="extra-message"
    placeholder="追加文章を入力できます"
  ></textarea>


  <!-- =====================================================
       送信
       ===================================================== -->

  <button
    id="sendBtn"
    class="send-btn"
    type="button"
    disabled
  >
    写真＋報告文章を送信
  </button>


</section>


<!-- =======================================================
     履歴
     ======================================================= -->

<section class="history">

  <h3>
    今日の履歴
  </h3>

  <ul
    id="historyList"
    class="history-list"
  >

    <li class="empty">
      まだ履歴はありません
    </li>

  </ul>

</section>


</main>


<footer class="footer">
  勤怠管理Bot
</footer>


</div>


<script>

/* ============================================================
   設定
   ============================================================ */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwcdo-FzaXTmRj2mVv-REGhopjLeDcr4XRkBO4s3v1mRKSjsjHHXu6Rh2N4I0Vi_ymv/exec';

const LIFF_ID =
  '2011011273-HIdBF1sM';

const RECENT_KEY =
  'driver_menu_recent_drivers_v6';

const HISTORY_KEY =
  'driver_menu_attendance_history_v6';

const WORK_KEY =
  'driver_menu_work_state_v6';


/* ============================================================
   DOM
   ============================================================ */

const $ =
  id =>
    document.getElementById(id);


const e = {

  status:
    $('statusPill'),

  icon:
    $('statusIcon'),

  statusText:
    $('statusText'),

  driver:
    $('driverSelect'),

  btnIn:
    $('btnIn'),

  btnOut:
    $('btnOut'),

  photoInput:
    $('photoInput'),

  photoBtn:
    $('photoBtn'),

  notice:
    $('notice'),

  editPanel:
    $('editPanel'),

  photoPreviewWrap:
    $('photoPreviewWrap'),

  photoPreview:
    $('photoPreview'),

  ocrNote:
    $('ocrNote'),

  inFields:
    $('inFields'),

  outFields:
    $('outFields'),

  reportDate:
    $('reportDate'),

  clockInTime:
    $('clockInTime'),

  outReportDate:
    $('outReportDate'),

  editClockInTime:
    $('editClockInTime'),

  clockOutTime:
    $('clockOutTime'),

  nextDate:
    $('nextDate'),

  nextTime:
    $('nextTime'),

  preview:
    $('preview'),

  extraMessage:
    $('extraMessage'),

  sendBtn:
    $('sendBtn'),

  historyList:
    $('historyList')

};


/* ============================================================
   STATE
   ============================================================ */

const state = {

  driver:
    null,

  idToken:
    '',

  mode:
    null,

  startTime:
    '',

  drivers:
    [],

  history:
    [],

  draft:
    null,

  manual:
    false

};


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  mode
){

  e.status.classList.remove(
    'done'
  );


  if(
    mode === 'done'
  ){

    e.icon.textContent =
      '✓';

    e.statusText.textContent =
      '完了';

    e.status.classList.add(
      'done'
    );

    return;

  }


  if(
    mode === 'waiting'
  ){

    e.icon.textContent =
      '👤';

    e.statusText.textContent =
      '人物選択待ち';

    return;

  }


  e.icon.textContent =
    '⏳';

  e.statusText.textContent =
    '自動判別中...';

}


/* ============================================================
   NOTICE
   ============================================================ */

function showNotice(
  text
){

  e.notice.textContent =
    text;

  e.notice.classList.add(
    'show'
  );

}


function hideNotice(){

  e.notice.textContent =
    '';

  e.notice.classList.remove(
    'show'
  );

}


/* ============================================================
   DATE
   ============================================================ */

function todayDate(){

  const d =
    new Date();

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );

}


function tomorrowDate(){

  const d =
    new Date();

  d.setDate(
    d.getDate()+1
  );

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0') +
    '-' +
    String(
      d.getDate()
    ).padStart(2,'0')
  );

}


function currentTime(){

  const d =
    new Date();

  return (
    String(
      d.getHours()
    ).padStart(2,'0') +
    ':' +
    String(
      d.getMinutes()
    ).padStart(2,'0')
  );

}


function jpDate(
  value
){

  const m =
    String(
      value || ''
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(
    !m
  ){

    return String(
      value || ''
    ).replace(
      /-/g,
      '/'
    );

  }


  const d =
    new Date(
      Number(m[1]),
      Number(m[2])-1,
      Number(m[3])
    );


  const week = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];


  return (
    Number(m[2]) +
    '/' +
    Number(m[3]) +
    '(' +
    week[
      d.getDay()
    ] +
    ')'
  );

}


function slashDate(
  value
){

  const m =
    String(
      value || ''
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(
    !m
  ){

    return value || '';

  }


  return (
    Number(m[1]) +
    '/' +
    Number(m[2]) +
    '/' +
    Number(m[3])
  );

}


/* ============================================================
   次回の文言

   明日
   明後日
   来週
   次回
   ============================================================ */

function nextLabel(
  value
){

  if(
    !value
  ){

    return '次回';

  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const target =
    new Date(
      value +
      'T00:00:00'
    );


  const diff =
    Math.round(
      (
        target -
        today
      ) /
      86400000
    );


  /* 明日 */

  if(
    diff === 1
  ){

    return '明日';

  }


  /* 明後日 */

  if(
    diff === 2
  ){

    return '明後日';

  }


  /*
   * 今週の月曜日を取得
   * JavaScriptでは日曜=0なので
   * 日曜だけ7として扱う
   */

  const day =
    today.getDay() === 0
      ? 7
      : today.getDay();


  const thisMonday =
    new Date(
      today
    );


  thisMonday.setDate(
    today.getDate() -
    day +
    1
  );


  /*
   * 来週月曜日
   */

  const nextMonday =
    new Date(
      thisMonday
    );


  nextMonday.setDate(
    thisMonday.getDate() +
    7
  );


  /*
   * 来週日曜日
   */

  const nextSunday =
    new Date(
      nextMonday
    );


  nextSunday.setDate(
    nextMonday.getDate() +
    6
  );


  /*
   * 来週の月曜日〜日曜日なら
   * 「来週」
   */

  if(
    target >= nextMonday &&
    target <= nextSunday
  ){

    return '来週';

  }


  return '次回';

}

/* ============================================================
   API
   ============================================================ */

function callServer(
  operation,
  data = {}
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      Object.entries({

        action:
          'api',

        operation:
          operation,

        requestId:
          requestId,

        idToken:
          state.idToken ||
          '',

        ...data

      }).forEach(
        (
          [
            key,
            value
          ]
        ) => {

          params.append(
            key,
            value == null
              ? ''
              : String(
                  value
                )
          );

        }
      );


      fetch(
        API_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers:{

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params.toString()

        }
      )
      .catch(
        error =>
          console.warn(
            error
          )
      );


      pollApi(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );

}


function pollApi(
  requestId,
  resolve,
  reject,
  attempt
){

  if(
    attempt >=
    45
  ){

    reject(
      new Error(
        'Apps Script APIから応答がありません'
      )
    );

    return;

  }


  const callback =
    'gas_' +
    Date.now() +
    '_' +
    attempt;


  const script =
    document.createElement(
      'script'
    );


  function cleanup(){

    script.remove();


    try{

      delete window[
        callback
      ];

    }catch(_){}

  }


  window[
    callback
  ] =
    response => {

      cleanup();


      if(
        response &&
        (
          response.status ===
            'pending' ||

          response.status ===
            'processing'
        )
      ){

        setTimeout(
          () => {

            pollApi(
              requestId,
              resolve,
              reject,
              attempt + 1
            );

          },
          400
        );

        return;

      }


      if(
        !response ||
        response.ok !==
          true
      ){

        reject(
          new Error(
            response &&
            response.error
              ? response.error
              : 'Apps Script APIエラー'
          )
        );

        return;

      }


      resolve(
        response.data
      );

    };


  script.onerror =
    () => {

      cleanup();


      setTimeout(
        () => {

          pollApi(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        400
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callback
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}

/* ============================================================
   IMAGE
   ============================================================ */

function prepareImage(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              '写真を読み込めませんでした'
            )
          );

        };


      reader.onload =
        () => {

          const image =
            new Image();


          image.onerror =
            () => {

              reject(
                new Error(
                  '画像を開けませんでした'
                )
              );

            };


          image.onload =
            () => {

              const maxSide =
                1800;


              const scale =
                Math.min(
                  1,

                  maxSide /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const width =
                Math.max(
                  1,

                  Math.round(
                    image.width *
                    scale
                  )
                );


              const height =
                Math.max(
                  1,

                  Math.round(
                    image.height *
                    scale
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d',
                  {
                    alpha:false
                  }
                );


              ctx.fillStyle =
                '#ffffff';


              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .86
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* ============================================================
   OCR
   ============================================================ */

async function runOcr(
  dataUrl
){

  if(
    !window.Tesseract
  ){

    throw new Error(
      '無料OCRが読み込めませんでした'
    );

  }


  const result =
    await Tesseract.recognize(
      dataUrl,
      'eng',
      {

        logger:
          message => {

            if(
              message &&
              message.status ===
                'recognizing text'
            ){

              const percent =
                Math.round(
                  Number(
                    message.progress ||
                    0
                  ) *
                  100
                );


              showNotice(
                '写真を読み取り中... ' +
                percent +
                '%'
              );

            }

          }

      }
    );


  return String(
    result &&
    result.data &&
    result.data.text
      ? result.data.text
      : ''
  );

}

    );


    e.btnIn.classList.remove(
      'active'
    );


    e.btnOut.classList.remove(
      'active'
    );


    e.editPanel.classList.remove(
      'show'
    );


    e.photoPreviewWrap.classList.remove(
      'show'
    );


    e.ocrNote.classList.remove(
      'show'
    );


    e.preview.classList.remove(
      'show'
    );


    e.photoInput.value =
      '';


    state.draft =
      null;


    state.mode =
      null;


  }catch(error){

    console.error(
      error
    );


    showNotice(
      error.message ||
      '送信に失敗しました'
    );


  }finally{

    e.sendBtn.disabled =
      false;

  }

}


/* ============================================================
   LIFF
   ============================================================ */

async function autoDetect(){

  setStatus(
    'detecting'
  );


  try{

    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    if(
      !liff.isLoggedIn()
    ){

      setStatus(
        'waiting'
      );

      return;

    }


    state.idToken =
      liff.getIDToken() ||
      '';


    if(
      !state.idToken
    ){

      setStatus(
        'waiting'
      );

      return;

    }


    const info =
      await callServer(
        'getDriverInfo'
      );


    if(
      state.manual &&
      state.driver
    ){

      return;

    }


    if(
      info &&
      info.found
    ){

      const driver =
        findDriver(
          info.driverKey
        );


      if(
        driver
      ){

        selectDriver(
          driver,
          false
        );

        return;

      }

    }


    setStatus(
      'waiting'
    );


  }catch(error){

    console.error(
      '自動判別エラー',
      error
    );


    setStatus(
      'waiting'
    );

  }

}


/* ============================================================
   UTILITY
   ============================================================ */

function escapeHtml(
  value
){

  return String(
    value == null
      ? ''
      : value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#39;'
    );

}


/* ============================================================
   EVENTS
   ============================================================ */

e.driver.addEventListener(
  'change',
  () => {

    const driver =
      findDriver(
        e.driver.value
      );


    if(
      !driver
    ){

      state.driver =
        null;


      e.btnIn.disabled =
        true;


      e.btnOut.disabled =
        true;


      setStatus(
        'waiting'
      );


      return;

    }


    selectDriver(
      driver,
      true
    );

  }
);


e.btnIn.addEventListener(
  'click',
  () => {

    if(
      !state.driver
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }


    setMode(
      'in'
    );

  }
);


e.btnOut.addEventListener(
  'click',
  () => {

    if(
      !state.driver
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }


    setMode(
      'out'
    );

  }
);


e.photoBtn.addEventListener(
  'click',
  () => {

    if(
      !state.driver
    ){

      alert(
        '先に人物を選択してください。'
      );

      return;

    }

e.photoInput.addEventListener(
  'change',
  () => {

    const file =
      e.photoInput.files &&
      e.photoInput.files[0];


    if(
      file
    ){

      processPhoto(
        file
      );

    }

  }
);


[
  e.reportDate,
  e.clockInTime,
  e.outReportDate,
  e.editClockInTime,
  e.clockOutTime,
  e.nextDate,
  e.nextTime,
  e.extraMessage

].forEach(

    input.addEventListener(
      'input',
      refreshMessage
    );


    input.addEventListener(

      refreshMessage
    );

  }
);

  'click',

);

    e.outReportDate.value =

    );

);
