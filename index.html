<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>運転手MENU</title>

  <!-- LINE LIFF -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <!--
    完全無料OCR
    Google Cloud Visionは使用しません。
    OCRはスマホ/PCのブラウザ上でTesseract.jsを実行します。
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
  ></script>


  <style>

    :root {

      --bg1: #e7f7ff;
      --bg2: #f8fcff;

      --card: #ffffff;

      --line: #d5eaf7;

      --text: #17324d;

      --muted: #71889a;

      --blue: #1676c7;

      --blue2: #2d88d8;

      --green: #18824e;

      --green-bg: #eefbf3;

      --soft: #f7fcff;

      --danger: #c93b3b;

      --shadow:
        0 12px 34px
        rgba(40, 92, 128, .10);

    }


    * {

      box-sizing: border-box;

    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

    }


    body {

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          var(--bg1),
          var(--bg2)
        );

      color:
        var(--text);

    }


    button,
    input,
    select,
    textarea {

      font-family: inherit;

    }


    .page {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding:
        12px
        10px
        calc(
          24px +
          env(safe-area-inset-bottom)
        );

    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {

      position: relative;

      overflow: hidden;

      padding:
        22px 14px 18px;

      border-radius: 26px;

      text-align: center;

      background:

        radial-gradient(
          circle at 18% 18%,
          rgba(255,255,255,.88) 0 7%,
          transparent 7.5%
        ),

        radial-gradient(
          circle at 82% 20%,
          rgba(255,255,255,.88) 0 7%,
          transparent 7.5%
        ),

        linear-gradient(
          180deg,
          #bfeaff 0%,
          #e8f9ff 78%,
          #8bd07c 78%,
          #73c768 100%
        );

      box-shadow:
        var(--shadow);

    }


    .hero-car {

      position: relative;

      z-index: 2;

      font-size: 48px;

      line-height: 1;

    }


    .hero h1 {

      position: relative;

      z-index: 2;

      margin:
        7px 0 0;

      color:
        var(--blue);

      font-size: 32px;

      line-height: 1.1;

      font-weight: 900;

    }


    /* =========================================================
       MAIN CARD
       ========================================================= */

    .card {

      margin-top: 12px;

      padding: 13px;

      border-radius: 24px;

      background:
        rgba(255,255,255,.97);

      box-shadow:
        var(--shadow);

    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      width: fit-content;

      min-height: 44px;

      max-width: 100%;

      margin:
        0 auto 11px;

      padding:
        9px 17px;

      border:
        1px solid
        var(--line);

      border-radius: 999px;

      background:
        #f3fbff;

      color:
        var(--blue);

      font-size: 16px;

      font-weight: 900;

      text-align: center;

    }


    .status.done {

      color:
        var(--green);

      background:
        var(--green-bg);

      border-color:
        #ccefd8;

    }


    .status.error {

      color:
        var(--danger);

      background:
        #fff3f3;

      border-color:
        #f0cccc;

    }


    /* =========================================================
       COMMON BOX
       ========================================================= */

    .box {

      border:
        1px solid
        var(--line);

      border-radius:
        17px;

      background:
        var(--soft);

    }


    /* =========================================================
       DRIVER
       ========================================================= */

    .driver-box {

      padding:
        10px 12px;

    }


    .label {

      display: block;

      margin-bottom: 6px;

      color:
        #637c90;

      font-size: 13px;

      line-height: 1.3;

      font-weight: 900;

    }


    select,
    input[type="time"],
    input[type="date"] {

      display: block;

      width: 100%;

      height: 46px;

      min-height: 46px;

      margin: 0;

      padding:
        0 11px;

      border:
        1px solid
        #cfe4f3;

      border-radius: 13px;

      outline: none;

      background:
        #ffffff;

      color:
        var(--text);

      font-size: 16px;

      font-weight: 800;

    }


    select:focus,
    input:focus {

      border-color:
        #67b6ea;

      box-shadow:
        0 0 0 3px
        rgba(103,182,234,.14);

    }


    /* =========================================================
       MODE
       ========================================================= */

    .mode-box {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 10px;

      padding: 8px;

      border:
        1px solid
        var(--line);

      border-radius: 17px;

      background:
        var(--soft);

    }


    .mode-btn {

      min-height: 74px;

      padding: 10px;

      border: 0;

      border-radius: 15px;

      background:
        #e7f4fb;

      color:
        #738a9a;

      font-size: 23px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform .12s ease,
        opacity .12s ease;

    }


    .mode-btn:active {

      transform:
        scale(.99);

    }


    .mode-btn.active.in {

      color:
        #084e78;

      background:
        linear-gradient(
          180deg,
          #70cdfb,
          #aee9ff 60%,
          #79d272
        );

    }


    .mode-btn.active.out {

      color:
        #ffffff;

      background:
        linear-gradient(
          180deg,
          #1b357c,
          #0e1e4d
        );

    }


    /* =========================================================
       PHOTO
       ========================================================= */

    .upload-btn {

      display: block;

      width: 100%;

      min-height: 54px;

      margin-top: 11px;

      padding:
        12px 14px;

      border:
        1px solid
        #cfe8f7;

      border-radius: 17px;

      background:
        #eaf7ff;

      color:
        var(--blue);

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;

    }


    .upload-btn:active {

      transform:
        translateY(1px);

    }


    .notice {

      display: none;

      margin-top: 10px;

      padding:
        10px 12px;

      border-radius: 13px;

      background:
        #f7fcff;

      border:
        1px solid
        var(--line);

      color:
        #5c7588;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;

    }


    .notice.show {

      display: block;

    }


    .preview-wrap {

      display: none;

      margin-top: 12px;

      padding: 12px;

      border:
        1px solid
        var(--line);

      border-radius: 19px;

      background:
        #ffffff;

    }


    .preview-wrap.show {

      display: block;

    }


    .photo-preview {

      display: block;

      width: 100%;

      max-height: 390px;

      object-fit: contain;

      border-radius: 15px;

      background:
        #eef4f8;

    }


    /* =========================================================
       OCR
       ========================================================= */

    .section-title {

      margin:
        14px 0 7px;

      color:
        var(--blue);

      font-size: 18px;

      font-weight: 900;

      text-align: center;

    }


    .ocr-text {

      max-height: 145px;

      overflow: auto;

      padding: 10px;

      border:
        1px solid
        var(--line);

      border-radius: 12px;

      background:
        #f9fdff;

      color:
        #526c80;

      font-size: 12px;

      line-height: 1.5;

      white-space: pre-wrap;

      word-break: break-word;

    }


    /* =========================================================
       FIELDS
       ========================================================= */

    .fields {

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

      gap: 8px;

      margin-top: 11px;

    }


    .field {

      min-width: 0;

      padding: 9px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      background:
        #f9fdff;

    }


    .field.full {

      grid-column:
        1 / -1;

    }


    .field .label {

      margin-bottom: 4px;

      font-size: 12px;

    }


    .field input {

      height: 42px;

      min-height: 42px;

      padding:
        0 4px;

      font-size: 18px;

      font-weight: 900;

      text-align: center;

    }


    /* =========================================================
       SUMMARY
       ========================================================= */

    .summary {

      grid-column:
        1 / -1;

      padding:
        11px 10px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      background:
        #f7fcff;

      color:
        #446276;

      font-size: 14px;

      line-height: 1.6;

      font-weight: 800;

      text-align: center;

    }


    .summary strong {

      color:
        var(--blue);

      font-size: 16px;

    }


    /* =========================================================
       MESSAGE
       ========================================================= */

    .message-box {

      margin-top: 11px;

      padding:
        13px 14px;

      border:
        1px solid
        var(--line);

      border-radius: 16px;

      background:
        #f4fbff;

    }


    .message-preview {

      min-height: 120px;

      color:
        #15446e;

      font-size: 14px;

      line-height: 1.8;

      font-weight: 600;

      white-space: pre-line;

      word-break: break-word;

    }


    /* =========================================================
       SEND
       ========================================================= */

    .send-btn {

      display: block;

      width: 100%;

      min-height: 55px;

      margin-top: 11px;

      padding:
        13px 14px;

      border: 0;

      border-radius: 17px;

      background:
        linear-gradient(
          180deg,
          #56baf0,
          #2d88d8
        );

      color:
        #ffffff;

      font-size: 19px;

      font-weight: 900;

      cursor: pointer;

    }


    .send-btn:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    /* =========================================================
       HISTORY
       ========================================================= */

    .history {

      margin-top: 17px;

      padding-top: 14px;

      border-top:
        1px solid
        #e1edf5;

    }


    .history-title {

      margin:
        0 0 10px;

      color:
        var(--blue);

      font-size: 21px;

      font-weight: 900;

      text-align: center;

    }


    .history-list {

      list-style: none;

      margin: 0;

      padding: 0;

    }


    .history-item {

      display: grid;

      grid-template-columns:
        auto
        auto
        auto
        1fr
        auto;

      align-items: center;

      gap: 6px;

      padding:
        10px 2px;

      border-bottom:
        1px solid
        #edf4fa;

      color:
        #536b7c;

      font-size: 12px;

      line-height: 1.4;

      white-space: nowrap;

    }


    .history-date {

      color:
        #71889a;

      font-weight: 800;

    }


    .history-type {

      color:
        var(--blue);

      font-weight: 900;

    }


    .history-time {

      color:
        var(--text);

      font-weight: 900;

    }


    .history-sent {

      color:
        #71889a;

      text-align: right;

    }


    .history-ok {

      color:
        var(--green);

      font-weight: 900;

    }


    .empty {

      padding:
        10px;

      color:
        #8095a5;

      text-align: center;

    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      padding:
        15px 0 4px;

      color:
        #8aa0b2;

      font-size: 13px;

      text-align: center;

    }


    .hidden {

      display: none !important;

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width:480px) {

      .page {

        padding:
          12px
          10px
          calc(
            22px +
            env(safe-area-inset-bottom)
          );

      }


      .hero {

        padding:
          20px 12px 17px;

        border-radius: 24px;

      }


      .hero-car {

        font-size: 45px;

      }


      .hero h1 {

        font-size: 31px;

      }


      .card {

        padding: 12px;

        border-radius: 22px;

      }


      .mode-btn {

        min-height: 70px;

        font-size: 22px;

      }


      .fields {

        gap: 7px;

      }


      .field {

        padding: 8px;

      }


      .field input {

        font-size: 18px;

      }


      .history-item {

        grid-template-columns:
          auto
          auto
          auto
          1fr;

        gap: 4px;

        font-size: 11px;

      }


      .history-ok {

        grid-column: 4;

        text-align: right;

      }

    }

  </style>

</head>


<body>

<div class="page">


  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="hero">

    <div class="hero-car">
      🚙
    </div>

    <h1>
      運転手MENU
    </h1>

  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="card">


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >
      ⏳ 自動判別中...
    </div>


    <!-- DRIVER -->

    <section class="box driver-box">

      <label
        class="label"
        for="driverSelect"
      >
        人物選択
      </label>

      <select
        id="driverSelect"
      >

        <option value="">
          人物を選択してください
        </option>

      </select>

    </section>


    <!-- MODE -->

    <section class="mode-box">

      <button
        id="inMode"
        class="mode-btn active in"
        type="button"
      >
        ☀️ 出勤
      </button>


      <button
        id="outMode"
        class="mode-btn"
        type="button"
      >
        🌙 退勤
      </button>

    </section>


    <!-- FILE -->

    <input
      id="photoInput"
      class="hidden"
      type="file"
      accept="image/*"
      capture="environment"
    >


    <button
      id="uploadBtn"
      class="upload-btn"
      type="button"
    >
      📷 写真を選択して読み取る
    </button>


    <div
      id="notice"
      class="notice"
    ></div>


    <!-- =====================================================
         PREVIEW
         ===================================================== -->

    <section
      id="previewWrap"
      class="preview-wrap"
    >


      <img
        id="photoPreview"
        class="photo-preview"
        alt="勤怠写真"
      >


      <div class="section-title">
        🔎 写真の読み取り結果
      </div>


      <div
        id="ocrText"
        class="ocr-text"
      ></div>


      <!-- FIELDS -->

      <div class="fields">


        <div class="field">

          <label
            class="label"
            for="reportDate"
          >
            報告日
          </label>

          <input
            id="reportDate"
            type="date"
          >

        </div>


        <div class="field">

          <label
            id="reportTimeLabel"
            class="label"
            for="reportTime"
          >
            出勤時間
          </label>

          <input
            id="reportTime"
            type="time"
          >

        </div>


        <!-- 退勤用 -->

        <div
          id="startField"
          class="field hidden"
        >

          <label
            class="label"
            for="startTime"
          >
            出勤時間
          </label>

          <input
            id="startTime"
            type="time"
          >

        </div>


        <div
          id="endField"
          class="field hidden"
        >

          <label
            class="label"
            for="endTime"
          >
            退勤時間
          </label>

          <input
            id="endTime"
            type="time"
          >

        </div>


        <div
          id="nextDateField"
          class="field hidden"
        >

          <label
            class="label"
            for="nextDate"
          >
            次回出勤日
          </label>

          <input
            id="nextDate"
            type="date"
          >

        </div>


        <div
          id="nextTimeField"
          class="field hidden"
        >

          <label
            class="label"
            for="nextTime"
          >
            次回出勤時間
          </label>

          <input
            id="nextTime"
            type="time"
            value="08:00"
          >

        </div>


        <!-- SUMMARY -->

        <div
          id="summary"
          class="summary"
        >
          前回残業
          <strong>
            0:00
          </strong>

          　月間合計
          <strong>
            0:00
          </strong>
        </div>


      </div>


      <!-- MESSAGE -->

      <section class="message-box">

        <div
          class="section-title"
          style="margin-top:0;"
        >
          📝 送信内容
        </div>

        <div
          id="messagePreview"
          class="message-preview"
        ></div>

      </section>


      <!-- SEND -->

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        disabled
      >
        📤 写真＋報告文章を送信
      </button>


    </section>


    <!-- =====================================================
         HISTORY
         ===================================================== -->

    <section class="history">

      <h2 class="history-title">
        🕘 今日の履歴
      </h2>

      <ul
        id="historyList"
        class="history-list"
      >

        <li class="empty">
          人物を選択すると履歴を表示します
        </li>

      </ul>

    </section>


  </main>


  <footer class="footer">
    勤怠管理Bot
  </footer>


</div>


<script>


// ============================================================
// ★★★★★ 設定 ★★★★★
// ============================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbxohd0FrxlbAut88V825oeCR9hFSAI__22K8G0FXAPb9cjtqxmJ7yfwt98_NHiCm-U/exec';


const LIFF_ID =
  '2011011273-HIdBF1sM';


const RECENT_STORAGE_KEY =
  'driver_menu_recent_v3';


const MAX_RECENT =
  10;


// ============================================================
// STATE
// ============================================================

const state = {

  idToken:
    '',

  drivers:
    [],

  driver:
    null,

  mode:
    'in',

  draft:
    null,

  workState: {

    hasWork:
      false,

    startTime:
      ''

  },

  summary: {

    previousOvertime:
      '0:00',

    monthlyOvertime:
      '0:00'

  }

};


// ============================================================
// ELEMENTS
// ============================================================

const el = {

  status:
    document.getElementById(
      'status'
    ),

  driverSelect:
    document.getElementById(
      'driverSelect'
    ),

  inMode:
    document.getElementById(
      'inMode'
    ),

  outMode:
    document.getElementById(
      'outMode'
    ),

  photoInput:
    document.getElementById(
      'photoInput'
    ),

  uploadBtn:
    document.getElementById(
      'uploadBtn'
    ),

  notice:
    document.getElementById(
      'notice'
    ),

  previewWrap:
    document.getElementById(
      'previewWrap'
    ),

  photoPreview:
    document.getElementById(
      'photoPreview'
    ),

  ocrText:
    document.getElementById(
      'ocrText'
    ),

  reportDate:
    document.getElementById(
      'reportDate'
    ),

  reportTimeLabel:
    document.getElementById(
      'reportTimeLabel'
    ),

  reportTime:
    document.getElementById(
      'reportTime'
    ),

  startField:
    document.getElementById(
      'startField'
    ),

  startTime:
    document.getElementById(
      'startTime'
    ),

  endField:
    document.getElementById(
      'endField'
    ),

  endTime:
    document.getElementById(
      'endTime'
    ),

  nextDateField:
    document.getElementById(
      'nextDateField'
    ),

  nextDate:
    document.getElementById(
      'nextDate'
    ),

  nextTimeField:
    document.getElementById(
      'nextTimeField'
    ),

  nextTime:
    document.getElementById(
      'nextTime'
    ),

  summary:
    document.getElementById(
      'summary'
    ),

  messagePreview:
    document.getElementById(
      'messagePreview'
    ),

  sendBtn:
    document.getElementById(
      'sendBtn'
    ),

  historyList:
    document.getElementById(
      'historyList'
    )

};


// ============================================================
// STATUS
// ============================================================

function setStatus(
  text,
  type
) {

  el.status.textContent =
    text;


  el.status.classList.remove(
    'done',
    'error'
  );


  if (
    type === 'done'
  ) {

    el.status.classList.add(
      'done'
    );

  }


  if (
    type === 'error'
  ) {

    el.status.classList.add(
      'error'
    );

  }

}


// ============================================================
// NOTICE
// ============================================================

function showNotice(
  text
) {

  el.notice.textContent =
    text;


  el.notice.classList.add(
    'show'
  );

}


function hideNotice() {

  el.notice.textContent =
    '';


  el.notice.classList.remove(
    'show'
  );

}


// ============================================================
// API
// ============================================================

function callServer(
  operation,
  data
) {

  data =
    data ||
    {};


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const requestId =
        'req_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const params =
        new URLSearchParams();


      params.append(
        'action',
        'api'
      );


      params.append(
        'operation',
        operation
      );


      params.append(
        'requestId',
        requestId
      );


      params.append(
        'idToken',
        state.idToken ||
        ''
      );


      Object.keys(
        data
      ).forEach(
        function(key) {

          params.append(
            key,
            data[key] == null
              ? ''
              : String(
                  data[key]
                )
          );

        }
      );


      /*
       * POST
       *
       * Apps Script側でCacheServiceへ結果を保存。
       */

      fetch(
        API_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'

          },

          body:
            params.toString()

        }
      ).catch(
        function(error) {

          console.warn(
            'POST:',
            error
          );

        }
      );


      /*
       * JSONPで結果取得
       */

      pollResult(
        requestId,
        resolve,
        reject,
        0
      );

    }
  );
}


// ============================================================
// POLL
// ============================================================

function pollResult(
  requestId,
  resolve,
  reject,
  attempt
) {

  if (
    attempt >= 50
  ) {

    reject(
      new Error(
        'Apps Scriptから応答がありませんでした'
      )
    );

    return;
  }


  const callback =
    'gasCallback_' +
    Date.now() +
    '_' +
    attempt +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


    try {

      delete window[
        callback
      ];

    } catch (_) {

      window[
        callback
      ] = undefined;

    }

  }


  window[
    callback
  ] = function(
    response
  ) {

    if (
      finished
    ) {

      return;
    }


    if (
      response &&
      (
        response.status ===
          'pending' ||

        response.status ===
          'processing'
      )
    ) {

      cleanup();


      setTimeout(
        function() {

          pollResult(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );


      return;
    }


    finished =
      true;


    cleanup();


    if (
      !response ||
      response.ok !== true
    ) {

      reject(
        new Error(
          response &&
          response.error
            ? response.error
            : 'Apps Script APIエラー'
        )
      );


      return;
    }


    resolve(
      response.data
    );

  };


  script.onerror =
    function() {

      if (
        finished
      ) {

        return;
      }


      cleanup();


      setTimeout(
        function() {

          pollResult(
            requestId,
            resolve,
            reject,
            attempt + 1
          );

        },
        500
      );

    };


  script.src =
    API_URL +
    '?action=pollApi' +
    '&requestId=' +
    encodeURIComponent(
      requestId
    ) +
    '&callback=' +
    encodeURIComponent(
      callback
    ) +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}

// RECENT DRIVER
// ============================================================

function getRecentDrivers() {

  try {

    const value =
      localStorage.getItem(
        RECENT_STORAGE_KEY
      );


    const parsed =
      JSON.parse(
        value ||
        '[]'
      );


    return Array.isArray(
      parsed
    )
      ? parsed
      : [];


  } catch (_) {

    return [];

  }

}


function saveRecentDriver(
  driver
) {

  if (!driver) {

    return;
  }


  let list =
    getRecentDrivers();


  list =
    list.filter(
      function(item) {

        return (
          item.driverKey !==
          driver.driverKey
        );

      }
    );


  list.unshift({

    driverKey:
      driver.driverKey,

    displayName:
      driver.displayName

  });


  try {

    localStorage.setItem(
      RECENT_STORAGE_KEY,
      JSON.stringify(
        list.slice(
          0,
          MAX_RECENT
        )
      )
    );

  } catch (_) {

  }

}


// ============================================================
// DRIVER
// ============================================================

function findDriver(
  driverKey
) {

  if (!driverKey) {

    return null;
  }


  return (

    state.drivers.find(
      function(driver) {

        return (
          driver.driverKey ===
          driverKey
        );

      }
    ) ||

    null

  );

}


function renderDrivers() {

  el.driverSelect.innerHTML =
    '<option value="">人物を選択してください</option>';


  const recent =
    getRecentDrivers();


  const activeRecent =
    recent
      .map(
        function(item) {

          return findDriver(
            item.driverKey
          );

        }
      )
      .filter(Boolean);


  const usedKeys =
    new Set(
      activeRecent.map(
        function(driver) {

          return driver.driverKey;

        }
      )
    );


  if (
    activeRecent.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '最近使った人物';


    activeRecent.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          '★ ' +
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  const others =
    state.drivers.filter(
      function(driver) {

        return (
          !usedKeys.has(
            driver.driverKey
          )
        );

      }
    );


  if (
    others.length
  ) {

    const group =
      document.createElement(
        'optgroup'
      );


    group.label =
      '人物一覧';


    others.forEach(
      function(driver) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          driver.driverKey;


        option.textContent =
          driver.displayName;


        group.appendChild(
          option
        );

      }
    );


    el.driverSelect.appendChild(
      group
    );

  }


  if (
    state.driver
  ) {

    el.driverSelect.value =
      state.driver.driverKey;

  }

}

// ============================================================

function renderHistory(
  history
) {

  const list =
    Array.isArray(
      history
    )
      ? history
      : [];


  /*
   * 念のため表示側でも新しい順にする
   */

  list.sort(
    function(a, b) {

      return (
        Number(
          b.savedAt ||
          0
        ) -
        Number(
          a.savedAt ||
          0
        )
      );

    }
  );


  if (
    !list.length
  ) {

    el.historyList.innerHTML =
      '<li class="empty">まだ履歴はありません</li>';

    return;
  }


  el.historyList.innerHTML =
    list
      .map(
        function(item) {

          let attendanceTime =
            '';


          if (
            item.type ===
            '退勤'
          ) {

            attendanceTime =

              String(
                item.startTime ||
                ''
              ) +

              '→' +

              String(
                item.endTime ||
                ''
              );


          } else {

            attendanceTime =
              String(
                item.reportTime ||
                ''
              );

          }


          return (

            '<li class="history-item">' +

              '<span class="history-date">' +
                escapeHtml(
                  item.date ||
                  ''
                ) +
              '</span>' +

              '<span class="history-type">' +
                escapeHtml(
                  item.type ||
                  ''
                ) +
              '</span>' +

              '<span class="history-time">' +
                escapeHtml(
                  attendanceTime
                ) +
              '</span>' +

              '<span class="history-sent">' +
                '送信 ' +
                escapeHtml(
                  item.sentTime ||
                  ''
                ) +
              '</span>' +

              '<span class="history-ok">' +
                '✓' +
                escapeHtml(
                  item.status ||
                  '完了'
                ) +
              '</span>' +

            '</li>'

          );

        }
      )
      .join('');

}

// ============================================================
// IMAGE PREPARE
// ============================================================

function prepareImage(
  file
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onerror =
        function() {

          reject(
            new Error(
              '写真を読み込めませんでした'
            )
          );

        };


      reader.onload =
        function() {

          const image =
            new Image();


          image.onerror =
            function() {

              reject(
                new Error(
                  '画像を開けませんでした'
                )
              );

            };


          image.onload =
            function() {

              /*
               * OCR精度と通信サイズのバランス。
               */

              const maxSide =
                1800;


              const scale =
                Math.min(
                  1,
                  maxSide /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const width =
                Math.max(
                  1,
                  Math.round(
                    image.width *
                    scale
                  )
                );


              const height =
                Math.max(
                  1,
                  Math.round(
                    image.height *
                    scale
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d',
                  {

                    alpha:
                      false

                  }
                );


              ctx.fillStyle =
                '#ffffff';


              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              const dataUrl =
                canvas.toDataURL(
                  'image/jpeg',
                  .86
                );


              resolve({

                dataUrl:
                  dataUrl,

                width:
                  width,

                height:
                  height

              });

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


// ============================================================
// OCR
// ============================================================

async function runOcr(
  dataUrl
) {

  if (
    !window.Tesseract
  ) {

    throw new Error(
      '無料OCRライブラリを読み込めませんでした'
    );
  }


  const result =
    await Tesseract.recognize(

      dataUrl,

      'eng',

      {

        logger:
          function(message) {

            if (
              !message
            ) {

              return;
            }


            if (
              message.status ===
              'recognizing text'
            ) {

              const percent =
                Math.round(
                  Number(
                    message.progress ||
                    0
                  ) *
                  100
                );


              showNotice(
                '写真を読み取り中... ' +
                percent +
                '%'
              );

            }

          }

      }

    );


  if (
    !result ||
    !result.data
  ) {

    return '';
  }


  return String(
    result.data.text ||
    ''
  );

}

async function processPhoto(
  file
) {

  if (
    !state.driver
  ) {

    alert(
      '先に人物を選択してください。'
    );


    return;
  }


  if (!file) {

    return;
  }


  state.draft =
    null;


  el.sendBtn.disabled =
    true;


  showNotice(
    '写真を準備しています...'
  );


  try {

    /*
     * 画像圧縮
     */

    const prepared =
      await prepareImage(
        file
      );


    el.photoPreview.src =
      prepared.dataUrl;


    /*
     * 無料OCR
     */

    const ocrText =
      await runOcr(
        prepared.dataUrl
      );


    showNotice(
      '読み取り結果を保存しています...'
    );


    /*
     * Apps Scriptへ
     */

    const draft =
      await callServer(
        'ocrPhoto',
        {

          selectedDriverKey:
            state.driver.driverKey,

          mode:
            state.mode,

          imageBase64:
            prepared.dataUrl,

          fileName:
            file.name ||
            'attendance.jpg',

          ocrText:
            ocrText

        }
      );


    if (
      !draft ||
      !draft.draftId
    ) {

      throw new Error(
        '写真の下書きを作成できませんでした'
      );
    }


    state.draft =
      draft;


    /*
     * 画面表示
     */

    el.previewWrap.classList.add(
      'show'
    );


    el.ocrText.textContent =
      draft.ocrText ||
      '文字を読み取れませんでした。時刻を確認して入力してください。';


    el.reportDate.value =
      draft.reportDate ||
      todayDate();


    if (
      state.mode === 'in'
    ) {

      /*
       * 例：
       * 写真OCR 09:20
       * ↓
       * 本人が09:30へ修正可能
       */

      el.reportTime.value =
        draft.ocrTime ||
        currentTime();


    } else {

      /*
       * 朝に確定した出勤時間を
       * サーバーから復元。
       */

      el.startTime.value =
        draft.startTime ||
        state.workState.startTime ||
        '';


      /*
       * 退勤写真OCR時間
       */

      el.endTime.value =
        draft.endTime ||
        draft.ocrTime ||
        currentTime();


      if (
        !el.nextDate.value
      ) {

        el.nextDate.value =
          tomorrowDate();

      }


      if (
        !el.nextTime.value
      ) {

        el.nextTime.value =
          '08:00';

      }

    }


    /*
     * サーバー側集計値を反映
     */

    if (
      draft.previousOvertime != null
    ) {

      state.summary.previousOvertime =
        draft.previousOvertime;

    }


    if (
      draft.monthlyOvertime != null
    ) {

      state.summary.monthlyOvertime =
        draft.monthlyOvertime;

    }


    renderSummary();


    refreshMessage();


    el.sendBtn.disabled =
      false;


    showNotice(
      '読み取り完了。内容を確認・修正してから送信してください。'
    );


    /*
     * 内容修正欄までスクロール
     */

    setTimeout(
      function() {

        el.previewWrap.scrollIntoView({

          behavior:
            'smooth',

          block:
            'start'

        });

      },
      100
    );


  } catch (error) {

    console.error(
      error
    );


    showNotice(
      error.message ||
      '写真の読み取りに失敗しました'
    );


    el.sendBtn.disabled =
      true;

  }

}

  ) {

    alert(
      '出勤時間を確認してください。'
    );


    return;
  }


  if (
    state.mode === 'out' &&
    (
      !el.startTime.value ||
      !el.endTime.value
    )
  ) {

    alert(
      '出勤時間と退勤時間を確認してください。'
    );


    return;
  }


  refreshMessage();


  el.sendBtn.disabled =
    true;


  showNotice(
    '写真＋報告文章を送信しています...'
  );


  try {

    const result =
      await callServer(
        'sendAttendanceDraft',
        {

          draftId:
            state.draft.draftId,

          mode:
            state.mode,

          reportDate:
            el.reportDate.value,

          /*
           * 出勤の場合：
           * 人間が確認・修正した確定時刻
           */

          reportTime:
            state.mode === 'in'
              ? el.reportTime.value
              : el.endTime.value,

          /*
           * 退勤の場合：
           * 朝に確定して保存した出勤時刻
           */

          startTime:
            state.mode === 'out'
              ? el.startTime.value
              : el.reportTime.value,

          endTime:
            state.mode === 'out'
              ? el.endTime.value
              : '',

          nextDate:
            state.mode === 'out'
              ? el.nextDate.value
              : '',

          nextTime:
            state.mode === 'out'
              ? el.nextTime.value
              : '',

          message:
            el.messagePreview.textContent

        }
      );


    if (
      !result ||
      result.ok !== true
    ) {

      throw new Error(
        '送信処理が完了しませんでした'
      );
    }


    showNotice(
      '✓ 写真＋報告文章を送信しました。'
    );


    /*
     * 下書き解除
     */

    state.draft =
      null;


    el.photoInput.value =
      '';


    el.previewWrap.classList.remove(
      'show'
    );


    /*
     * サーバーから再読込
     *
     * 出勤時間・履歴をスマホではなく
     * スプレッドシートから復元する。
     */

    await loadDriverState();


    /*
     * 出勤後なら
     * workStateに出勤時間が保存される。
     */

    if (
      state.mode === 'in'
    ) {

      setMode(
        'in'
      );

    }


  } catch (error) {

    console.error(
      error
    );


    showNotice(
      error.message ||
      '送信に失敗しました'
    );


  } finally {

    /*
     * 写真が残っている場合だけ再度押せる
     */

    el.sendBtn.disabled =
      !state.draft;

  }

}


// ============================================================
// DATE
// ============================================================

function todayDate() {

  const date =
    new Date();


  return (

    date.getFullYear() +

    '-' +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +

    '-' +

    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    )

  );

}


function tomorrowDate() {

  const date =
    new Date();


  date.setDate(
    date.getDate() + 1
  );


  return (

    date.getFullYear() +

    '-' +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +

    '-' +

    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    )

  );

}


function currentTime() {

  const date =
    new Date();


  return (

    String(
      date.getHours()
    ).padStart(
      2,
      '0'
    ) +

    ':' +

    String(
      date.getMinutes()
    ).padStart(
      2,
      '0'
    )

  );

}


function formatShortDate(
  yyyyMmDd
) {

  const match =
    String(
      yyyyMmDd ||
      ''
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if (!match) {

    return yyyyMmDd ||
      '';

  }


  return (

    Number(
      match[2]
    ) +

    '/' +

    Number(
      match[3]
    )

  );

}


// ============================================================
// NEXT LABEL
// ============================================================

function getNextLabel(
  yyyyMmDd
) {

  if (!yyyyMmDd) {

    return '次回';

  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const target =
    new Date(
      yyyyMmDd +
      'T00:00:00'
    );


  const diff =
    Math.round(
      (
        target -
        today
      ) /
      86400000
    );


  if (
    diff === 1
  ) {

    return '明日';

  }


  if (
    diff === 2
  ) {

    return '明後日';

  }


  /*
   * 来週判定
   */

  const todayDay =
    today.getDay() === 0
      ? 7
      : today.getDay();


  const monday =
    new Date(
      today
    );


  monday.setDate(
    today.getDate() -
    (
      todayDay -
      1
    )
  );


  const nextMonday =
    new Date(
      monday
    );


  nextMonday.setDate(
    monday.getDate() +
    7
  );


  const targetDay =
    target.getDay() === 0
      ? 7
      : target.getDay();


  const targetMonday =
    new Date(
      target
    );


  targetMonday.setDate(
    target.getDate() -
    (
      targetDay -
      1
    )
  );


  if (
    targetMonday.getTime() ===
    nextMonday.getTime()
  ) {

    return '来週';

  }


  return '次回';

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#39;'
    );

}
